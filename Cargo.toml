[workspace]
# Glob picks up every crate directory under `crates/`. Add a new crate by
# dropping its directory in `crates/` with its own Cargo.toml.
#
# The explicit `crates/trusty-agents/ui/src-tauri` entry (#3053) is the
# trusty-agents Tauri desktop app. It lives NESTED inside the trusty-agents
# member's directory rather than as a top-level `crates/*` dir, so the glob
# above does not match it — it must be listed by full path. It used to declare
# its own standalone `[workspace]` table (self-excluding from all
# workspace-wide build/clippy/test); that has been removed so the crate is now
# workspace-verified. It is deliberately NOT in `default-members` below (same
# as the two other Tauri GUIs — bare builds skip it) and is excluded from the
# headless CI jobs (WebKit2GTK-dependent); a dedicated `agents-ui` CI job
# build- and lint-verifies it.
members = ["crates/*", "crates/trusty-agents/ui/src-tauri"]
resolver = "2"
# Exclude paths inside copied projects that contain stray manifests we don't
# want Cargo to treat as workspace members. trusty-agents bundles a `weather_alerter`
# scratch dir; trusty-mpm-gui's `src-tauri` is included via its parent crate.
exclude = []
# `default-members` — the crates a BARE `cargo build`/`test`/`check` (no
# `--workspace`, no `-p`, run from this root) actually targets. Everything
# except `trusty-mpm-gui` (#2951) and `trusty-code-gui` (#2983, same rationale
# — a second Tauri desktop GUI needing the pnpm/Svelte UI toolchain).
#
# Why: CI already runs the workspace-wide gates with
# `--workspace --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui`
# (`.github/workflows/ci.yml`) because these GUIs need the pnpm/Svelte UI
# toolchain — a bare `cargo build`/`test`/`check` had no equivalent exclusion,
# so every agent worktree (which routinely runs the bare form per this
# repo's own documented workflow) silently rebuilt the GUI too. Seven stray
# ad-hoc-signed `trusty-mpm-gui` debug binaries were found across worktrees
# this way (forensics in #2951) — each a brand-new identity to macOS TCC, and
# each a wasted UI-toolchain-dependent build for anyone not actually touching
# the GUI. `--workspace` and `-p <crate>` are UNAFFECTED by `default-members`
# and keep working exactly as before (`cargo build --workspace`,
# `cargo test -p trusty-mpm-gui`, `cargo check -p trusty-code-gui`, etc.), so
# this only changes what the bare, no-flag form does — it does not remove
# either GUI crate from the workspace. `trusty-agents-ui` needs the same
# `--exclude` on `--workspace` invocations for a different reason: its
# `tauri::generate_context!()` reads the same `crates/trusty-agents/ui/dist/`
# that `trusty-agents`' own build.rs populates, so a `--workspace` run that
# happens to check/build `trusty-agents-ui` before that build script has run
# panics on the missing path — a real cargo build-order race, not merely a
# missing-toolchain skip (#3053).
#
# Maintenance note: Cargo has no "members minus one" glob for
# `default-members`, so this list must be updated by hand when a new crate
# lands under `crates/` (it is already a member via the `members` glob above
# either way — only the bare-command default is affected, so forgetting to add
# a new crate here is a mildly stale default, not a build break).
default-members = [
    "crates/tc-services",
    "crates/trusty-agents",
    "crates/trusty-agents-common",
    "crates/trusty-agents-local",
    "crates/trusty-analyze",
    "crates/trusty-audit",
    "crates/trusty-bm25-daemon",
    "crates/trusty-channels",
    "crates/trusty-code",
    "crates/trusty-common",
    "crates/trusty-console",
    "crates/trusty-cto-db",
    "crates/trusty-embedderd",
    "crates/trusty-embedderd-py",
    "crates/trusty-git-analytics",
    "crates/trusty-gworkspace",
    "crates/trusty-installer",
    "crates/trusty-kb",
    "crates/trusty-memory",
    "crates/trusty-mpm",
    "crates/trusty-progress",
    "crates/trusty-publish-guard",
    "crates/trusty-review",
    "crates/trusty-search",
    "crates/trusty-sld-lint",
    "crates/trusty-tui",
]

[workspace.package]
edition = "2024"
# The effective MSRV is 1.94: aws-config >= 1.9.0 and aws-sdk-bedrockruntime
# >= 1.136.0 (published 2026-07-08) declare rust-version = "1.94.1", which sets
# the real floor above the 1.88 let-chain minimum. Because the AWS entries below
# are unpinned caret ranges, `cargo install` without `--locked` re-resolves into
# those versions, so the floor reaches every crate whose graph touches the AWS
# SDK — not just the ones that name it directly. NOTE: this value only reaches a
# member that opts in with `rust-version.workspace = true`; 11 publishable crates
# declare no rust-version at all and so advertise no floor. See
# docs/adr/0029-msrv-1-94-and-edition-policy.md.
# CI verifies this with dtolnay/rust-toolchain@1.94 (see .github/workflows/ci.yml).
rust-version = "1.94"
# version = "0.4.0" — REMOVED. Every crate manages its own version independently
# in its own Cargo.toml. See issue #343 and CLAUDE.md "Git Tag / Release Convention".
# When publishing, bump only the crates that actually changed.
# NOTE: workspace-level license is MIT. All crates inherit this via `license.workspace = true`.
license = "MIT"
repository = "https://github.com/bobmatnyc/trusty-tools"
authors = ["Bob Matsuoka <bob@matsuoka.com>"]

[workspace.dependencies]
# ── Internal crates (path deps so the monorepo builds without publish cycles) ──
# trusty-code: per-project Claude-Code-compatible MPM orchestration harness (#587).
# First published to crates.io at version 0.1.0.
trusty-code = { path = "crates/trusty-code" }
# trusty-tui: engine-agnostic terminal-UI seam (`TuiEngine` trait + `ReplEvent`)
# shared by trusty-code's `tcode tui` and trusty-agents' tagent REPL (DOC-50,
# epic #3411). Not yet published (Slice 1, #3425).
trusty-tui = { path = "crates/trusty-tui", version = "0.1.0" }
trusty-agents-common = { path = "crates/trusty-agents-common", version = "0.5.1" }
trusty-common = { path = "crates/trusty-common", version = "0.33" }
# trusty-embedderd: embedding daemon — referenced by trusty-search so
# `cargo install trusty-search` produces both binaries from one command.
trusty-embedderd = { path = "crates/trusty-embedderd", version = "0.3.10" }
# trusty-bm25-daemon: per-palace BM25 lexical-index daemon — referenced by
# trusty-memory so `cargo install trusty-memory` produces both binaries from
# one command (mirrors the trusty-embedderd / trusty-search pattern, PR #190).
trusty-bm25-daemon = { path = "crates/trusty-bm25-daemon", version = "0.2.0" }
# tga: trusty-git-analytics — developer productivity analytics, and (since
# #5468) the sole owner of contributor profiling. No workspace member takes a
# Cargo edge on it: #5466 removed trusty-review's, and the tga -> trusty-review
# direction is a PATH lookup, not a manifest edge (#5236, DOC-67 §6). The entry
# stays so a future in-tree consumer resolves from source rather than crates.io.
tga = { path = "crates/trusty-git-analytics", version = "2.10" }
# trusty-mpm: unified crate (replaces the former trusty-mpm-{core,mcp,client,
# daemon,cli,tui,telegram} sub-crates). The gui sub-crate is kept separate
# because it owns Tauri's build.rs and tauri.conf.json.
trusty-mpm = { path = "crates/trusty-mpm", version = "1.0.0" }
# trusty-review: LLM-backed PR-review service. Referenced by trusty-analyze
# (behind the optional `review` feature) so the analyze MCP server can expose
# the trusty-review pipeline as `tr_review_*` tools (#630).
# Why (#5466): `default-features = false` HERE, not only on the member entry.
#      Cargo ignores a member's `default-features = false` when the workspace
#      entry omits the key (it warns, and says it may become a hard error), so
#      trusty-analyze's own `default-features = false` was a silent no-op until
#      this line existed. Both consumers name what they need: trusty-analyze's
#      `review` feature pulls `trusty-review/mcp`; trusty-mpm's dev-dependency
#      only touches `integrations`, which is unconditional.
trusty-review = { path = "crates/trusty-review", version = "0.17", default-features = false }
# trusty-console: web dashboard for trusty services. As of #1318 the standalone
# `trusty-console` crate is the SOLE producer of the `trusty-console` binary
# (de-bundled from the host crates for single-owner-per-binary). It is still a
# published library crate; the path entry remains so any local lib consumers
# resolve in-tree.
trusty-console = { path = "crates/trusty-console", version = "0.5.0" }
# trusty-progress: shared rustup/cargo-style progress + status display (#1315).
# Consumed by trusty-installer for install/upgrade component rows; published library crate.
trusty-progress = { path = "crates/trusty-progress", version = "0.3.0" }
# trusty-installer: consumed as a LIBRARY by trusty-audit for the pinned,
# fail-closed prebuilt download entry point (#5491, #5495). trusty-audit is
# `publish = false`, so this entry exists for in-tree resolution.
trusty-installer = { path = "crates/trusty-installer", version = "0.8" }

# ── Async runtime / HTTP ────────────────────────────────────────────────────
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML (de)serialisation. PINNED to the 0.9.x line — and ONLY 0.9.x — on
# purpose (#1220 acceptance criterion #4): the 0.8 line has known parsing
# soundness issues that were fixed in 0.9, so 0.9 is the floor for any new
# YAML-consuming code in this workspace (e.g. the
# `~/.trusty-tools/<crate>/config.yaml` convention added in #1220). Note:
# `serde_yaml` 0.9 itself still resolves to the `unsafe-libyaml` C-transliteration
# backend (dtolnay's c2rust port of libyaml, unsafe pointer code) — it is NOT the
# pure-Rust `libyaml-safer` backend; do not claim otherwise in docs. There are no
# open advisories against `unsafe-libyaml` today, which is why this pin is still
# the safe choice. `serde_yaml` is the workspace-wide standard for all
# YAML-consuming code: `serde_yml` (a fork once considered as a "maintained
# successor" per the old #1250 direction) turned out to be archived upstream and
# unsound (GHSA-hhw4-xg65-fp2x / GHSA-gfxp-f68g-8x78, Dependabot #42/#43) —
# trusty-agents and trusty-search were migrated back onto `serde_yaml` in #2991.
# Do not reintroduce `serde_yml` or `libyml`.
serde_yaml = "0.9"
# Jaro-Winkler / Levenshtein similarity helpers used by the
# `trusty_common::help` "did you mean?" suggester behind the `cli-help`
# feature. Pure-Rust, no transitive native deps.
strsim = "0.11"
# Widened to `full` so trusty-mpm + trusty-agents + trusty-memory get
# process/signal/time/fs; the originally-listed feature set is a strict
# subset of `full`.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
fastembed = { version = "5", default-features = false }
lru = "0.16"
parking_lot = "0.12"
dirs = "5"
colored = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
futures-util = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
# IANA named-timezone support (e.g. "America/New_York") for chrono. Already
# resolved in Cargo.lock transitively via `tera` (trusty-git-analytics); pinned
# here as a first-class workspace dep for trusty-agents' user-timezone-aware
# date/time rendering (#3052 follow-up).
chrono-tz = "0.9"
base64 = "0.22"
# jsonwebtoken 10 splits the crypto backend behind a feature flag (no backend
# in default features). We select `aws_lc_rs` (already built via aws-smithy) so
# RS256 works, and avoid `rust_crypto` which would pull in the `rsa` crate
# (RUSTSEC-2023-0071 Marvin advisory). `use_pem` stays on via default features
# for `EncodingKey::from_rsa_pem`. See #2765 (GHSA-h395-gr6q-cpjc).
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
# v5 (ADR-0027): room ids are minted as name-based UUIDv5 over a canonical
# key so they are reproducible across processes without coordination and carry
# a full SHA-1 digest rather than the colliding 16-byte fold they replace.
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
# Cross-process advisory file locking for trusty-gworkspace's tokens.json
# read-modify-write critical section (issue #3502) — small, actively
# maintained, no unsafe beyond the platform lock syscalls it wraps.
fd-lock = "4"
# Gzip decompression for prebuilt-binary tarballs (trusty-installer Phase 2).
flate2 = "1"
# Tar archive extraction for prebuilt-binary tarballs (trusty-installer Phase 2).
tar = "0.4"
# Semantic-version parsing for GitHub release tag comparison (trusty-installer Phase 2).
semver = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
# Hidden (no-echo) terminal input for the universal `config keys set` verb
# (issue #2404), gated behind trusty-common's `config-cli` feature. Reads a
# secret from the TTY without echoing it so keys never land in shell history.
rpassword = "7"
toml = "0.8"
# Format-preserving TOML editing for `trusty-common::codex_config` (#5264):
# the Codex CLI config is a hand-maintained file, so a registration repair must
# not reflow the operator's comments and unrelated tables.
toml_edit = "0.22"
libc = "0.2"
unicode-width = "0.2"
# `.env.local` loader for the trusty-common `credentials` resolver
# (issue #2401). Already used ad hoc by trusty-agents and trusty-search; the
# workspace-shared pin lets those crates adopt the canonical loader later
# without a version bump.
dotenvy = "0.15"
# OS-keychain credential storage for the `credentials::KeyringStore`
# backend (issue #2401), gated behind trusty-common's `keyring-store` feature.
# `apple-native`/`windows-native`/`sync-secret-service` select the per-OS
# backend transparently; async D-Bus support is not needed here.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# CLI / TUI / Telegram (trusty-mpm-tui, trusty-mpm-telegram).
ratatui = "0.29"
crossterm = "0.28"
# `default-features = false` + `rustls` (issue #3538): teloxide's default
# feature set pulls in `native-tls` -> `openssl-sys`, which needs a system
# OpenSSL the Linux release environment doesn't have. Swap to the rustls
# backend and re-enable the other two default features the code actually
# uses: `macros` (BotCommands derive, trusty-mpm/src/telegram) and
# `ctrlc_handler` (Dispatcher::enable_ctrlc_handler(), same file).
teloxide = { version = "0.17", default-features = false, features = ["rustls", "macros", "ctrlc_handler"] }
# Slack Socket-Mode WebSocket client (trusty-mpm `slack` feature, DOC-20 #1294).
# Same pin/features trusty-agents already uses, so the lockfile is unchanged.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# #4825: direct rustls handle so a binary can install the process-level
# CryptoProvider explicitly. One rustls 0.23 instance in this graph carries
# BOTH provider features — `ring` (reqwest's `rustls-tls`, `ureq`) and
# `aws-lc-rs` (the aws-smithy client stack) — so rustls cannot auto-select one
# and panics on the first handshake that goes through `ClientConfig::builder()`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# Progress bars / spinners. Shared rustup/cargo-style progress display lives in
# the `trusty-progress` crate (#1315). Pinned to 0.17 to match the existing
# local pins in trusty-search and tga; migrating those two crates to this
# workspace dep is a tracked follow-up (do NOT churn them here, see #1315).
indicatif = "0.17"

# Misc utilities used across crates.
dashmap = "6"
walkdir = "2"
# Lock-free `Arc` hot-swap for runtime backend switching (epic #3524 slice 6:
# `SwitchableEmbedder` wraps the active embedder backend behind this so
# reads never block a swap). Widely used, minimal deps.
arc-swap = "1"
# gitignore-aware recursive file walking (ripgrep's walker) + glob matching —
# power the tcode engineer's native glob/grep exploration tools (#1027). Both
# are already in the workspace lockfile (transitive via trusty-search), so
# promoting them to explicit workspace deps adds no new lockfile entries.
ignore = "0.4"
globset = "0.4"
regex = "1"
# POSIX shell word-splitting for the PM Bash guard's git-argv parsing (#2734):
# quote-aware tokenization so quoted `-m` message content is not mistaken for
# shell operators, and git global flags (`-C <path>`, `-c <kv>`, …) are skipped
# to resolve the real subcommand.
shlex = "1.3"
gray_matter = "0.2"
notify = "6"
# CommonMark AST parser — powers trusty-channels' CommonMark → Slack
# canvas-markdown translator (issue #3744 slice 2). Already present in the
# lockfile pinned locally by trusty-agents at the same version; promoted to a
# workspace dep here rather than re-pinned so both crates share one resolved
# version. `default-features = false` drops the `shortcodes`/`syntect` extras
# neither consumer needs.
comrak = { version = "0.52", default-features = false }
# Process / system introspection (RSS, CPU sampling for daemon /health).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Storage / KG / embeddings (trusty-common memory-core feature).
usearch = "2.25"
# Pure-Rust HNSW (issue #50). The `serde` feature does not exist on
# hnsw_rs 0.3 — vectors are persisted in redb (postcard-encoded) and the
# in-memory Hnsw index is rebuilt on palace open, so direct serde of the
# Hnsw struct is unnecessary.
hnsw_rs = "0.3"
# Align with trusty-memory upstream (rusqlite 0.39, bundled libsqlite3).
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
tiktoken-rs = "0.5"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
kuzu = "0.9"

# Embedded assets (trusty-memory, trusty-agents).
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
mime_guess = "2"

# OpenAPI / Swagger (utoipa 5 + axum 0.8 — see trusty-mpm-mcp).
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# serial_test: run env-mutating tests serially to prevent env-var races across
# parallel test threads. Used by bug-report token tests.
serial_test = "3"
# wiremock: async HTTP mock server for hermetic reqwest-based client tests
# (e.g. trusty-channels' 200/401/429 Slack Web API paths). Also pinned locally by
# trusty-git-analytics; this shared entry is the canonical version.
wiremock = "0.6"

# ── AWS Bedrock (optional; used by trusty-common `bedrock` feature + trusty-agents + tga) ──
# Versions pinned to what is already resolved in Cargo.lock (1.8.17 / 1.131.0).
# `behavior-version-latest` silences the deprecation warning on aws_config::load_from_env().
# `aws-sdk-bedrockruntime`'s default `rustls` feature drags in a legacy hyper 0.14 +
# rustls 0.21 + rustls-webpki 0.101.7 TLS stack for backward compat (GHSA-82j2-j2ch-gfr8,
# GHSA-xgp8-3hg3-c2mh, GHSA-965h-392x-2mh5 / Dependabot #46-48). Disable default-features
# and select only the modern rustls-aws-lc based client (`default-https-client`) instead.
aws-config             = { version = "1.8", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.131", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types              = { version = "1" }
aws-smithy-types       = { version = "1.4" }

# ── trusty-analyze additional deps ────────────────────────────────────────
clap_complete = "4"
which = "6"
open = "5"
redb = "4"
postcard = { version = "1", features = ["alloc"] }
ndarray = "0.16"
scip = "0.7"
protobuf = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hmac = "0.12"
hex = "0.4"
ort = "2.0.0-rc.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Candle: optional Metal/CPU BERT backend (issue #54). Versions match the
# pre-existing pins in `trusty-search` so both consumers resolve to a single
# version. The deps are listed here so the shared embedder in
# `trusty-common` (behind `embedder-candle`) and the `trusty-search`
# in-crate path can pull from the same workspace entry.
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
hf-hub = { version = "0.3", default-features = false, features = ["online", "tokio"] }
http-body-util = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "=0.7.0"
tree-sitter-scala = "0.24"

# ── Document extraction (trusty-search native pdf/docx/xlsx indexing, #2923) ──
# pdf-extract: pure-Rust PDF text extraction (MIT). No system deps (no poppler/
# pdfium); scanned/image-only PDFs yield empty text, which the extractor layer
# turns into an explicit "no extractable text" warning rather than a silent
# empty index (OCR is out of scope for v1).
# Pinned to >=0.12 (issue #3367): 0.9 pulled lopdf 0.36.0, vulnerable to
# RUSTSEC-2026-0187 (stack-overflow DoS via deeply nested PDF objects, CVSS
# 7.5); 0.12 pulls patched lopdf >=0.42.
pdf-extract = "0.12"
# calamine: pure-Rust xls/xlsx/xlsm/ods reader (MIT), used to read spreadsheet
# rows per sheet.
# Pinned to >=0.36 (issue #3367): 0.26 pulled quick-xml 0.31.0, vulnerable to
# RUSTSEC-2026-0194/0195 (DoS, CVSS 7.5 each); 0.36 pulls patched
# quick-xml >=0.41.
calamine = "0.36"
# zip + quick-xml: OOXML (.docx) is a zip container around XML parts. Parsing
# `word/document.xml` ourselves (rather than pulling in docx-rs) matches this
# repo's own-the-parsing style and avoids a much larger dependency surface for
# a single-purpose paragraph-text extraction need.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pinned to >=0.41 (issue #3367): 0.37.5 is vulnerable to RUSTSEC-2026-0194/0195.
quick-xml = "0.41"

# ── [patch.crates-io] ──────────────────────────────────────────────────────
# trusty-search and a handful of other crates depend on trusty-common by
# version (because it was previously published from a separate repo). In the
# monorepo we want those resolves to hit the in-tree path, so patch it here.
# Cargo only honours `[patch]` tables at the workspace root.
# Note: trusty-embedder, trusty-mcp-core, and trusty-symgraph were absorbed
# into trusty-common (refactor: consolidate 5 utility crates into trusty-common).
# Their [patch] entries are no longer needed.
[patch.crates-io]
trusty-common = { path = "crates/trusty-common" }
trusty-embedderd = { path = "crates/trusty-embedderd" }
