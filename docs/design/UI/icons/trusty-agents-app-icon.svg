<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Trusty Agents app icon</title>
  <desc id="desc">A lead PM robot in front of two supporting robot units.</desc>

  <!-- Night Shift chassis -->
  <rect width="1024" height="1024" rx="224" fill="#201612"/>
  <rect x="28" y="28" width="968" height="968" rx="200" fill="none" stroke="#46311F" stroke-width="12"/>

  <!-- Supporting UNIT, left -->
  <g opacity=".92">
    <path d="M280 328v-66" stroke="#C4B096" stroke-width="22"/>
    <rect x="258" y="222" width="44" height="44" rx="10" fill="#C4B096"/>
    <rect x="92" y="328" width="376" height="350" rx="64" fill="#8A5A2B"/>
    <rect x="170" y="450" width="58" height="58" rx="10" fill="#201612"/>
    <rect x="332" y="450" width="58" height="58" rx="10" fill="#201612"/>
    <path d="M202 584h156" stroke="#201612" stroke-width="24" stroke-linecap="square"/>
  </g>

  <!-- Supporting UNIT, right -->
  <g opacity=".92">
    <path d="M744 328v-66" stroke="#C4B096" stroke-width="22"/>
    <rect x="722" y="222" width="44" height="44" rx="10" fill="#C4B096"/>
    <rect x="556" y="328" width="376" height="350" rx="64" fill="#B7410E"/>
    <rect x="634" y="450" width="58" height="58" rx="10" fill="#201612"/>
    <rect x="796" y="450" width="58" height="58" rx="10" fill="#201612"/>
    <path d="M666 584h156" stroke="#201612" stroke-width="24" stroke-linecap="square"/>
  </g>

  <!-- Lead PM UNIT: larger, forward, and centered -->
  <g>
    <path d="M512 290v-92" stroke="#E9B98A" stroke-width="28"/>
    <rect x="482" y="144" width="60" height="60" rx="13" fill="#D97742"/>
    <rect x="270" y="290" width="484" height="492" rx="78" fill="#D97742"/>
    <rect x="298" y="318" width="428" height="436" rx="54" fill="none" stroke="#E9B98A" stroke-width="9" opacity=".55"/>
    <rect x="366" y="464" width="76" height="76" rx="13" fill="#201612"/>
    <rect x="582" y="464" width="76" height="76" rx="13" fill="#201612"/>
    <path d="M400 658h224" stroke="#201612" stroke-width="30" stroke-linecap="square"/>
  </g>
</svg>
