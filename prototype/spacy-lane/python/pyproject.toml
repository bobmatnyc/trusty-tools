[project]
name = "kg-pos-sidecar"
version = "0.1.0"
description = "spaCy POS/NP sidecar for trusty-memory kg_extract (bake-off lane B prototype, #5399)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8,<3.9",
    "en_core_web_sm",
]

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_pos_sidecar"]
