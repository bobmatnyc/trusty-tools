# Egress allowlist for the sled (DOC-90 section 6, ADR-0076). Refs #11054 #11073.
#
# Owner ruling D1b (Bob, 2026-11-11 21:23Z): "Accept all eight as recommended."
#   One allowlisted egress proxy; CONNECT to port 443 only, from the app subnet
#   only; no plain HTTP; no raw-IP CONNECT; no cache; every decision logged.
# Owner ruling D20 (2026-11-11, settles DOC-90 OQ-3): controlplane.tailscale.com,
#   login.tailscale.com and the DERP relay pattern join the steady profile, so
#   `tailscale serve` works from inside the sled. Tailnet traffic is meant to be
#   relay-only; UNVERIFIED, no tailnet joined yet (README.md, Tailscale).
#   log.tailscale.com, log.tailscale.io and console.tailscale.com stay denied.
# A host is added only by a named owner ruling cited here (DOC-90 OUT-5).

# At start, sled-bind-addr rewrites this line in the copy squid runs
# (/run/squid-run.conf) to the container's internal-network address, so the
# default bridge (outbound side) gets no answer (#11156). Nothing is published.
http_port 3128

# Only the sled's internal network may use the proxy. Keep this subnet equal to
# the `docker network create --subnet` value in README.md.
acl internal_net src 10.250.78.0/24
acl tls_port port 443
acl connect_method method CONNECT

# Raw IPv4 (dotted or bare integer) and IPv6 literals, with or without brackets.
# -n: match the literal; never reverse-resolve it to a name.
acl raw_ip dstdom_regex -n ^[0-9.]+$
acl raw_ip dstdom_regex -n -i ^\[?[0-9a-f]*:[0-9a-f:.]*\]?$

# Steady profile (DOC-90 OUT-4). Model API (ruling 3), GitHub (ruling 5),
# Tailscale control hosts (D20).
acl steady_hosts dstdomain api.anthropic.com
acl steady_hosts dstdomain github.com
acl steady_hosts dstdomain api.github.com
acl steady_hosts dstdomain controlplane.tailscale.com
acl steady_hosts dstdomain login.tailscale.com
# DERP relays (D20): derp<region><letter>.tailscale.com, never .tailscale.com.
acl derp dstdom_regex -i ^derp[0-9]+[a-z]*(-all)?\.tailscale\.com$

http_access deny !internal_net
http_access deny !connect_method
http_access deny connect_method !tls_port
# Before every allow: a raw-IP target is denied whatever it is.
http_access deny connect_method raw_ip
http_access allow connect_method tls_port steady_hosts
http_access allow connect_method tls_port derp
# Login profile: empty in steady state. `sled-profile login` copies login.conf
# here and `sled-profile steady` empties it again (see README.md).
include /etc/squid/profile.d/active.conf
http_access deny all

# No cache; no disk state.
cache deny all
cache_log /var/log/squid/cache.log
access_log stdio:/var/log/squid/access.log
pid_filename /run/squid.pid
# Each line: time, client, TCP_DENIED/403 or TCP_TUNNEL/200, CONNECT host:port.
via off
forwarded_for delete
