# Egress allowlist for the cloudtest container. Refs #11054.
# Three destinations are allowed, CONNECT port 443 only: api.anthropic.com, plus
# platform.claude.com and claude.ai for the interactive login (owner-approved).

# All interfaces of this container: the internal network (app side) and the
# default bridge (outbound side). Nothing is published, so the host sees no port.
http_port 3128

# Only the internal network may use the proxy (fixed subnet, see README).
acl internal_net src 10.250.77.0/24
acl tls_port port 443
acl connect_method method CONNECT
# -n: no reverse-DNS lookup. Without it, a CONNECT to an IP literal is matched by
# the IP's PTR name, which whoever owns the IP can set to an allowed host. With
# it, an IP literal never matches and falls to `deny all`. Refs #11054
acl anthropic_api dstdomain -n api.anthropic.com

# Interactive Claude Code login (/login). Exactly these two, owner-approved.
acl anthropic_extra dstdomain -n platform.claude.com
acl anthropic_extra dstdomain -n claude.ai

http_access deny !internal_net
http_access deny !connect_method
http_access deny connect_method !tls_port
http_access allow connect_method tls_port anthropic_api
http_access allow connect_method tls_port anthropic_extra
http_access deny all

# No cache; no disk state.
cache deny all
cache_log /var/log/squid/cache.log
access_log stdio:/var/log/squid/access.log
pid_filename /run/squid.pid
# Each line: time, client, TCP_DENIED/403 or TCP_TUNNEL/200, CONNECT host:port.
via off
forwarded_for delete
