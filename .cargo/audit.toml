# cargo-audit configuration — read automatically from `.cargo/audit.toml` at the
# workspace root by the `cargo audit` leg of `.github/workflows/pre-publish.yml`
# (Gate 2) and by `.github/workflows/cargo-audit.yml` (the weekly cron).
#
# SCOPE: this file exists ONLY to hold time-boxed advisory deferrals. It is not a
# place to turn the gate down. Every entry names one advisory id, and the comment
# above it says who deferred it, when, and what clears it.
#
# NO EXPIRY FIELD EXISTS HERE, AND NONE IN `deny.toml` EITHER. cargo-audit's
# ignore list is a bare array of ids. cargo-deny's ignore entry accepts only
# `id` and `reason` (it rejects `expires`). The review date for this deferral
# lives in the `reason` string of the matching `deny.toml` `[advisories].ignore`
# entry — "REVIEW BY 2026-11-13" — and nothing enforces it automatically; a
# human acts on it. Remove the id here in the same change that removes it there.

[advisories]
