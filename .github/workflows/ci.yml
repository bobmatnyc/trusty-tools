# CI workflow for the trusty-tools Cargo workspace.
#
# Jobs:
#   changes  – classify the diff as docs-only or not, once, for every job
#              below to consult (issue #4468: docs-only PRs ran the full Rust
#              build). The exemption is applied to STEPS, never to the trigger
#              or to the job, so required checks always report.
#   fmt      – cargo fmt --all --check (stable)
#   clippy   – cargo clippy --workspace --all-targets -D warnings (stable, SKIP_UI_BUILD=1)
#   test     – cargo test --workspace (stable, SKIP_UI_BUILD=1, full clone for git tests)
#   msrv     – cargo check --workspace (toolchain 1.94, SKIP_UI_BUILD=1)
#   agents-ui – cargo clippy -p trusty-agents-ui (stable, WebKit2GTK-enabled runner)
#   embedder-cuda-check – cargo check -p trusty-common --features embedder-cuda
#                         (issue #3508: compile-check the deadlock-safety
#                         invariant test that is otherwise never compiled)
#   ui-checks – matrix job running each of the 7 UI crates' OWN existing
#               test/build scripts (issue: SKIP_UI_BUILD=1 means pnpm is never
#               invoked anywhere else in CI)
#   notify-main-failure – file/refresh a tracking issue when `push: main` CI
#                         goes red (post-merge breakage was detected but never
#                         alerted)
#
# trusty-mpm-gui, trusty-code-gui, and trusty-agents-ui are excluded from the
# headless workspace jobs (clippy/test/msrv): all three are Tauri desktop apps
# (publish = false) that require WebKit2GTK on Linux (~100 MB apt chain) which
# the headless runners do not install. Exclude them via
# --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui
# on every workspace-wide cargo invocation.
#
# UNLIKE the two other GUIs, trusty-agents-ui gets a DEDICATED `agents-ui` job
# (#3053) that installs the WebKit2GTK toolchain and runs
# `cargo clippy -p trusty-agents-ui --all-targets -- -D warnings`, so the crate
# is genuinely build- and lint-verified in CI rather than merely excluded. That
# job stubs a minimal `crates/trusty-agents/ui/dist/index.html` (gitignored)
# because `tauri::generate_context!()` requires the `frontendDist` path to
# exist at compile time; a placeholder is sufficient to compile- and
# lint-verify the Rust side without pulling node/pnpm into CI.
#
# SKIP_UI_BUILD=1 is set globally: the four crates with build.rs Svelte
# pipelines (trusty-search, trusty-memory, trusty-analyze, trusty-agents) skip
# pnpm when this env var is set. The committed ui-dist/ artefacts embedded
# via include_dir!/include_str! are sufficient for compilation.
#
# FASTEMBED MODEL CACHE (issue #865): the test job pre-seeds the
# AllMiniLML6V2Q ONNX model (Xenova/all-MiniLM-L6-v2, ~22 MB) into
# ~/.cache/fastembed before cargo test runs, and preserves the populated
# directory in the Actions cache keyed on Cargo.lock. This eliminates the
# intermittent HTTP 429 failures from HuggingFace that were causing ~31
# trusty-memory tests to fail spuriously on cold runners.
#
# Issue #3493 P0 part 2 extends this to also pre-seed the fp32
# Qdrant/all-MiniLM-L6-v2-onnx model (~90 MB, AllMiniLML6V2 — the default
# model since #3486/#3493 P0): the accuracy correctness gate
# `default_model_matches_sentence_transformers_reference`
# (crates/trusty-common/src/embedder/mod.rs) was un-`#[ignore]`d so it
# actually runs as a real CI gate against the CoreML-default regression
# class, and it constructs the default `FastEmbedder` — see the "Pre-seed
# fastembed models" step below for the download logic.
#
# The 7 env-sensitive trusty-memory tests (project_slug_returns_none_without_markers,
# project_slug_at_returns_none_without_markers, cwd_palace_slug_falls_back_to_basename,
# palace_slug_from_stdin_cwd_uses_stdin_path, resolve_palace_for_log_prefers_stdin_cwd,
# prompt_context_recall_filters_deny_tags, prompt_context_recalls_palace_drawers) fail
# on developer machines because tempfile::tempdir() creates dirs under a path that is
# itself inside the trusty-tools git worktree, causing find_project_root to return a
# non-None value. On the CI runner /tmp is a clean filesystem with no git ancestor, so
# these tests are expected to pass. They are NOT excluded here; if they go red in CI
# that is a real bug and should block the PR.
#
# trusty-agents git tests (git::branch::tests::list_branches_includes_current,
# git::log::tests::search_commits_finds_known_keyword) require a full git clone
# with local branch refs and commit history. The test job uses fetch-depth: 0
# to ensure a full (non-shallow) clone is present.
#
# MSRV NOTE: the effective MSRV is 1.94, declared as [workspace.package]
# rust-version = "1.94" in the root Cargo.toml. It is driven by aws-config
# >= 1.9.0 / aws-sdk-bedrockruntime >= 1.136.0 (published 2026-07-08), which
# declare rust-version = "1.94.1". The msrv job below pins
# dtolnay/rust-toolchain@1.94 to enforce this floor. See
# docs/adr/0029-msrv-1-94-and-edition-policy.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # EXPLICIT activity types (#4179). Without a `types:` key GitHub uses the
    # default set — opened, synchronize, reopened — and RETARGETING a pull
    # request fires none of them: a base change is delivered as `edited` with
    # `changes.base`. A stacked PR opened against another feature branch is
    # therefore filtered out by `branches: [main]` while it is stacked, and
    # then never re-triggered when it is retargeted to main. PR #3838 merged
    # with `statusCheckRollup: []` — zero check runs, ever — exactly this way.
    #
    # `edited` also fires on title/body edits. Left alone that is worse than a
    # duplicate run: the PR concurrency group is the same for `edited` and
    # `synchronize`, so an edit mid-flight would CANCEL the running checks and
    # restart from zero — up to ~16 min of `Test` discarded, and under repeated
    # description edits (routine here, agents rewrite PR bodies) the checks
    # could be kept from ever settling. The `cancel-in-progress` expression
    # below excludes `edited` for exactly that reason, so an edit-triggered run
    # leaves the in-flight one alone instead of killing it. `ready_for_review`
    # (also non-default) covers a draft being marked ready.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# PULL REQUESTS: one run per PR ref — a new push supersedes the previous run,
# which is what saves the CI minutes this key was added for.
#
# PUSH TO MAIN: the group is keyed to the COMMIT, not the branch, so it is
# unique per merge and no run is ever cancelled or queued behind a sibling
# (#4179). The previous `ci-${{ github.ref }}` + `cancel-in-progress: true`
# meant every push to main shared the group `ci-refs/heads/main`, so each merge
# KILLED the previous merge's verification: 19 of 60 sampled push-to-main runs
# (32%) concluded `cancelled`. A cancelled run is the only signal that commit
# will ever get — the commit is already on main, so there is nothing to
# supersede and nothing to save by cancelling.
#
# `edited` is excluded from cancel-in-progress: a title/body edit shares the PR
# group with the real run, so cancelling on it would discard up to ~16 min of
# in-flight `Test`. Excluded, the edit-triggered run leaves the running one
# alone and it still reaches a conclusion. Costs an extra run per description
# edit; throws away no completed work. Observed on this PR: two body edits
# produced two extra runs and the in-flight run completed `success` regardless.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

# SKIP_UI_BUILD=1 prevents the four build.rs Svelte pipelines from invoking pnpm.
env:
  SKIP_UI_BUILD: "1"
  CARGO_TERM_COLOR: always
  # Reduce noise from ort/fastembed download progress bars.
  RUST_LOG: "warn"

jobs:
  # --------------------------------------------------------------------------
  # changes: classify the diff as docs-only or not (issue #4468), once, for
  # every job below to consult.
  #
  # WHY THIS IS A JOB AND NOT A `paths:` FILTER. Five of this workflow's checks
  # are REQUIRED by branch protection (Format check, Clippy, Test, MSRV check
  # (1.94), trusty-search daemon smoke test). GitHub does not create check runs
  # for a workflow its path/branch filters skipped, so a required context would
  # sit pending forever and a docs-only PR would become unmergeable instead of
  # fast — the trap #4468 calls out and the one
  # .github/workflows/changelog-fragment.yml already documents. So every job
  # still RUNS and still REPORTS; the exemption lives inside the jobs, on the
  # steps that cost money. A docs-only PR therefore gets a green required check
  # in ~30 s of runner startup instead of 45 minutes of cargo.
  #
  # The same reasoning rules out a job-level `if:`. GitHub documents a
  # conditionally-skipped job as reporting success to branch protection, but
  # the failure mode if that is wrong is every docs PR blocked forever, so the
  # jobs are kept unconditional and only their steps are gated.
  #
  # PUSH TO MAIN never takes the exemption: main is the branch everything is
  # cut from, so it is verified in full regardless of what the diff touched.
  # --------------------------------------------------------------------------
  changes:
    name: Detect docs-only change set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # fetch-depth: 0 — the detector needs `git merge-base` against the base
      # branch, which a shallow checkout cannot resolve.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The detector and the notifier's conclusion mapping are both pure shell
      # with fixture-backed selftests; run them here so a regression in either
      # is caught on the PR that introduces it rather than in production.
      - name: CI helper selftests (#4179, #4468, #4421)
        run: bash scripts/check-ci-helpers-selftest.sh

      # Refresh the base branch ref (same fix as #4688 in version-parity.yml's
      # pr-version-bump job). `github.event.pull_request.base.sha` is a
      # SNAPSHOT taken when the triggering event was delivered, but
      # `actions/checkout`'s default ref for a pull_request event
      # (`refs/pull/<PR>/merge`) is a GitHub-generated merge commit whose first
      # parent tracks the base branch's CURRENT tip, refreshed continuously and
      # independently of that snapshot. On a repo merging this frequently, the
      # gap between "when the event fired" and "when this job actually runs"
      # routinely spans several unrelated merges to main. `git merge-base
      # <stale-sha> HEAD` then resolves to that stale snapshot itself (it IS an
      # ancestor of HEAD), so the diff against it sweeps in every file touched
      # by every commit merged to main in between — a genuinely docs-only PR
      # gets misclassified as docs_only=false. Live instance: PR #4960 (4 files,
      # all under docs/) was classified as 23 changed paths including a dozen
      # unrelated trusty-mpm .rs files, because its stale base.sha lagged the
      # live merge ref by ~25 minutes / several merges. Re-fetching
      # `origin/<base-ref>` right before diffing pins DOCS_ONLY_BASE to the
      # freshest tip available at diff time, closing that window.
      - name: Refresh the base branch ref (#4688 pattern — avoid a stale merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Classify changed paths
        id: detect
        env:
          DOCS_ONLY_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push to ${{ github.ref }} — verifying in full, no docs-only exemption"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/detect-docs-only.sh > /dev/null

  # --------------------------------------------------------------------------
  # fmt: enforce cargo fmt --all --check (stable toolchain + rustfmt component)
  #
  # The instruction floor guard below is NOT gated on the docs-only detection:
  # it guards instruction/markdown content, which is exactly what a docs-only
  # PR changes.
  # --------------------------------------------------------------------------
  fmt:
    name: Format check
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with rustfmt
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Note: rustfmt.toml uses imports_granularity and group_imports which are
      # nightly-only; stable rustfmt silently ignores them (emits warnings, exit 0).
      # The format check itself is not affected.
      - name: cargo fmt --all --check
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo fmt --all --check

  # --------------------------------------------------------------------------
  # clippy: deny warnings across the whole workspace (stable, all targets)
  # trusty-mpm-gui, trusty-code-gui, trusty-agents-ui excluded: Tauri desktop apps, need WebKit2GTK on Linux.
  # --------------------------------------------------------------------------
  clippy:
    name: Clippy
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Free disk space (#2091; prune gated #4402, SDK purge gated #5325).
      # Reclaims only when `df` says this runner needs it — thresholds, the
      # three-tier decision, and why the reclamation is gated rather than
      # deleted all live in the script.
      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-free-disk-space.sh

      - name: Install stable toolchain with clippy
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key per job so fmt/clippy/test/msrv don't fight
          # over incompatible target directories.
          key: clippy
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache above.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui -- -D warnings

  # --------------------------------------------------------------------------
  # test-shard: run all unit + integration tests (stable, no --include-ignored),
  # split four ways by nextest partition. The `test` job below aggregates these
  # into the single required check named "Test".
  #
  # Why sharded: the unsharded job ran 16–24 minutes and was the critical path
  # of every CI run — ~45% of it executing tests one binary at a time.
  #
  # Why partitioned rather than split by crate. Splitting by crate (`-p a -p b`
  # per shard) would also cut the build, and that was the first design here. It
  # is wrong, and quietly so. Cargo resolves features across the packages in ONE
  # invocation, so a shard that builds a subset resolves a SUBSET of features:
  # measured on this workspace, a shard containing trusty-common + its six
  # nearest neighbours saw 24 of the 37 trusty-common features that `--workspace`
  # resolves, losing embedder, memory-core, bm25, migrations and friends — and
  # every test behind those `#[cfg(feature = …)]` gates with them. A bare
  # `cargo test -p trusty-common --lib` lists 310 tests where `--workspace`
  # lists 2062. Four green shards, ~1750 trusty-common tests not run, nothing
  # anywhere saying so.
  #
  # `--partition` cannot do that. Every shard runs the same `--workspace` build,
  # so feature resolution is byte-for-byte what it was before this change, and
  # nextest assigns each test in the resolved list to exactly one partition.
  # The split is over test EXECUTION only, and its totality is a property of
  # nextest's partitioner rather than of a crate list somebody has to maintain.
  # The build is not sharded; it is shared instead — see the cache note below.
  #
  # ONNX-backed tests are #[ignore]-tagged; they are intentionally skipped here
  # because they require model downloads and a running embedderd daemon.
  # trusty-mpm-gui, trusty-code-gui, trusty-agents-ui excluded: see clippy note above.
  # fetch-depth: 0 (full clone) required for trusty-agents git tests that inspect
  # local branch refs and search commit history.
  #
  # FASTEMBED MODEL CACHING (issue #865):
  # trusty-memory tests initialise FastEmbedder which downloads the
  # AllMiniLML6V2Q ONNX model from HuggingFace (Xenova/all-MiniLM-L6-v2,
  # ~22 MB). Cold CI runners concurrently fetch this file and hit HF's
  # HTTP 429 rate-limit, causing ~31 tests to fail spuriously.
  #
  # Fix: two-stage approach.
  #   1. Restore the model from the Actions cache keyed on the fastembed
  #      version (from Cargo.lock) + model repo IDs. On a cache hit the
  #      runner never contacts HuggingFace at all.
  #   2. On a cache miss, pre-seed the model BEFORE cargo test runs,
  #      using a retried curl download with exponential backoff (5 attempts,
  #      up to ~120 s total). One controlled download per cold runner is far
  #      more reliable than N concurrent in-test downloads.
  #
  # The model is stored under FASTEMBED_CACHE_DIR (~/.cache/fastembed on the
  # runner) using hf-hub's layout:
  #   models--Xenova--all-MiniLM-L6-v2/
  #     refs/main          <- snapshot hash pointer
  #     snapshots/<hash>/  <- model files (onnx/, tokenizer.json, …)
  #     blobs/<sha256>     <- actual content-addressed objects
  #
  # We cache the entire FASTEMBED_CACHE_DIR so any additional tokeniser /
  # config files pulled by fastembed are also captured.
  # --------------------------------------------------------------------------
  test-shard:
    name: Test shard ${{ matrix.shard }}
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole that PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard runs to completion. Cancelling siblings on the first
      # failure would hide the other shards' results, which is the opposite of
      # what sharding is for: one PR usually breaks one crate, and seeing the
      # other three shards stay green is what localises it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Point fastembed (and hf-hub) at a stable, writable path so the
      # actions/cache key can target it precisely. This env var is honoured
      # natively by fastembed-rs via get_cache_dir() and also by the
      # resolve_fastembed_cache_dir() helper in trusty-common.
      FASTEMBED_CACHE_DIR: /home/runner/.cache/fastembed
      # 179+ statically-linked test binaries with full default debuginfo
      # exhausted runner disk (~9 GB of binaries + the DWARF-driven share of
      # ~18 GB of never-swept intermediate .rcgu.o codegen objects); Linux
      # ELF embeds DWARF directly in the binary, unlike the macOS proxy.
      # line-tables-only keeps file:line info in panic backtraces while
      # dropping the bulk of debug records. See #3668.
      #
      # The workspace Cargo.toml has no [profile.test] override, so `cargo
      # test` normally inherits dev's implicit debug level — but the `test`
      # profile is the one actually selected by `cargo test`, and cargo
      # honors CARGO_PROFILE_TEST_DEBUG directly for it (verified locally:
      # this var alone changes the emitted debug info, no
      # CARGO_PROFILE_DEV_DEBUG needed). Scoped to this job only: the
      # clippy job's `--all-targets` run was checked and confirmed to build
      # under the check-only `dev` profile with zero linked executables and
      # zero .rcgu.o output, so it does not share this disk pressure.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Free disk space (#2091; prune gated #4402, SDK purge gated #5325).
      # #3668 was a real disk-exhaustion incident in this job, on a target/
      # tree fed by onnxruntime/ort, ~a dozen tree-sitter grammars,
      # aws-sdk-bedrock and usearch. The script fires the reclamation on
      # measured headroom instead of unconditionally; the .rcgu.o sweep below,
      # not this step, is what actually remedied #3668. Every shard still does
      # the full workspace build, so the disk pressure this guards against is
      # unchanged by sharding.
      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-free-disk-space.sh

      # trusty-agents's git tests (list_branches_includes_current) assert that the
      # local branch list includes "main". GitHub Actions PR checkouts only create
      # a local branch for the PR head; "main" is only a remote ref unless we
      # explicitly create a local tracking branch for it.
      - name: Create local main branch for git tests
        if: needs.changes.outputs.docs_only != 'true'
        run: git fetch origin main:main || true

      - name: Install stable toolchain
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      # The official prebuilt binary (get.nexte.st) rather than `cargo install
      # cargo-nextest`, which would compile the tool itself on every runner and
      # cost more than nextest saves. No third-party action involved.
      - name: Install cargo-nextest
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      # ONE cache shared by all four shards. Every shard runs the same
      # `--workspace` build and differs only in which tests it executes, so the
      # target/ trees are identical and four separate caches would be four
      # copies of the same bytes against a quota that is already blown.
      #
      # `save-if` restricted to main is deliberate and is a FIX, not a
      # restriction (see the PR that introduced sharding). GitHub scopes a
      # cache saved on a PR ref to that PR alone, but counts it against the
      # repo-wide 10 GB quota. This repo was sitting at 11.03 GB with FOUR
      # byte-identical 1.29 GB copies of this job's cache — one per open PR,
      # none readable by any other PR — which had evicted the one copy on
      # refs/heads/main that every PR actually restores from. That eviction is
      # what made ~half of all Test runs recompile the entire 864-crate
      # dependency graph from scratch (~+350s). Saving only from main keeps the
      # shared copy alive and stops PRs from evicting it.
      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cache key for the fastembed ONNX models (issue #865, corrected #4940):
      # the fastembed crate VERSION + the two model repo IDs used by this
      # workspace:
      #   - Xenova/all-MiniLM-L6-v2  (AllMiniLML6V2Q — primary, ~22 MB)
      #   - Qdrant/all-MiniLM-L6-v2-onnx (AllMiniLML6V2 — CPU fallback, ~86 MB)
      # Upgrading fastembed rotates the key so old model blobs are not served
      # to a new model registry.
      #
      # #4940: this used to be `hashFiles('Cargo.lock')` — the hash of the
      # WHOLE lockfile — while the comment claimed it was the fastembed
      # version. Those are not the same thing. Any dependency bump anywhere in
      # a 21-crate workspace rotated the key, so on a repo landing dozens of
      # PRs a day the cache was almost always cold and almost every run
      # re-downloaded ~110 MB from HuggingFace. Keying on the version the
      # comment always described makes the key rotate when the models actually
      # change and not otherwise.
      - name: Resolve fastembed model cache key
        if: needs.changes.outputs.docs_only != 'true'
        id: fastembed-key
        run: |
          set -euo pipefail
          ver=$(awk '/^name = "fastembed"$/ { found = 1; next }
                     found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock)
          if [ -z "${ver}" ]; then
            echo "::error::could not resolve the fastembed version from Cargo.lock — refusing to fall back to an unkeyed cache"
            exit 1
          fi
          echo "Resolved fastembed version from Cargo.lock: ${ver}"
          echo "key=fastembed-v${ver}-xenova-allminilm-l6-v2-qdrant-allminilm-l6-v2-onnx" >> "$GITHUB_OUTPUT"

      # #4940: `actions/cache/restore` + an explicit `actions/cache/save`
      # below, NOT the combined `actions/cache`. The combined action declares
      # `post-if: success()`, so its save step is SKIPPED whenever the job
      # fails — visible as "Post Restore fastembed model cache -> skipped" in
      # run 31026363957's failed Test job. That produced a ratchet: HF
      # rate-limits the pre-seed -> no model -> the accuracy gate fails -> the
      # job fails -> the model is never cached -> the next run is cold and
      # rate-limited again. Two unrelated PRs (#4920, #4926) failed identically
      # inside the same hour because both raced the same permanently-empty
      # cache. Saving explicitly, right after a successful download and BEFORE
      # any test runs, removes the test outcome from that path entirely.
      - name: Restore fastembed model cache
        if: needs.changes.outputs.docs_only != 'true'
        id: fastembed-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/fastembed
          key: ${{ steps.fastembed-key.outputs.key }}

      # Pre-seed the model on a cache miss so tests never hit HuggingFace
      # concurrently (the root cause of the HTTP 429 flake). Uses hf-hub's
      # CLI-friendly URL pattern with exponential backoff: 5 attempts, waiting
      # 5, 10, 20, 40 seconds between retries. After a successful download the
      # explicit "Save fastembed model cache" step below persists the populated
      # directory for future runs (#4940 — no longer a post step).
      #
      # Primary model: Xenova/all-MiniLM-L6-v2 at the pinned snapshot.
      # The refs/main pointer, tokenizer files, and the quantized ONNX are
      # all needed for fastembed initialisation.
      #
      # Resilience (issue #2554): two changes after PR #2548's run 29291600721
      # hit a hard HTTP 403 from HuggingFace's CDN and killed the whole Test
      # job before any Rust tests ran:
      #   (a) Authenticated requests when an optional HF_TOKEN repo/org
      #       secret is configured — authenticated callers generally get a
      #       materially higher HF rate limit than anonymous ones.
      #       ${{ secrets.HF_TOKEN }} evaluates to an empty string (never an
      #       error) when the secret is unset, so forks/PRs without access
      #       to repo secrets fall back to the previous anonymous behavior.
      #   (b) The whole step is now fail-SOFT: any failure (rate limit,
      #       network blip, etc.) prints a ::warning:: annotation and lets
      #       the job continue instead of hard-failing. This is safe for
      #       almost every real-model test — the vast majority require the
      #       downloaded model are #[ignore]-gated
      #       (crates/trusty-common/src/embedder/mod.rs
      #       fastembed_returns_correct_dim / fastembed_cache_hit_is_idempotent,
      #       crates/trusty-search/tests/migration_e2e.rs, crates/trusty-search/
      #       tests/embedder_supervisor_e2e.rs, crates/trusty-embedderd/tests/
      #       bit_identical.rs) and are never run by the plain `cargo test
      #       --workspace` step below. Every other non-ignored test that
      #       touches the shared embedder pre-seeds a MockEmbedder instead via
      #       seed_shared_embedder_with_mock() (issue #850,
      #       crates/trusty-common/src/memory_core/retrieval/embedder.rs), so
      #       cargo test never needs HuggingFace network access for those.
      #
      #       ONE exception (issue #3493 P0 part 2):
      #       `default_model_matches_sentence_transformers_reference`
      #       (crates/trusty-common/src/embedder/mod.rs) is the accuracy
      #       correctness gate that would have caught the CoreML-default
      #       regression, and is deliberately NOT `#[ignore]`d — it DOES run
      #       under the plain `cargo test --workspace` step and DOES need the
      #       real default (fp32, Qdrant/all-MiniLM-L6-v2-onnx) model. The
      #       Qdrant pre-seed block above exists specifically to make that
      #       test's model available from cache on every PR. Fail-soft is
      #       still kept here rather than hard-failing the pre-seed step
      #       itself: on a genuine HuggingFace outage the test will attempt
      #       its own direct download at test time (fastembed's normal
      #       cache-miss behaviour) and may then flake/fail for the same
      #       underlying reason — that failure surfaces as a real, visible
      #       `cargo test` failure rather than this optional latency step
      #       aborting the whole job.
      #
      #       PR #2981 code-critic fix: fail-soft MUST NOT invoke seed_models
      #       directly as an `if`/`while` condition. Bash disables `errexit`
      #       for the entire compound command being tested as a conditional,
      #       and — per the bash manual — "this behavior applies even when
      #       the failing command is ... contained within a shell function
      #       called by a command in the list", so a `set -e` re-declared
      #       INSIDE the function does not help: a mid-download curl failure
      #       is silently swallowed, execution falls through to the final
      #       `du -sh ... || true` (always exit 0), the function reports
      #       success, the ::warning:: never fires, and a PARTIAL/corrupt
      #       cache dir gets persisted by actions/cache's post-step and
      #       served as a false "hit" on every run until the cache key
      #       rotates. Empirically reproduced during review. Fix: invoke
      #       seed_models as a plain statement in a subshell (never as a
      #       conditional's test) and capture its exit status via $?.
      - name: Pre-seed fastembed models (cache miss only)
        if: needs.changes.outputs.docs_only != 'true' && steps.fastembed-cache.outputs.cache-hit != 'true'
        id: fastembed-preseed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          CACHE_DIR="${FASTEMBED_CACHE_DIR}"
          mkdir -p "${CACHE_DIR}"

          # ── Auth header (issue #2554) ───────────────────────────────────
          # Authenticated HF requests get a materially higher rate limit
          # than anonymous ones. Built once; empty when HF_TOKEN is unset so
          # unauthenticated requests behave exactly as before.
          CURL_AUTH=()
          if [ -n "${HF_TOKEN:-}" ]; then
            CURL_AUTH=(-H "Authorization: Bearer ${HF_TOKEN}")
          fi

          # ── Retry helper ──────────────────────────────────────────────────
          # curl_retry <url> <dest>
          # 7 attempts with a doubling back-off capped at 60 s: 10, 20, 40, 60,
          # 60, 60 — ~250 s of patience.
          #
          # #4940: this was 5 attempts at 5/10/20/40 s, a 75-second window. In
          # run 31026363957 HuggingFace returned HTTP 429 to all five attempts
          # inside 75 s and the pre-seed gave up; an HF rate-limit window
          # outlasts a minute routinely. 250 s costs nothing on the normal path
          # (a cache hit skips this step entirely, and an un-limited download
          # never retries) and is only spent on the runs that would otherwise
          # fail outright.
          curl_retry() {
            local url="$1" dest="$2" attempt=1 max=7 wait=10
            until curl -fsSL --retry 0 "${CURL_AUTH[@]}" -o "${dest}" "${url}"; do
              if [ "${attempt}" -ge "${max}" ]; then
                echo "ERROR: download failed after ${max} attempts: ${url}" >&2
                return 1
              fi
              echo "Download failed (attempt ${attempt}/${max}), retrying in ${wait}s …"
              sleep "${wait}"
              attempt=$(( attempt + 1 ))
              wait=$(( wait * 2 ))
              # An `[ … ] && wait=60` one-liner would return 1 on the false
              # branch and trip this step's `set -e`. Keep the `if`.
              if [ "${wait}" -gt 60 ]; then wait=60; fi
            done
          }

          # The substantive pre-seed logic runs strict (its own set -e) inside
          # this function so any failure anywhere inside it — a 403, a
          # transient network error, anything — aborts the function
          # immediately instead of silently continuing. Bash functions share
          # the enclosing shell's variables/other functions, so CURL_AUTH and
          # curl_retry are visible here without re-declaration. See the
          # PR #2981 code-critic note above the step name for why this MUST
          # be invoked in a subshell below, never as an `if`/`while` test.
          seed_models() {
            set -euo pipefail

            # ── Xenova/all-MiniLM-L6-v2 (AllMiniLML6V2Q — primary model) ──
            # hf-hub resolves the model at the revision pinned in refs/main.
            # We download the refs/main pointer first, then the exact snapshot.
            HF_BASE="https://huggingface.co"
            XENOVA_REPO="Xenova/all-MiniLM-L6-v2"
            XENOVA_DIR="${CACHE_DIR}/models--Xenova--all-MiniLM-L6-v2"

            mkdir -p "${XENOVA_DIR}/refs" "${XENOVA_DIR}/blobs"

            # Resolve current HEAD commit for the model repo.
            echo "Resolving Xenova/all-MiniLM-L6-v2 HEAD revision …"
            XENOVA_REV=$(curl -fsSL "${CURL_AUTH[@]}" \
              "${HF_BASE}/${XENOVA_REPO}/resolve/main/onnx/model_quantized.onnx" \
              -o /dev/null -w '%{url_effective}' | grep -oP '(?<=/resolve/)[^/]+' || true)

            # Fallback: query the HF API for the main branch commit hash.
            if [ -z "${XENOVA_REV}" ] || [ "${XENOVA_REV}" = "main" ]; then
              XENOVA_REV=$(curl -fsSL "${CURL_AUTH[@]}" \
                "https://huggingface.co/api/models/${XENOVA_REPO}?full=false" \
                | grep -oP '"sha":"[^"]{40}"' | head -1 | grep -oP '[0-9a-f]{40}' || true)
            fi

            # If we still have no revision, use the well-known pinned hash from
            # the developer's local cache (matches fastembed 5.13.4).
            XENOVA_REV="${XENOVA_REV:-751bff37182d3f1213fa05d7196b954e230abad9}"
            echo "Using Xenova/all-MiniLM-L6-v2 revision: ${XENOVA_REV}"

            echo "${XENOVA_REV}" > "${XENOVA_DIR}/refs/main"
            SNAP_DIR="${XENOVA_DIR}/snapshots/${XENOVA_REV}"
            mkdir -p "${SNAP_DIR}/onnx"

            # Download required files for AllMiniLML6V2Q initialisation.
            for FILE in tokenizer.json tokenizer_config.json special_tokens_map.json config.json; do
              DEST="${SNAP_DIR}/${FILE}"
              if [ ! -f "${DEST}" ]; then
                echo "Downloading ${XENOVA_REPO}/${FILE} …"
                curl_retry \
                  "${HF_BASE}/${XENOVA_REPO}/resolve/${XENOVA_REV}/${FILE}" \
                  "${DEST}"
              fi
            done

            ONNX_DEST="${SNAP_DIR}/onnx/model_quantized.onnx"
            if [ ! -f "${ONNX_DEST}" ]; then
              echo "Downloading ${XENOVA_REPO}/onnx/model_quantized.onnx (~22 MB) …"
              curl_retry \
                "${HF_BASE}/${XENOVA_REPO}/resolve/${XENOVA_REV}/onnx/model_quantized.onnx" \
                "${ONNX_DEST}"
            fi

            # ── Qdrant/all-MiniLM-L6-v2-onnx (AllMiniLML6V2 — fp32, the
            # DEFAULT model since issue #3486 / #3493 P0, resolved by
            # `resolve_default_embedding_model()`) ──
            #
            # Issue #3493 P0 part 2: the accuracy correctness gate
            # `default_model_matches_sentence_transformers_reference`
            # (crates/trusty-common/src/embedder/mod.rs) is no longer
            # `#[ignore]`d — it runs as part of the plain `cargo test
            # --workspace` step below and constructs the DEFAULT
            # `FastEmbedder`, which downloads this fp32 model, not the
            # Xenova quantized one above. Same resolution strategy as
            # Xenova: try the classic `/resolve/<hash>/` redirect first: this
            # repo actually serves gated files via a `resolve-cache` URL that
            # does NOT match that pattern, so this intentionally falls
            # through to the HF API sha lookup on every run — kept as the
            # first attempt anyway so a future HF storage-backend change that
            # restores the classic redirect is picked up for free without
            # touching this script.
            QDRANT_REPO="Qdrant/all-MiniLM-L6-v2-onnx"
            QDRANT_DIR="${CACHE_DIR}/models--Qdrant--all-MiniLM-L6-v2-onnx"

            mkdir -p "${QDRANT_DIR}/refs" "${QDRANT_DIR}/blobs"

            echo "Resolving Qdrant/all-MiniLM-L6-v2-onnx HEAD revision …"
            QDRANT_REV=$(curl -fsSL "${CURL_AUTH[@]}" \
              "${HF_BASE}/${QDRANT_REPO}/resolve/main/tokenizer.json" \
              -o /dev/null -w '%{url_effective}' | grep -oP '(?<=/resolve/)[^/]+' || true)

            if [ -z "${QDRANT_REV}" ] || [ "${QDRANT_REV}" = "main" ]; then
              QDRANT_REV=$(curl -fsSL "${CURL_AUTH[@]}" \
                "https://huggingface.co/api/models/${QDRANT_REPO}?full=false" \
                | grep -oP '"sha":"[^"]{40}"' | head -1 | grep -oP '[0-9a-f]{40}' || true)
            fi

            # Last-resort pinned hash (verified against the live repo while
            # writing this step; matches fastembed 5.13.4's model registry).
            QDRANT_REV="${QDRANT_REV:-5f1b8cd78bc4fb444dd171e59b18f3a3af89a079}"
            echo "Using Qdrant/all-MiniLM-L6-v2-onnx revision: ${QDRANT_REV}"

            echo "${QDRANT_REV}" > "${QDRANT_DIR}/refs/main"
            QDRANT_SNAP_DIR="${QDRANT_DIR}/snapshots/${QDRANT_REV}"
            mkdir -p "${QDRANT_SNAP_DIR}"

            for FILE in tokenizer.json tokenizer_config.json special_tokens_map.json config.json; do
              DEST="${QDRANT_SNAP_DIR}/${FILE}"
              if [ ! -f "${DEST}" ]; then
                echo "Downloading ${QDRANT_REPO}/${FILE} …"
                curl_retry \
                  "${HF_BASE}/${QDRANT_REPO}/resolve/${QDRANT_REV}/${FILE}" \
                  "${DEST}"
              fi
            done

            QDRANT_ONNX_DEST="${QDRANT_SNAP_DIR}/model.onnx"
            if [ ! -f "${QDRANT_ONNX_DEST}" ]; then
              echo "Downloading ${QDRANT_REPO}/model.onnx (~90 MB) …"
              curl_retry \
                "${HF_BASE}/${QDRANT_REPO}/resolve/${QDRANT_REV}/model.onnx" \
                "${QDRANT_ONNX_DEST}"
            fi

            echo "fastembed model pre-seed complete."
            du -sh "${CACHE_DIR}" || true
          }

          # Invoke as a plain statement in a subshell — NOT as an `if`/`while`
          # test — so seed_models' own `set -e` is actually honored (see the
          # PR #2981 code-critic note above). `set +e` around the call stops
          # THIS failure from tripping the outer script's own errexit; it is
          # restored immediately after the status is captured.
          set +e
          ( seed_models )
          rc=$?
          set -e

          if [ "${rc}" -ne 0 ]; then
            # Do not let the save step persist a partial/corrupt download
            # tree under this run's key: an absent cache is a safe "miss"
            # next run; a partial one would look like a permanent false
            # "hit" until the key rotates (issue #2554/#2981).
            rm -rf "${CACHE_DIR}"
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            # #4940: this warning used to end "the tests that need the real
            # model are #[ignore]-gated and are not run in this job", which is
            # FALSE and contradicted the block comment 30 lines above it —
            # `default_model_matches_sentence_transformers_reference` is the
            # documented exception and does run here. Reading that sentence is
            # what made this failure get misdiagnosed as a flaky test rather
            # than a missing model. State the actual consequence instead.
            echo "::warning::fastembed model pre-seed failed (rc=${rc}; HuggingFace rate-limit/403 or network issue) — continuing WITHOUT a pre-seeded cache. CONSEQUENCE: default_model_matches_sentence_transformers_reference (crates/trusty-common/src/embedder/tests/reference_accuracy_tests.rs) is deliberately NOT #[ignore]d (issue #3493 P0 part 2) and WILL attempt its own HuggingFace download; if that is rate-limited too it fails with 'failed to initialise fastembed'. That is a missing MODEL, not an accuracy regression and not a flaky test — re-run once HuggingFace stops rate-limiting. Every other embedder test uses a MockEmbedder via seed_shared_embedder_with_mock() (issue #850) and is unaffected. See #2554 and #4940."
          else
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          fi

      # #4940: save explicitly, HERE — before any test runs — instead of
      # relying on `actions/cache`'s post step, which is `post-if: success()`
      # and therefore never fires on a failing job. Gated on the pre-seed
      # having actually succeeded so a partial tree (already `rm -rf`'d above)
      # can never be persisted as a false "hit".
      - name: Save fastembed model cache
        if: needs.changes.outputs.docs_only != 'true' && steps.fastembed-cache.outputs.cache-hit != 'true' && steps.fastembed-preseed.outputs.seeded == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/fastembed
          key: ${{ steps.fastembed-key.outputs.key }}

      # Build phase only (no test execution yet): links this shard's test
      # binaries so the intermediate .rcgu.o codegen objects below can be
      # swept once linking is done and before the (disk-heavier) test
      # execution phase runs. See #3668.
      #
      # `--no-run` under nextest is `list --list-type binaries-only`; plain
      # `cargo test --no-run` is used instead because it produces byte-identical
      # artefacts to the doctest step below and therefore shares one build
      # fingerprint with it. (A `cargo nextest list` here resolved a DIFFERENT
      # fingerprint and forced a ~91s recompile — measured in #4402.)
      - name: cargo test --workspace --no-run (build phase)
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test --workspace --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui --no-run

      # Sweep intermediate per-codegen-unit object files (#3668): once a
      # test binary is linked, its .rcgu.o inputs are dead weight — cargo
      # never reclaims them itself, and they made up ~18 GB of the runner's
      # disk exhaustion. Verified locally that deleting them does not cause
      # a subsequent `cargo test` invocation to relink (cargo's fingerprint
      # tracking does not depend on these surviving).
      - name: Sweep intermediate .rcgu.o codegen objects
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          echo "Before sweep:"; du -sh target/debug 2>/dev/null || true
          find target/debug/deps -name '*.rcgu.o' -delete
          echo "After sweep:"; du -sh target/debug 2>/dev/null || true

      # cargo-nextest instead of `cargo test`, for two reasons measured on this
      # repo:
      #
      #   1. Speed. `cargo test` runs the ~220 test binaries one after another,
      #      parallelising only WITHIN a binary — so every binary drains its
      #      own tail with idle cores, ~220 times. nextest schedules every test
      #      in the shard from one global queue and keeps all cores busy.
      #   2. Attribution. nextest prints the owning crate for every test, which
      #      is what .github/scripts/attribute_test_failures.py (#4402) had to
      #      reconstruct from panic-message source paths. The script is deleted
      #      in the same change; nextest reports natively what it inferred.
      #
      # The #4402 comment that used to sit here said nextest was blocked by a
      # trusty-memory test-order bug: two tests depended on
      # TRUSTY_SKIP_PALACE_ENFORCEMENT being set as a side effect by a
      # DIFFERENT test in the same process, which nextest's process-per-test
      # isolation correctly exposed. That comment was stale — #4413 fixed the
      # coupling at its root in 2026-07 (each test now calls
      # `skip_palace_enforcement()` to establish its own precondition, see
      # crates/trusty-memory/src/tools/tests.rs) and #4482 followed up. The
      # whole workspace was re-verified under nextest before this switch: no
      # test depends on another test's side effects.
      #
      # --no-fail-fast: report every failing crate in one run. `cargo test`
      # stopped at the first failing BINARY, so a PR breaking two crates needed
      # two CI rounds to discover that.
      #
      # The divisor is `strategy.job-total`, not a literal 4. nextest only
      # rejects a partition whose numerator exceeds its denominator, so a
      # hand-written divisor left stale after the matrix changed would silently
      # stop running a quarter of the suite with every shard green. Deriving it
      # from the matrix makes `shard: [1, 2, 3, 4]` the only place the count
      # exists.
      #
      # `hash:N/M` rather than `count:N/M`: hash assigns a test to a partition
      # from its name, so a given test lands in the same shard on every run and
      # a failure is reproducible by re-running that one shard. `count` is
      # round-robin by position, which reshuffles the whole assignment whenever
      # a test is added anywhere. Neither balances by RUNTIME — with ~24k tests
      # per split the counts even out, and the handful of multi-second tests
      # (the slowest is ~31s) are spread by name.
      - name: cargo nextest run
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cargo nextest run --workspace --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui --no-fail-fast \
            --partition hash:${{ matrix.shard }}/${{ strategy.job-total }} \
            -E 'not test(=update::tests::cache_fresh_returns_some_when_newer)'

      # nextest cannot run doctests — it has no doctest harness at all (see
      # nextest issue #16). Skipping this step would silently drop every
      # doctest from CI, so `cargo test --doc` runs them separately.
      #
      # Shard 1 only: `--partition` splits the tests nextest owns, and doctests
      # are not among them, so running this in all four shards would run the
      # same doctests four times rather than a quarter of them each. There are
      # ~7 across the workspace; this is here for coverage, not for speed.
      - name: cargo test --doc
        if: needs.changes.outputs.docs_only != 'true' && matrix.shard == 1
        run: cargo test --workspace --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui --doc

      # trusty-common's cache_fresh_returns_some_when_newer needs CI unset
      # (see check_throttled in crates/trusty-common/src/update/mod.rs: it
      # returns None whenever CI is non-empty, and this test expects the
      # live cache-freshness path instead). It is filtered out of the nextest
      # run above and re-run here with the override. Previously CI="" was
      # applied to the WHOLE `cargo test --workspace` invocation, which flipped
      # cargo's fingerprint for every crate in the workspace and forced an
      # unrelated recompile of trusty-agents + trusty-agents-local (#4402).
      # Scoping the override to a single `-p trusty-common` invocation
      # contains that recompile to trusty-common alone (measured locally:
      # ~3s) instead of cascading workspace-wide. `--features update-check`
      # is required: that module is `#[cfg(feature = "update-check")]`-gated
      # and only gets pulled in under `--workspace` via other crates'
      # feature unification, not under a bare `-p trusty-common` build.
      - name: cargo test -p trusty-common (cache-freshness, CI unset)
        if: needs.changes.outputs.docs_only != 'true' && matrix.shard == 1
        env:
          CI: ""
        run: |
          cargo test -p trusty-common --lib --features update-check \
            update::tests::cache_fresh_returns_some_when_newer -- --exact

  # --------------------------------------------------------------------------
  # test: the aggregate gate over the sharded suite above.
  #
  # This job exists to keep ONE stable required-check name. Branch protection
  # requires the literal context "Test"; sharding alone would rename the check
  # to "Test (shard-N)" and silently drop the requirement, leaving main
  # unprotected. Repointing branch protection at N shard names would work but
  # would have to be re-edited every time the shard count changes — this job
  # makes the shard count an implementation detail instead.
  #
  # `needs.test-shard.result` is the AGGREGATE of the matrix: it is 'success'
  # only when every leg succeeded, and 'failure' / 'cancelled' / 'skipped'
  # otherwise. The check is written as "must equal success" rather than "must
  # not equal failure" so a skipped matrix fails closed — GitHub reports a
  # skipped required check as PASSING, which is the exact fail-open hole #4179
  # closed for this job's `if:` condition.
  # --------------------------------------------------------------------------
  test:
    name: Test
    needs: [changes, test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to have succeeded
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          echo "test-shard matrix aggregate result: ${SHARDS_RESULT}"
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::Test is red: the test-shard matrix reported '${SHARDS_RESULT}'. Open the individual 'Test shard N' jobs — nextest names the owning crate for every failing test."
            exit 1
          fi
          echo "every test shard succeeded"

  # --------------------------------------------------------------------------
  # msrv: verify the workspace compiles on the effective MSRV.
  # cargo check is used (not test) to keep this job fast: the MSRV guarantee
  # is that the code *compiles* on the minimum toolchain, not that tests pass.
  # trusty-mpm-gui, trusty-code-gui, trusty-agents-ui excluded: see clippy note above.
  #
  # Toolchain is 1.94, matching [workspace.package].rust-version = "1.94" in the
  # root Cargo.toml. The AWS SDK entries (aws-config, aws-sdk-bedrockruntime)
  # resolve to versions that require rustc >= 1.94.1, which sets the effective
  # MSRV. This job pins the toolchain to that floor so the workspace is
  # guaranteed to compile on the declared minimum.
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV check (1.94)
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Free disk space (#2091; prune gated #4402, SDK purge gated #5325).
      # Reclaims only when `df` says this runner needs it — thresholds, the
      # three-tier decision, and why the reclamation is gated rather than
      # deleted all live in the script.
      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-free-disk-space.sh

      - name: Install Rust 1.94 toolchain
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@1.94

      - name: Install system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1-94
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache above.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --workspace
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo check --workspace --exclude trusty-mpm-gui --exclude trusty-code-gui --exclude trusty-agents-ui

  # --------------------------------------------------------------------------
  # agents-ui: build- and lint-verify the trusty-agents Tauri desktop app
  # (crates/trusty-agents/ui/src-tauri, package `trusty-agents-ui`). Issue #3053.
  #
  # This crate is a Tauri 2 app and is EXCLUDED from the headless workspace
  # jobs above (clippy/test/msrv) because Tauri links WebKit2GTK on Linux,
  # which those runners do not install. This dedicated job installs the
  # WebKit2GTK toolchain so the crate is genuinely compiled and clippy-linted
  # in CI (unlike trusty-mpm-gui / trusty-code-gui, which are only excluded).
  #
  # `tauri::generate_context!()` embeds the config's `frontendDist` ("../dist",
  # i.e. crates/trusty-agents/ui/dist) at compile time and hard-errors if that
  # path is absent. `dist/` is a gitignored build artefact (produced by
  # `pnpm build`), so we stub a minimal placeholder index.html before clippy.
  # That is sufficient to compile- and lint-verify the Rust side without
  # pulling node/pnpm into CI; the real UI bundle is only needed for `tauri
  # build` packaging, which this build/lint gate does not perform.
  # --------------------------------------------------------------------------
  agents-ui:
    name: trusty-agents-ui clippy
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with clippy
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri 2 Linux system dependencies (WebKit2GTK 4.1 + GTK stack). These
      # mirror the Tauri project's documented Linux prerequisites and are the
      # same reason the headless workspace jobs exclude this crate.
      - name: Install Tauri system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: agents-ui
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache above.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Stub the frontendDist so tauri::generate_context!() can embed it.
      - name: Stub frontend dist for generate_context!
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p crates/trusty-agents/ui/dist
          printf '<!doctype html><html><head><meta charset="utf-8"><title>trusty-agents</title></head><body></body></html>\n' \
            > crates/trusty-agents/ui/dist/index.html

      - name: cargo clippy -p trusty-agents-ui --all-targets -- -D warnings
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy -p trusty-agents-ui --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # embedder-cuda-check: compile-check the `embedder-cuda` feature (issue
  # #3508). The deadlock-safety invariant test
  # (ort_intra_threads_default_pinned_under_cuda_feature,
  # crates/trusty-common/src/embedder/mod.rs, guarding the PR #1668 CUDA
  # barrier deadlock) is `#[cfg(feature = "embedder-cuda")]`-gated, and no
  # workflow previously built with that feature at all — `grep -r cuda
  # .github/workflows/` returned zero hits — so the invariant had zero
  # automated tripwire.
  #
  # WHY nvcc IS REQUIRED (this is NOT just "no GPU needed"): `embedder-cuda`
  # forwards to `fastembed/cuda`, which turns on `candle-core/cuda` (fastembed
  # 5.13.4 bundles an optional Candle backend). `candle-core/cuda` pulls in
  # `candle-kernels`, whose build.rs compiles real `.cu` kernel sources via
  # `nvcc` unconditionally. This was verified empirically while building this
  # job: setting `CUDARC_CUDA_VERSION` only bypasses cudarc's OWN `nvcc
  # --version` probe (cudarc itself uses dynamic *loading*, no toolkit
  # needed) — it does NOT help candle-kernels, which has no override and
  # hard-fails with `NvccNotFound` if the compiler isn't on PATH. So this job
  # installs nvcc ONLY (no driver, no GPU, no cudart/cublas/curand runtime
  # libraries) from NVIDIA's official apt repo: compiling `.cu` sources to
  # PTX/cubin is a pure host-side compilation step and does not require a
  # physical CUDA-capable device.
  #
  # SCOPE: `cargo check`, not `cargo test` — matching issue #3508's own
  # explicit ask ("Scope to cargo check ... since full CUDA runtime isn't
  # available on GitHub runners"). `cargo check` never invokes the linker, so
  # nothing beyond the compiler itself needs installing. `--all-targets`
  # activates `#[cfg(test)]`, so this actually type-checks the gated test
  # function — a job that builds the lib but never compiles the test target
  # would be theater. Full `cargo test` execution (issue #3508's stretch
  # goal) was investigated and is intentionally left for a follow-up: running
  # the binary would need to link against a real `libcuda.so`, which on a
  # hosted non-GPU runner is only reliably available as a build-time stub,
  # not something guaranteed loadable at process start — exactly the
  # "full CUDA runtime isn't available" risk the issue itself flagged.
  #
  # CUDA_COMPUTE_CAP: candle-kernels' build.rs (see above) also auto-detects
  # the target GPU architecture by shelling out to `nvidia-smi`, which does
  # not exist on a driver-less runner. Its own error message documents the
  # override: `CUDA_COMPUTE_CAP=90` (verified empirically — the build
  # advanced past nvcc detection and failed here first, confirming nvcc
  # itself was found correctly). The value doesn't affect this job's
  # correctness: we only need `nvcc` to emit *some* valid PTX/cubin for
  # `cargo check`'s type-checking pass, never to run on an actual device.
  # --------------------------------------------------------------------------
  embedder-cuda-check:
    name: embedder-cuda compile check (#3508)
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_COMPUTE_CAP: "90"
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      # nvcc ONLY — see the job-level comment above for why the compiler
      # (not a GPU, not a driver) is a genuine, unavoidable requirement here.
      - name: Install nvcc (CUDA 12.8 compiler only; no driver, no GPU)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          rm -f cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"

      - name: Verify nvcc is on PATH
        if: needs.changes.outputs.docs_only != 'true'
        run: nvcc --version

      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: embedder-cuda-check
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache above.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check -p trusty-common --features embedder-cuda --all-targets
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo check -p trusty-common --features embedder-cuda --all-targets

  # --------------------------------------------------------------------------
  # ui-checks: run each UI crate's OWN existing test/build scripts. Issue:
  # SKIP_UI_BUILD=1 (set globally above) means the Rust build.rs Svelte
  # pipelines never invoke pnpm, and no other workflow anywhere runs pnpm /
  # vitest / playwright / eslint / tsc — so CI ships whatever bundle is
  # already committed under `ui-dist/` / `ui/dist/` via
  # include_dir!/include_str! with ZERO automated verification.
  #
  # There are SEVEN `ui/` directories in this workspace, not six — verified
  # by direct inspection of each package.json (the originating audit
  # undercounted; token-drift.yml's own header independently confirms "all 7
  # UI crates"). This job does NOT invent new test suites; it wires up
  # exactly what each crate's package.json already declares:
  #   trusty-search    -> vitest run                          (real tests)
  #   trusty-agents    -> vitest run (test:unit) + svelte-check (check)
  #   trusty-code-gui  -> vitest run                          (real tests)
  #   trusty-mpm-gui   -> vite build (build:web)   — NO test/lint/typecheck
  #                        scripts exist in package.json at all; build:web is
  #                        the cheapest meaningful floor (catches compile-time
  #                        Svelte/TS errors) without inventing a test suite
  #   trusty-memory    -> vite build (build)       — same: no test scripts
  #   trusty-console   -> vite build (build)       — same: no test scripts
  #   trusty-analyze   -> vite build (build)       — same: no test scripts
  #
  # trusty-agents/ui's `test` script (playwright e2e) is intentionally NOT
  # run here: it needs a built app plus browser binaries, a materially
  # heavier job than the other six legs — left for a follow-up issue rather
  # than bolted onto this fast matrix.
  #
  # check:tokens (scripts/check_token_drift.mjs) is deliberately NOT
  # duplicated here — it already runs across all 7 crates directly (not via
  # each package.json's script) in token-drift.yml.
  #
  # Committed `ui-dist`/`ui/dist` bundle verification (rebuild-then-diff
  # against the committed artefact) was considered and NOT implemented:
  # trusty-search/trusty-memory/trusty-console/trusty-analyze commit
  # Vite-built bundles with content-hashed filenames (e.g.
  # `index-CPNos4BT.js`). A rebuild in CI has no guaranteed byte-for-byte
  # stability against whatever machine/toolchain last produced the committed
  # bundle — any patch-level Vite/Rollup/Node drift between that machine and
  # this job's pinned versions can legitimately change the hash with no
  # underlying behavior change, which would make a straight diff a flaky
  # false-failure generator rather than a real gate. The `vite build` step
  # above for those four crates already catches the higher-value case (the
  # bundle fails to build at all); byte-exact drift detection would need a
  # hash-normalizing comparator, which is a real feature in its own right —
  # left for a follow-up issue, not shipped half-built here.
  #
  # Kept OUT of the slow `test` job (16-32 min observed) and off the
  # Tauri-excluded clippy/test/msrv path: this is Node/pnpm tooling, not
  # Rust, and runs as its own fast, parallel matrix.
  # --------------------------------------------------------------------------
  ui-checks:
    name: UI checks (${{ matrix.name }})
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trusty-search
            dir: crates/trusty-search/ui
            command: pnpm run test
          - name: trusty-agents
            dir: crates/trusty-agents/ui
            command: pnpm run test:unit && pnpm run check
          - name: trusty-code-gui
            dir: crates/trusty-code-gui/ui
            command: pnpm run test
          - name: trusty-mpm-gui
            dir: crates/trusty-mpm-gui/ui
            command: pnpm run build:web
          - name: trusty-memory
            dir: crates/trusty-memory/ui
            command: pnpm run build
          - name: trusty-console
            dir: crates/trusty-console/ui
            command: pnpm run build
          - name: trusty-analyze
            dir: crates/trusty-analyze/ui
            command: pnpm run build
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        if: needs.changes.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.dir }}
        run: pnpm install --frozen-lockfile

      - name: Run checks
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.command }}

  # --------------------------------------------------------------------------
  # search-daemon-smoke: build the trusty-search release binary and verify
  # that the HTTP daemon starts and answers /health with status=ok.
  #
  # Design notes (issue #952):
  #
  # FLAKE AVOIDANCE — issue #865 documented fastembed/ONNX HTTP-429 flake
  # when the model is downloaded at startup. This job avoids that by:
  #   1. TRUSTY_NO_KG=1 — skip knowledge-graph init (no network calls needed).
  #   2. The /health endpoint returns HTTP 200 with status="ok" immediately
  #      once the axum server binds, even while the embedder is still
  #      initialising in the background. The embedder field reports
  #      "initialising" but the HTTP status is always 200 — the smoke check
  #      only needs the server to be reachable, not for the model to be ready.
  #   3. --no-auto-discover — skip the startup project-scan so the daemon does
  #      not walk ~/Projects or ~/code on the ephemeral runner.
  #   4. --data-dir /tmp/ts-smoke — fully isolated data directory so no
  #      indexes.toml, lockfile, or port-file collides with any other process.
  #
  # REQUIRED, AND ABLE TO FAIL (#4179). This job used to carry
  # `continue-on-error: true` and describe itself as OPTIONAL while branch
  # protection listed `trusty-search daemon smoke test` among its seven
  # required contexts. Both statements could not be true, and the combination
  # produced signal inversion: job-level `continue-on-error` still publishes
  # `conclusion: failure` to the CHECK RUN (so it did gate the merge button),
  # but it keeps the RUN green — so the Actions UI, `gh run view`, and
  # `needs.<job>.result` all read healthy while a required check was red.
  #
  # Resolved in favour of REQUIRED, because that half is the one enforced by
  # branch protection and this PR is not permitted to change branch-protection
  # settings. Dropping `continue-on-error` costs nothing in wall clock (the
  # ~15-20 min cold release build ran either way) and buys an honest run
  # conclusion plus a place in `notify-main-failure`'s `needs`, which it could
  # not have while its result never surfaced as `failure`. If the runner
  # timeout/kill race it worried about ever materialises, the answer is to fix
  # the race or drop the check from branch protection — not to make a required
  # check unable to report the truth.
  #
  # TEARDOWN — the daemon is killed at the end via the stored PID. This is
  # correct CI behaviour: ephemeral runners are discarded after the job
  # completes, but explicit teardown ensures the port is freed if a later step
  # reuses the runner.
  # --------------------------------------------------------------------------
  search-daemon-smoke:
    name: trusty-search daemon smoke test
    needs: [changes]
    # #4179: `needs:` alone would make this job SKIP when `changes` fails, and
    # GitHub reports a skipped required check as PASSING — reintroducing the
    # fail-open hole this PR exists to close. `!cancelled()` overrides the
    # implicit success() so the job still runs; `docs_only` then resolves to
    # '' and every gated step runs, i.e. a broken classifier costs a FULL
    # build, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Free disk space (#2091; prune gated #4402, SDK purge gated #5325).
      # Reclaims only when `df` says this runner needs it — thresholds, the
      # three-tier decision, and why the reclamation is gated rather than
      # deleted all live in the script.
      - name: Free disk space
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-free-disk-space.sh

      - name: Install stable toolchain
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Cache cargo artifacts
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: search-daemon-smoke
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache above.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # SKIP_UI_BUILD=1 is already set globally via env: at the workflow level.
      # The committed ui-dist/ bundle is used as-is; pnpm is not required.
      - name: Build trusty-search release binary
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo build --release -p trusty-search

      - name: Start trusty-search daemon (background)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          # Skip KG init — no network calls, no model downloads at startup.
          TRUSTY_NO_KG: "1"
          # CPU device — explicit to avoid any GPU EP probe on the runner.
          TRUSTY_DEVICE: cpu
          RUST_LOG: "info"
          # GitHub ubuntu-latest runners report ~15.6 GB RAM, just below the
          # 16 GB startup floor. This smoke test only checks HTTP connectivity,
          # not indexing or embedding, so the RAM floor adds no value here.
          TRUSTY_SKIP_RAM_CHECK: "1"
        run: |
          mkdir -p /tmp/ts-smoke
          ./target/release/trusty-search start \
            --foreground \
            --port 7999 \
            --data-dir /tmp/ts-smoke \
            --no-auto-discover \
            > /tmp/ts-smoke/daemon.log 2>&1 &
          echo $! > /tmp/ts-smoke/daemon.pid
          echo "Daemon PID: $(cat /tmp/ts-smoke/daemon.pid)"

      - name: Wait for /health (poll up to 30 s)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          PORT=7999
          DEADLINE=$(( $(date +%s) + 30 ))
          until curl -sf "http://127.0.0.1:${PORT}/health" > /tmp/ts-smoke/health.json 2>/dev/null; do
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "--- daemon log ---"
              cat /tmp/ts-smoke/daemon.log || true
              echo "--- end daemon log ---"
              echo "ERROR: /health did not respond within 30 s" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Daemon is up. Health response:"
          cat /tmp/ts-smoke/health.json

      - name: Assert /health returns status=ok
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # jq is preinstalled on ubuntu-latest; use it instead of python3 for clarity.
          HEALTH_STATUS=$(jq -r '.status // ""' /tmp/ts-smoke/health.json)
          echo "status field: ${HEALTH_STATUS}"
          if [ "${HEALTH_STATUS}" != "ok" ]; then
            echo "ERROR: /health did not return status=ok (got: ${HEALTH_STATUS})"
            cat /tmp/ts-smoke/health.json
            exit 1
          fi
          echo "OK: status=ok confirmed"

      - name: Tear down daemon
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: |
          if [ -f /tmp/ts-smoke/daemon.pid ]; then
            PID=$(cat /tmp/ts-smoke/daemon.pid)
            echo "Killing daemon PID ${PID}"
            kill "${PID}" 2>/dev/null || true
          fi

  # --------------------------------------------------------------------------
  # notify-main-failure: file/refresh a tracking GitHub issue when CI goes red
  # on a `push` to `main` (post-merge breakage). ci.yml already re-runs on
  # push: branches: [main], so breakage IS detected — but nothing alerted
  # anyone. Confirmed instance: main went red on 2026-07-20 and was cleared
  # incidentally ~42 minutes later by an unrelated merge, not by anyone
  # reacting to the failure; anyone branching off main in that window
  # inherited the breakage silently.
  #
  # MECHANISM: the bundled `actions/github-script` action, authenticated with
  # the default `GITHUB_TOKEN` (scoped to `issues: write` on this job only).
  # No Slack webhook or other notification integration exists in this repo —
  # `grep -r secrets\. .github/workflows/*.yml` turns up only
  # `secrets.HF_TOKEN` and `secrets.HOMEBREW_TAP_TOKEN` — so filing/updating a
  # GitHub issue is the only alerting channel available without inventing a
  # credential this repo doesn't have. No new secret is required.
  #
  # IDEMPOTENCY: searches for an OPEN issue labeled `ci-red-main` first. A
  # repeat failure adds a comment (with the new run's link) to that existing
  # issue instead of spawning a duplicate. Nothing here auto-closes the
  # issue when main goes green again — a later unrelated merge clearing the
  # symptom (exactly what happened on 2026-07-20) is not the same as the
  # breakage having been diagnosed and handled, so closing stays a human
  # call.
  #
  # NOT-SUCCESS IS NOT SUCCESS (#4179). This job used to ask
  # `contains(needs.*.result, 'failure')`. `cancelled` is not `failure`, so a
  # run whose every build and test job was CANCELLED skipped the alarm AND
  # reported success — the merge commit read verified when nothing had been
  # verified. Live instance: run 30720348101 (head b4b91af9) — Test, Clippy,
  # MSRV and the smoke test all cancelled, notifier green. It was not an edge
  # case either: 19 of 60 sampled push-to-main runs concluded `cancelled`.
  #
  # The verdict now comes from scripts/classify-ci-results.sh, which folds
  # every job conclusion into green / red / inconclusive with red >
  # inconclusive > green precedence, and only an all-`success` set is green.
  # The mapping is fixture-tested (scripts/check-ci-helpers-selftest.sh) rather
  # than buried in a GitHub expression where it cannot be exercised.
  #
  # This job also FAILS on any non-green verdict, so the run's own conclusion
  # stops disagreeing with what the jobs actually did.
  #
  # LAYERING, STATED HONESTLY: the concurrency change at the top of this file
  # is the primary remedy, because a run cancelled mid-flight takes this job
  # with it and no notifier can report from inside a cancelled run. This
  # verdict is the second layer, for the cancellations concurrency cannot
  # prevent — a manual cancel, a runner eviction, a `skipped` job.
  #
  # `needs` lists every hard-gating job. `search-daemon-smoke` is now included:
  # it was excluded only because `continue-on-error: true` meant its result
  # never surfaced as `failure`, and that flag is gone.
  # --------------------------------------------------------------------------
  notify-main-failure:
    name: Notify on red main
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        fmt,
        clippy,
        test,
        msrv,
        agents-ui,
        embedder-cuda-check,
        ui-checks,
        search-daemon-smoke,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Classify job conclusions
        id: verdict
        env:
          CI_JOB_RESULTS: >-
            fmt=${{ needs.fmt.result }}
            clippy=${{ needs.clippy.result }}
            test=${{ needs.test.result }}
            msrv=${{ needs.msrv.result }}
            agents-ui=${{ needs['agents-ui'].result }}
            embedder-cuda-check=${{ needs['embedder-cuda-check'].result }}
            ui-checks=${{ needs['ui-checks'].result }}
            search-daemon-smoke=${{ needs['search-daemon-smoke'].result }}
        run: bash scripts/classify-ci-results.sh > /dev/null

      - name: File or update tracking issue
        if: steps.verdict.outputs.verdict != 'green'
        uses: actions/github-script@v7
        env:
          CI_VERDICT: ${{ steps.verdict.outputs.verdict }}
          CI_SUMMARY: ${{ steps.verdict.outputs.summary }}
        with:
          script: |
            const label = 'ci-red-main';
            const title = 'CI red on main';
            const verdict = process.env.CI_VERDICT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const headline = verdict === 'red'
              ? `CI FAILED on a push to \`main\` at ${context.sha}.`
              : `CI did NOT conclude successfully on a push to \`main\` at ${context.sha} (verdict: ${verdict}).`;
            const body = [
              headline,
              '',
              `Job conclusions: ${process.env.CI_SUMMARY}`,
              '',
              `Run: ${runUrl}`,
              '',
              verdict === 'red'
                ? 'Anyone branching off `main` right now inherits this breakage.'
                : 'This commit has NO verification result. Cancelled and skipped jobs prove nothing; re-run this workflow before treating `main` as green.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.notice(`Updated existing tracking issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Filed new tracking issue #${created.data.number}`);
            }

      # The run's own conclusion must match what the jobs actually did. Without
      # this, a run whose jobs were all cancelled still ends green and `gh run
      # view` reports a verified commit that was never verified (#4179).
      - name: Fail the run when main was not verified green
        if: steps.verdict.outputs.verdict != 'green'
        run: |
          echo "::error::main CI verdict is '${{ steps.verdict.outputs.verdict }}', not green — ${{ steps.verdict.outputs.summary }}"
          exit 1
