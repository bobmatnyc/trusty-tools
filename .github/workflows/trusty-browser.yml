name: Trusty Browser
on:
  pull_request:
    paths: ["python/trusty-browser/**", "crates/trusty-browser/extension/**", "crates/trusty-browser/tests/js/**", ".github/workflows/trusty-browser.yml"]
  push:
    branches: [main]
    paths: ["python/trusty-browser/**", "crates/trusty-browser/extension/**", "crates/trusty-browser/tests/js/**", ".github/workflows/trusty-browser.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: python/trusty-browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]"
      - run: python -m playwright install chromium
      - run: python -m pytest -q
      - run: node --test tests/*.mjs
      # #11211: the Rust crate's own extension tree, on the same fake-Chrome harness.
      - run: node --test crates/trusty-browser/tests/js/*.test.mjs
        working-directory: ${{ github.workspace }}
