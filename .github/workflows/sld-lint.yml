# SLD-lint gate for the trusty-tools workspace (DOC-38, issue #2854).
#
# Enforces the Spec-Linked Documentation standard mechanically: every declared
# spec reference (inline `# Spec References` blocks across crates/**, and
# `spec_refs:` frontmatter in docs/specs/**/*.md) must resolve, and opted-in
# specs must satisfy the DOC-38 §4 conventions. Runs in DEFAULT (grandfathering)
# mode — reference resolution everywhere + full checks only on frontmatter-bearing
# specs — so it passes on the current tree while the retrofit (§10 F5/F6) lands.
name: SLD lint

# This optional workflow is limited to inputs the SLD verdict can observe:
# spec documents, crate source/doc comments, the linter implementation, and
# its wrapper/configuration. ADR-only and other prose changes do not install a
# Rust toolchain just to discover that SLD had nothing relevant to inspect.
on:
  push:
    branches: [main]
    paths:
      - "docs/specs/**"
      - "crates/**/*.rs"
      - "crates/**/*.py"
      - "crates/**/*.ts"
      - "crates/**/*.tsx"
      - "crates/**/*.js"
      - "crates/**/*.mjs"
      - "crates/**/*.cjs"
      - "crates/**/*.sh"
      - "crates/**/*.bash"
      - "crates/**/*.toml"
      - "crates/**/*.yaml"
      - "crates/**/*.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".sld-lint-allowlist.tsv"
      - "scripts/check_sld.sh"
      - ".github/workflows/sld-lint.yml"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "docs/specs/**"
      - "crates/**/*.rs"
      - "crates/**/*.py"
      - "crates/**/*.ts"
      - "crates/**/*.tsx"
      - "crates/**/*.js"
      - "crates/**/*.mjs"
      - "crates/**/*.cjs"
      - "crates/**/*.sh"
      - "crates/**/*.bash"
      - "crates/**/*.toml"
      - "crates/**/*.yaml"
      - "crates/**/*.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".sld-lint-allowlist.tsv"
      - "scripts/check_sld.sh"
      - ".github/workflows/sld-lint.yml"

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: sld-lint-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  sld-lint:
    name: SLD (DOC-38) reference + spec-doc lint
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # MSRV floor is 1.94 (root Cargo.toml rust-version), matching ci.yml.
      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sld-lint
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache in ci.yml.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run SLD linter (default / grandfathering mode)
        run: bash scripts/check_sld.sh
