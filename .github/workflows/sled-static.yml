# Static checks over the cloud sled build files in docker/sled (#11156).
#
# scripts/check_sled_tailscale_isolation.sh reads the Dockerfile, the
# entrypoint and the in-app scripts and asserts that tailscaled runs in its own
# sidecar, as a uid the sled's agents cannot control (DOC-90 IN-7). It needs no
# docker and no toolchain. The live half, docker/sled/check_tailscale.sh (V5),
# runs on a docker host and is not run here.
name: Sled static

on:
  push:
    branches: [main]
    paths:
      - "docker/sled/**"
      - "scripts/check_sled_tailscale_isolation.sh"
      - ".github/workflows/sled-static.yml"
  pull_request:
    # Explicit activity types (#4179); `edited` covers a base-branch retarget.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "docker/sled/**"
      - "scripts/check_sled_tailscale_isolation.sh"
      - ".github/workflows/sled-static.yml"

concurrency:
  group: sled-static-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.action != 'ready_for_review' }}

jobs:
  tailscale-isolation:
    name: Sled tailscaled isolation (static)
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: tailscaled runs in a sidecar the agents cannot reach
        run: ./scripts/check_sled_tailscale_isolation.sh
      - name: shellcheck the sled scripts
        run: shellcheck docker/sled/check_tailscale.sh docker/sled/entrypoint.sh docker/sled/exercise.sh scripts/check_sled_tailscale_isolation.sh
