# Line-cap gate for the trusty-tools workspace (issue #610; dual-cap #1131,
# TEST_CAP raised #4074).
#
# Enforces a dual SLOC file-size cap mechanically via a ratcheted allowlist:
#   - a NEW tracked .rs file over its applicable cap (500 SLOC production /
#     3000 SLOC test-benchmark) fails the job (cannot merge);
#   - an allowlisted (grandfathered) file may not grow past its frozen budget;
#   - when an allowlisted file drops to <= its applicable cap its entry must
#     be removed.
#
# Pure line counting — no Rust toolchain or build needed, so this is fast and
# runs as its own lightweight job (matches ci.yml's checkout style/auth).
#
# A second job in this file, `dev-dep-edges` (#8341), enforces that no crate's
# dev/build dependencies reach a workspace crate its normal dependencies do not.
# It is the one gate here that needs cargo (`cargo metadata --no-deps`, offline),
# which is why it is a separate job rather than another step above.
name: Line cap

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: line-cap-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  line-cap:
    name: 500-line file-size cap
    runs-on: ubuntu-latest
    # 10, not 5: the zsh install below can take a minute on a slow mirror.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # #7812: the gates re-exec under bash when invoked via zsh. This proves
      # bash and zsh reach one verdict for check_line_cap.sh,
      # check_changelog_fragment.sh and check_test_pointers.sh. zsh is not on
      # the hosted runner image, so it is installed first; the selftest fails,
      # never skips, without it.
      - name: Install zsh for the gate-shells selftest
        run: bash scripts/ci-apt-install.sh zsh

      - name: Gate-shells selftest (bash and zsh give one verdict)
        run: bash scripts/check_gate_shells_selftest.sh

      # Gate on the SLOC counter's own regression fixtures (issue #2563) so a
      # future edit to scripts/lib/sloc_awk.sh that reintroduces a counting
      # bug (e.g. the nested-block-comment overcount fixed here, or the
      # #2489/#2509 doc-comment-prose swallow) fails CI instead of silently
      # rotting. Runs before the real gate since a broken counter makes the
      # real gate's result unreliable.
      - name: SLOC counter selftest (regression fixtures)
        run: bash scripts/check_line_cap_selftest.sh

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh line_cap

      - name: Enforce SLOC file cap (500 prod / 3000 test, ratcheted allowlist)
        run: bash scripts/check_line_cap.sh

      # #5205: a generated doc region is only checked if the owning crate has a
      # `tests/generated_docs.rs`. Markers pasted anywhere else would look
      # generated while being hand-maintained, so reject an unowned region here
      # rather than discovering it via another stale README. Cheap, no toolchain.
      - name: Every generated doc region has an owning test
        run: bash scripts/check_generated_regions.sh

  # Test-only workspace dev-dependency edges (#8341). A separate job because it
  # is the one gate in this file that needs cargo: `cargo metadata --no-deps`
  # reads the member manifests and nothing else — no registry index, no network,
  # no build — but it still needs a toolchain, and the line-cap job above is
  # deliberately toolchain-free. Running it here rather than in its own workflow
  # keeps every cheap script gate reachable from one file.
  dev-dep-edges:
    name: No test-only workspace dev-dependency edges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The MSRV toolchain, matching ci.yml, so the manifest read never depends
      # on whatever cargo the runner image happens to ship.
      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@1.94

      # The gate's own fixture suite first: a gate that cannot be shown to fail
      # makes the real run's green meaningless. Mirrors the selftest-then-gate
      # ordering of the line-cap job above. No cargo — it drives the gate over
      # synthetic metadata documents.
      - name: Dev-dep-edge selftest (must reject a test-only edge)
        run: bash scripts/check_dev_dep_edges_selftest.sh

      - name: No crate's dev/build deps reach outside its normal tree
        run: bash scripts/check_dev_dep_edges.sh
