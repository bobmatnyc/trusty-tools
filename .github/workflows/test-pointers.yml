# Test-pointer gate for the trusty-tools workspace (issue #2458).
#
# Lints `/// Test:` / `//! Test:` doc-comment pointers (the Why/What/Test
# convention in CLAUDE.md) against real test names:
#   - a NEW dangling pointer (cites a test that doesn't exist as `fn <name>(`
#     anywhere in the citing file's crate) fails the job;
#   - an allowlisted (grandfathered) pointer in .test-pointer-allowlist.tsv
#     that is no longer dangling (fixed) also fails — remove its entry.
#
# Pure text scanning — no Rust toolchain or build needed, so this runs as
# its own lightweight job (matches ci.yml / line-cap.yml's checkout style).
name: Test pointers

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: test-pointers-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  test-pointers:
    name: "Test: doc-comment pointer lint"
    runs-on: ubuntu-latest
    # #4882: was 5. Measured 2026-08-05: the lint itself legitimately took
    # 352s locally (close to CI's observed 303s the run that got cancelled),
    # dominated by tens of thousands of subprocess forks in
    # scripts/check_test_pointers.sh (dirname/tr/mktemp/grep per file, per
    # Test: annotation, per citation — see that script's #4882 comments).
    # Fixing those forks cut local wall time to ~201s (43% faster), but that
    # still leaves under 2x headroom against a 5-minute cap on a runner that
    # was already this close to timing out under normal load — not a safe
    # margin. 10 minutes gives ~3x headroom over the post-fix measurement.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh test_pointers

      - name: "Lint Test: doc-comment pointers against real test names"
        run: bash scripts/check_test_pointers.sh
