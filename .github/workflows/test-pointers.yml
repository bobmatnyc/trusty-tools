# Test-pointer gate for the trusty-tools workspace (issue #2458).
#
# Lints `/// Test:` / `//! Test:` doc-comment pointers (the Why/What/Test
# convention in CLAUDE.md) against real test names:
#   - a NEW dangling pointer (cites a test that doesn't exist as `fn <name>(`
#     anywhere in the citing file's crate) fails the job;
#   - an allowlisted (grandfathered) pointer in .test-pointer-allowlist.tsv
#     that is no longer dangling (fixed) also fails — remove its entry.
#
# Pure text scanning — no Rust toolchain or build needed, so this runs as
# its own lightweight job (matches ci.yml / line-cap.yml's checkout style).
#
# On a push to main the `notify-main-failure` job at the bottom files or
# comments on the `ci-red-main` tracking issue when the lint does not come out
# green. `ci.yml`'s notifier cannot do that for this workflow — a `needs:` list
# cannot cross workflow files — and for 24 hours in August 2026 that meant a red
# lint on main with no alarm at all (#5657).
name: Test pointers

# `push` stays path-filtered to the lint's actual inputs.
#
# #5311: `pull_request` no longer is. This gate is meant to become a REQUIRED
# branch-protection context — a red pointer lint nearly merged during the 1.3.5
# train and was caught only because the merge agent had been told to treat it as
# blocking regardless of what GitHub showed. A required context that a path
# filter can skip is unmergeable rather than fast: GitHub never creates the check
# run for a workflow its filters skipped, so the context stays pending forever
# (proven on #5415/#5416 for the sibling `Version parity` workflow — zero runs
# against either head SHA). The same globs still decide whether the lint does any
# work; they moved from this trigger into
# `scripts/detect-pointer-lint-inputs.sh`, which the always-running job below
# consults. A PR that changes none of them costs a checkout and one git diff and
# still REPORTS, instead of never reporting at all.
on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - ".test-pointer-allowlist.tsv"
      - "scripts/check_test_pointers.sh"
      - "scripts/check_scan_floor_selftest.sh"
      - "scripts/detect-pointer-lint-inputs.sh"
      - ".github/workflows/test-pointers.yml"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    #
    # No `paths` / `paths-ignore` here — see the header comment above.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: test-pointers-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  test-pointers:
    name: "Doc-comment pointer lint (Why/What/Test)"
    # #5311: NO job-level `if:`. A job whose `if:` is false concludes `skipped`,
    # and a skipped conclusion does not satisfy a required context — the PR waits
    # on it forever. The condition that used to live here also decided from the
    # ACTIVITY TYPE (`edited` with a null changes.base), which is the #5407 defect
    # shape: a decision about the event, never about the diff. Whether this gate
    # does any work is now decided per-step, from the diff, below.
    runs-on: ubuntu-latest
    # #4882: was 5. Measured 2026-08-05: the lint itself legitimately took
    # 352s locally (close to CI's observed 303s the run that got cancelled),
    # dominated by tens of thousands of subprocess forks in
    # scripts/check_test_pointers.sh (dirname/tr/mktemp/grep per file, per
    # Test: annotation, per citation — see that script's #4882 comments).
    # Fixing those forks cut local wall time to ~201s (43% faster), but that
    # still leaves under 2x headroom against a 5-minute cap on a runner that
    # was already this close to timing out under normal load — not a safe
    # margin. 10 minutes gives ~3x headroom over the post-fix measurement.
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — the relevance classifier below needs `git merge-base`
      # against the base branch, which a shallow checkout cannot resolve.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # #4688: diff against the base branch AS IT IS NOW, not the frozen
      # `base.sha` snapshot. checkout leaves refs/remotes/origin/<base> at
      # whatever it fetched; re-fetching pins it to the live tip so the merge
      # base cannot lag behind the merge ref's own first parent.
      - name: Refresh the base branch ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"

      # #5311: the `paths:` filter this replaces on the pull_request trigger.
      # Asked here, the job still reports on a PR that changes none of the
      # lint's inputs — which is what a required context needs. The `else` arm
      # is the `push` trigger, the only other one this workflow has: it keeps
      # its `paths:` filter, so a push that reaches this job already changed a
      # lint input and the answer is `true` by construction.
      - name: Classify pointer-lint inputs from the diff
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            POINTER_LINT_BASE="origin/${BASE_REF}" \
              bash scripts/detect-pointer-lint-inputs.sh > /dev/null
          else
            echo "pointer_inputs_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        if: steps.detect.outputs.pointer_inputs_changed == 'true'
        run: bash scripts/check_scan_floor_selftest.sh test_pointers

      - name: "Lint Test: doc-comment pointers against real test names"
        if: steps.detect.outputs.pointer_inputs_changed == 'true'
        run: bash scripts/check_test_pointers.sh

      # #5311: the no-op path, and it must EXECUTE rather than be skipped —
      # `skipped` does not satisfy a required context. The job runs, this step
      # runs, and the check reports success on a PR the lint cannot have an
      # opinion about.
      - name: No pointer-lint input changed — nothing to lint
        if: steps.detect.outputs.pointer_inputs_changed != 'true'
        run: |
          echo "No changed path is a Test:-pointer input (**/*.rs, the allowlist,"
          echo "the gate scripts, or this workflow), so scripts/check_test_pointers.sh"
          echo "would report exactly what it reported on the base branch."
          echo "Reporting success rather than not reporting at all — see #5311."

  # Loudness on main (#5657). `ci.yml`'s `notify-main-failure` is the repo's
  # only red-main detector, and a `needs:` list cannot name a job in another
  # workflow file — so this workflow's result was structurally invisible to it.
  # That is not a theory: this lint was red on `main` continuously from run
  # 31587713536 (2026-08-12 10:30) to 31688534235 (2026-08-13 09:52), over 24
  # hours spanning every PR opened in that window, and no `ci-red-main` issue
  # was ever filed. A human eventually found it by hand and opened #5520.
  #
  # WHY ITS OWN NOTIFY JOB rather than folding the lint into `ci.yml`. The two
  # workflows disagree on every structural choice this job depends on: this one
  # keeps a `paths:` filter on `push` (`ci.yml` has none, so the lint would run
  # on every merge), carries its own per-commit concurrency group, and its job
  # name is the REQUIRED branch-protection context "Doc-comment pointer lint
  # (Why/What/Test)" — a move would have to preserve that string exactly while
  # inheriting a trigger set built for a different question. `version-parity.yml`
  # already answered this the other way with `notify-main-drift` (#4688), so
  # copying that shape is the change the existing structure supports, and it
  # generalises: the other 13 push-to-main workflows can each take this job.
  #
  # It files on the SAME `ci-red-main` label `ci.yml` uses, so a red lint lands
  # on the one tracking issue a reader already watches instead of a second one.
  # `always()` so a cancelled or skipped lint still reports — a non-green
  # verdict is never silence.
  notify-main-failure:
    name: Notify on red main
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-pointers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      # Same classifier `ci.yml` uses, fed this workflow's own job conclusion:
      # `failure`/`timed_out` are red, `cancelled`/`skipped` are inconclusive,
      # and only `success` is green (#4179).
      - name: Classify the lint's conclusion
        id: verdict
        env:
          CI_JOB_RESULTS: test-pointers=${{ needs['test-pointers'].result }}
        run: bash scripts/classify-ci-results.sh > /dev/null

      - name: File or update tracking issue
        if: steps.verdict.outputs.verdict != 'green'
        uses: actions/github-script@v7
        env:
          CI_VERDICT: ${{ steps.verdict.outputs.verdict }}
          CI_SUMMARY: ${{ steps.verdict.outputs.summary }}
        with:
          script: |
            const label = 'ci-red-main';
            const title = 'CI red on main';
            const verdict = process.env.CI_VERDICT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              verdict === 'red'
                ? `The doc-comment pointer lint FAILED on a push to \`main\` at ${context.sha}.`
                : `The doc-comment pointer lint did NOT conclude successfully on a push to \`main\` at ${context.sha} (verdict: ${verdict}).`,
              '',
              `Job conclusions: ${process.env.CI_SUMMARY}`,
              '',
              `Run: ${runUrl}`,
              '',
              'A `Test:` doc-comment pointer cites a test that does not exist in the',
              'citing file’s crate, or an allowlisted pointer is no longer dangling.',
              'Run `bash scripts/check_test_pointers.sh` locally for the exact lines.',
              '',
              'This lint runs in its own workflow, so `ci.yml`’s notifier cannot see it',
              'and reports green regardless (issue #5657).',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.notice(`Updated existing tracking issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Filed new tracking issue #${created.data.number}`);
            }

      # The run's own conclusion must match what the lint actually did, the same
      # rule `ci.yml`'s notifier enforces: without this a cancelled lint still
      # ends the run green and `gh run view` reports a verified commit.
      - name: Fail this job on any non-green verdict
        if: steps.verdict.outputs.verdict != 'green'
        run: |
          echo "::error::pointer lint verdict on main: ${{ steps.verdict.outputs.verdict }}"
          exit 1
