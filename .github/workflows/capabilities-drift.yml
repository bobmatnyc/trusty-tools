# tm-capabilities drift gate for the trusty-tools workspace (issue #2913).
#
# Enforces that the committed `tm-capabilities` bundled skill (CLI command
# tree, MCP tool catalog, agent roster, skill catalog, doctor checks) matches
# exactly what `tm generate capabilities` produces right now — a stale
# generated file fails the job instead of silently rotting.
#
# Since #8700 the same job also runs trusty-mpm's agent resident-budget tests
# off the same build, so a bundled-asset edit that overruns a budget cannot
# merge through this required context. Since #9123 it also runs the workspace
# credential-test scan off that build, on any diff that changes a crate's Rust
# source.
#
# REQUIRED CONTEXT since 2026-09-11 (owner ruling, decision a). Before that
# date this job carried `paths:` filters on both triggers and was NOT a
# required branch-protection context, so a PR outside those paths simply
# never got a check run for it — the filters were invisible from the PR's own
# checks list. #7471 and #7472 both merged with this job never having run.
# Promoting the job to required exposed the real failure mode of a `paths:`
# filter on a required check: GitHub blocks the merge on a required context
# that a filtered trigger never produces, wedging the PR forever. The filters
# are therefore GONE from both triggers — this job now runs on every push to
# main and every pull request, unconditionally.
#
# In their place, the job classifies relevance ITSELF, in its own first step,
# never at the job or trigger level: a job skipped via `if:` reports nothing,
# and GitHub treats a required context with no check run as still pending,
# not as passing (the reason `.github/workflows/ci.yml`'s `changes` job
# gates the four required Tauri UI clippy jobs the same way — see that job's
# `agents-ui` sibling for the identical shape). When the diff cannot affect
# `tm generate capabilities` — nothing under crates/trusty-mpm/**, no change
# to `scripts/check_capabilities.sh`, `scripts/check_test_count.sh` or this
# workflow file itself, and no
# change reachable through trusty-mpm's own dependency closure (via
# `scripts/ci-crate-relevance.sh`, issue #7063's shared detector, which also
# treats Cargo.toml/Cargo.lock as workspace-wide) — the later steps are
# skipped and the job still reports success, cheaply. Every failure arm of
# that classification (an unresolvable base ref, a failed `git diff`, a
# failed closure computation) answers "relevant" and runs the full check:
# fail closed, matching #7063.
name: Capabilities drift

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: capabilities-drift-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  capabilities-drift:
    name: tm-capabilities generated-skill drift check
    # No job-level `if:` keyed on the pull_request ACTIVITY TYPE here —
    # ci.yml's `changes` job carries an explicit warning against exactly that
    # pattern (issue #5407): a title/body edit shares this workflow's PR
    # concurrency group with the real run (cancel-in-progress excludes
    # `edited`), so an edit-triggered run that reports without doing the work
    # coexists with the genuine one and GitHub shows only whichever finishes
    # LAST for this context name — a fast, empty "skipped" run can bury a
    # real failure. Now that this job is a required context, that risk is not
    # acceptable here either: the job always runs; the relevance step inside
    # it (below) is what stays cheap on an inert diff.
    runs-on: ubuntu-latest
    # #8378: 30, not 20 — an asset-only diff also compiles the listed tests'
    # targets (trusty-code and its dependencies, trusty-agents-common, the
    # `tm` bin): about 13 min with a cache hit, about 20 on a miss.
    timeout-minutes: 30
    env:
      SKIP_UI_BUILD: "1"
    steps:
      # fetch-depth: 0 — the relevance classifier below needs `git
      # merge-base` against the base branch (pull_request) or the push's
      # `before` SHA, which a shallow checkout cannot resolve. Matches
      # ci.yml's `changes` job.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Refresh the base branch ref, same fix as ci.yml's `changes` job
      # (#4688 pattern): `actions/checkout`'s default ref for a pull_request
      # event tracks the base branch's current tip, which can have moved past
      # the event's own snapshot by the time this job runs on a busy repo.
      - name: Refresh the base branch ref (#4688 pattern — avoid a stale merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      # Classify whether this diff can affect `tm generate capabilities`
      # output. Runs unconditionally so the reason is always in the log, even
      # when the later steps end up skipped. FAIL CLOSED on every error arm
      # (#7063): an unresolvable base, a failed diff, or a failed closure
      # computation all answer "relevant" and cost a full build rather than a
      # silent skip.
      - name: Classify capabilities-drift relevance
        id: relevance
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail

          fail_closed() {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "capabilities-drift: $1 — running the full check (fail closed)"
            exit 0
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            fail_closed "no usable base SHA"
          fi

          if ! merge_base="$(git merge-base "$base" HEAD)"; then
            fail_closed "cannot resolve merge-base against '${base}'"
          fi

          # #7063: `-z` — without it git C-quotes any path carrying a
          # non-ASCII byte, a double quote or a backslash, and the quoted
          # string matches neither a crate directory nor our two exact paths
          # below, so a real change reads as inert.
          changed="${RUNNER_TEMP}/capabilities-drift-changed.txt"
          if ! git diff -z --name-only --no-renames "$merge_base" HEAD > "$changed"; then
            fail_closed "git diff against ${merge_base} failed"
          fi

          # Two paths ci-crate-relevance.sh's trusty-mpm closure does not
          # cover: the check script itself, and this workflow file. Cargo.toml
          # / Cargo.lock and everything under crates/trusty-mpm/** (the
          # bundled tm-capabilities skill included) are covered below, via
          # the shared closure detector.
          changed_nl="${RUNNER_TEMP}/capabilities-drift-changed.lines"
          tr '\0' '\n' < "$changed" > "$changed_nl"

          # #9123: the credential-test scan reads every crate's Rust sources,
          # so ANY .rs change under crates/ — inside trusty-mpm's closure or
          # not — runs it. Computed before every early exit below; a
          # fail-closed arm above sets relevant=true, which runs it too.
          if grep -qE '^crates/[^/]+/(src|tests)/.*\.rs$' "$changed_nl"; then
            echo "credential_scan=true" >> "$GITHUB_OUTPUT"
            echo "capabilities-drift: a crate's Rust source changed — the credential-test scan runs"
          else
            echo "credential_scan=false" >> "$GITHUB_OUTPUT"
          fi

          # #8378: an instruction-content edit is Cargo-inert, so `Rust tests
          # (affected crates)` skips it. `asset_content=true` makes this job
          # run the listed asset-content tests (scripts/asset-content-tests.tsv)
          # instead. Set by a Cargo-inert diff that touches instruction
          # content (the paths `detect-docs-only.sh --instruction-assets`
          # accepts — the guard below reads the same definition), by an edit
          # to the list or its runner, and by a failed classification. A code
          # diff leaves the tests to the affected-crates job. The trigger
          # covers push to main too, so the merge of an asset-only PR runs the
          # same list on main (base = the push's `before`). Setting it always
          # makes the job relevant: a content/** diff sits outside
          # trusty-mpm's closure.
          if ! verdict="$(env -u GITHUB_OUTPUT DOCS_ONLY_BASE="$merge_base" bash scripts/detect-docs-only.sh)"; then
            echo "asset_content=true" >> "$GITHUB_OUTPUT"
            echo "capabilities-drift: detect-docs-only.sh failed — asset-content tests run (fail closed)"
            asset_content=true
          elif { [ "$verdict" = "docs_only=true" ] &&
                 [ -n "$(bash scripts/detect-docs-only.sh --instruction-assets < "$changed_nl")" ]; } ||
               grep -qxE 'scripts/(asset-content-tests\.tsv|check_asset_test_filter\.py|lib/asset_filter_lex\.py)' "$changed_nl"; then
            echo "asset_content=true" >> "$GITHUB_OUTPUT"
            echo "capabilities-drift: Cargo-inert instruction-content edit, or the test list changed — asset-content tests run here"
            asset_content=true
          else
            echo "asset_content=false" >> "$GITHUB_OUTPUT"
            asset_content=false
          fi
          if [ "$asset_content" = "true" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #8700: check_test_count.sh wraps the budget-test step, so an edit
          # to it must run that step too.
          if grep -qxF "scripts/check_capabilities.sh" "$changed_nl" ||
             grep -qxF "scripts/check_test_count.sh" "$changed_nl" ||
             grep -qxF ".github/workflows/capabilities-drift.yml" "$changed_nl"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "capabilities-drift: running — a check script or this workflow changed"
            exit 0
          fi

          # #7063's shared per-crate detector: relevant when the diff touches
          # crates/trusty-mpm/** (own directory), any crate in trusty-mpm's
          # transitive dependency closure, or a workspace-wide cargo input
          # (Cargo.toml, Cargo.lock, …). GITHUB_OUTPUT is unset for this call
          # so the script's own trusty_mpm_relevant/_reason outputs are not
          # also written into this step's output set.
          if ! crate_relevant="$(env -u GITHUB_OUTPUT bash scripts/ci-crate-relevance.sh trusty-mpm < "$changed")"; then
            fail_closed "ci-crate-relevance.sh failed"
          fi

          case "$crate_relevant" in
            true | false) ;;
            *) fail_closed "ci-crate-relevance.sh printed an unusable verdict '${crate_relevant}'" ;;
          esac

          echo "relevant=${crate_relevant}" >> "$GITHUB_OUTPUT"
          if [ "$crate_relevant" = "true" ]; then
            echo "capabilities-drift: running — change touches the trusty-mpm build closure"
          else
            echo "capabilities-drift: skipped — no changed path touches trusty-mpm, its dependency closure, the check script, or this workflow"
          fi

      # #8378: the guard behind the asset-content list. Runs on EVERY diff, not
      # only a relevant one: a new test that reads an asset can land in any
      # crate, and it must join scripts/asset-content-tests.tsv in that same PR
      # or run nowhere on the next asset-only diff. Static (python3 + the
      # source tree), no toolchain; its fixture selftest runs first.
      - name: Asset-content test list covers every asset-reading test
        run: |
          ./scripts/check_asset_test_filter_selftest.sh
          python3 scripts/check_asset_test_filter.py check

      # MSRV floor is 1.94 (root Cargo.toml rust-version), matching ci.yml.
      - name: Install Rust toolchain (1.94)
        if: >-
          steps.relevance.outputs.relevant != 'false'
          || steps.relevance.outputs.credential_scan == 'true'
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo build
        if: >-
          steps.relevance.outputs.relevant != 'false'
          || steps.relevance.outputs.credential_scan == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: capabilities-drift
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache in ci.yml.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # #8700: ONE cargo build serves both checks below. The resident-budget
      # tests are unit tests in trusty-mpm's lib, and a lib test build resolves
      # trusty-mpm's dev-dependency features (trusty-common gains axum-server;
      # memory-core and embedder-test-support only under `sm-memory` since
      # 2026-09-27), which re-features units. A separate `cargo install` (release, production
      # features) therefore shared nothing with the test build. Asking cargo
      # for one integration-test target makes it also build the normal `tm`
      # executable inside that same resolve, so `tm` and the lib test harness
      # come from one dependency graph. `env_serial` is only the smaller of
      # trusty-mpm's two integration targets (#8345 folded the per-file
      # targets, including the old `config_mount`, into `integration` and
      # `env_serial`); it is built, never run here.
      #
      # scripts/lib/run_or_cargo.sh (used by check_capabilities.sh) prefers a
      # `tm` on PATH over `cargo run`, so putting this build's output dir on
      # PATH makes the drift check run the binary built from THIS checkout.
      #
      # CARGO_TARGET_DIR stays outside ./target, as `cargo install`'s temp dir
      # did, so rust-cache saves the same footprint as before (see the quota
      # note on ci.yml's test-shard cache).
      - name: Build tm and the trusty-mpm lib test harness (one dependency graph)
        id: build
        if: >-
          steps.relevance.outputs.relevant != 'false'
          || steps.relevance.outputs.credential_scan == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tm-target
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo test -p trusty-mpm --lib --test env_serial --locked --no-run
          echo "${CARGO_TARGET_DIR}/debug" >> "$GITHUB_PATH"

      - name: Check tm-capabilities generated skill for drift
        if: steps.relevance.outputs.relevant != 'false'
        run: bash scripts/check_capabilities.sh

      # #8700: the agent resident-budget tests (bundle_tests.rs) ran only in
      # the non-required pre-publish shards, so PR #8695 grew BASE-AGENT.md
      # past the rust-engineer and ticketing budgets and merged green. The
      # step names the four budget tests (#8378 added the #7915 ledger test) in full under `--exact` and then
      # requires `running 4 tests`, so renaming or deleting any one of them
      # fails the step; check_test_count.sh still refuses a zero-test run.
      # Same env as the build step, so nothing recompiles. Runs even when the
      # drift check failed, so one push reports both verdicts.
      - name: Agent resident-budget tests (reuse the build above)
        if: >-
          !cancelled() && steps.relevance.outputs.relevant != 'false'
          && steps.build.outcome == 'success'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tm-target
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/budget-tests.log"
          status=0
          bash scripts/check_test_count.sh -- \
            cargo test -p trusty-mpm --lib --locked --no-fail-fast -- --exact \
            core::bundle::tests::the_default_output_style_stays_within_its_resident_budget \
            core::bundle::tests::rust_engineer_composed_body_stays_within_its_resident_budget \
            core::bundle::tests::every_deployed_agent_composed_body_stays_within_its_resident_budget \
            core::bundle::tests::composed_body_ledger_names_every_chain_link_7915 \
            > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! grep -qx "running 4 tests" "$log"; then
            echo "::error::expected exactly the 4 resident-budget tests to run; a name above no longer matches a test (#8700, #8378)"
            exit 1
          fi

      # #9123: the workspace credential-test scan. It lives in trusty-mpm's
      # lib, so `Rust tests (affected crates)` ran it only when trusty-mpm was
      # affected — a credential test added to any other crate merged unseen.
      # Here it runs on every diff that changes a crate's Rust source, off the
      # build above. Names every scan test under `--exact` and requires
      # `running 4 tests`, like the budget step.
      - name: Credential-test scan (every crate, reuse the build above)
        if: >-
          !cancelled() && steps.build.outcome == 'success'
          && (steps.relevance.outputs.relevant != 'false'
              || steps.relevance.outputs.credential_scan == 'true')
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tm-target
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/credential-scan.log"
          status=0
          bash scripts/check_test_count.sh -- \
            cargo test -p trusty-mpm --lib --locked --no-fail-fast -- --exact \
            secret_source::credential_test_scan::every_credential_test_is_serial_and_sandboxed \
            secret_source::credential_test_scan::the_credential_test_scan_judges_each_shape \
            secret_source::credential_test_scan::a_helper_that_mutates_a_credential_flags_its_test \
            secret_source::credential_test_scan::the_ratchet_judges_by_test_name \
            > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! grep -qx "running 4 tests" "$log"; then
            echo "::error::expected exactly the 4 credential-test scan tests to run; a name above no longer matches a test (#9123)"
            exit 1
          fi

      # #8378 (owner ruling 2026-09-27, until PHASE_3): an instruction-content
      # edit is Cargo-inert, so neither the affected-crates job (on the PR) nor
      # the test shards (on the push to main) run the tests that read the
      # bundled assets. They run here instead, for that diff class
      # (`asset_content`, set by the relevance step) on BOTH events: exactly
      # the rows of scripts/asset-content-tests.tsv, one `cargo test` per
      # crate + target with the rows' name filters. The runner fails on a
      # failing test and on a row that selected no test. trusty-mpm's lib and
      # env_serial harnesses are the ones built above.
      - name: Asset-content tests (filtered list, Cargo-inert instruction edits)
        if: >-
          !cancelled() && steps.relevance.outputs.relevant != 'false'
          && steps.relevance.outputs.asset_content != 'false'
          && steps.build.outcome == 'success'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tm-target
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/check_asset_test_filter.py run
