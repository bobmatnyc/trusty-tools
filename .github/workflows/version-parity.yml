# Version-parity drift gates for the trusty-tools workspace (issues #3366,
# #4421).
#
# Detects "unpublished source drift under an already-published version
# number": a crate whose Cargo.toml version is already live on crates.io, but
# whose local src/ tree no longer matches what was actually published under
# that version — the defect class that turned `cargo publish -p trusty-mpm
# --dry-run` into a release blocker (6 "symbol not found" errors) when
# trusty-common and trusty-agents-common each drifted this way.
#
# TWO jobs, deliberately different in what they compare and when.
#
# 1. `pr-version-bump` (PULL REQUEST) — the merge-time guard #3366 proposed
#    and never got, which is why the defect kept recurring: TWICE on
#    2026-07-30 alone (trusty-installer 0.4.10 at 6078b21c, nine consecutive
#    red runs; trusty-agents-common 0.3.0 at e8f30ef0, hours after the first
#    fix landed). It asks the one question that is decidable from the PR
#    itself — did this branch change `crates/<X>/src/**` without bumping
#    `crates/<X>/Cargo.toml`, under a version crates.io already has? — with
#    one sparse-index GET per touched crate and no tarball downloads. See
#    scripts/check-pr-version-bump.sh's header for why this option was chosen
#    over running the full parity check on PRs.
#
# 2. `version-parity` (PUSH TO MAIN **AND ON A SCHEDULE**, #4688) — still the
#    authority. It diffs the real published tarball against the real merged
#    tree and fails CLOSED, including when the registry is unreachable. The
#    PR-time guard is an early warning, not a replacement: it warns rather than
#    fails on a registry outage precisely because this job is still behind it.
#
#    WHY IT ALSO RUNS ON A SCHEDULE (#4688). This job answers a question about
#    TWO moving parts — main's tree and crates.io — but only ever fired when
#    ONE of them moved. `cargo publish` happens out of band from a maintainer's
#    machine, so a green main can go drifted with no commit to trigger anything.
#    That is exactly the 2026-08-03 sequence: the run at 1ec38321 passed at
#    17:13Z, `trusty-common 0.27.0` went live at 17:21:48Z, and main was not
#    re-evaluated until the next unrelated push. A cron re-asks the question on
#    the registry's clock instead of the repo's, so a publish cannot open a
#    silent window.
#
# 3. `notify-main-drift` (#4688) — files/refreshes a tracking issue when the
#    main-side job does not come out green, mirroring ci.yml's
#    `notify-main-failure` (#4179). Drift on main is everyone's problem the
#    moment it exists; a red square on a scheduled run nobody is watching is
#    not "loudly".
name: Version parity

# `push` stays path-filtered to crate source/manifests and the checkers
# themselves — the scheduled authority below remains unfiltered and re-asks
# the complete crates.io parity question every three hours, so a filtered
# push trigger can never open a coverage gap on main.
#
# `pull_request` carries NO path filter (issue #4421 follow-up). It used to —
# first a `paths-ignore: [website/**, docs/**]`, later narrowed to a
# `paths:` allowlist of crate/manifest/checker globs — but `pr-version-bump`
# is now a REQUIRED branch-protection context, and a required context that a
# path filter can skip goes permanently pending on any PR that doesn't touch
# the allowlisted globs (proven on #5415/#5416: zero `Version parity` runs
# against either head SHA). A required check must run on every PR
# unconditionally, so the filter is gone rather than widened again. This is
# cheap on unrelated PRs: `scripts/check-pr-version-bump.sh` exits 0 with
# "[ OK ] ... none under crates/<crate>/src/**" the moment its scan floor
# sees changed paths but zero of them under `crates/*/src/`, so a docs-only
# or website-only PR still costs one shell scan-floor check, not a
# skipped-forever gate. The SAME "required context must never go pending/
# skipped" reasoning is why `pr-version-bump` carries no job-level `if:` —
# see the job's own header comment, which also records why every ACTION in
# that list runs the real check rather than short-circuiting (#6243).
on:
  push:
    branches: [main]
    paths:
      - "crates/*/src/**"
      - "crates/*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-version-parity.sh"
      - "scripts/check-pr-version-bump.sh"
      - "scripts/lib/source_class.sh"
      - "scripts/check_source_class_selftest.sh"
      - "scripts/check_scan_floor_selftest.sh"
      - "scripts/check_version_bump_verdict_selftest.sh"
      - ".github/workflows/version-parity.yml"
  # Every three hours. Fine-grained enough that a publish is caught in one
  # working session, coarse enough to stay well inside crates.io's API-usage
  # policy (~21 sparse-index GETs + a tarball per published crate, per run).
  schedule:
    - cron: "17 */3 * * *"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    #
    # No `paths` / `paths-ignore` here — see the header comment above.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  workflow_dispatch: {}

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179) — this workflow was hit particularly hard by the
# old `${{ github.ref }}` group, since it is push-to-main only and therefore
# only ever saw the LAST commit of a merge train. Per-ref group on pull_request
# so a new push still supersedes the superseded run. Matches ci.yml.
#
# #6243: the `edited` carve-out is gone. It was there because an `edited` run
# used to be a no-op that must not cancel a real in-flight evaluation — with
# the no-op removed, every `pull_request` run is a real evaluation, so the
# newest one is always the one worth keeping. Collapsing duplicates is now
# the safe default rather than a hazard. It is not by itself the fix for
# #6243: in that incident the first run had already COMPLETED when the second
# was created, so nothing was in progress to cancel.
concurrency:
  group: version-parity-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pre-merge guard (#4421). Pure shell + one HTTP GET per touched crate: no
  # Rust toolchain, no cargo build, so it adds seconds to a PR rather than the
  # minutes the post-merge job costs.
  #
  # REQUIRED branch-protection context. That is why this job carries NO
  # job-level `if:` — a job whose `if:` evaluates false is reported to
  # branch protection as `skipped`, not `success`, and GitHub creates a
  # SEPARATE check run for it at the SAME head SHA as any earlier real run.
  # A title/body-only edit fires `pull_request: edited` with no base change,
  # which is exactly the case the old job-level `if:` excluded — and on a
  # required context, that `skipped` run can sit alongside an earlier
  # `success` run at the identical SHA, which is at minimum confusing and,
  # depending on how branch protection reconciles two runs at one SHA, can
  # mask the real result. Confirmed live on PR #5434, head `8619d595`: a
  # `synchronize` run concluded `success` at 15:37:24Z, then an `edited` run
  # at 15:43:44Z concluded `skipped` at that same SHA. Mirrors `ci.yml`'s
  # `changes` job, which carries the identical no-job-level-`if:` reasoning
  # in its own header comment.
  #
  # So the job always runs and always concludes `success` or `failure` —
  # never `skipped`.
  #
  # #6243 — WHY EVERY STEP'S `if:` IS `github.event_name == 'pull_request'`
  # AND NOTHING NARROWER. This job used to carry a first step that set a
  # `run_check` output and reported `success` WITHOUT running the check
  # whenever a `pull_request: edited` event arrived with no base change. That
  # is a real check run at the PR's head SHA, and branch protection reads the
  # LATEST check run per (app, name, head_sha) — so the no-op published a
  # `success` ON TOP OF a completed real verdict at the same SHA and became
  # the answer an armed auto-merge would act on.
  #
  # Live on PR #6241, head `19f206de`: a `synchronize` run (32803218879) ran
  # the real check and concluded `failure` at 02:55:42Z; a title/body `edited`
  # event fired 17 seconds later, and run 32803235300 skipped every real step
  # and concluded `success` at 02:55:50Z. `origin/main` genuinely carried
  # `trusty-mpm 1.5.0` and `trusty-agents-common 0.6.0` unbumped against
  # crates.io — the `failure` was correct and the `success` overwrote it. The
  # two runs were two distinct trigger events, not a duplicate webhook
  # delivery, so no concurrency setting could have collapsed them: the first
  # had already completed when the second was created.
  #
  # The rule this job now holds: a run that did not evaluate the check does
  # not report a verdict on a pull request. Every `pull_request` action —
  # `edited` with no base change included — runs the real check. It costs
  # ~11 seconds and produces the same answer as the `synchronize` run at that
  # head, so two runs on one head_sha agree by construction instead of
  # racing. The `skipped`-vs-`success` trade PR #5434 had to make is gone
  # rather than re-decided: on a pull request neither is reachable.
  #
  # The remaining `if:` is false on three triggers, and they are NOT equally
  # safe. `push` is filtered to `main` and `schedule` runs on the default
  # branch, so neither can produce a check run at an open PR's head SHA —
  # skipping the check there states something true. `workflow_dispatch: {}`
  # is different: it takes any ref, so dispatching this workflow on a PR's own
  # head branch publishes a `success` at that head SHA having evaluated
  # nothing, which is the #6243 overwrite by another route. That residue is
  # ACCEPTED, not fixed. Closing it needs either a job-level `if:` — which
  # reopens PR #5434's skipped-required-context hazard — or running the PR
  # gate on non-PR events, where HEAD equals the base and the scan floor
  # turns `main` red. A manual dispatch on a PR branch is a deliberate act,
  # so the trade is: keep the two structural hazards closed, and leave this
  # one documented.
  #
  # It stays a step-level `if:` and not a job-level one for the #5434 reason
  # above.
  #
  # Mechanically enforced: `scripts/check_version_bump_verdict_selftest.sh`
  # refuses an `if:` anywhere in this job other than that exact expression at
  # step indent, refuses a job-level `if:` outright, and refuses a step that
  # publishes a `$GITHUB_OUTPUT` flag for other steps to branch on. Its own
  # mutation battery re-proves that those refusals actually fire. It runs as
  # a step of this job, so the invariant is re-proven on every PR.
  pr-version-bump:
    name: "PR version bump vs crates.io (issue #4421)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — the guard needs `git merge-base` against the base
      # branch and `git show <merge-base>:crates/<X>/Cargo.toml`, neither of
      # which a shallow checkout can resolve.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # Verdict-integrity selftest (#6243). Asserts against this very file
      # that no step in this job can skip the real check while the job still
      # reports `success` on a pull request. Runs before the real gate for the
      # same reason the scan-floor selftest does: a gate whose green can be
      # fabricated makes the real run's green meaningless.
      - name: Verdict-integrity selftest (no success without running the check)
        if: github.event_name == 'pull_request'
        run: bash scripts/check_version_bump_verdict_selftest.sh

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        if: github.event_name == 'pull_request'
        run: bash scripts/check_scan_floor_selftest.sh pr_version_bump

      # Publish-ORDER selftest (issue #5358). Different question from this
      # job's own gate — not "is this version already live" but "would we
      # upload a crate before a sibling it needs" — and it lives here because
      # this is the only PR-triggered, unconditionally-run job on the
      # publish-safety side. Its own workflow cannot host it:
      # release.yml's `publish-dry-run` job fires on `*-v*` tags only, and
      # pre-publish.yml states in its header that it deliberately does not run
      # on pull_request. A selftest nothing invokes on a PR is #5501's defect,
      # so it goes where PRs actually reach it.
      #
      # Cheap enough to sit in a required job: pure shell plus python3 against
      # a checked-in cargo-metadata fixture, no cargo, no network, well under
      # a second. It never runs `cargo publish` — every case is --list-only.
      - name: Publish-order selftest (optional + dev dep edges must order first)
        if: github.event_name == 'pull_request'
        run: bash scripts/publish-dry-run-order_selftest.sh

      # Shared-classification selftest (#5765). This gate decides which crates
      # it examines from `scripts/lib/source_class.sh`, shared with
      # `scripts/check_changelog_fragment.sh` — the two used to carry
      # independent path matches that disagreed about a test file under src/.
      # Run here as well as in changelog-fragment.yml because both consumers
      # should refuse to run against a broken definition, and this is the
      # required context of the two. Pure shell, no network, well under a
      # second.
      - name: Source-classification selftest (both gates share one definition)
        if: github.event_name == 'pull_request'
        run: bash scripts/check_source_class_selftest.sh

      # #4688: diff against the base branch AS IT IS NOW, not the frozen
      # `base.sha` snapshot. checkout leaves refs/remotes/origin/<base> at
      # whatever it fetched; re-fetching pins it to the live tip so the merge
      # base cannot lag behind the merge ref's own first parent. See the
      # ATTRIBUTION note in scripts/check-pr-version-bump.sh for the failure
      # this removes (PR #4666 / run 30839255128).
      - name: Refresh the base branch ref
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Check PR version bumps against crates.io
        if: github.event_name == 'pull_request'
        env:
          PR_VERSION_BUMP_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-pr-version-bump.sh

  # Post-merge authority (#3366). Quoted `name:` — an unquoted ` #` opens a
  # YAML comment in a plain scalar, which silently truncated this job's
  # reported context to "Publish-version parity (issue".
  version-parity:
    name: "Publish-version parity (issue #3366)"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # MSRV floor is 1.94 (root Cargo.toml rust-version), matching ci.yml.
      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: version-parity
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache in ci.yml.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run version-parity guard
        run: bash scripts/check-version-parity.sh

  # Loudness (#4688). Without this, drift discovered by a SCHEDULED run is a red
  # square on a workflow nobody opened — the exact failure mode #4179 fixed for
  # ci.yml. `always()` so the job still reports when `version-parity` fails,
  # is cancelled, or is skipped; a non-green verdict is never silence.
  notify-main-drift:
    name: Notify on version drift on main
    if: always() && github.event_name != 'pull_request'
    needs: [version-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update tracking issue
        if: needs.version-parity.result != 'success'
        uses: actions/github-script@v7
        env:
          PARITY_RESULT: ${{ needs.version-parity.result }}
        with:
          script: |
            const label = 'version-drift-main';
            const title = 'Version-parity drift on main';
            const result = process.env.PARITY_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              result === 'failure'
                ? `Version-parity FAILED on \`main\` at ${context.sha} (trigger: ${context.eventName}).`
                : `Version parity did NOT conclude on \`main\` at ${context.sha} (result: ${result}, trigger: ${context.eventName}).`,
              '',
              'A publishable crate\'s `src/**` no longer matches the crates.io tarball for the',
              'version its own Cargo.toml declares, or the check could not verify that it does.',
              'Bump the affected crate before the next release; `cargo publish` will otherwise',
              'fail, or ship source nobody reviewed under a version number that is already out.',
              '',
              'This can appear with NO new commit: publishing to crates.io moves the other half',
              'of the comparison (issue #4688).',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Updated existing tracking issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Filed tracking issue #${created.data.number}`);
            }
