# Design-token drift gate for the trusty-tools workspace (epic #3486).
#
# Foundry v2 design tokens (docs/design/UI/design-system/tokens.css) are the
# canonical hex source. Adopted UIs consume it two ways: Tailwind crates
# (trusty-agents, trusty-code-gui, trusty-mpm-gui) hand-transcribe the hex
# into Tailwind's `--color-*: R G B` RGB-triple convention; plain-CSS crates
# (trusty-console, trusty-analyze, trusty-search, trusty-memory) keep the
# canonical `--trusty-*` names with `#hex` values verbatim. Nothing previously
# stopped either from silently drifting apart. This job re-derives each
# enforced crate's expected values from the canonical source and fails with a
# per-token diff on any mismatch.
#
# All 7 UI crates are enforced (epic #3486); the allowlist is empty. Both
# comparison modes ("rgb-triple" and "hex") live in scripts/check_token_drift.mjs.
#
# Pure Node script, zero dependencies — no pnpm install / lockfile needed, so
# this runs as its own lightweight job (matches line-cap.yml / test-pointers.yml's
# checkout style).
#
# scripts/check_token_drift.test.mjs is a `node:test` regression suite for
# the checker itself (drift detection, missing-block/missing-token parse
# failures, and the zero-comparison guard — see that file's header for why).
# It runs BEFORE the real check: if the checker's own logic is broken, its
# verdict on the real crates isn't trustworthy either.
name: Token drift

# Optional and dependency-free: trigger only for the canonical tokens, the
# seven enforced consumer stylesheets, or the checker/workflow itself.
on:
  push:
    branches: [main]
    paths:
      - "docs/design/UI/design-system/tokens.css"
      - "crates/trusty-agents/ui/src/app.css"
      - "crates/trusty-code-gui/ui/src/app.css"
      - "crates/trusty-mpm-gui/ui/src/app.css"
      - "crates/trusty-console/ui/src/theme.css"
      - "crates/trusty-analyze/ui/src/lib/styles/tokens.css"
      - "crates/trusty-console/ui-search/src/lib/styles/tokens.css"
      - "crates/trusty-memory/ui/src/lib/styles/tokens.css"
      - "scripts/check_token_drift.mjs"
      - "scripts/check_token_drift.test.mjs"
      - ".github/workflows/token-drift.yml"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "docs/design/UI/design-system/tokens.css"
      - "crates/trusty-agents/ui/src/app.css"
      - "crates/trusty-code-gui/ui/src/app.css"
      - "crates/trusty-mpm-gui/ui/src/app.css"
      - "crates/trusty-console/ui/src/theme.css"
      - "crates/trusty-analyze/ui/src/lib/styles/tokens.css"
      - "crates/trusty-console/ui-search/src/lib/styles/tokens.css"
      - "crates/trusty-memory/ui/src/lib/styles/tokens.css"
      - "scripts/check_token_drift.mjs"
      - "scripts/check_token_drift.test.mjs"
      - ".github/workflows/token-drift.yml"

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: token-drift-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  token-drift:
    name: Foundry token drift check (all 7 UI crates)
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run check_token_drift.mjs regression tests
        run: node --test scripts/check_token_drift.test.mjs

      - name: Check adopted-UI tokens against canonical Foundry source
        run: node scripts/check_token_drift.mjs
