# Per-PR changelog fragment gate (issue #4476).
#
# Enforces mechanically what was previously a review-gate-only rule: a PR that
# changes `crates/<crate>/src/**` must record the change in a
# `crates/<crate>/changelog.d/<number>-<slug>.md` fragment. Release time folds
# the fragments into CHANGELOG.md (scripts/assemble-changelog.sh), so concurrent
# PRs never write to the same lines of the same file.
#
# Pure path/diff logic — no Rust toolchain or build needed, so this runs as its
# own lightweight job (matches line-cap.yml's checkout style/auth).
#
# Deliberately NO `paths:` filter (issue #4468): a required check that is skipped
# by a path filter never reports on the PRs it skips and leaves them pending
# forever. This job always runs and reports SUCCESS on an exempt (docs-only /
# CI-only / test-only) PR — the exemption lives in the script, not the trigger.
#
# `pull_request` only: the gate compares a branch against its base, which is
# meaningless on a push to main (the diff against the merge base is empty).
name: Changelog fragment

on:
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes (matches ci.yml).
concurrency:
  group: changelog-fragment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-fragment:
    name: Per-PR changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — the gate needs `git merge-base` against the base
      # branch, which a shallow checkout cannot resolve.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh changelog_fragment changelog_fragment_tool_error

      # Fragment-validation selftest. The gate does not re-implement fragment
      # validation — it asks the release assembler
      # (`assemble-changelog.sh <crate> --stdout`), so gate and assembler cannot
      # disagree. This proves the assembler still REJECTS a malformed fragment,
      # including the real four-categories-in-one-file case that mis-rendered
      # during the 1.3.3 release. Without it the validator is untested code and
      # a refactor can silently restore the silent-mis-render behaviour.
      - name: Fragment-validation selftest (must reject a malformed fragment)
        run: bash scripts/assemble_changelog_selftest.sh

      # Stale-base selftest (#5018): replays the false failure on a synthetic
      # repo — a branch touching crate A only, with crate B released (and B's
      # fragments consumed) on main since the fork point. Proves the gate
      # refuses the stale base, passes against the live branch naming only A,
      # and still fails a genuinely missing fragment. Without it the base
      # handling is untested code and a later edit can silently restore the
      # blame-innocent-crates behaviour.
      - name: Stale-base selftest (must refuse a pinned base.sha)
        run: bash scripts/check_changelog_base_selftest.sh

      # Crate-attribution selftest (#4576): the gate selected nested crate
      # source with a `case` glob whose `*` spans `/`, then extracted the crate
      # with a sed that spans exactly one directory level — so a nested path was
      # selected and silently DROPPED, and the gate printed "no crate source
      # changed … — OK" over a whole shipped source tree (PR #5796). This
      # re-proves that nested source is attributed, that an unattributable path
      # fails rather than vanishing, and that build.rs / tests/ / benches/ /
      # testdata/ / dist bundles / Cargo.toml still need no fragment.
      - name: Crate-attribution selftest (must not drop nested crate source)
        run: bash scripts/check_changelog_attribution_selftest.sh

      # #4688: diff against the base branch AS IT IS NOW, not the frozen
      # `base.sha` snapshot. checkout leaves refs/remotes/origin/<base> at
      # whatever it fetched; re-fetching pins it to the live tip so the merge
      # base cannot lag behind the merge ref's own first parent. Matches
      # version-parity.yml and ci.yml. See the ATTRIBUTION note in
      # scripts/check_changelog_fragment.sh for the failure this removes
      # (PR #5018 / run 31431273762).
      - name: Refresh the base branch ref
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Enforce per-PR changelog fragment
        env:
          CHANGELOG_GATE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check_changelog_fragment.sh
