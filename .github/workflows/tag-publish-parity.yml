# Release tag / publish-commit parity gate.
#
# The gate itself (scripts/check-tag-publish-parity.sh) can only run where a
# publish runs — on the maintainer's machine, wired as preflight-publish.sh
# CHECK 6, because the fact it checks is about THAT checkout's HEAD. There is
# nothing for CI to assert about a tag push: the workflow checkout IS the
# tagged commit, so the comparison is true by construction and proves nothing.
#
# What CI can do is keep the gate able to fail. Its failing branches are the
# whole product — a parity check that returns 0 unconditionally is exactly the
# state the release path was already in on 2026-08-11, when tga-v2.17.0 was cut
# at 246e4ca2 and the crate published from 7d5cf82e1 with every gate green. So
# this job runs the self-test's fixtures, not the gate.
#
# Pure git + shell, no Rust toolchain, so it stays a fast standalone job.
#
# It carries a second preflight self-test of the same shape (#5620): CHECK 5's
# decision, which likewise only runs where a publish runs and is likewise worth
# nothing if it cannot fail. The workflow name stays as it is — renaming it
# would rename the required checks — and the jobs are separate so a red one
# names which decision broke.
#
# These three jobs are required status checks, and a required context must
# exist on every PR — a `paths:`-filtered trigger cannot produce one on a PR
# that doesn't touch the listed paths, and a required context with no check
# run leaves the PR permanently BLOCKED (see CLAUDE.md's CI section, "A
# missing required job definition"). Worse, a `paths:` filter is scoped to
# what changed, not to what could break the gate it protects: #6115 merged
# with this workflow red because the diff under review never touched these
# scripts, so the filter never ran the self-tests at all (#6120). Both
# triggers run unconditionally so the checks are always present and always
# actually run. The jobs themselves stay unchanged: three fast shell scripts,
# ~10s apiece, so an unconditional run is cheap.
name: Tag/publish parity

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types, matching line-cap.yml: `edited` catches a
    # base-branch retarget, which the default set does not.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

concurrency:
  group: tag-publish-parity-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  selftest:
    name: Parity gate self-test (must catch a drifted tag)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 brings tags with it, which case 11 of the self-test uses
      # to run the gate against the real tga-v2.17.0. That case self-skips when
      # the tag is absent, so a shallow clone degrades it to a skip rather than
      # a false failure — the synthetic cases carry the coverage either way.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag/publish parity self-test
        run: bash scripts/check-tag-publish-parity-selftest.sh

  # Same shape, same reason, different check (#5620). CHECK 5's decision — what
  # preflight concludes from check_semver.sh's output — can only matter where a
  # publish runs, and its failing branches are the whole product: reading exit 0
  # as a pass is what let trusty-review 0.16.0 ship with `0 crate(s) checked,
  # 0 skipped, 1 inventory NOT computed`. So CI runs the fixtures, not the gate.
  #
  # Separate job rather than another step, so a red one names which decision
  # broke. Pure shell over captured output: no cargo, no rustdoc, no network.
  check5-decision:
    name: CHECK 5 decision self-test (0 compared must never print PASS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Preflight CHECK 5 decision self-test
        run: bash scripts/preflight-check5-selftest.sh

  # Third instance of the same shape, third check (#5755). CHECK 8 decides
  # whether the release gate actually ran against the commit being published,
  # and it used to key on `head_sha` — which, once #5741 let a dispatch pin an
  # older commit, stopped naming the commit a run examined. Run 31874835425
  # gated 020c139d and records `head_sha` 3f39b79f, so a preflight at 3f39b79f
  # counted it as evidence for a commit it never opened. That is CHECK 6's
  # failure in a new place, so it gets CHECK 6's treatment: fixtures in CI.
  #
  # Separate job rather than another step, so a red one names which decision
  # broke. Pure shell over captured API output: no gh, no network, no cargo.
  check8-decision:
    name: CHECK 8 decision self-test (a run's head_sha is not what it gated)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Preflight CHECK 8 decision self-test
        run: bash scripts/preflight-check8-selftest.sh
