# Root CLAUDE.md re-track guard for the trusty-tools workspace (issue #2299).
#
# Enforces that the repo-root CLAUDE.md stays untracked mechanically:
#   - issue #2299 moved it to .trusty-mpm/INSTRUCTIONS.md to avoid duplicate
#     context loading (~11k tokens/session) in Claude Code;
#   - #2647 was a regression where it got re-tracked at the repo root;
#   - this workflow fails the build if that ever happens again.
#
# Pure git-index check — no Rust toolchain or build needed, so this is fast
# and runs as its own lightweight job (matches line-cap.yml's shape).
name: CLAUDE.md guard

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: claude-md-guard-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  claude-md-guard:
    name: Root CLAUDE.md must stay untracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh claude_md

      - name: Guard against re-tracking root CLAUDE.md (#2299)
        run: bash scripts/check_claude_md_not_tracked.sh
