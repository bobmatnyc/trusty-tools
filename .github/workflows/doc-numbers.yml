# Document-number allocation gate for the trusty-tools workspace.
#
# Nothing owned `DOC-N` / ADR-number allocation, so concurrent authors kept
# claiming the same number (DOC-42, DOC-46, ADR-0023, plus a stale "next free"
# hint that misled an author — see scripts/check_doc_numbers.sh's header).
# This job enforces, via a ratcheted allowlist:
#   - no two files may claim the same DOC-N or ADR-NNNN (by filename OR by
#     their own header self-label);
#   - a file's filename number and its own header self-label must agree;
#   - every `| DOC-N |` row in the spec catalog must point at a file that
#     exists (the OTHER direction — every spec needs a catalog row — is already
#     owned by sld-lint's `spec-catalog` check and is NOT duplicated here);
#   - the catalog's "next free `DOC-N`" hint must actually be free.
#
# Pure text scanning — no Rust toolchain or build needed, so this runs as its
# own lightweight job (matches line-cap.yml / test-pointers.yml checkout style).
name: Doc numbers

#
# Optional and pure shell: run only when the document-number or ADR corpora,
# their allowlist/checkers, or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "docs/specs/**"
      - "docs/adr/**"
      - "docs/trusty-installer/research/02-design/**"
      - ".doc-number-allowlist.tsv"
      - "scripts/check_doc_numbers.sh"
      - "scripts/check_adr.sh"
      - "scripts/check_scan_floor_selftest.sh"
      - ".github/workflows/doc-numbers.yml"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "docs/specs/**"
      - "docs/adr/**"
      - "docs/trusty-installer/research/02-design/**"
      - ".doc-number-allowlist.tsv"
      - "scripts/check_doc_numbers.sh"
      - "scripts/check_adr.sh"
      - "scripts/check_scan_floor_selftest.sh"
      - ".github/workflows/doc-numbers.yml"

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: doc-numbers-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  doc-numbers:
    name: DOC-N allocation and ADR consistency lint
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Gate on the parser's own fixtures first: the label/filename/catalog
      # extraction is the part that can silently rot into "0 violations", so a
      # broken parser must fail loudly rather than make the real gate look
      # clean. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Doc-number parser selftest (fixtures)
        run: bash scripts/check_doc_numbers.sh --self-test

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh doc_numbers

      - name: Enforce DOC-N / ADR number allocation (ratcheted allowlist)
        run: bash scripts/check_doc_numbers.sh

      - name: Test ADR consistency checker
        run: scripts/check_adr.sh --self-test

      - name: Check ADR corpus consistency
        run: bash scripts/check_adr.sh
