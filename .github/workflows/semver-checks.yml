# Public-API / SemVer gate for the trusty-tools workspace (issue #5050),
# moved from per-PR to release-time by #5149.
#
# The workspace publishes 20+ crates to crates.io and had no check that a
# breaking public-API change carried a matching version bump. #4088 is what that
# costs: `trusty-common` 0.22.5 added a required public field on a patch bump,
# every dependent on a `^0.22` floor stopped compiling on a lockfile-free
# `cargo install`, and `trusty-analyze` 0.7.3 was yanked. A workspace
# `cargo check` cannot see that class of break — the root Cargo.toml's path
# override always pairs local source with local dependency — so this job
# compares against the REGISTRY instead.
#
# WHY THIS IS NOT A PR GATE (#5149). It used to run on every `pull_request`.
# Installing the pinned `cargo-semver-checks` and warming a cold
# `target/semver-checks` cache costs 20+ minutes under a 40-minute timeout,
# and it is paid before crate selection has even decided whether the PR is
# exempt. A SemVer break only becomes a defect when something is published, so
# the check belongs where a publish happens. Between releases the repo is
# deliberately unprotected against this class of break: a breaking change can
# merge to main, and the gate catches it at the release that would ship it.
#
# WHERE THE BLOCKING GATE LIVES — READ THIS BEFORE TREATING THIS JOB AS THE
# GATE. It is not. `cargo publish` for this workspace is run LOCALLY by a human
# (`local-ops`), not by any workflow here, so no CI job can stop an upload. The
# barrier is `scripts/preflight-publish.sh` CHECK 5, which runs the same
# `scripts/check_semver.sh` immediately before `cargo publish` and whose nonzero
# exit is the documented absolute stop. This job is the SECOND, INDEPENDENT
# report: it fires on the tag push, which in this project's sequence happens
# BEFORE `cargo publish` (see .claude/skills/cargo-publish/SKILL.md steps 4-6),
# so a red run here is visible while the publish can still be called off. Same
# blocking-vs-independent split, and the same reasoning, as release.yml's
# `publish-dry-run` job.
#
# THE TRIGGER RACES THE PUBLISH, AND NO LONGER MATTERS (#5296). The tag push
# comes before `cargo publish` in the documented step order, but this job takes
# minutes to reach the registry and the publish takes seconds — so by the time
# it queried crates.io the crate's own version was usually already the latest
# release there. The gate then compared the crate against ITSELF and reported no
# change: observed on trusty-agents-common 0.5.0, trusty-progress 0.3.0 and tga
# 2.12.0 during the 1.3.5 cut. The fix is in check_semver.sh, not here — the
# baseline is now the greatest release BELOW the crate's declared version, which
# is the same version before the publish and the correct one after it. This job
# therefore produces a real verdict wherever in the sequence it lands, and no
# ordering between tag and publish needs to hold for it to mean anything.
#
# AND IT ALSO RUNS ON PULL REQUESTS, WITHOUT RESTORING WHAT #5149 REMOVED
# (#5311). `Public API / SemVer` is meant to be a required branch-protection
# context. Tag-push-only means the context does not exist on a pull request at
# all, and GitHub waits forever on a required context that never reports — so
# requiring it today makes every PR in the repo unmergeable. The workflow
# therefore runs on `pull_request` too, unfiltered, and decides INSIDE the job
# whether there is anything to compare: `scripts/detect-version-bumps.sh` reads
# the diff and answers "does this branch declare a version it did not start
# with". No, on the overwhelming majority of PRs — one git diff, then a success
# that says so. #5149's cost is untouched: the pinned tool and the cold rustdoc
# cache are installed only once the answer is yes.
#
# Yes is a release PR, and running there is the point. This workspace bumps a
# crate's version in a PR and cuts the `<crate>-v<version>` tag from merged main
# afterwards, so the bump PR is strictly EARLIER than the trigger above — a
# break surfaces while the release can still be reworked, with no tag in flight.
#
# ON-DEMAND: workflow_dispatch takes a crate name so a break can be checked
# without cutting a release. `bash scripts/check_semver.sh --crate <crate>`
# does the same thing locally.
name: SemVer checks

on:
  push:
    tags:
      - "*-v*"
  pull_request:
    # Explicit activity types (#4179), matching ci.yml and version-parity.yml:
    # `edited` is not in GitHub's default set and is the event a base-branch
    # RETARGET fires. No `paths` / `paths-ignore` — see #5311 above.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to check — package name (tga) or crates/ directory (trusty-git-analytics)"
        required: true
        type: string

concurrency:
  group: semver-checks-${{ github.ref }}
  # `edited` is excluded on pull requests (#4179 shape): that run is not
  # cancelled, so it must be a real one rather than a cheaper answer racing the
  # run it coexists with.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}

jobs:
  semver-checks:
    name: Public API / SemVer
    # #5311: NO job-level `if:`. A job whose `if:` is false concludes `skipped`,
    # and a skipped conclusion does not satisfy a required context — the PR waits
    # on it forever. Whether this gate does any work is decided per-step below,
    # from the diff.
    runs-on: ubuntu-latest
    # #5311: was 40. The tag path checks one crate; a release PR can declare
    # several, and they are compared serially in this one job.
    timeout-minutes: 60
    # #5688: what this run actually did, in one sentence, for the `verdict` job
    # below to wear as its check name. Every branch that can conclude sets it
    # BEFORE it exits, including the failing ones, so the fallback fires only
    # when a step this job does not control died first.
    outputs:
      verdict_label: >-
        ${{ steps.noop.outputs.verdict_label
            || steps.enforce.outputs.verdict_label
            || 'SemVer: verdict unavailable — the gate job did not reach a conclusion' }}
    steps:
      # fetch-depth: 0 — the pull-request path needs `git merge-base` and
      # `git show <merge-base>:crates/<X>/Cargo.toml`, neither of which a
      # shallow checkout can resolve.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # #4688: diff against the base branch AS IT IS NOW, not the frozen
      # `base.sha` snapshot, so the merge base cannot lag behind the merge ref's
      # own first parent and sweep another author's bump into this PR's diff.
      - name: Refresh the base branch ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"

      # Three triggers, three ways to name what is under test:
      #   tag push          — the tag prefix, in whichever accepted form the
      #                       tagger used. `tga-v1.4.2` and
      #                       `trusty-git-analytics-v1.4.2` are both valid tags
      #                       for the same crate (#1128), and `--crate` accepts
      #                       either, so no alias table is duplicated here.
      #   workflow_dispatch — the crate the operator typed.
      #   pull_request      — #5311: every crate whose declared version this
      #                       branch changed, read from the diff by
      #                       scripts/detect-version-bumps.sh. None is the
      #                       normal answer and means no release is under test.
      - name: Select crates to check
        id: crate
        env:
          TAG: ${{ github.ref_name }}
          INPUT_CRATE: ${{ inputs.crate }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAMES="$(
              VERSION_BUMP_BASE="origin/${BASE_REF}" \
                bash scripts/detect-version-bumps.sh | sed -n 's/^bumped_crates=//p'
            )"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NAMES="$INPUT_CRATE"
          else
            NAMES="$(printf '%s' "$TAG" | sed -E 's/-v[0-9].*$//')"
            # An unchanged string means the sed matched nothing, i.e. the ref is
            # not <crate>-v<version>. Resolving it would hand check_semver.sh a
            # crate name that does not exist and read as a tooling error.
            if [[ "$NAMES" == "$TAG" ]]; then
              echo "::error::Ref '${TAG}' is not a <crate>-v<version> release tag."
              exit 1
            fi
          fi
          # An empty selection is a legitimate verdict on a pull request and a
          # tooling error anywhere else — a tag push or a manual dispatch names
          # its crate by construction, so nothing there can leave this blank.
          if [[ -z "$NAMES" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "::error::Empty crate name — nothing to check."
            exit 1
          fi
          echo "crates=${NAMES}" >> "$GITHUB_OUTPUT"
          if [[ -n "$NAMES" ]]; then
            echo "have_work=true" >> "$GITHUB_OUTPUT"
            echo "Checking crate(s): ${NAMES}"
          else
            echo "have_work=false" >> "$GITHUB_OUTPUT"
            echo "No crate declares a new version in this diff."
          fi

      # #5501: the SECOND trigger, and the self-tests below run on either one.
      # `have_work` is computed only from detect-version-bumps.sh, so a PR that
      # repairs this gate and bumps nothing took the no-op path and the
      # self-tests stood down on exactly the PR that changed the thing they
      # test. Observed on PR #5496 (see #5500): it fixed this workflow, `Public
      # API / SemVer` passed in ~15s through the no-op path, and its regression
      # proof was local only.
      #
      # The `else` arm is the tag push and the manual dispatch, neither of which
      # has a diff to classify. `have_work` is true by construction there, so
      # this output changes nothing — it says true rather than false because a
      # classifier that could not look must never be the reason a self-test is
      # skipped.
      - name: Classify SemVer gate machinery from the diff
        id: machinery
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SEMVER_GATE_BASE="origin/${BASE_REF}" \
              bash scripts/detect-semver-gate-inputs.sh > /dev/null
          else
            echo "semver_gate_inputs_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # STABLE, DELIBERATELY NOT THE MSRV 1.94 THIS REPO PINS (#5289).
      # cargo-semver-checks builds rustdoc in a scratch project that ignores this
      # workspace's Cargo.lock, so the graph it resolves can demand a higher
      # rustc than we ship under — `takecell` 0.1.2 wants 1.96 where the lock
      # pins 0.1.1, and under 1.94 the gate could not run at all. Which rustc
      # renders the rustdoc JSON does not change what our public API is, so this
      # costs no coverage; MSRV compliance is ci.yml's job and is untouched.
      # check_semver.sh makes the same choice locally by picking the newest
      # installed toolchain, so CI and a developer's machine agree.
      #
      # #5311: this step and the three below are the 20+ minutes #5149 refused
      # to pay on every PR, so they are gated on there being a release under
      # test. STEP-level, never job-level: a skipped JOB does not satisfy a
      # required context.
      #
      # #5501: this one step also runs on the machinery path, because both
      # self-tests need a `cargo` on PATH — check_semver_selftest.sh's stub
      # forwards `cargo metadata` to the real one, and the type differ resolves
      # `--crate` the same way. It costs seconds; the three below stay on
      # `have_work` alone, which is what keeps #5149's decision intact.
      - name: Install stable toolchain
        if: steps.crate.outputs.have_work == 'true' || steps.machinery.outputs.semver_gate_inputs_changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      # #5440: trusty-common's `keyring-store` feature pulls in libdbus-sys,
      # whose build.rs shells out to `pkg-config dbus-1`. That package is
      # absent on the ubuntu-latest runner image, so building rustdoc for
      # trusty-common under `--only-explicit-features` (which includes every
      # non-excluded feature, keyring-store among them — see feature_args() in
      # scripts/check_semver.sh) aborted before cargo-semver-checks ever
      # compared an API. That is a NO VERDICT (exit 3), not a pass and not a
      # confirmed-unchanged API — see the "Enforce public-API SemVer" step
      # below. libdbus-1-dev supplies the `dbus-1` pkg-config package this
      # build.rs looks for.
      - name: Install system dependencies (libdbus for keyring-store)
        if: steps.crate.outputs.have_work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev

      # A prebuilt binary, PINNED. `cargo install cargo-semver-checks` compiles
      # ~2 minutes of tool before a single crate is checked. install-action
      # downloads a release artifact instead, and pinning the version keeps a
      # tool release from silently changing the lint set under a release. It
      # also never touches this workspace's Cargo.lock — refreshing that turns
      # the MSRV 1.94 job red (see CLAUDE.md).
      - name: Install cargo-semver-checks (pinned prebuilt)
        if: steps.crate.outputs.have_work == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Cache cargo artifacts
        if: steps.crate.outputs.have_work == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver-checks
          # cargo-semver-checks builds into target/semver-checks/, which
          # rust-cache prunes as "unrecognised" by default.
          cache-directories: target/semver-checks
          # Save only from main: a cache saved on a PR ref is readable by that
          # PR alone but still counts against the repo-wide 10 GB quota, and this
          # repo was over it — see the note on the test-shard cache in ci.yml.
          # This one also saved from worktree branches pushed for release tags.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runs BEFORE the real gate, matching line-cap.yml's selftest-then-gate
      # ordering: a gate that cannot fail makes the real run's green meaningless.
      #
      # #5501: OR the machinery trigger — a gate-fix PR bumps no version, and
      # gating this on the bump alone skipped the proof on every PR that changed
      # the gate.
      - name: SemVer gate selftest (must refuse a blind run)
        if: steps.crate.outputs.have_work == 'true' || steps.machinery.outputs.semver_gate_inputs_changed == 'true'
        run: bash scripts/check_semver_selftest.sh

      # cargo-semver-checks 0.50.0 compares NO TYPES: substitute any type and
      # the item still exists with the same name and arity, so every lint
      # passes. Against a 9-break probe crate at --release-type patch it caught
      # 2 and missed 7, all 7 type substitutions; trusty-common 0.32.0 -> 0.33.0
      # changed a return from u64 to Result<u64> and the step below reported
      # `196 checks: 196 pass`. scripts/check_semver_types.sh closes that, and
      # this proves it still catches all seven.
      #
      # Gated the same way as the selftest above, not because it is expensive —
      # it reads two committed rustdoc JSON documents and builds nothing — but
      # because its --crate cases need `cargo metadata`, and the toolchain step
      # is itself gated. #5501 widened both to the machinery trigger together.
      - name: Type-differ selftest (must catch what the lints miss)
        if: steps.crate.outputs.have_work == 'true' || steps.machinery.outputs.semver_gate_inputs_changed == 'true'
        run: bash scripts/check_semver_types_selftest.sh

      # The build-acceleration resolver both scripts above source. It compiles
      # nothing and reaches no network, so it is gated only to keep the step list
      # consistent with its siblings, not for cost. Ungated by the toolchain step
      # for the same reason: none of its cases needs a cargo.
      - name: Build-acceleration selftest (an absent accelerator must change nothing)
        if: steps.crate.outputs.have_work == 'true' || steps.machinery.outputs.semver_gate_inputs_changed == 'true'
        run: bash scripts/build_accel_selftest.sh

      # The two nonzero statuses are annotated differently ON PURPOSE (#5289).
      # Exit 1 is a computed verdict that says break; exit 3 means the gate never
      # compared anything, and reporting that as "your API changed" is the lie
      # this issue was filed for. Both fail the job — a non-verdict is not a
      # pass — but a reader must be able to tell which one they are looking at
      # from the annotation alone.
      #
      # #5688: EXIT 0 IS THREE DIFFERENT FACTS, and they used to render as one
      # green tick. The gate exits 0 when it compared a crate and found nothing
      # wrong, when every selected crate was a recorded skip, and when the
      # advisory inventory could not be built (`NO INVENTORY`, tool exit 101 —
      # observed on PR #5686's trusty-search run, where the `cuda` feature wanted
      # nvcc). Only the first is coverage. The counts come from the gate's own
      # `semver-gate-verdict:` line, so nothing here re-parses the prose summary
      # that preflight-publish.sh CHECK 5 reads; a line this step cannot find is
      # treated as blindness, never as a clean compare.
      - name: Enforce public-API SemVer against crates.io
        id: enforce
        if: steps.crate.outputs.have_work == 'true'
        env:
          SKIP_UI_BUILD: '1'
          CRATES: ${{ steps.crate.outputs.crates }}
        run: |
          set -uo pipefail
          # One `--crate` per selected crate: check_semver.sh accumulates them
          # and reports a single verdict over the whole set, so a release PR
          # that bumps several gets one pass through the tool rather than N.
          args=()
          for c in $CRATES; do
            args+=(--crate "$c")
          done
          rc=0
          # REDIRECTED, NOT PIPED. A pipeline's status is its last command's, and
          # the gate's exit code is the entire verdict — `| tee` here would
          # report every failing run as a pass.
          bash scripts/check_semver.sh "${args[@]}" > "${RUNNER_TEMP}/gate.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/gate.log"

          verdict_line="$(grep -E '^semver-gate-verdict:' "${RUNNER_TEMP}/gate.log" | tail -1 || true)"
          compared="$(printf '%s' "$verdict_line" | sed -nE 's/.*[[:space:]]compared=([0-9]+).*/\1/p')"
          blind="$(printf '%s' "$verdict_line" | sed -nE 's/.*[[:space:]]blind=([0-9]+).*/\1/p')"
          inventoried="$(printf '%s' "$verdict_line" | sed -nE 's/.*[[:space:]]inventoried=([0-9]+).*/\1/p')"

          if [[ "$rc" -eq 1 ]]; then
            label="SemVer: BREAK — a breaking public-API change without a breaking bump"
            echo "::error title=SemVer break::${CRATES} has a breaking public-API change without a breaking version bump. See the failing lints in the log."
          elif [[ "$rc" -eq 3 ]]; then
            label="SemVer: NO VERDICT — the gate never compared anything"
            echo "::error title=SemVer gate could not run::No verdict was computed for ${CRATES}. cargo-semver-checks never completed a comparison (see the log), so whether this release breaks the public API is UNKNOWN. Do not read this as a required version bump, and do not publish on it."
          elif [[ "$rc" -ne 0 ]]; then
            label="SemVer: gate malfunctioned (exit ${rc})"
            echo "::error title=SemVer gate malfunctioned::check_semver.sh exited ${rc}, which is not one of its documented statuses (0 clean, 1 break, 2 usage, 3 no verdict). Nothing was compared."
          elif [[ -z "$compared" ]]; then
            label="SemVer: NO COMPARISON — the gate printed no verdict line"
            echo "::warning title=SemVer gate reported no counts::check_semver.sh exited 0 but printed no 'semver-gate-verdict:' line, so how much it compared is unknown. Treat this as uncompared, not as clean."
          elif [[ "${blind:-0}" -gt 0 ]]; then
            label="SemVer: INCOMPLETE — ${blind} crate(s) could not be compared"
            echo "::warning title=SemVer comparison incomplete::${blind} crate(s) reached cargo-semver-checks and produced no inventory, so nothing examined their public API. Green here means the version numbers already permit a break, not that the break was reviewed."
          elif [[ "$compared" -eq 0 ]]; then
            label="SemVer: NO COMPARISON — every selected crate was skipped"
            echo "::warning title=SemVer compared nothing::Every crate selected for this run was a recorded skip (unpublished, bin-only, or excluded), so no public API was examined. See the skip reasons in the log."
          elif [[ "${inventoried:-0}" -gt 0 ]]; then
            # An inventoried crate WAS compared, but its findings are advisory:
            # the declared bump already permits a break, so "no break" would be
            # the wrong sentence even though the gate is green.
            label="SemVer: ${compared} crate(s) compared — ${inventoried} advisory inventory (breaking bump)"
            echo "::notice title=SemVer inventory::${inventoried} crate(s) already carry a breaking version bump, so their findings are an advisory inventory rather than a pass/fail verdict. Read the listed breaks in the log and confirm each was intended."
          else
            label="SemVer: ${compared} crate(s) compared, no break"
            echo "::notice title=SemVer compared::${compared} crate(s) were compared against their previous crates.io release and no break was found."
          fi

          echo "verdict_label=${label}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${label}"
            echo
            echo "Crates selected: \`${CRATES}\`"
            echo
            echo "\`\`\`"
            echo "${verdict_line:-<no semver-gate-verdict line>}"
            echo "\`\`\`"
            echo
            echo "\`compared\` counts crates whose public API was actually examined."
            echo "See [#5688](https://github.com/bobmatnyc/trusty-tools/issues/5688) for why this is spelled out."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # #5311: the no-op path, and it must EXECUTE rather than be skipped —
      # `skipped` does not satisfy a required context. Nothing in this diff
      # declares a version, so nothing is being released and there is nothing to
      # compare against the registry. The verdict for the release itself is
      # still owned by scripts/preflight-publish.sh CHECK 5 and by the tag-push
      # run of this same workflow; neither is weakened by this branch.
      #
      # #5688: still `success`, and still for #5311's reason — but it now says so
      # where a reader will see it. PR #5686 carried a real break (a public field
      # added to `SearchAppState` without `#[non_exhaustive]`) past this branch,
      # because the only place this path admitted to comparing nothing was the
      # job log, which nobody opens on a green check.
      - name: No release under test — nothing to compare
        id: noop
        if: steps.crate.outputs.have_work != 'true'
        run: |
          echo "No crate's declared version changed against the base branch, so this"
          echo "branch releases nothing and there is no registry baseline to compare."
          echo "Reporting success rather than not reporting at all — see #5311."
          echo "verdict_label=SemVer: no comparison ran — this branch declares no version bump" >> "$GITHUB_OUTPUT"
          {
            echo "## SemVer: no comparison ran"
            echo
            echo "No crate's declared version changed against the base branch, so nothing"
            echo "is being released and there is no registry baseline to compare against."
            echo "**cargo-semver-checks did not examine this branch's public API.**"
            echo
            echo "This is a pass by design ([#5311](https://github.com/bobmatnyc/trusty-tools/issues/5311)),"
            echo "not a statement that the API is unchanged. The verdict for a release is owned by"
            echo "\`scripts/preflight-publish.sh\` CHECK 5 and by this workflow's tag-push run."
          } >> "$GITHUB_STEP_SUMMARY"

  # #5688: the verdict as a CHECK NAME, which is the one surface `gh pr checks`
  # and the merge box render without anyone opening a log. The gate job's own
  # name cannot carry it — that string is the branch-protection context, and a
  # context whose name moves is a context that never reports. So this second,
  # deliberately UNREQUIRED job wears the sentence instead.
  #
  # It mirrors the gate's conclusion rather than always passing: a check named
  # "SemVer: BREAK" that reports green would be a worse conflation than the one
  # this issue is about.
  verdict:
    name: ${{ needs.semver-checks.outputs.verdict_label }}
    needs: semver-checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both values reach the shell through `env:`, never through `${{ }}`
      # interpolation inside `run:` — the label is assembled from this
      # workflow's own constants and the gate's integer counts, and keeping the
      # seam closed means a future edit that puts a crate name in it cannot
      # become a script injection.
      - name: Restate the verdict
        env:
          LABEL: ${{ needs.semver-checks.outputs.verdict_label }}
          GATE: ${{ needs.semver-checks.result }}
        run: |
          echo "$LABEL"
          if [ "$GATE" != "success" ]; then
            echo "::error title=SemVer gate did not pass::The 'Public API / SemVer' job concluded '${GATE}'. Read it, not this job."
            exit 1
          fi
