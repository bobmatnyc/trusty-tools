# CI for the trusty-summarizer converter worker, `workers/summarizer-convert`.
#
# Why: the worker is its own Cargo workspace with its own `Cargo.lock`, kept out
#   of the root workspace by `[workspace] exclude` because xberg 1.3.10 needs
#   Rust 1.98. Every `ci.yml` job runs against the root workspace, so none of
#   them compiles or tests the worker.
# What: two jobs, the `okf-extract-worker.yml` pattern.
#   - `exclusion` runs the exclusion guard: the root workspace must not absorb
#     the worker directory.
#   - `build-test` builds and tests the worker through `--manifest-path` on
#     Rust 1.98.1, its `rust-toolchain.toml` pin.
#   No audit or deny here: `cargo-audit.yml` (weekly cron) and `pre-publish.yml`
#   cover the worker lock beside the root one.
#
# TRIGGERS. No `paths:` filter: the worker compiles `crates/trusty-summarizer`
#   as a path dependency, so a change outside `workers/` can break it.
#   `red-main-notify.yml` watches this workflow by name.

name: Summarizer convert worker

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179); matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  workflow_dispatch: {}

# Per-commit group on push, per-ref on pull_request; `edited` and
# `ready_for_review` never cancel an in-flight run (#4179, #9189). Matches ci.yml.
concurrency:
  group: summarizer-convert-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.action != 'ready_for_review' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  exclusion:
    name: summarizer-convert stays outside the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@1.94

      # `cargo metadata --no-deps --offline` only; no registry fetch, no build.
      - name: Worker directories are excluded from the root workspace
        run: bash scripts/check_worker_dir_excluded.sh

  build-test:
    name: summarizer-convert build + test (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The worker's `rust-toolchain.toml` pin.
        toolchain: ["1.98.1"]
    env:
      # RUSTUP_TOOLCHAIN outranks the worker's `rust-toolchain.toml`, so the
      # leg builds on the toolchain its name says.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: bash scripts/ci-free-disk-space.sh

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      # A leg that silently ran on another toolchain would prove nothing.
      - name: Assert the toolchain in use
        run: |
          rustc --version
          rustc --version | grep -q "^rustc ${{ matrix.toolchain }}" \
            || { echo "::error::expected rustc ${{ matrix.toolchain }}"; exit 1; }

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/summarizer-convert -> target
          key: summarizer-convert-${{ matrix.toolchain }}
          # Save only from main, as ci.yml does (repo-wide cache quota).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tests/sizes.rs runs the `trusty-summarizer` CLI from the worker's
      # target directory; a dependency's binary is built only when named.
      - name: cargo build (trusty-summarizer CLI, beside the worker)
        run: cargo build --locked --manifest-path workers/summarizer-convert/Cargo.toml -p trusty-summarizer

      - name: cargo build (worker)
        run: cargo build --locked --manifest-path workers/summarizer-convert/Cargo.toml --all-targets

      - name: cargo test (worker)
        run: cargo test --locked --manifest-path workers/summarizer-convert/Cargo.toml --no-fail-fast
