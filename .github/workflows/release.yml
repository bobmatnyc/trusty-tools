# Generic per-crate binary release workflow for all distributable trusty crates.
#
# WHY:
#   Every distributable crate in the workspace shares the same tag convention
#   (<crate>-v<version>), the same Rust MSRV, and the same macOS arm64 /
#   Linux x86_64 / Linux arm64 platform matrix. Rather than maintaining a
#   bespoke workflow per crate, a single data-driven workflow covers them all:
#   adding support for a new crate is a one-line change to the CRATE_CONFIG
#   map in the `setup` job.
#
# WHAT:
#   1. `setup`     — parse tag / dispatch inputs → validate crate → emit build matrix.
#   2. `build`     — matrix fan-out: compile, strip, tar+sha256 each asset.
#   3. `release`   — create/update GitHub Release, upload all assets.
#   4. `homebrew-bump` — PLACEHOLDER (no-op); see comments there.
#
# TRIGGERS:
#   - push of any tag matching `*-v*`  (e.g. `trusty-analyze-v0.5.0`)
#   - workflow_dispatch for manual dry-runs (skips the release upload by default)
#
# LINUX BINARY PORTABILITY (issue #2037):
#   Historically the Linux x86_64 leg ran a bare `cargo build` on the
#   `ubuntu-latest` runner (Ubuntu 24.04, glibc 2.39), so every released
#   binary carried a `GLIBC_2.39` floor and failed to even execute on
#   Debian 12 (2.36), Ubuntu 22.04 LTS (2.35), RHEL 9 / AL2023 (2.34), etc.
#   There was also no Linux arm64 build at all.
#
#   Fix: the `linux-zigbuild` variant below builds Linux gnu targets with
#   `cargo zigbuild` (https://github.com/rust-cross/cargo-zigbuild) pinned to
#   glibc 2.17 — the manylinux2014 floor, i.e. "runs on essentially any glibc
#   Linux still in service" (RHEL 8/9, Debian 11/12, Ubuntu 20.04+, Amazon
#   Linux 2/2023, ...). zigbuild is a drop-in `cargo build` wrapper: it only
#   changes the *linker* (routes through `zig cc`, which ships its own
#   versioned glibc stubs), so it changes nothing about which sources get
#   compiled or which Cargo features are active — the resulting binary lands
#   in the SAME `target/<triple>/release/` directory a plain `cargo build`
#   would use, just linked against an older glibc baseline. This same
#   mechanism cross-compiles `aarch64-unknown-linux-gnu` from the x86_64
#   runner with no separate arm64 runner or Docker `cross` toolchain needed.
#
#   CAVEAT — ORT-bundling crates (trusty-search, trusty-analyze), discovered
#   via a real workflow_dispatch dry-run CI validation while building #2037:
#   their DEFAULT `bundled-ort` feature links a prebuilt ONNX Runtime archive
#   that was itself compiled with a real GNU toolchain (GNU libstdc++ ABI).
#   zig's `cc` does not ship a GNU-ABI-compatible libstdc++ for its glibc
#   cross targets (its own C++ support is LLVM libc++, a different, mutually
#   unlinkable ABI), so the final link fails with `undefined symbol:
#   std::...` — a genuine cargo-zigbuild + prebuilt-GNU-C++-archive
#   limitation, not a one-line flag fix (confirmed: passing `-lstdc++`
#   explicitly does not resolve it). So for these two crates the x86_64 leg
#   below (see `native_linux_entry` in the matrix-generation step) is left on
#   its ORIGINAL native `cargo build` — unchanged glibc floor, exactly what
#   shipped before #2037, NOT a regression. Their portable-Linux option
#   remains the existing `x86_64-linux-al2023` asset built with `--features
#   load-dynamic` (dlopen()s a system ONNX Runtime at runtime instead of
#   linking one at build time, sidestepping the ABI problem entirely). The
#   NEW aarch64 leg reuses that same load-dynamic feature set for these two
#   crates (see the matrix-generation step below) — proven working in CI,
#   since it never links ONNX Runtime at build time either.
#
#   The Linux arm64 leg is marked `best_effort` (continue-on-error, like the
#   existing AL2023 leg) because it is new and has not yet been validated by
#   an actual tagged release — see the PR for #2037 for the target-triple /
#   asset-name coordination with the companion install.sh issue (#2038).
#
# ASSET NAMING CONVENTION (matches INSTALL-CONVENTION.md / PR #891):
#   <crate>-<version>-<target>.tar.gz           (standard variants, e.g.
#                                                 x86_64-unknown-linux-gnu,
#                                                 aarch64-unknown-linux-gnu,
#                                                 aarch64-apple-darwin)
#   <crate>-<version>-x86_64-linux-al2023.tar.gz  (AL2023 load-dynamic variant)
#   <crate>-<version>-<target>.tar.gz.sha256    (paired checksum)

name: Binary Release

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate name (e.g. trusty-analyze)"
        required: true
        type: string
      version:
        description: "Version string without leading 'v' (e.g. 0.5.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build but do not upload to GitHub Releases"
        required: false
        type: boolean
        default: true

# Required so the release job can create/update GitHub Releases.
permissions:
  contents: write

# Cancel any in-flight run for the same ref to avoid wasted compute.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Suppress fastembed/ort download progress bars in build logs.
  RUST_LOG: warn

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: setup
#
# Parses the tag (or dispatch inputs) into {crate, version}, looks up the
# per-crate config table, and emits a JSON build matrix consumed by the
# `build` job.  Fails fast with a clear message if the crate is not in the
# config map or if the tag does not match the expected pattern.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  setup:
    name: Parse tag / resolve crate config
    runs-on: ubuntu-latest
    outputs:
      crate:    ${{ steps.parse.outputs.crate }}
      # Why (#1128): the ORIGINAL tag prefix before alias canonicalization (e.g.
      # `tga` stays `tga`, while `crate` becomes `trusty-git-analytics`). Used by
      # the release job's changelog --tag-pattern, which must match the literal
      # pushed tag. For non-aliased crates tag_prefix == crate.
      tag_prefix: ${{ steps.parse.outputs.tag_prefix }}
      version:  ${{ steps.parse.outputs.version }}
      matrix:   ${{ steps.matrix.outputs.matrix }}
      dry_run:  ${{ steps.parse.outputs.dry_run }}
      # Why (#1318 + library-tag fix): `bundled=true` means "this tag has no
      # standalone distributable binary, skip the build/release/homebrew jobs
      # GREEN." It fires for any crate NOT in the binary-crate allowlist in the
      # `config` step — i.e. all library-only crates. Examples: trusty-common
      # (shared lib), trusty-bm25-daemon / trusty-embedderd (sidecar binaries
      # that ship INSIDE a host crate, single-owner-per-binary), trusty-progress,
      # the internal trusty-agents* libs, etc. Previously a library-only tag
      # (e.g. trusty-common-v0.15.3) errored RED; it now green-skips. (trusty-console
      # is NOT bundled — it has its own standalone release job.)
      bundled:  ${{ steps.config.outputs.bundled }}

    steps:
      - name: Parse tag or dispatch inputs
        id: parse
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CRATE="${{ github.event.inputs.crate }}"
            VERSION="${{ github.event.inputs.version }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          else
            TAG="${GITHUB_REF_NAME}"
            # Expected pattern: <crate>-v<version>  e.g. trusty-analyze-v0.5.0
            if [[ ! "$TAG" =~ ^(.+)-v([0-9].+)$ ]]; then
              echo "ERROR: tag '$TAG' does not match <crate>-v<version> pattern."
              exit 1
            fi
            CRATE="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
            DRY_RUN="false"
          fi

          # ── Tag-prefix aliases (issue #1128) ─────────────────────────────────
          # Some crates publish to crates.io under a SHORT package name that
          # differs from their directory / canonical crate name, and the
          # documented release convention (.trusty-mpm/INSTRUCTIONS.md "Git Tag / Release
          # Convention", abbreviation table) lets contributors tag with either
          # form. We canonicalize the alias here so every downstream consumer —
          # the per-crate config map, the homebrew-bump case statement, the
          # changelog --include-path, and the GitHub Release name — keys off the
          # single canonical crate/directory name.
          #
          # tga (the crates.io package name for trusty-git-analytics) → its
          # directory/canonical name trusty-git-analytics. Pushing tga-v<ver>
          # previously fell through to the library-only green-skip branch and
          # silently produced no binaries; it now resolves to the same config as
          # trusty-git-analytics-v<ver>.
          #
          # TAG_PREFIX retains the ORIGINAL tag prefix (before aliasing) because
          # the changelog step keys --tag-pattern off the literal pushed tag, not
          # the canonical crate name. For non-aliased crates TAG_PREFIX == CRATE.
          TAG_PREFIX="$CRATE"
          case "$CRATE" in
            tga) CRATE="trusty-git-analytics" ;;
          esac

          {
            echo "crate=$CRATE"
            echo "tag_prefix=$TAG_PREFIX"
            echo "version=$VERSION"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: crate=$CRATE  tag_prefix=$TAG_PREFIX  version=$VERSION  dry_run=$DRY_RUN"

      # ── Per-crate configuration table ──────────────────────────────────────
      # Each entry encodes everything the build job needs for one crate:
      #
      #   cargo_pkg      – value passed to -p (the Cargo package name)
      #   binaries       – space-separated list of binary names to package
      #   skip_ui_build  – "true" to set SKIP_UI_BUILD=1 (UI-embedding crates)
      #   cargo_features – value for --features flag (empty = use defaults)
      #   no_default_features – "true" to pass --no-default-features
      #   al2023_variant – "true" to also build the AL2023 load-dynamic asset
      #   al2023_no_default_features – "true" for the AL2023 build
      #   al2023_features – --features value for the AL2023 build
      #
      # TO ADD A NEW CRATE: append one `elif [[ "$CRATE" == "<name>" ]]; then`
      # block with the variables filled in.  Everything else is automatic.
      # ─────────────────────────────────────────────────────────────────────
      - name: Resolve per-crate config
        id: config
        shell: bash
        run: |
          CRATE="${{ steps.parse.outputs.crate }}"

          if [[ "$CRATE" == "trusty-search" ]]; then
            # Binaries: trusty-search + trusty-embedderd
            # Both [[bin]] targets are declared in trusty-search/Cargo.toml.
            # trusty-console was REMOVED from the install surface in #1318
            # (single-owner-per-binary); it now ships as its own release job.
            # UI-embedding crate: SKIP_UI_BUILD=1 required for cargo publish / build.
            # Default features: bundled-ort (static ORT, glibc ≥ 2.38 / macOS).
            # AL2023 variant: --no-default-features --features load-dynamic
            #   (trusty-search has a bare `load-dynamic` feature; there is NO
            #    `http-server` feature in this crate — confirmed from Cargo.toml).
            CARGO_PKG="trusty-search"
            BINARIES="trusty-search trusty-embedderd"
            SKIP_UI_BUILD="true"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="true"
            AL2023_NO_DEFAULT="true"
            AL2023_FEATURES="load-dynamic"

          elif [[ "$CRATE" == "trusty-memory" ]]; then
            # Binaries: trusty-memory + trusty-bm25-daemon
            # Both [[bin]] targets confirmed in trusty-memory/Cargo.toml.
            # trusty-console was REMOVED from the install surface in #1318
            # (single-owner-per-binary); it now ships as its own release job.
            # (The trusty-memory-mcp-bridge compat shim is built but not part of
            # the released asset set, matching prior release behaviour.)
            # trusty-memory bin has required-features=["axum-server"]; default
            # features include axum-server so all build with default features.
            # UI-embedding crate: SKIP_UI_BUILD=1
            # No ORT bundling (BM25 sidecar, no ONNX): no AL2023 variant.
            CARGO_PKG="trusty-memory"
            BINARIES="trusty-memory trusty-bm25-daemon"
            SKIP_UI_BUILD="true"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-analyze" ]]; then
            # Binaries: trusty-analyze
            # The trusty-analyze [[bin]] target is confirmed in trusty-analyze/Cargo.toml.
            # trusty-console was REMOVED from the install surface in #1318
            # (single-owner-per-binary); it now ships as its own release job.
            # required-features=["http-server"]; default = ["http-server","bundled-ort"].
            # UI-embedding crate: SKIP_UI_BUILD=1
            # ORT-bundling (bundled-ort default): AL2023 load-dynamic variant needed.
            # trusty-analyze DOES have an `http-server` feature (unlike trusty-search),
            # so the AL2023 flags are: --no-default-features --features http-server,load-dynamic.
            CARGO_PKG="trusty-analyze"
            BINARIES="trusty-analyze"
            SKIP_UI_BUILD="true"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="true"
            AL2023_NO_DEFAULT="true"
            AL2023_FEATURES="http-server,load-dynamic"

          elif [[ "$CRATE" == "trusty-review" ]]; then
            # Binaries: trusty-review
            # The trusty-review [[bin]] target is confirmed in trusty-review/Cargo.toml.
            # trusty-console was REMOVED from the install surface in #1318
            # (single-owner-per-binary); it now ships as its own release job.
            # required-features=[]. Default features = ["http-server","mcp"].
            # No ORT, no UI embedding. No SKIP_UI_BUILD, no AL2023 variant.
            CARGO_PKG="trusty-review"
            BINARIES="trusty-review"
            SKIP_UI_BUILD="false"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-mpm" ]]; then
            # Binaries: tm, trusty-mpm
            # trusty-mpm/Cargo.toml defines [[bin]] targets: tm, trusty-mpm,
            # plus shim binaries not shipped in the distribution (trusty-mpmd, trusty-mpm-tui,
            # trusty-mpm-telegram) and Tauri GUI (trusty-mpm-gui, excluded — needs webview).
            # trusty-console was REMOVED from the install surface in #1318
            # (single-owner-per-binary); it now ships as its own release job.
            # The `cli` feature embeds daemon + tui + telegram as SUBCOMMANDS of tm/trusty-mpm;
            # the shim binaries are thin entry-point wrappers not part of the user-facing CLI.
            # Default features = ["cli","daemon"] which already implies daemon+tui+telegram
            # via the cli → daemon+tui+telegram dependency chain; no explicit --features needed.
            # No SKIP_UI_BUILD, no AL2023 variant.
            CARGO_PKG="trusty-mpm"
            BINARIES="tm trusty-mpm"
            SKIP_UI_BUILD="false"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-git-analytics" ]]; then
            # Cargo package name is `tga` (short name in Cargo.toml — confirmed).
            # Also serves `tga-v*` tags: the parse step canonicalizes the `tga`
            # tag-prefix alias to `trusty-git-analytics` (issue #1128), so both
            # tga-v<ver> and trusty-git-analytics-v<ver> resolve to this branch.
            # Single [[bin]] `tga` at src/main.rs confirmed in Cargo.toml.
            # Default features = [] (empty); no required-features on the bin target.
            # No SKIP_UI_BUILD, no AL2023 variant.
            CARGO_PKG="tga"
            BINARIES="tga"
            SKIP_UI_BUILD="false"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-code" ]]; then
            # Single [[bin]] `tcode` at src/main.rs confirmed in Cargo.toml.
            # No required-features on the bin target; publish=false but included for
            # local distribution. No SKIP_UI_BUILD, no AL2023 variant.
            CARGO_PKG="trusty-code"
            BINARIES="tcode"
            SKIP_UI_BUILD="false"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-installer" ]]; then
            # Binaries: trusty-installer + tctl (transitional alias, ADR-0013 / SPEC-INSTALLER-01)
            # Two [[bin]] targets: `trusty-installer` (primary) and `tctl` (alias),
            # both pointing at src/main.rs in trusty-installer/Cargo.toml.
            # No UI embedding, no ORT: no SKIP_UI_BUILD, no AL2023 variant.
            CARGO_PKG="trusty-installer"
            BINARIES="trusty-installer tctl"
            SKIP_UI_BUILD="false"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          elif [[ "$CRATE" == "trusty-console" ]]; then
            # Binaries: trusty-console
            # As of #1318 (single-owner-per-binary) the standalone trusty-console
            # crate is the SOLE producer of the `trusty-console` binary — it was
            # de-bundled from trusty-search/memory/analyze/review/mpm to fix the
            # cargo `.crates2.json` binary-ownership collisions (#1262). It now has
            # its own standalone release job.
            # Single [[bin]] `trusty-console` at src/main.rs (delegates to
            # `trusty_console::run()`). No required-features.
            # UI-embedding crate (embeds ui/dist via rust-embed): SKIP_UI_BUILD=1.
            # No ORT, no AL2023 variant.
            CARGO_PKG="trusty-console"
            BINARIES="trusty-console"
            SKIP_UI_BUILD="true"
            CARGO_FEATURES=""
            NO_DEFAULT_FEATURES="false"
            AL2023_VARIANT="false"
            AL2023_NO_DEFAULT="false"
            AL2023_FEATURES=""

          # ── Library-only crates — GREEN-SKIP, never an error ─────────────────
          # The branches ABOVE are the authoritative ALLOWLIST of binary-producing
          # crates that ship a standalone distributable binary. Anything that does
          # NOT match one of those branches falls through to here.
          #
          # Many workspace crates publish to crates.io as LIBRARIES ONLY and have
          # no standalone binary target this workflow can build/package/upload:
          #
          #   trusty-common      — shared library (thiserror error types, memory-core, …)
          #   trusty-bm25-daemon — binary ships INSIDE trusty-memory (#1318)
          #   trusty-embedderd   — binary ships INSIDE trusty-search (#1318)
          #   trusty-progress    — shared progress-reporting library
          #   trusty-agents-common / trusty-agents-local — internal libs (publish=false)
          #   …and any future library-only crate added to the workspace.
          #
          # Pushing a tag for one of these (e.g. `trusty-common-v0.15.3`) used to
          # hit a fatal `exit 1`, turning the whole release run RED even though
          # there was nothing wrong — there simply is no binary to release. That
          # false-red is the bug this branch fixes.
          #
          # Design (#1318 follow-up): treat the binary-crate table above as a
          # strict allowlist and DEFAULT EVERYTHING ELSE TO A GRACEFUL SKIP. We
          # emit bundled=true (re-using the existing skip plumbing) so the build /
          # release / homebrew-bump jobs are skipped and the run finishes GREEN.
          # New library crates then "just work" (green-skip) with no workflow edit.
          #
          # CAVEAT — adding a NEW binary crate: because the default is skip, a brand
          # new *binary*-producing crate will ALSO green-skip until you add an
          # explicit config branch for it above. That is intentional (fail-safe, not
          # fail-loud), but it means a missing binary release is silent. (The former
          # `trusty-controller` / bin `tctl` gap from #1316 was closed in #1332 — it
          # was renamed to `trusty-installer` in #1757 with `tctl` as a transitional alias.)
          else
            echo "::notice title=Library-only crate — release skipped::Crate '$CRATE' is not in the binary-release allowlist; treating it as library-only and skipping the binary release gracefully (green, not an error)."
            echo "Binary-producing crates (built + released): trusty-search, trusty-memory,"
            echo "  trusty-analyze, trusty-review, trusty-mpm, trusty-git-analytics (tga),"
            echo "  trusty-code, trusty-console, trusty-installer (+ tctl alias)."
            echo "Library-only / internal crates (green-skip, no standalone binary):"
            echo "  trusty-common, trusty-bm25-daemon, trusty-embedderd, trusty-progress,"
            echo "  trusty-agents*, trusty-mpm-gui, tc-services, cto-assistant,"
            echo "  trusty-cto-db, trusty-gworkspace, and any future library crate."
            echo "If '$CRATE' SHOULD produce a released binary, add a config branch for it"
            echo "above (see the 'TO ADD A NEW CRATE' note) — otherwise this skip is correct."
            echo "bundled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Export config values as step outputs for the matrix job below.
          {
            echo "cargo_pkg=$CARGO_PKG"
            echo "binaries=$BINARIES"
            echo "skip_ui_build=$SKIP_UI_BUILD"
            echo "cargo_features=$CARGO_FEATURES"
            echo "no_default_features=$NO_DEFAULT_FEATURES"
            echo "al2023_variant=$AL2023_VARIANT"
            echo "al2023_no_default=$AL2023_NO_DEFAULT"
            echo "al2023_features=$AL2023_FEATURES"
            echo "bundled=false"
          } >> "$GITHUB_OUTPUT"

      # ── Build matrix generation ─────────────────────────────────────────────
      # Emits a JSON `include` array consumed by the `build` job's
      # `strategy.matrix.include`.  Each entry carries all the fields the build
      # job needs so it never needs to repeat crate-specific logic.
      #
      # Standard variant (macOS — native `cargo build`, no linker tricks needed):
      #   { runner: macos-14,      target: aarch64-apple-darwin,      variant: standard }
      #
      # linux-zigbuild variants (issue #2037 — portable glibc 2.17 baseline,
      # built via `cargo zigbuild --target <triple>.2.17`; see the file-header
      # comment for the full rationale):
      #   { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu,  variant: linux-zigbuild, best_effort: false }
      #   { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, variant: linux-zigbuild, best_effort: true  }
      #   (aarch64 is cross-compiled from the x86_64 runner by zig/cargo-zigbuild;
      #    for ORT-bundling crates it uses the load-dynamic feature set, same as
      #    the AL2023 variant below, since bundled-ort has no aarch64 build-time
      #    binary to download)
      #
      # AL2023 variant (ORT crates only):
      #   { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu,  variant: al2023   }
      #   (built inside an amazonlinux:2023 container; named …-x86_64-linux-al2023)
      #
      # `best_effort: true` legs run with `continue-on-error` at the job level —
      # a failure there does not fail the workflow or block the release; it is
      # for new/unverified legs (see file-header comment) and the AL2023 leg.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Generate build matrix
        id: matrix
        # Skip matrix generation for bundled crates — the build job is also
        # skipped, so there is no matrix consumer.  An empty / unset matrix
        # would cause the build job to error rather than skip cleanly.
        if: steps.config.outputs.bundled != 'true'
        shell: python3 {0}
        env:
          CARGO_PKG:            ${{ steps.config.outputs.cargo_pkg }}
          BINARIES:             ${{ steps.config.outputs.binaries }}
          SKIP_UI_BUILD:        ${{ steps.config.outputs.skip_ui_build }}
          CARGO_FEATURES:       ${{ steps.config.outputs.cargo_features }}
          NO_DEFAULT_FEATURES:  ${{ steps.config.outputs.no_default_features }}
          AL2023_VARIANT:       ${{ steps.config.outputs.al2023_variant }}
          AL2023_NO_DEFAULT:    ${{ steps.config.outputs.al2023_no_default }}
          AL2023_FEATURES:      ${{ steps.config.outputs.al2023_features }}
          CRATE:                ${{ steps.parse.outputs.crate }}
          VERSION:              ${{ steps.parse.outputs.version }}
        run: |
          import json, os

          crate        = os.environ["CRATE"]
          version      = os.environ["VERSION"]
          pkg          = os.environ["CARGO_PKG"]
          bins         = os.environ["BINARIES"].split()
          skip_ui      = os.environ["SKIP_UI_BUILD"] == "true"
          feats        = os.environ["CARGO_FEATURES"]
          no_def       = os.environ["NO_DEFAULT_FEATURES"] == "true"
          al2023       = os.environ["AL2023_VARIANT"] == "true"
          al_no_def    = os.environ["AL2023_NO_DEFAULT"] == "true"
          al_feats     = os.environ["AL2023_FEATURES"]

          common = dict(
              crate=crate,
              version=version,
              cargo_pkg=pkg,
              binaries=bins,
              skip_ui_build=skip_ui,
          )

          # Portable-Linux glibc baseline (issue #2037): manylinux2014's floor,
          # runs on effectively every glibc Linux distro still in service.
          ZIG_GLIBC = "2.17"

          def linux_zigbuild_entry(target, best_effort, use_al2023_features):
              # For ORT-bundling crates (al2023 True), the aarch64 leg reuses
              # the load-dynamic feature set instead of default bundled-ort:
              # bundled-ort downloads a prebuilt x86_64 ONNX Runtime archive at
              # build time with no guaranteed aarch64 counterpart, so it would
              # fail outright; load-dynamic dlopen()s at runtime instead, so it
              # builds regardless of target arch (see file-header comment).
              entry_features = al_feats if use_al2023_features else feats
              entry_no_def   = al_no_def if use_al2023_features else no_def
              return {
                  **common,
                  "runner": "ubuntu-latest",
                  "target": target,
                  "variant": "linux-zigbuild",
                  "asset_suffix": target,
                  "container": "",
                  "zig_target": f"{target}.{ZIG_GLIBC}",
                  "best_effort": best_effort,
                  "cargo_features": entry_features,
                  "no_default_features": entry_no_def,
                  "al2023_no_default": False,
                  "al2023_features": "",
              }

          def native_linux_entry(target):
              # Original (pre-#2037) native x86_64 build: plain `cargo build`
              # on ubuntu-latest, no zig. Reserved for ORT-bundling crates'
              # x86_64 leg (see comment below) — NOT a regression, this is
              # exactly what shipped before this issue.
              return {
                  **common,
                  "runner": "ubuntu-latest",
                  "target": target,
                  "variant": "standard",
                  "asset_suffix": target,
                  "container": "",
                  "zig_target": "",
                  "best_effort": False,
                  "cargo_features": feats,
                  "no_default_features": no_def,
                  "al2023_no_default": False,
                  "al2023_features": "",
              }

          # x86_64 Linux — Tier-1, required.
          #
          # CAVEAT discovered via a real CI dry-run (see PR for #2037): for
          # ORT-bundling crates (al2023 True) the DEFAULT `bundled-ort`
          # feature links a prebuilt ONNX Runtime archive that was compiled
          # with a real GNU toolchain (GNU libstdc++ ABI). zig's `cc` driver
          # does not ship a GNU-ABI-compatible libstdc++ for its glibc cross
          # targets (its own C++ support is LLVM libc++, a different ABI), so
          # the final link fails with `undefined symbol: std::...` no matter
          # what `-lstdc++`/`-l:libstdc++.a` variant is passed — this is a
          # genuine cargo-zigbuild + prebuilt-GNU-C++-archive limitation, not
          # a one-line fix. So ORT-bundling crates keep their ORIGINAL native
          # x86_64 build here (unchanged glibc floor, exactly what shipped
          # before #2037 — not a regression); their portable-Linux option
          # remains the existing `x86_64-linux-al2023` load-dynamic asset
          # below, which sidesteps the problem entirely by not linking ONNX
          # Runtime at build time at all. All OTHER crates get the full
          # glibc-2.17 zigbuild leg.
          x86_64_entry = (
              native_linux_entry("x86_64-unknown-linux-gnu") if al2023
              else linux_zigbuild_entry("x86_64-unknown-linux-gnu", best_effort=False, use_al2023_features=False)
          )

          includes = [
              {**common,
               "runner": "macos-14",
               "target": "aarch64-apple-darwin",
               "variant": "standard",
               "asset_suffix": "aarch64-apple-darwin",
               "container": "",
               "zig_target": "",
               "best_effort": False,
               "cargo_features": feats,
               "no_default_features": no_def,
               "al2023_no_default": False,
               "al2023_features": ""},
              x86_64_entry,
              # aarch64 Linux — NEW (issue #2037), best-effort/non-blocking
              # until validated by a real tagged-release CI run. For
              # ORT-bundling crates this reuses the load-dynamic feature set
              # (see linux_zigbuild_entry) — proven working in CI, since it
              # never links ONNX Runtime at build time and so never hits the
              # libstdc++-ABI problem above.
              linux_zigbuild_entry("aarch64-unknown-linux-gnu", best_effort=True, use_al2023_features=al2023),
          ]

          if al2023:
              includes.append({
                  **common,
                  "runner": "ubuntu-latest",
                  "target": "x86_64-unknown-linux-gnu",
                  "variant": "al2023",
                  "asset_suffix": "x86_64-linux-al2023",
                  # Use the AL2023-specific build flags (load-dynamic, no bundled-ort)
                  "cargo_features": al_feats,
                  "no_default_features": al_no_def,
                  "container": "amazonlinux:2023",
                  "zig_target": "",
                  "best_effort": True,
                  "al2023_no_default": al_no_def,
                  "al2023_features": al_feats,
              })

          matrix = {"include": includes}
          result = json.dumps(matrix)
          print(f"matrix={result}")

          import pathlib
          output_file = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output_file.open("a") as f:
              f.write(f"matrix={result}\n")

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: build
  #
  # Fan-out matrix job.  Each entry builds one crate × platform × variant.
  # Produces: one .tar.gz + one .tar.gz.sha256 per matrix entry.
  #
  # AL2023 entries run inside an amazonlinux:2023 container (glibc 2.34).
  # linux-zigbuild entries cross/native-compile on the ubuntu-latest runner via
  # `cargo zigbuild` against a pinned old-glibc baseline (issue #2037; see the
  # file-header comment). Standard (macOS) entries run natively, no linker
  # tricks needed.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.crate }} ${{ matrix.asset_suffix }}
    needs: setup
    # Skip entirely for bundled crates — they have no standalone binary target.
    if: needs.setup.outputs.bundled != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Why: `best_effort` legs (AL2023, and the new Linux aarch64 leg from
    # issue #2037) are allowed to fail without sinking the whole build matrix.
    # AL2023 uses GCC 11 which rejects newer SIMD probe flags emitted by
    # numkind (needs GCC 12+); the aarch64-linux-gnu leg is new/CI-unverified
    # (cross-compiled via zig — see #2037 PR for what remains to be validated
    # by a real tagged release). Neither is required for Homebrew (Tier-1:
    # macOS arm64 + linux x86_64-gnu, unchanged). The release job is
    # conditioned to run when the Tier-1 legs succeed regardless of a
    # best_effort leg's outcome.
    continue-on-error: ${{ matrix.best_effort == true }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    # AL2023 variant runs inside an Amazon Linux 2023 container.
    # Standard variants have no container (empty string → no container).
    container: ${{ matrix.container != '' && matrix.container || null }}

    steps:
      # ── AL2023 container bootstrap ──────────────────────────────────────────
      # amazonlinux:2023 ships without tar/gzip, which actions/checkout needs.
      # This step is a no-op on non-container runners (the condition guards it).
      - name: Install tar/gzip (AL2023 container prerequisite)
        if: matrix.variant == 'al2023'
        run: dnf install -y tar gzip

      - name: Checkout repository
        uses: actions/checkout@v5

      # ── AL2023: install full build prerequisites via dnf ────────────────────
      - name: Install build prerequisites (AL2023 — dnf)
        if: matrix.variant == 'al2023'
        run: |
          dnf install -y --allowerasing \
            gcc gcc-c++ make openssl-devel perl \
            curl tar gzip pkg-config findutils binutils

      # ── Linux runners (linux-zigbuild): install system deps ─────────────────
      # Same base toolchain as before; zigbuild only replaces the final linker,
      # so build-essential/pkg-config/libssl-dev are still needed for crates
      # whose build.rs shells out to a C compiler or pkg-config directly.
      - name: Install build prerequisites (Ubuntu)
        # `standard` here means the ORT-bundling-crate native x86_64 leg
        # (see native_linux_entry in the matrix-generation step) — the only
        # `standard`-variant entry that runs on ubuntu-latest; the OTHER
        # `standard` entry is macOS (guarded out by the runner check).
        if: matrix.variant == 'linux-zigbuild' || (matrix.variant == 'standard' && matrix.runner == 'ubuntu-latest')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev binutils curl

      # ── zig + cargo-zigbuild (issue #2037) ──────────────────────────────────
      # cargo-zigbuild wraps `cargo build`, routing the link step through
      # `zig cc`/`zig c++`/`zig ar` for the target in `matrix.zig_target`
      # (e.g. `x86_64-unknown-linux-gnu.2.17`), which pins the glibc symbol
      # baseline instead of whatever the build host happens to ship. It also
      # cross-links `aarch64-unknown-linux-gnu` from this x86_64 runner with
      # no separate arm64 runner or Docker `cross` toolchain required.
      - name: Install zig (linux-zigbuild variant)
        if: matrix.variant == 'linux-zigbuild'
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild (linux-zigbuild variant)
        if: matrix.variant == 'linux-zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # ── Rust toolchain ───────────────────────────────────────────────────────
      # AL2023 container cannot use the dtolnay action (needs runner Node.js),
      # so we install via rustup directly. Standard (macOS) and linux-zigbuild
      # runners both use the action — zigbuild just needs the target's std lib
      # installed via rustup same as a native build would.
      - name: Install Rust 1.91 (MSRV) via rustup — AL2023
        if: matrix.variant == 'al2023'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91 \
                       --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust (MSRV 1.91) — standard + linux-zigbuild runners
        if: matrix.variant == 'standard' || matrix.variant == 'linux-zigbuild'
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: ${{ matrix.target }}

      # ── Cargo cache ─────────────────────────────────────────────────────────
      # AL2023 uses actions/cache directly (Swatinem requires Node.js 20+,
      # which the amazonlinux:2023 runner image does not provide).
      - name: Cache cargo registry + artefacts (AL2023)
        if: matrix.variant == 'al2023'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: al2023-1.91-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            al2023-1.91-${{ matrix.crate }}-
            al2023-1.91-

      - name: Cache cargo registry + artefacts (standard + linux-zigbuild)
        if: matrix.variant == 'standard' || matrix.variant == 'linux-zigbuild'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.crate }}

      # ── AL2023: download ONNX Runtime for load-dynamic builds ───────────────
      # Supplies the system libonnxruntime.so that the `ort` crate dlopen()s at
      # runtime.  ORT 1.20.1 was built on Ubuntu 20.04 (glibc 2.31), so it
      # loads cleanly on AL2023 (glibc 2.34).
      # The ORT version here must match the version the workspace's ort-sys
      # rc.12 expects (see al2023-build.yml for full rationale).
      - name: Download ONNX Runtime 1.20.1 (AL2023 load-dynamic)
        if: matrix.variant == 'al2023'
        shell: bash
        env:
          ORT_VERSION: "1.20.1"
        run: |
          ORT_DIR="/opt/onnxruntime-${ORT_VERSION}"
          ORT_TARBALL="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ORT_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_TARBALL}"

          echo "Downloading ORT ${ORT_VERSION} from ${ORT_URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${ORT_TARBALL}" "${ORT_URL}"
          mkdir -p "${ORT_DIR}"
          tar -xzf "/tmp/${ORT_TARBALL}" -C "${ORT_DIR}" --strip-components=1
          rm "/tmp/${ORT_TARBALL}"

          DYLIB_PATH=$(find "${ORT_DIR}/lib" -name "libonnxruntime.so.${ORT_VERSION}" | head -1)
          if [[ -z "${DYLIB_PATH}" ]]; then
            DYLIB_PATH=$(find "${ORT_DIR}/lib" -name "libonnxruntime.so" | head -1)
          fi
          if [[ -z "${DYLIB_PATH}" ]]; then
            echo "ERROR: libonnxruntime.so not found after extraction."
            find "${ORT_DIR}" -name "*.so*" || true
            exit 1
          fi

          echo "ORT_DYLIB_PATH=${DYLIB_PATH}" >> "$GITHUB_ENV"
          echo "Found: ${DYLIB_PATH}"

      # ── Build ────────────────────────────────────────────────────────────────
      # Applies per-crate env vars, optional --no-default-features, optional
      # --features.  The build command is identical for all crates — only the
      # env + flags + linker (plain `cargo build` vs `cargo zigbuild`) differ.
      #
      # linux-zigbuild variant (issue #2037): uses `matrix.zig_target`, which
      # carries the glibc-pinned target suffix (e.g.
      # `x86_64-unknown-linux-gnu.2.17`). cargo-zigbuild strips that suffix
      # for the actual rustc target and writes output to the SAME
      # `target/<bare-triple>/release/` directory a plain `cargo build` would
      # use — the "Strip, package, and checksum" step below reads from
      # `target/${{ matrix.target }}/release/` (the bare triple) either way.
      #
      # HOST_CFLAGS (issue #2037, discovered via a real CI dry-run — see PR):
      # cargo-zigbuild exports its `CC_<target>` env var for the WHOLE build
      # session, so HOST-only build-dependencies (e.g. `ort-sys`'s build.rs
      # uses `ureq` → `native-tls` → `openssl-sys` to download the prebuilt
      # ONNX Runtime archive, and build-dependencies always compile for the
      # HOST, never the `--target`) also get routed through zig's `cc`
      # wrapper. Zig's `cc` runs with `-nostdinc`, so it does NOT replicate
      # gcc's built-in Debian/Ubuntu multiarch header search (`/usr/include/
      # x86_64-linux-gnu`), which is where `openssl/opensslconf.h` actually
      # lives on the apt-installed `libssl-dev` here — the top-level
      # `/usr/include/openssl/*.h` shim headers were found, but the
      # multiarch-only conf header was not. `HOST_CFLAGS` is a distinct
      # override cc-rs (the `cc` crate) checks specifically for HOST-targeted
      # compiles (confirmed from the build.rs diagnostic output in that CI
      # run), so this does NOT affect the actual `--target` cross-compile.
      #
      # RUSTFLAGS -lstdc++ (issue #2037, ORT-bundling crates): the prebuilt
      # ONNX Runtime archive `bundled-ort` links against is a C++ library, so
      # the final binary needs libstdc++. A normal `cc`/`g++` invocation
      # auto-links libstdc++ for C++ inputs, but zig's `cc` (used here as the
      # Rust linker driver, which only ever sees Rust object files, not C++
      # sources) does not infer that a transitively-linked static archive
      # needs it — this surfaces as `undefined symbol: std::...` at final
      # link time. Passed unconditionally for the linux-zigbuild variant: an
      # unused `-lstdc++` is a no-op for crates that don't need it (modern
      # linkers only pull in symbols actually referenced).
      - name: Build release binary
        shell: bash
        # SKIP_UI_BUILD is a per-step env var set from the matrix field.
        # Using a step-level env block is cleanest: no shell quoting hazards,
        # no shellcheck warnings, and the value is validated at workflow parse time.
        env:
          SKIP_UI_BUILD: ${{ matrix.skip_ui_build && '1' || '' }}
          HOST_CFLAGS: ${{ matrix.variant == 'linux-zigbuild' && '-I/usr/include/x86_64-linux-gnu' || '' }}
          RUSTFLAGS: ${{ matrix.variant == 'linux-zigbuild' && '-C link-arg=-lstdc++' || '' }}
        run: |
          CARGO_ARGS="-p ${{ matrix.cargo_pkg }} --release"

          if [[ "${{ matrix.no_default_features }}" == "true" ]]; then
            CARGO_ARGS="$CARGO_ARGS --no-default-features"
          fi

          if [[ -n "${{ matrix.cargo_features }}" ]]; then
            CARGO_ARGS="$CARGO_ARGS --features ${{ matrix.cargo_features }}"
          fi

          if [[ "${{ matrix.variant }}" == "linux-zigbuild" ]]; then
            echo "Running: cargo zigbuild $CARGO_ARGS --target ${{ matrix.zig_target }}"
            # SC2086 is intentional: CARGO_ARGS is word-split on purpose (flag list).
            # shellcheck disable=SC2086
            cargo zigbuild $CARGO_ARGS --target ${{ matrix.zig_target }}
          else
            echo "Running: cargo build $CARGO_ARGS --target ${{ matrix.target }}"
            # shellcheck disable=SC2086
            cargo build $CARGO_ARGS --target ${{ matrix.target }}
          fi

      # ── Strip + package ──────────────────────────────────────────────────────
      # Strips each binary to reduce asset size, packages them into a .tar.gz
      # alongside LICENSE and README.md, and computes a .sha256 checksum.
      #
      # Asset naming: <crate>-<version>-<asset_suffix>.tar.gz
      #   macOS:        trusty-analyze-0.5.0-aarch64-apple-darwin.tar.gz
      #   Linux x86_64: trusty-analyze-0.5.0-x86_64-unknown-linux-gnu.tar.gz  (glibc 2.17 baseline)
      #   Linux arm64:  trusty-analyze-0.5.0-aarch64-unknown-linux-gnu.tar.gz (glibc 2.17 baseline, best-effort — issue #2037)
      #   AL2023:       trusty-analyze-0.5.0-x86_64-linux-al2023.tar.gz
      - name: Strip, package, and checksum
        id: package
        shell: bash
        run: |
          CRATE="${{ matrix.crate }}"
          VERSION="${{ matrix.version }}"
          TARGET="${{ matrix.target }}"
          SUFFIX="${{ matrix.asset_suffix }}"
          ASSET_NAME="${CRATE}-${VERSION}-${SUFFIX}"
          STAGING_DIR="staging/${ASSET_NAME}"

          mkdir -p "${STAGING_DIR}"

          # Strip and copy each binary.
          for BIN in ${{ join(matrix.binaries, ' ') }}; do
            BIN_PATH="target/${TARGET}/release/${BIN}"
            if [[ ! -f "${BIN_PATH}" ]]; then
              echo "ERROR: expected binary not found: ${BIN_PATH}"
              exit 1
            fi
            strip "${BIN_PATH}" || true   # strip may not be available on all hosts; non-fatal
            cp "${BIN_PATH}" "${STAGING_DIR}/"
            echo "Packaged: ${BIN}"
          done

          # Include LICENSE and README if present.
          [[ -f "LICENSE" ]]                                   && cp "LICENSE"    "${STAGING_DIR}/" || true
          [[ -f "crates/${CRATE}/README.md" ]]                 && cp "crates/${CRATE}/README.md" "${STAGING_DIR}/" || true
          [[ ! -f "crates/${CRATE}/README.md" && -f "README.md" ]] && cp "README.md" "${STAGING_DIR}/" || true

          # load-dynamic variants: append a runtime note about ORT_DYLIB_PATH.
          # Covers BOTH the AL2023 leg (x86_64) and the linux-zigbuild aarch64
          # leg for ORT-bundling crates (issue #2037 — that leg reuses the
          # same load-dynamic feature set since bundled-ort has no aarch64
          # build-time binary to download; see file-header comment).
          # The exact --features flag varies by crate:
          #   trusty-search:  --no-default-features --features load-dynamic
          #   trusty-analyze: --no-default-features --features http-server,load-dynamic
          # matrix.cargo_features holds the correct value for this matrix entry.
          LOAD_DYNAMIC_BUILD_FEATURES="${{ matrix.cargo_features }}"
          if [[ "${LOAD_DYNAMIC_BUILD_FEATURES}" == *"load-dynamic"* ]]; then
            case "${TARGET}" in
              aarch64-*) ORT_ARCH="aarch64" ;;
              *)         ORT_ARCH="x64" ;;
            esac
            {
              printf 'Linux load-dynamic ORT build (portable across glibc versions)\n'
              printf '===============================================================\n'
              printf 'This binary was compiled with:\n'
              printf '  --no-default-features --features %s\n' "${LOAD_DYNAMIC_BUILD_FEATURES}"
              printf '\n'
              printf 'It does NOT bundle ONNX Runtime static libraries; instead it dlopen()s\n'
              printf 'libonnxruntime.so at startup.\n'
              printf '\n'
              printf 'REQUIRED at runtime:\n'
              printf '  export ORT_DYLIB_PATH=/path/to/libonnxruntime.so\n'
              printf '\n'
              printf 'Compatible ORT build: 1.20.1 linux-%s (Ubuntu 20.04 / glibc 2.31)\n' "${ORT_ARCH}"
              printf '  https://github.com/microsoft/onnxruntime/releases/tag/v1.20.1\n'
              printf '\n'
              printf 'Example install:\n'
              printf '  curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-%s-1.20.1.tgz \\\n' "${ORT_ARCH}"
              printf '    | tar xz -C /opt\n'
              printf '  export ORT_DYLIB_PATH=/opt/onnxruntime-linux-%s-1.20.1/lib/libonnxruntime.so.1.20.1\n' "${ORT_ARCH}"
            } > "${STAGING_DIR}/ORT-RUNTIME-NOTE.txt"
          fi

          # Create the archive.
          tar -czf "${ASSET_NAME}.tar.gz" -C staging "${ASSET_NAME}"

          # Compute SHA-256 checksum.
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
          fi

          {
            echo "asset_archive=${ASSET_NAME}.tar.gz"
            echo "asset_checksum=${ASSET_NAME}.tar.gz.sha256"
            echo "asset_name=${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "--- Built assets ---"
          ls -lh "${ASSET_NAME}.tar.gz" "${ASSET_NAME}.tar.gz.sha256"
          cat "${ASSET_NAME}.tar.gz.sha256"

      # ── Upload build artifacts for the release job ───────────────────────────
      - name: Upload assets as workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: |
            ${{ steps.package.outputs.asset_archive }}
            ${{ steps.package.outputs.asset_checksum }}
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: release
  #
  # Downloads all per-platform artifacts and uploads them to the GitHub Release
  # for this tag.  Creates the release if it does not exist yet.
  #
  # Skipped entirely when dry_run == 'true' (workflow_dispatch dry-runs).
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create / update GitHub Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    # Why: `build` may report result='failure' when the AL2023 leg fails even
    # though continue-on-error prevents it from failing sibling legs — GitHub
    # Actions marks a matrix job as failed when any non-continue-on-error entry
    # fails, but here ALL non-continue-on-error entries succeed.  We explicitly
    # allow result='failure' on `build` (AL2023 case) while still requiring
    # it didn't get cancelled outright.  The Tier-1 artifacts (macOS arm64 +
    # linux-gnu) will be present in the artifact store regardless.
    if: >-
      needs.setup.outputs.bundled != 'true' &&
      needs.setup.outputs.dry_run != 'true' &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped'
    timeout-minutes: 15

    steps:
      # ── Checkout the repository (required by git-cliff) ──────────────────────
      # Why: the git-cliff step below (orhun/git-cliff-action@v4) reads cliff.toml
      # from the repo root and walks the git history/tags to render RELEASE_NOTES.md.
      # Without a checkout this job runs in an empty working dir: git-cliff cannot
      # find cliff.toml (falls back to the default config) NOR the git repository
      # ("could not find repository at '/home/runner/work/trusty-tools/trusty-tools'"),
      # so it errors out, RELEASE_NOTES.md is never written, and softprops fails to
      # read body_path → no GitHub Release is created (regression from #1322 / PR #1346).
      # fetch-depth: 0 fetches the FULL history and all tags, which git-cliff needs
      # for its --latest / --tag-pattern tag-range walking.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          # Download every artifact produced by the build matrix.
          merge-multiple: true

      - name: List assets to be uploaded
        run: |
          echo "Assets to upload:"
          find release-assets -type f | sort

      - name: Detect prerelease
        id: prerelease
        shell: bash
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          # Treat as prerelease if version contains a hyphen (e.g. 0.5.0-alpha.1)
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Generate release notes from conventional commits (issue #1322) ───────
      # Why: replaces softprops' generic generate_release_notes with a curated,
      # per-crate, Keep-a-Changelog-grouped body driven by the same cliff.toml
      # that produces the per-crate CHANGELOG.md files.
      #
      # Scoping (issue #1128): two distinct keys are used here on purpose.
      #   --include-path crates/<crate>/**  keys off needs.setup.outputs.crate,
      #     the CANONICAL crate/directory name (e.g. trusty-git-analytics). This
      #     must be the directory under crates/ so git-cliff scopes commits to
      #     the right path.
      #   --tag-pattern <tag_prefix>-v*  keys off needs.setup.outputs.tag_prefix,
      #     the ORIGINAL tag prefix actually pushed (e.g. `tga`). This must match
      #     the literal tag so --latest selects this release's section.
      # For non-aliased crates the two are identical (tag_prefix == crate); only
      # aliased tags like tga-v* (canonical trusty-git-analytics) differ.
      #
      # --latest emits only this tag's section; --strip all drops the
      # Keep-a-Changelog header/footer so the body is just the grouped commits.
      #
      # OUTPUT writes the rendered notes to ${{ github.workspace }}/RELEASE_NOTES.md.
      # The git-cliff-action runs from the repo root (no working-directory), and so
      # does the softprops step below, so a plain relative "RELEASE_NOTES.md" path
      # resolves to the same file in both steps.
      - name: Generate release notes (git-cliff)
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --include-path "crates/${{ needs.setup.outputs.crate }}/**"
            --tag-pattern "${{ needs.setup.outputs.tag_prefix }}-v*"
            --latest
            --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create / update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ needs.setup.outputs.crate }} v${{ needs.setup.outputs.version }}"
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          # Release notes are now generated by git-cliff (step above) instead of
          # softprops' generic generate_release_notes. We point body_path at the
          # file the git-cliff step wrote (OUTPUT: RELEASE_NOTES.md) rather than
          # piping multi-line content through the `body:` expression, which is
          # fragile for multi-line strings. If a tag has no in-scope conventional
          # commits, RELEASE_NOTES.md is empty — that is intentional and softprops
          # handles an empty body_path file fine (empty release body).
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: homebrew-bump
  #
  # WHY: After a real tag release (non-dry-run), update the Homebrew tap
  #   bobmatnyc/homebrew-trusty so `brew install bobmatnyc/trusty/<crate>`
  #   picks up the new version automatically.  The tap hosts a binary formula
  #   (pre-built bottles) rather than a source formula.
  #
  # WHAT:
  #   1. Download the .sha256 files from the artifacts produced by the build job.
  #   2. Parse the SHA-256 hex strings for the two Tier-1 platforms:
  #        aarch64-apple-darwin  (macOS arm64)
  #        x86_64-unknown-linux-gnu  (Linux x86_64)
  #   3. Check out bobmatnyc/homebrew-trusty using HOMEBREW_TAP_TOKEN (a PAT
  #      with repo scope on the tap repo — stored as a secret, never hardcoded).
  #   4. Generate (or idempotently update) tap/Formula/<crate>.rb with:
  #        - correct version string
  #        - per-platform `url` pointing at the GitHub release asset
  #        - per-platform `sha256` from the downloaded checksum files
  #      The formula uses `on_macos { on_arm { … } }` / `on_linux { … }` blocks
  #      so Homebrew serves the correct pre-built binary per platform.
  #   5. Commit (only if the file changed) and push to the tap's main branch.
  #
  # GUARDS:
  #   - Runs ONLY on real tag pushes (dry_run != 'true').
  #   - Runs ONLY when the HOMEBREW_TAP_ENABLED repository variable is 'true'.
  #     This lets the job exist in the workflow without doing anything until the
  #     tap and token are actually configured.
  #   - HOMEBREW_TAP_TOKEN secret must be set to a PAT with `repo` scope on
  #     bobmatnyc/homebrew-trusty before enabling.
  #
  # TO ACTIVATE (once bobmatnyc/homebrew-trusty tap is set up):
  #   1. Create the tap repo: `gh repo create bobmatnyc/homebrew-trusty --public`
  #   2. Add secret: Settings → Secrets → HOMEBREW_TAP_TOKEN (PAT, repo scope)
  #   3. Add variable: Settings → Variables → HOMEBREW_TAP_ENABLED = true
  #   The job will then run automatically on every subsequent real tag push.
  # ─────────────────────────────────────────────────────────────────────────────
  homebrew-bump:
    name: "Homebrew tap update"
    needs: [setup, release]
    runs-on: ubuntu-latest
    # Only run on real tag releases (not dry-runs) and only when the tap is enabled.
    # HOMEBREW_TAP_ENABLED must be set to 'true' as a repository/org variable AND
    # HOMEBREW_TAP_TOKEN must be configured as a secret before this job does anything.
    # Until both are configured the job is skipped silently.
    # release.result may be 'success' or 'failure' (if softprops errored); only
    # skip on cancel/skip to avoid tap diverging from a partially-uploaded release.
    if: >-
      needs.setup.outputs.bundled != 'true' &&
      needs.setup.outputs.dry_run != 'true' &&
      vars.HOMEBREW_TAP_ENABLED == 'true' &&
      needs.release.result == 'success'
    timeout-minutes: 10

    steps:
      # ── Download the .sha256 checksum files produced by the build job ────────
      # Each matrix entry uploaded an artifact containing:
      #   <crate>-<version>-<suffix>.tar.gz
      #   <crate>-<version>-<suffix>.tar.gz.sha256
      # We only need the .sha256 files for the two Tier-1 platforms.
      - name: Download build artifacts (sha256 files)
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      # ── Check out the Homebrew tap repository ────────────────────────────────
      # HOMEBREW_TAP_TOKEN is a PAT with `repo` (contents:write) scope on
      # bobmatnyc/homebrew-trusty.  It is stored as a repository secret and
      # is NEVER printed or echoed in any step.
      - name: Checkout bobmatnyc/homebrew-trusty tap
        uses: actions/checkout@v5
        with:
          repository: bobmatnyc/homebrew-trusty
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # ── Generate / update the formula ────────────────────────────────────────
      # This step:
      #   - Reads the SHA-256 from the .sha256 files for each Tier-1 platform.
      #   - Constructs the GitHub release asset URLs using the tag / crate / version.
      #   - Writes (or overwrites) tap/Formula/<crate>.rb.
      #
      # Formula structure (binary formula, per-platform bottle blocks):
      #
      #   class <CrateClass> < Formula
      #     desc "..."
      #     homepage "https://github.com/bobmatnyc/trusty-tools"
      #     version "<version>"
      #     license "Elastic-2.0"  # or MIT per crate
      #
      #     on_macos do
      #       on_arm do
      #         url "https://github.com/bobmatnyc/trusty-tools/releases/download/<tag>/<asset-aarch64>.tar.gz"
      #         sha256 "<hex>"
      #       end
      #     end
      #
      #     on_linux do
      #       on_intel do
      #         url "https://github.com/bobmatnyc/trusty-tools/releases/download/<tag>/<asset-x86_64>.tar.gz"
      #         sha256 "<hex>"
      #       end
      #     end
      #
      #     def install
      #       bin.install "<binary>"  # repeat for multi-binary crates
      #     end
      #   end
      #
      # The script is idempotent: running it twice for the same version produces
      # the identical file (same content → git detects no change → no commit).
      - name: Generate or update Formula/<crate>.rb
        shell: bash
        env:
          CRATE:   ${{ needs.setup.outputs.crate }}
          VERSION: ${{ needs.setup.outputs.version }}
          # TAG is the raw git ref name, e.g. "trusty-analyze-v0.5.1"
          TAG:     ${{ github.ref_name }}
          # GITHUB_REPOSITORY is "bobmatnyc/trusty-tools"
          REPO:    ${{ github.repository }}
        run: |
          set -euo pipefail

          FORMULA_DIR="tap/Formula"
          mkdir -p "${FORMULA_DIR}"
          FORMULA_FILE="${FORMULA_DIR}/${CRATE}.rb"

          # ── Locate SHA-256 files for the two Tier-1 platforms ──────────────
          # The .sha256 files written by the build job contain one line:
          #   <hex>  <filename>.tar.gz
          # (sha256sum / shasum -a 256 output format)

          MACOS_SUFFIX="aarch64-apple-darwin"
          LINUX_SUFFIX="x86_64-unknown-linux-gnu"

          MACOS_SHA256_FILE=$(find release-assets -name "${CRATE}-${VERSION}-${MACOS_SUFFIX}.tar.gz.sha256" | head -1)
          LINUX_SHA256_FILE=$(find release-assets -name "${CRATE}-${VERSION}-${LINUX_SUFFIX}.tar.gz.sha256" | head -1)

          if [[ -z "${MACOS_SHA256_FILE}" ]]; then
            echo "ERROR: macOS sha256 file not found for ${CRATE}-${VERSION}-${MACOS_SUFFIX}"
            find release-assets -name "*.sha256" | sort
            exit 1
          fi
          if [[ -z "${LINUX_SHA256_FILE}" ]]; then
            echo "ERROR: Linux sha256 file not found for ${CRATE}-${VERSION}-${LINUX_SUFFIX}"
            find release-assets -name "*.sha256" | sort
            exit 1
          fi

          # Extract the hex digest (first field on the line).
          MACOS_SHA256=$(awk '{print $1}' "${MACOS_SHA256_FILE}")
          LINUX_SHA256=$(awk '{print $1}' "${LINUX_SHA256_FILE}")

          echo "macOS arm64  SHA-256: ${MACOS_SHA256}"
          echo "Linux x86_64 SHA-256: ${LINUX_SHA256}"

          # ── Asset URLs ─────────────────────────────────────────────────────
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          MACOS_URL="${BASE_URL}/${CRATE}-${VERSION}-${MACOS_SUFFIX}.tar.gz"
          LINUX_URL="${BASE_URL}/${CRATE}-${VERSION}-${LINUX_SUFFIX}.tar.gz"

          # ── Convert crate name to Ruby class name ──────────────────────────
          # e.g. "trusty-analyze" → "TrustyAnalyze"
          CLASS_NAME=$(echo "${CRATE}" | sed 's/-\([a-z]\)/\U\1/g; s/^\([a-z]\)/\U\1/')

          # ── Determine binaries to install ──────────────────────────────────
          # Map known multi-binary crates; default is the crate name itself.
          # NOTE (#1318): trusty-console was de-bundled — it is its own formula
          # now (single-owner-per-binary), so it no longer appears in any host's
          # INSTALL_BINS. The trusty-console case below installs only its own bin.
          case "${CRATE}" in
            trusty-search)   INSTALL_BINS="trusty-search trusty-embedderd" ;;
            trusty-memory)   INSTALL_BINS="trusty-memory trusty-bm25-daemon" ;;
            trusty-analyze)  INSTALL_BINS="trusty-analyze" ;;
            trusty-review)   INSTALL_BINS="trusty-review" ;;
            trusty-mpm)      INSTALL_BINS="tm trusty-mpm" ;;
            trusty-console)  INSTALL_BINS="trusty-console" ;;
            # Keyed on the canonical crate name; `tga-v*` tags are already
            # canonicalized to trusty-git-analytics in the parse step (#1128).
            trusty-git-analytics) INSTALL_BINS="tga" ;;
            trusty-code)     INSTALL_BINS="tcode" ;;
            trusty-installer) INSTALL_BINS="trusty-installer tctl" ;;
            *)               INSTALL_BINS="${CRATE}" ;;
          esac

          # Build the `bin.install` lines.
          BIN_INSTALL_LINES=""
          for BIN in ${INSTALL_BINS}; do
            BIN_INSTALL_LINES="${BIN_INSTALL_LINES}    bin.install \"${BIN}\"\n"
          done

          # ── Write the formula ───────────────────────────────────────────────
          # Using a Python heredoc inside bash to avoid quoting hazards with
          # Ruby string literals and backslashes.
          python3 - <<PYEOF
          import os, textwrap
          crate        = os.environ["CRATE"]
          version      = os.environ["VERSION"]
          class_name   = "${CLASS_NAME}"
          macos_url    = "${MACOS_URL}"
          macos_sha256 = "${MACOS_SHA256}"
          linux_url    = "${LINUX_URL}"
          linux_sha256 = "${LINUX_SHA256}"
          formula_file = "${FORMULA_FILE}"

          bins = "${INSTALL_BINS}".split()
          bin_lines = ""
          for b in bins:
              bin_lines += f'    bin.install "{b}"\n'

          # Use the first binary in INSTALL_BINS as the smoke-test target.
          # (Previously used crate.split("-")[0] which gave "trusty" for all
          #  trusty-* crates — that binary does not exist in any tarball.)
          test_bin = bins[0]

          formula = f"""\
          # Generated by the Binary Release workflow (release.yml).
          # Do not edit by hand — changes will be overwritten on the next release.
          # To customise behaviour, edit .github/workflows/release.yml in
          # bobmatnyc/trusty-tools (homebrew-bump job, "Generate or update Formula" step).
          class {class_name} < Formula
            desc "trusty-tools: {crate} binary"
            homepage "https://github.com/bobmatnyc/trusty-tools"
            version "{version}"

            # macOS arm64 (Apple Silicon) pre-built binary
            on_macos do
              on_arm do
                url "{macos_url}"
                sha256 "{macos_sha256}"
              end
            end

            # Linux x86_64 (glibc 2.17+) pre-built binary
            on_linux do
              on_intel do
                url "{linux_url}"
                sha256 "{linux_sha256}"
              end
            end

            def install
          {bin_lines.rstrip()}
            end

            test do
              system bin/"{test_bin}", "--version"
            end
          end
          """

          # textwrap.dedent strips the leading indentation added by the f-string.
          output = textwrap.dedent(formula)
          with open(formula_file, "w") as f:
              f.write(output)
          print(f"Wrote formula to {formula_file}")
          PYEOF

          echo "--- Formula content ---"
          cat "${FORMULA_FILE}"

      # ── Commit and push (only when the formula actually changed) ─────────────
      # Using git diff --quiet to detect changes avoids creating empty commits
      # if the formula was already at this version (idempotent re-runs).
      - name: Commit and push updated formula
        shell: bash
        env:
          CRATE:   ${{ needs.setup.outputs.crate }}
          VERSION: ${{ needs.setup.outputs.version }}
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/

          if git diff --cached --quiet; then
            echo "Formula unchanged — no commit needed (idempotent re-run)."
          else
            git commit -m "chore: bump ${CRATE} formula to v${VERSION}"
            git push
            echo "Formula pushed to bobmatnyc/homebrew-trusty."
          fi
