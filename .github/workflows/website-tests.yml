# #5200: nothing in CI ran `website/`'s Vitest suite — this workflow does.
# #5918: nothing ran `pnpm lint` over it either — the `Prettier + ESLint` job
# at the bottom does, as a second, independent job.
#
# The gap #5200 closed: `scripts/detect-docs-only.sh` buckets `website/**` as
# inert (same as `docs/**`), so a website-only PR set `docs_only=true`,
# `ci.yml`'s `Test` job skipped, and the `ui-checks` matrix — the only pnpm
# surface in `ci.yml` — never listed `website/`. Every website PR merged on a
# green that tested nothing. A leg on that matrix cannot fix it: every step
# there is gated on `docs_only != 'true'`, and `website/**` IS docs-only by
# that classifier's rule, so the leg would skip on exactly the PRs it exists
# to check.
#
# NO `paths:` FILTERS, AND WHY THEY WENT AWAY. The three jobs below run on
# every push to main and every pull request, and each classifies relevance
# ITSELF in its own first step (`scripts/ci-website-relevance.sh`). Two
# reasons, both already established in this repo:
#
#   1. A `paths:` filter on a job that is (or becomes) a required context
#      wedges the PR forever: GitHub never creates the check run, and a
#      required context with no run is pending, not passing. Same trap
#      documented in capabilities-drift.yml and detect-docs-only.sh. Nothing
#      here is required TODAY — read the live list with `gh api
#      repos/bobmatnyc/trusty-tools/branches/main/protection --jq
#      '.required_status_checks.contexts'`, never a copy — but promoting one
#      must not require rewriting the trigger.
#   2. The old filter list was derived from what the suite READS, and included
#      `crates/*/Cargo.toml` and `docs/**`. That made every release PR pay for
#      the whole website suite: PR #8272, a Rust-only fix, went red here on a
#      changelog-corpus hook timeout while touching the website not at all.
#
# WHAT EACH JOB IS RELEVANT TO (scripts/ci-website-relevance.sh owns the rule,
# docs/reference/ci-gates.md states the policy):
#
#   Vitest (unit + smoke)  website/** minus website/src/content/**, plus the
#                          two trusty-installer sources `site.test.ts` pins
#                          values out of (UNIT_RUST_INPUTS in the classifier)
#   Changelog corpus       crates/*/changelog.d/**, crates/*/CHANGELOG.md,
#                          website/src/lib/changelog/**, and the flagship list
#   Prettier + ESLint      website/** including prose content
#
# A DOCUMENTATION-ONLY change therefore runs no code test suite, and still
# runs the content gate its own content owes (`Changelog corpus`). Every
# failure arm of the classifier answers "relevant" and costs a full run.
#
# PNPM — the version is READ from `website/package.json`'s `packageManager`
# field rather than hardcoded, then asserted after install. `ui-checks` pins
# `version: 9`, which floats across the 9.x line; `website/` pins the exact
# `pnpm@9.15.9`, and a shell at the repo root has no pin at all. Parsing the
# field keeps one source of truth, and the assertion makes a mis-resolution
# fail loudly instead of running the suite under some other pnpm.
#
# NODE 22 — `website/` declares no `engines` field and has no `.nvmrc`. All
# jobs pin 22, which every floor accepts: vitest 4 wants `^20 || ^22 || >=24`,
# vite 6 wants `^18 || ^20 || >=22`, SvelteKit 2 wants `>=18.13`. A local Node
# on a different line can report `localStorage` failures in
# `tests/theme.test.ts` that this runner does not — match the pin before
# treating one as real.
#
# CHROMIUM — `tests/mobile-overflow.test.ts` launches a real browser to
# measure `scrollWidth`; jsdom has no layout engine and cannot. That file's
# header assumes a browser already cached by `crates/trusty-agents/ui`'s
# Playwright install, which is a developer-machine assumption — an ephemeral
# runner has nothing cached, so this installs it explicitly.
name: Website tests

on:
  push:
    branches: [main]
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml / token-drift.yml.
concurrency:
  group: website-tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  # No job-level `if:` keyed on the pull_request ACTIVITY TYPE in any job here
  # (#5407, and capabilities-drift.yml's note): a title edit shares this
  # workflow's PR concurrency group with the real run, so an edit-triggered run
  # that reports without doing the work can bury a real failure under the same
  # context name. The jobs always run; the relevance step is what stays cheap.
  website-tests:
    name: Vitest (unit + smoke)
    runs-on: ubuntu-latest
    # The `smoke` project shells out to a real `vite build` twice (once per
    # `tests/**` file, `fileParallelism: false`) and then drives Chromium over
    # the output. ~4 min on an M-series laptop; 20 leaves headroom on a
    # slower hosted runner without letting a hang burn a full hour.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — the relevance classifier needs `git merge-base`
      # against the base branch (pull_request) or the push's `before` SHA,
      # which a shallow checkout cannot resolve. Matches ci.yml's `changes`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh the base branch ref (#4688 pattern — avoid a stale merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Classify website code relevance
        id: relevance
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-website-relevance.sh unit

      - name: Read the pinned pnpm version from website/package.json
        id: pin
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\).*/\1/p' website/package.json)"
          if [ -z "$version" ]; then
            echo "::error::no pnpm@<version> found in website/package.json packageManager" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.relevance.outputs.relevant != 'false'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: Install Node.js
        if: steps.relevance.outputs.relevant != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Verify the resolved pnpm is the pinned one
        if: steps.relevance.outputs.relevant != 'false'
        run: |
          set -euo pipefail
          resolved="$(pnpm --version)"
          expected="${{ steps.pin.outputs.version }}"
          if [ "$resolved" != "$expected" ]; then
            echo "::error::pnpm $resolved resolved, but website/package.json pins $expected" >&2
            exit 1
          fi
          echo "pnpm $resolved matches the pin"

      - name: Install dependencies
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the mobile-overflow smoke test
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm run test` is the `unit` and `smoke` projects. The `corpus`
      # project is deliberately NOT in it — see the job below.
      - name: Run the website test suite
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm run test

  # The real-changelog gate, split out of the unit suite (owner ruling,
  # 2026-09-18). It parses every released crate's CHANGELOG.md — ~21 s and
  # growing with each release — and it is the only website test a changelog
  # fragment can affect. As a block inside `Vitest (unit + smoke)` it made
  # every release PR pay for the whole website suite and blew vitest's default
  # 10 s `hookTimeout` in `beforeAll` (PR #8272). Its own check name means a
  # red corpus is legible as a content problem, not a website-code problem.
  website-corpus:
    name: Changelog corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh the base branch ref (#4688 pattern — avoid a stale merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Classify changelog corpus relevance
        id: relevance
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-website-relevance.sh corpus

      - name: Read the pinned pnpm version from website/package.json
        id: pin
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\).*/\1/p' website/package.json)"
          if [ -z "$version" ]; then
            echo "::error::no pnpm@<version> found in website/package.json packageManager" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.relevance.outputs.relevant != 'false'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: Install Node.js
        if: steps.relevance.outputs.relevant != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Verify the resolved pnpm is the pinned one
        if: steps.relevance.outputs.relevant != 'false'
        run: |
          set -euo pipefail
          resolved="$(pnpm --version)"
          expected="${{ steps.pin.outputs.version }}"
          if [ "$resolved" != "$expected" ]; then
            echo "::error::pnpm $resolved resolved, but website/package.json pins $expected" >&2
            exit 1
          fi
          echo "pnpm $resolved matches the pin"

      - name: Install dependencies
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm install --frozen-lockfile

      # No Chromium and no `vite build`: the `corpus` project is plain Node.
      - name: Run the changelog corpus gate
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm run test:corpus

  # #5918: nothing in CI ran `pnpm lint` over `website/`, and `main` carried a
  # Prettier violation because of it.
  #
  # A SEPARATE JOB, not a step in `website-tests`. Two reasons. A Prettier nit
  # and a broken assertion are different problems and deserve different red
  # squares — as one job, whichever ran first would mask the other. And this job
  # needs neither Chromium nor a `vite build`, so it settles in well under a
  # minute while the suite takes up to twenty.
  #
  # Its relevance includes `website/src/content/**`, which the unit job's does
  # not: Prettier formats prose markdown, so a content edit still owes a lint.
  website-lint:
    name: Prettier + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh the base branch ref (#4688 pattern — avoid a stale merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Classify website lint relevance
        id: relevance
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-website-relevance.sh lint

      # Same pin-then-verify sequence as the jobs above, and for the same
      # reason: `website/` pins an exact pnpm in `packageManager` and a shell at
      # the repo root has no pin at all, so the version is READ, not hardcoded.
      - name: Read the pinned pnpm version from website/package.json
        id: pin
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\).*/\1/p' website/package.json)"
          if [ -z "$version" ]; then
            echo "::error::no pnpm@<version> found in website/package.json packageManager" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.relevance.outputs.relevant != 'false'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: Install Node.js
        if: steps.relevance.outputs.relevant != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Verify the resolved pnpm is the pinned one
        if: steps.relevance.outputs.relevant != 'false'
        run: |
          set -euo pipefail
          resolved="$(pnpm --version)"
          expected="${{ steps.pin.outputs.version }}"
          if [ "$resolved" != "$expected" ]; then
            echo "::error::pnpm $resolved resolved, but website/package.json pins $expected" >&2
            exit 1
          fi
          echo "pnpm $resolved matches the pin"

      - name: Install dependencies
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm install --frozen-lockfile

      # `prettier --check . && eslint .` — the script `website/package.json`
      # already defines, so a developer running `pnpm lint` locally runs exactly
      # what this job runs. `pnpm format` writes the fixes.
      - name: Lint the website
        if: steps.relevance.outputs.relevant != 'false'
        working-directory: website
        run: pnpm run lint
