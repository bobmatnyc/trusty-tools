# Agent-asset staleness guard for the trusty-tools workspace (issue #2958 Slice E4).
#
# Enforces that trusty-code's forked agent copies
# (crates/trusty-code/src/assets/agents/*.md) never silently drift from the
# shared source of truth (crates/trusty-agents-common/src/assets/agents/*.md):
#   - trusty-code's agents dir must hold EXACTLY 8 accounted files — any other
#     file there is a re-copied shared asset and fails the gate;
#   - 4 known-deviated files (qa.md, code-critic.md, code-analyzer.md,
#     web-qa.md — a Bob-approved tools: restriction + reworded prose) are
#     pinned by SHARED SOURCE hash, so an upstream edit behind one of them
#     fails the gate for deliberate reconciliation instead of drifting
#     unnoticed;
#   - the other 4 (engineer.md, qa-agent.md, code-reviewer.md, pm.md) are
#     tcode-only defaults that deliberately track nothing.
#
# #5604 collapsed every other agent asset to ONE physical copy under
# crates/trusty-agents-common/, which both trusty-mpm and trusty-code embed via
# trusty_agents_common::agent_assets — so crates/trusty-mpm/src/assets/agents/
# no longer exists and is not a path this gate can watch.
#
# Pure file/hash comparison — no Rust toolchain or build needed, so this runs
# as its own lightweight job (matches line-cap.yml's structure/style). Scoped
# to PRs touching either assets directory or the guard itself.
name: Agent assets

on:
  push:
    branches: [main]
    paths:
      - "crates/trusty-code/src/assets/agents/**"
      - "crates/trusty-agents-common/src/assets/agents/**"
      - "scripts/check_agent_assets.sh"
      - "scripts/agent-asset-pins.tsv"
      - ".github/workflows/agent-assets.yml"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "crates/trusty-code/src/assets/agents/**"
      - "crates/trusty-agents-common/src/assets/agents/**"
      - "scripts/check_agent_assets.sh"
      - "scripts/agent-asset-pins.tsv"
      - ".github/workflows/agent-assets.yml"

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: agent-assets-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  agent-assets:
    name: tcode embedded agent-asset staleness check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Scan-floor mutation self-test (issue #4618): re-proves in CI that this
      # gate REFUSES a vacuous scan. Without it the floor is untested code and a
      # later refactor can silently restore the "0 examined, still green" pass.
      # Runs before the real gate — a gate that cannot fail makes the real run's
      # green meaningless. Mirrors line-cap.yml's selftest-then-gate ordering.
      - name: Scan-floor selftest (must refuse an empty scan)
        run: bash scripts/check_scan_floor_selftest.sh agent_assets_tool_error

      - name: Enforce agent-asset parity + pinned-deviation checks
        run: bash scripts/check_agent_assets.sh
