# Amazon Linux 2023 / glibc 2.34 build gate for trusty-search /
# trusty-embedderd (issues #605, #2222).
#
# WHY this workflow exists:
#   The default `bundled-ort` feature downloads a prebuilt ONNX Runtime
#   binary (ORT 1.24.2 as of fastembed 5.x) that was compiled against glibc
#   2.38. Amazon Linux 2023 ships glibc 2.34, which is lower — so the
#   prebuilt ORT binary references `__isoc23_strtol`, a glibc 2.38 symbol,
#   causing a link failure on AL2023.
#
#   The fix is to build with `--no-default-features --features load-dynamic`,
#   which tells the `ort` crate to dlopen a system-installed
#   `libonnxruntime.so` at runtime instead of linking the bundled static libs.
#   That system library just needs to satisfy the glibc present on the host.
#
#   This workflow proves the load-dynamic build path compiles AND links (not
#   just `cargo check`) on a real AL2023 container — so the regression cannot
#   return silently (refs #605, #2222).
#
#   Issue #2222 gap this closes: trusty-search bundles a second binary
#   (`trusty-embedderd`, built from `crates/trusty-search/src/bin/
#   trusty-embedderd.rs` against the `trusty-embedderd` library crate) inside
#   the same `cargo install trusty-search`. The `al2023-load-dynamic-search`
#   job exercises the link step for `-p trusty-search`, which also builds
#   that bundled `trusty-embedderd` binary target.
#
#   #5067: the companion `al2023-load-dynamic` job was DELETED. It built
#   trusty-analyze with a `load-dynamic` feature that no longer exists — the
#   feature went with the unused neural clustering embedder whose model load
#   stalled daemon boot — so the job could only fail with `does not contain
#   this feature: load-dynamic`. Since this workflow's `paths:` filter also
#   fires on trusty-search, trusty-embedderd and trusty-common, leaving it
#   would have turned every PR touching any of those crates red for an
#   unrelated reason.
#
# WHAT the job does:
#   1. Runs in an `amazonlinux:2023` container (glibc 2.34 — the exact
#      platform that triggered #605 / #2222).
#   2. Installs Rust 1.94 (workspace MSRV) via rustup inside the container.
#   3. Downloads the official ORT 1.24.2 linux-x64 tarball (its
#      libonnxruntime.so references no glibc symbol newer than 2.27, so it
#      loads on AL2023's glibc 2.34) and exports ORT_DYLIB_PATH pointing at
#      the extracted libonnxruntime.so.
#   4. Runs `cargo build -p trusty-search --no-default-features --features
#      load-dynamic` — full link step, not just check.
#   5. #8612: runs the built `trusty-embedderd` once with ORT_DYLIB_PATH set
#      and asserts one embedding comes back, then once with a missing
#      ORT_DYLIB_PATH and asserts startup fails — see
#      scripts/check_ort_runtime_load.sh.
#
# ORT version choice (1.24.2) — #8612:
#   The workspace Cargo.lock resolves `ort` / `ort-sys` to 2.0.0-rc.12 with the
#   `api-24` feature (crates/trusty-common/Cargo.toml), so ORT_API_VERSION is
#   24. The bundled-ort path downloads ORT 1.24.2 at build time. The
#   load-dynamic feature bypasses that download and dlopens whatever is at
#   ORT_DYLIB_PATH at runtime, and `ort` refuses a runtime whose minor version
#   is below 24 (`expected version >= '1.24.x'`). Any 1.24.x runtime works;
#   1.24.2 matches the bundled build. This pin used to say 1.20.1, which
#   compiled fine and failed at the first dlopen — the gap step 5 closes.
#
# TRIGGERS:
#   - push / PR touching crates/trusty-search/**, crates/trusty-embedderd/**,
#     crates/trusty-common/** (the shared `embedder-*` feature definitions
#     live here), this workflow file, or scripts/check_ort_runtime_load.sh.
#   - workflow_dispatch (manual re-run from the Actions UI).
#   Deliberately NOT on every push to main — the container build is slow (~5
#   min) and only this crate set can affect the load-dynamic build path.

name: AL2023 load-dynamic build gate

on:
  push:
    branches: [main]
    paths:
      - "crates/trusty-search/**"
      - "crates/trusty-embedderd/**"
      - "crates/trusty-common/**"
      - ".github/workflows/al2023-build.yml"
      - "scripts/check_ort_runtime_load.sh"
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - "crates/trusty-search/**"
      - "crates/trusty-embedderd/**"
      - "crates/trusty-common/**"
      - ".github/workflows/al2023-build.yml"
      - "scripts/check_ort_runtime_load.sh"
  workflow_dispatch:
    # Allow manual trigger from the Actions UI for ad-hoc validation.

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: al2023-build-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

env:
  # Suppress ort/fastembed download progress bars in build output.
  RUST_LOG: "warn"
  CARGO_TERM_COLOR: always
  # Skip Svelte UI build (same as ci.yml — committed ui-dist/ is sufficient).
  SKIP_UI_BUILD: "1"
  # Pin the ORT release used for the system libonnxruntime.so.
  # #8612: `ort` 2.0.0-rc.12 + `api-24` needs ORT >= 1.24. The 1.24.2
  # linux-x64 .so references glibc <= 2.27 — compatible with AL2023 (glibc 2.34).
  # Bump this when the `api-NN` feature on the workspace's `ort` dep moves;
  # the runtime load check below fails if the two disagree.
  ORT_VERSION: "1.24.2"

jobs:
  # --------------------------------------------------------------------------
  # al2023-load-dynamic-search: prove `cargo build -p trusty-search
  # --no-default-features --features load-dynamic` compiles AND links on
  # Amazon Linux 2023 (glibc 2.34) — issue #2222.
  #
  # `cargo build -p trusty-search` builds BOTH `[[bin]]` targets declared in
  # crates/trusty-search/Cargo.toml: the `trusty-search` binary itself and
  # the bundled `trusty-embedderd` binary (src/bin/trusty-embedderd.rs, a
  # thin shim over the `trusty-embedderd` library crate). This job is the
  # only CI coverage that actually links the `trusty-embedderd` binary
  # against a real AL2023 (glibc 2.34) toolchain — see the file-level
  # comment for why that gap mattered (a Cargo feature-unification bug used
  # to leak `embedder-bundled-ort` into this build regardless of the
  # `--features load-dynamic` flag; fixed alongside this job, see
  # crates/trusty-search/Cargo.toml and crates/trusty-embedderd/Cargo.toml).
  #
  # Mirrors release.yml's AL2023 asset build flags for trusty-search
  # (`--no-default-features --features load-dynamic`, no `http-server` in the
  # feature list — trusty-search has a bare `load-dynamic` feature with no
  # separate `http-server` gate).
  # --------------------------------------------------------------------------
  al2023-load-dynamic-search:
    name: AL2023 load-dynamic (glibc 2.34) — trusty-search
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: amazonlinux:2023

    steps:
      # ------------------------------------------------------------------
      # 0. Install tar/gzip BEFORE actions/checkout — amazonlinux:2023 ships
      #    without either, and actions/checkout needs both to unpack.
      # ------------------------------------------------------------------
      - name: Install tar/gzip (required by actions/checkout)
        run: dnf install -y tar gzip

      # ------------------------------------------------------------------
      # 1. Checkout the repo inside the container.
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # 2. Install build prerequisites via dnf. Same set release.yml's
      #    AL2023 asset-build job installs for trusty-search (gcc-c++ covers
      #    usearch's C++ core and the tree-sitter grammars; binutils
      #    supplies `ar`/`strip` for the native link + package step).
      # ------------------------------------------------------------------
      - name: Install build prerequisites (dnf)
        run: |
          dnf install -y --allowerasing \
            gcc \
            gcc-c++ \
            make \
            openssl-devel \
            perl \
            curl \
            tar \
            gzip \
            pkg-config \
            findutils \
            binutils

      # ------------------------------------------------------------------
      # 3. Install Rust 1.94 (workspace MSRV) via rustup inside the container.
      # ------------------------------------------------------------------
      - name: Install Rust 1.94 (MSRV) via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.94
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # 4. Cache cargo registry + build artefacts, under a key prefix scoped
      #    to this job's dependency graph (tree-sitter grammars, usearch, …).
      # ------------------------------------------------------------------
      # Split into restore/save because `actions/cache@v4` has no `save-if`
      # input — the guard `Swatinem/rust-cache` offers natively has to be
      # spelled as an `if:` on a separate save step here.
      #
      # Save only from main: a cache saved on a PR ref is readable by that PR
      # alone but still counts against the repo-wide 10 GB quota, and this repo
      # was over it — see the note on the test-shard cache in ci.yml. This
      # entry is the single largest in the repo at 2.32 GB (22% of quota), and
      # this workflow DOES trigger on pull_request (path-filtered to
      # trusty-search / trusty-embedderd / trusty-common), so every PR touching
      # those crates could mint another 2.32 GB copy that no other PR can read.
      - name: Restore cargo registry and build artefacts
        id: al2023-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: al2023-1.94-search-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            al2023-1.94-search-

      # ------------------------------------------------------------------
      # 5. Download the official ORT linux-x64 tarball at ORT_VERSION and
      #    export ORT_DYLIB_PATH.
      # ------------------------------------------------------------------
      - name: Download ONNX Runtime ${{ env.ORT_VERSION }} (linux-x64)
        run: |
          ORT_DIR="/opt/onnxruntime-${ORT_VERSION}"
          ORT_TARBALL="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ORT_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_TARBALL}"

          echo "Downloading ORT ${ORT_VERSION} from ${ORT_URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${ORT_TARBALL}" "${ORT_URL}"

          mkdir -p "${ORT_DIR}"
          tar -xzf "/tmp/${ORT_TARBALL}" -C "${ORT_DIR}" --strip-components=1
          rm "/tmp/${ORT_TARBALL}"

          DYLIB_PATH=$(find "${ORT_DIR}/lib" -name "libonnxruntime.so.${ORT_VERSION}" | head -1)
          if [ -z "${DYLIB_PATH}" ]; then
            DYLIB_PATH=$(find "${ORT_DIR}/lib" -name "libonnxruntime.so" | head -1)
          fi
          if [ -z "${DYLIB_PATH}" ]; then
            echo "ERROR: libonnxruntime.so not found in ${ORT_DIR}/lib after extraction."
            find "${ORT_DIR}" -name "*.so*" || true
            exit 1
          fi

          echo "ORT_DYLIB_PATH=${DYLIB_PATH}" >> "$GITHUB_ENV"
          echo "Found libonnxruntime.so at: ${DYLIB_PATH}"
          ldd "${DYLIB_PATH}" | head -5 || true

      # ------------------------------------------------------------------
      # 6. Build trusty-search with load-dynamic, no bundled-ort.
      #
      #    `-p trusty-search` builds both `[[bin]]` targets in that crate's
      #    Cargo.toml (`trusty-search` and the bundled `trusty-embedderd`
      #    shim), so a link failure in either binary — or in the
      #    trusty-embedderd LIBRARY crate it depends on — fails this step.
      #    SKIP_UI_BUILD=1 (workflow-level env) skips the Svelte UI build
      #    (committed ui-dist/ is sufficient, same as ci.yml).
      #
      #    NK_TARGET_* (issue #2222 follow-up): trusty-search's mandatory
      #    `usearch` dependency pulls in `numkong` (its SIMD backend) —
      #    unrelated to the bundled-ort/load-dynamic ORT selection above.
      #    numkong's NK_TARGET_SAPPHIREAMX capability probe only checks that
      #    gcc accepts `-mamx-tile -mamx-int8` (AL2023's GCC 11 recognizes
      #    both), but the C source it then unconditionally compiles under
      #    `#if NK_TARGET_SAPPHIREAMX` also uses the `avx512fp16` function
      #    target attribute, which GCC 11 does not support (added in GCC
      #    12) — probe and source are out of sync. Force the
      #    newest-generation targets off via numkong's own build.rs
      #    `NK_TARGET_FOO=0` override mechanism; none of them matter for an
      #    AL2023 CPU-baseline build. Mirrored in release.yml's AL2023 leg
      #    (same crate, same failure) so the CI gate and the shipped release
      #    asset build identically.
      # ------------------------------------------------------------------
      - name: Build trusty-search (load-dynamic, no bundled-ort)
        env:
          NK_TARGET_SAPPHIREAMX: "0"
          NK_TARGET_GRANITEAMX: "0"
          NK_TARGET_DIAMOND: "0"
          NK_TARGET_SIERRA: "0"
        run: |
          echo "ORT_DYLIB_PATH=${ORT_DYLIB_PATH}"
          cargo build -p trusty-search \
            --no-default-features \
            --features load-dynamic

      # The `save-if` half of the split above. `cache-hit` is true only on an
      # exact key match, so a run that restored via `restore-keys` (a stale
      # lockfile prefix) still saves under the current key and the entry keeps
      # up with Cargo.lock.
      - name: Save cargo registry and build artefacts
        if: github.ref == 'refs/heads/main' && steps.al2023-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: al2023-1.94-search-${{ hashFiles('Cargo.lock') }}

      # ------------------------------------------------------------------
      # 7. #8612: runtime load check. The build above only proves the
      #    binary links; `ort` dlopens ORT_DYLIB_PATH at first use and
      #    rejects a runtime older than its `api-NN` floor. Run the bundled
      #    `trusty-embedderd` once over --stdio and require one embedding
      #    back (this also downloads the all-MiniLM-L6-v2 model). A runtime
      #    that fails to load makes `ort` rc.12 hang rather than exit, so the
      #    script bounds the run with `timeout` and reads exit 124 as a load
      #    failure. Placed after the cache save so a runtime failure never
      #    costs the build cache.
      # ------------------------------------------------------------------
      - name: Runtime load check — embed once through trusty-embedderd (#8612)
        env:
          CHECK_TIMEOUT_SECS: "600"
        run: ./scripts/check_ort_runtime_load.sh target/debug/trusty-embedderd

      # #8612: negative control. The same binary with a missing runtime must
      # produce no embedding, so the step above cannot pass without a
      # loadable ORT. 60 s is ample: a load failure hangs within
      # milliseconds of startup and never recovers.
      - name: Runtime load check — negative control, missing ORT_DYLIB_PATH (#8612)
        env:
          ORT_DYLIB_PATH: /nonexistent/libonnxruntime.so
          CHECK_TIMEOUT_SECS: "60"
        run: ./scripts/check_ort_runtime_load.sh target/debug/trusty-embedderd --expect-load-failure
