# vmtest-harness shell gate (issue #16).
#
# No CI covered `vmtest-harness/` at all before this job: `grep -rn vmtest
# .github/workflows/ scripts/` returned nothing, and the harness is 4,400 lines
# of bash implementing an exit-code contract with no mechanical check on it.
#
# What runs, and why each step is here rather than assumed:
#   1. `bash -n` — parse every file. Catches the syntax error a shell only finds
#      when control flow reaches it, which for a harness driven by a VM run can
#      be twenty minutes in.
#   2. `shellcheck -s bash -S error` — pinned to `error` DELIBERATELY. Default
#      severity exits 1 today on four warnings unrelated to any defect this gate
#      exists for (SC2209, SC1090, SC2115, SC2034); fixing or annotating them is
#      a separate change, and a gate that is red on arrival is a gate nobody
#      reads. Raise the severity when that backlog is cleared, not before.
#      NOTE: `-S error` is why the guard in step 4 bans backticks itself —
#      SC2006 is severity `style` and would never fire here.
#   3. `tests/check-no-swallowed-die-selftest.sh` — mutation self-test proving
#      the guard can still go RED for all seven defect classes. Runs FIRST.
#   4. `tests/check-no-swallowed-die.sh` — the static regression guard for #16.
#      Self-deriving: it recomputes which functions can `die` on every run, so a
#      `die` added anywhere is covered with no edit to the check.
#   5. `tests/subshell-classification.sh` — the behavioural artefact for #16.
#      Needs no VM; it sources the driver's `--source-only` hook and drives a
#      stub `die` through all six subshell constructs, then asserts §2's abort
#      contract (a signal exits with ITS code, not the classification).
#
# TWO JOBS, BECAUSE THE TARGET INTERPRETER IS NOT THE CI DEFAULT. `shell-gate`
# runs shellcheck on ubuntu-latest; `bash32-gate` re-runs the tests on macOS
# under /bin/bash 3.2.57, which is what the harness actually targets.
#
# NOT covered here, and it cannot be: `vmtest run local|branch|released`
# provisions a Tart VM on Apple silicon. That is post-merge evidence on a
# maintainer's host, not a PR gate.
name: vmtest-harness

on:
  push:
    branches: [main]
    paths:
      - 'vmtest-harness/**'
      - '.github/workflows/vmtest-harness.yml'
  pull_request:
    # Explicit activity types (#4179). `edited` is NOT in GitHub's default set
    # (opened/synchronize/reopened) and is the event a base-branch RETARGET
    # fires, so without it a stacked PR retargeted onto main never re-triggers
    # and can merge with zero checks — PR #3838 did exactly that.
    # `ready_for_review` covers a draft being marked ready. Matches ci.yml.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
    paths:
      - 'vmtest-harness/**'
      - '.github/workflows/vmtest-harness.yml'

# Per-COMMIT concurrency group on push so a merge never cancels the previous
# merge's verification (#4179); per-ref group on pull_request so a new push
# still supersedes the superseded run. Matches ci.yml.
concurrency:
  group: vmtest-harness-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  shell-gate:
    name: vmtest-harness shell gate (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Parse every harness file (bash -n)
        working-directory: vmtest-harness
        run: |
          for f in vmtest lib/*.sh scenarios/*.sh tests/*.sh; do
              bash -n "$f" || exit 1
          done
          echo "bash -n: OK"

      # `tests/*.sh` is included DELIBERATELY: `bash -n` above already parses
      # them, but a parse is not a lint, and the guard is now the thing standing
      # between the harness and a silent regression.
      - name: shellcheck (severity pinned to error — see header)
        working-directory: vmtest-harness
        run: shellcheck -s bash -S error vmtest lib/*.sh scenarios/*.sh tests/*.sh

      # The selftest runs BEFORE the real gate: a guard that cannot fail makes
      # the real run's green meaningless, and this project has already been
      # bitten by exactly that (the guard shipped blind to backticks). Mirrors
      # line-cap.yml's selftest-then-gate ordering.
      - name: Guard selftest (the guard must be able to go RED)
        working-directory: vmtest-harness
        run: bash tests/check-no-swallowed-die-selftest.sh

      - name: Static guard — no classifying function in a discarded-status context
        working-directory: vmtest-harness
        run: bash tests/check-no-swallowed-die.sh

      - name: Behavioural — die() classification survives every subshell construct
        working-directory: vmtest-harness
        run: bash tests/subshell-classification.sh

  # THE TARGET INTERPRETER IS bash 3.2.57, NOT THE ONE ubuntu-latest SHIPS.
  # Every file in the harness declares that target, and DOC-2 §Shell discipline
  # bans the bash 4+ features (`declare -A`, namerefs, `mapfile`, `${var,,}`,
  # `wait -n`) that a bash 5 gate would happily accept. A green Ubuntu run
  # therefore proves nothing about the shell this harness actually runs under.
  # macOS runners still ship 3.2.57 at /bin/bash, so the real interpreter is
  # available for free — and the version assertion below fails the job rather
  # than silently degrading if that ever stops being true.
  bash32-gate:
    name: vmtest-harness on the target interpreter (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Assert /bin/bash really is 3.2 (else this leg proves nothing)
        run: |
          /bin/bash --version | head -1
          /bin/bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]' \
            || { echo "::error::/bin/bash is no longer 3.x — this leg is not testing the target interpreter"; exit 1; }

      - name: Parse every harness file (/bin/bash -n)
        working-directory: vmtest-harness
        run: |
          for f in vmtest lib/*.sh scenarios/*.sh tests/*.sh; do
              /bin/bash -n "$f" || exit 1
          done
          echo "/bin/bash 3.2 -n: OK"

      - name: Guard selftest under bash 3.2
        working-directory: vmtest-harness
        run: /bin/bash tests/check-no-swallowed-die-selftest.sh

      - name: Static guard under bash 3.2
        working-directory: vmtest-harness
        run: /bin/bash tests/check-no-swallowed-die.sh

      - name: Behavioural test under bash 3.2
        working-directory: vmtest-harness
        run: /bin/bash tests/subshell-classification.sh
