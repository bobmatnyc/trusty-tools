<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trusty Browser</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main>
    <h1>Trusty Browser</h1>
    <div id="stage" aria-hidden="true">
      <div id="robot">
        <img src="icons/trusty-browser.webp" width="424" height="388" alt="">
        <span class="eye left"><span class="iris"></span></span>
        <span class="eye right"><span class="iris"></span></span>
      </div>
    </div>
    <section id="unpaired" hidden>
      <p>Activate Trusty Browser in this profile</p>
      <button id="pair">Activate</button>
    </section>
    <button id="activate" disabled>Activate Extension</button>
    <output id="status" aria-live="polite"></output>
    <section id="transfer" hidden>
      <p id="transfer-route"></p>
      <button id="replace">Confirm replacement</button>
      <button class="secondary" id="cancel">Cancel</button>
    </section>
    <section id="access" hidden aria-label="Agent access">
      <div id="choose">
        <p id="target"></p>
        <button id="mint-tab">Give access to this tab</button>
        <button class="secondary" id="mint-profile">Give access to the whole profile (every tab in this profile)</button>
      </div>
      <div id="shown" hidden>
        <input id="code" readonly aria-label="Activation code" autocomplete="off" spellcheck="false">
        <p><span id="code-scope"></span>, expires in <span id="countdown"></span></p>
        <button id="copy">Copy</button>
        <button class="secondary" id="cancel-code">Cancel code</button>
      </div>
      <div id="expired" hidden>
        <p>Code expired</p>
        <button id="new-code">New code</button>
      </div>
      <ul id="grants" aria-label="Agent grants"></ul>
      <button class="secondary" id="disconnect-all" hidden>Disconnect all</button>
    </section>
    <section id="paired" hidden aria-label="Pairing">
      <details>
        <summary>Pairing details</summary>
        <dl><dt>Chrome profile</dt><dd id="paired-email"></dd></dl>
      </details>
      <button class="secondary" id="unpair">Disconnect this profile</button>
    </section>
    <button class="secondary" id="retry" hidden>Retry</button>
    <details id="details" hidden>
      <summary>Activation details</summary>
      <dl>
        <dt>Chrome profile</dt><dd id="profile"></dd>
        <dt>Site</dt><dd id="site"></dd>
        <dt>Site account</dt><dd id="account"></dd>
        <dt>Workflow</dt><dd id="workflow"></dd>
      </dl>
      <button class="secondary" id="remove">Remove workflow</button>
    </details>
  </main>
  <script src="setup.js"></script>
</body>
</html>
