<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live - Architect Dashboard</title>
<!-- Live view (IL ar-Te8). Served at /live by scripts/dashboard-serve.py; polls GET /api/harness (scripts/dashboard_harness.py) every 3 s.
     Shape = state, size = activity, pulses = new messages (out: dot Architect->PM, in: arrowhead PM->Architect, blocker: big oxblood). ?demo=1 plays synthetic data. Click a mark for text. -->
<script>(function(){try{var t=localStorage.getItem("architect-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Tokens: templates/dashboard/tokens.css (linked first in <head> by dashboard-serve.py). Names used here are the semantic aliases: --sess-* (session state), --task-*, --ctx-*, --msg-*. */
*{box-sizing:border-box}
html{background:var(--surface-0)}
body{margin:0;background:var(--surface-0);color:var(--ink-1);font:var(--fs-base)/1.45 var(--font-body);overflow-x:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--surface-0);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
h1{font:700 var(--fs-xl)/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.tag{font:600 var(--fs-xs) var(--font-mono);line-height:18px;text-transform:uppercase;letter-spacing:var(--track-eyebrow);border:1px dashed var(--ink-2);color:var(--ink-2);border-radius:var(--r-sm);padding:0 var(--sp-2)}
nav{display:flex;gap:4px}
nav button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.sp{flex:1}
.tag.off{border-color:var(--st-stop);border-style:solid;background:color-mix(in srgb,var(--st-stop) var(--st-soft),var(--surface-1))}
.s-active{color:var(--st-info-ink)}.s-wait{color:var(--st-slow-ink)}.s-idle{color:var(--ink-2)}.s-blocked{color:var(--st-stop-ink)}
.shape{width:30px;height:30px;flex:none}
.pulse-ring{fill:none;stroke:currentColor;stroke-width:2}.spin{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:4 4}
.legend{min-width:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:var(--fs-xs) var(--font-mono);color:var(--ink-2);padding:6px 12px;border-top:1px solid var(--line);position:static}
.legend span{display:inline-flex;align-items:center;gap:3px}.legend svg{width:18px;height:18px}
.legend .lt{flex:none;white-space:nowrap;font:inherit;color:var(--ink-1);background:none;border:1px solid var(--line);border-radius:4px;padding:1px 8px;cursor:pointer}
.legend .ld{display:none;font-style:normal}.legend.open .ld{display:inline}.legend.open .ls{display:none}
.legend.open{flex-direction:column;align-items:flex-start;gap:4px}.legend.open span{align-items:flex-start}.legend.open svg{flex:none}
.legend:not(.open){flex-wrap:nowrap;gap:4px 6px;overflow:hidden}.legend:not(.open) span{flex:none;gap:2px}.legend:not(.open) svg{width:14px;height:14px}.legend .ls{font-weight:400;white-space:nowrap}   /* condensed: one row at desktop width; the phone width wraps below */
@media (max-width:700px){.legend:not(.open){flex-wrap:wrap}}
main{flex:1;display:flex;flex-direction:column;min-width:0;padding:0}
#live{position:relative;flex:1;min-height:340px}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}
#scene .node{cursor:pointer;outline:none}
#scene .node>.body{pointer-events:all}   /* the body is fill:none, so without this only its 2.5px stroke took a click: the whole disc is the target (the owner 2026-10-25) */
#scene .node:focus-visible .body{stroke:var(--focus);stroke-width:3}
#scene .lbl{font:600 11px var(--font-mono);fill:var(--ink-2);text-anchor:middle;pointer-events:none}
#scene .node.inact{opacity:.42;filter:grayscale(1) saturate(0)}
#scene .node.inact:hover,#scene .node.inact:focus-visible{opacity:.85}
#scene .lbl.inact{font-size:9px;opacity:.5}
#scene .link{stroke:var(--line);stroke-width:1}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface-1);color:var(--ink-1);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 8px;font:var(--fs-xs) var(--font-mono);max-width:240px;box-shadow:var(--shadow)}
#tip[hidden]{display:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.srcs{font:var(--fs-xs) var(--font-mono);color:var(--ink-2);padding:2px 12px 10px}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19}
#drawer{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface-0);color:var(--ink-1);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
#drawer[hidden],.scrim[hidden]{display:none}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-1)}
.dhead .shape{width:26px;height:26px}.dhead h2{margin:0;font:700 var(--fs-md) var(--font-mono);flex:1;min-width:0;overflow-wrap:anywhere}
.dbody{overflow-y:auto;overflow-x:hidden;padding:10px 12px 30px;display:grid;gap:12px;align-content:start}
.status{font-size:var(--fs-sm)}.chips{display:flex;flex-wrap:wrap;gap:4px 8px;font:var(--fs-xs) var(--font-mono);color:var(--ink-2)}
h3{font:600 var(--fs-xs) var(--font-mono);text-transform:uppercase;letter-spacing:var(--track-eyebrow);color:var(--ink-2);margin:0 0 4px}
.msg{display:grid;grid-template-columns:auto 1fr;gap:0 8px;padding:3px 0;border-bottom:1px dotted var(--line);font-size:var(--fs-xs)}
.msg time{font:var(--fs-xs) var(--font-mono);color:var(--ink-2)}
.msg .k{font:600 var(--fs-xs) var(--font-mono);line-height:18px;text-transform:uppercase;letter-spacing:var(--track-eyebrow);border-radius:var(--r-sm);padding:0 var(--sp-2);margin-right:4px;border:1px solid var(--ink-2);color:var(--ink-1)}
.in .k{border-color:var(--msg-in)}.out .k{border-color:var(--msg-out)}.out .k.blocker{border-color:var(--msg-blocker);font-weight:800}
.msg p{margin:0;overflow-wrap:anywhere}
.alist{display:grid;gap:6px}
.arow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 8px;cursor:pointer}
.arow svg{width:24px;height:24px;flex:none}.arow .ty{font:700 var(--fs-xs) var(--font-mono)}.arow .tk{flex:1;min-width:0;font-size:var(--fs-xs);overflow-wrap:anywhere}.arow .st{font:var(--fs-xs) var(--font-mono);color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:var(--fs-xs)}
/* side panel (ar-Tea): Events and Docs tabs; right column overlay */
#side{position:fixed;z-index:10;top:var(--hh,48px);right:0;bottom:0;width:min(340px,92%);background:var(--surface-0);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
#side[hidden]{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-1)}
.tabs .sclose{order:2;flex:0 0 auto;width:36px;font-size:var(--fs-lg);border-bottom-color:transparent}
.tabs button{flex:1;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 6px;cursor:pointer;font:600 var(--fs-xs) var(--font-mono)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
#fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface-1)}
#fbar[hidden]{display:none}
.fchip{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-pill);padding:1px 4px 1px 10px;cursor:pointer;font:600 var(--fs-xs) var(--font-mono)}
.fchip b{font-size:var(--fs-md);line-height:1;padding:0 4px}
#scene .dg{cursor:pointer}#scene .dg .dgh{fill:transparent;stroke:none;pointer-events:all}#scene .dg:focus-visible{outline:2px solid var(--accent)}
#scene .dg path{fill:var(--surface-1);stroke:var(--accent);stroke-width:1.3;stroke-linejoin:round;pointer-events:none}
#sbody{overflow-y:auto;overflow-x:hidden;flex:1;padding:6px 10px 24px}
.msg .k.arch{border-color:var(--msg-out)}.msg .k.sess{border-color:var(--msg-in)}.msg .who{font:600 var(--fs-xs) var(--font-mono);color:var(--ink-2);display:block}
.dlink{display:block;padding:5px 2px;border-bottom:1px dotted var(--line);font:600 var(--fs-xs) var(--font-mono);overflow-wrap:anywhere;color:var(--accent);text-decoration:none}
a.dlink:hover{text-decoration:underline}span.dlink{color:var(--ink-1)}
.drow{display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--line)}.drow .dlink{flex:1;min-width:0;border-bottom:0}

#viewer{position:fixed;inset:0;z-index:40;background:var(--scrim);padding:10px;display:flex}#vbox{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-0);color:var(--ink-1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}#viewer[hidden]{display:none}
#viewer header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}#viewer header b{flex:1;min-width:0;font:600 var(--fs-sm) var(--font-mono);overflow-wrap:anywhere}
#vbody{flex:1;min-height:0;overflow:auto}#vbody iframe{display:block;width:100%;height:100%;border:0}#vbody pre.dtext{margin:0;padding:12px}
pre.dtext{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere;font:var(--fs-xs)/1.4 var(--font-mono)}pre.dtext .ad{color:var(--st-ok-ink)}pre.dtext .rm{color:var(--st-stop-ink)}pre.dtext .hk{color:var(--ink-2)}
#sopen{position:absolute;top:8px;right:8px;z-index:5}#sopen[hidden]{display:none}
/* ctx pie: used share = darker shade, remainder = lighter shade of the node colour (--c); same formula in both themes */
#scene .pie-used{fill:color-mix(in srgb,var(--c) 60%,var(--mix-dark))}#scene .pie-rest{fill:color-mix(in srgb,var(--c) 50%,var(--mix-light))}
#scene .pie-edge{fill:none;stroke:var(--ink-1);stroke-opacity:.45;stroke-width:1}
#scene .alink{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
/* session pie (the owner 2026-10-29): one slice per open task, radial progress fill in the task's palette colour (--pal-N via --pc) */
#sumcard{position:fixed;z-index:31;left:0;top:0;width:min(300px,calc(100vw - 16px));background:var(--surface-1);color:var(--ink-1);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:8px 10px;font:var(--fs-xs)/1.4 var(--font-mono);box-shadow:var(--shadow-lg);pointer-events:none}
#sumcard.pin{pointer-events:auto}
#sumcard[hidden]{display:none}
#sumcard .sc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#sumcard .sc-name{flex:1;min-width:0;font-size:var(--fs-sm);overflow-wrap:anywhere}
#sumcard .sc-sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px var(--sc-bs,solid) var(--ink-2);display:flex;align-items:center;justify-content:center;font:700 10px var(--font-mono);color:var(--ink-1);background:radial-gradient(circle,color-mix(in srgb,var(--pc) var(--sc-c0),var(--surface-1)),var(--pc))}
#sumcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0}
#sumcard dt{color:var(--ink-2)}#sumcard dd{margin:0;overflow-wrap:anywhere}
#sumcard .sc-bar{display:inline-block;vertical-align:middle;width:70px;height:8px;margin-right:6px;border-radius:4px;border:1px solid var(--ink-2);background:color-mix(in srgb,var(--pc) 16%,var(--surface-1));overflow:hidden}
#sumcard .sc-bar i{display:block;height:100%;background:var(--pc)}
#sumcard .sc-st{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sumcard .sc-open{margin-top:8px;width:100%}
#scene .lane{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:7 6;stroke-opacity:.85;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){#scene .lane{animation:none}}
/* first-load state: covers the scene until the first snapshot is drawn; an error replaces the spinner with a retry (never spins forever) */
#lvload{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface-0);color:var(--ink-2);font:var(--fs-sm) var(--font-body)}
#lvload[hidden],#lvretry[hidden]{display:none}
.lvspin{flex:none;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:lvspin .8s linear infinite}
#lvload.err .lvspin{display:none}#lvload.err{color:var(--st-stop-ink)}
@keyframes lvspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lvspin{animation:none;border-top-color:var(--line)}}
.drow .k{font:600 var(--fs-xs) var(--font-mono);line-height:18px;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:var(--r-sm);padding:0 var(--sp-2);flex:none}
.msg .k.tool{color:var(--ink-2)}.msg .k.stat{border-color:var(--st-slow)}
/* focus mode (the owner 2026-10-24, ar-T07): the selected session takes the centre bubble; the Architect and its active siblings sit in a lower-left cluster; no panel or modal */
#focusbar{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:6px}#focusbar[hidden]{display:none}
#scene .lbl.sib{fill:var(--ink-1)}
#scene .lbl.hit{pointer-events:auto;cursor:pointer}#scene .lbl.hit:hover{text-decoration:underline}   /* cluster rows: the label is part of the click target */
/* inactive cluster spread (tap it): readable grey nodes in rows along the bottom */
#scene.spread .node.inact{opacity:.9}#scene.spread .lbl.inact{font-size:11px;opacity:1}
html.narrow #scene .lbl{font-size:12px}
html.narrow #scene .lbl.inact{font-size:10px}
html.embed header{display:none}html.embed #side{top:0}
@media (min-width:1000px){body.sideopen{padding-right:340px}}
@media (max-width:700px){main{padding:8px 6px 40px}#drawer{top:6vh;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}}
/* Kiosk (the owner 2026-10-30): the map fills the viewport; the scene is panned and zoomed with a CSS transform so the page's own viewBox re-layout never resets the view. */
#live{overflow:hidden}
#scene{transform-origin:0 0}
#scene.pz{touch-action:none;cursor:grab}#scene.pz.drag{cursor:grabbing}
#kexit,#kfit,#kfs,#khint{display:none}
html.kiosk body>header,html.kiosk #legend,html.kiosk #srcs,html.kiosk #sopen,html.kiosk #side,html.kiosk #focusbar{display:none!important}
html.kiosk body{padding:0!important;min-height:0}
html.kiosk main{padding:0}
html.kiosk #live{position:fixed;inset:0;min-height:0!important;height:auto!important;z-index:1}
html.kiosk #kexit,html.kiosk #kfit,html.kiosk #kfs{display:block;position:fixed;z-index:6;top:8px}
html.kiosk #kexit{right:8px;opacity:.55}html.kiosk #kfit{right:96px;opacity:.55}html.kiosk #kfs{right:176px;opacity:.55}html.kiosk #kfs:hover,html.kiosk #kfs:focus-visible{opacity:1}
html.kiosk #kexit:hover,html.kiosk #kexit:focus-visible,html.kiosk #kfit:hover,html.kiosk #kfit:focus-visible{opacity:1}
html.kiosk #khint{display:block;position:fixed;z-index:6;left:10px;bottom:8px;font:var(--fs-xs) var(--font-mono);color:var(--ink-2);opacity:.6;pointer-events:none}
@media (max-width:700px){html.kiosk #khint{display:none}}
</style>
</head>
<body>
<header>
  <h1>Fleet <span class="tag" id="conn">connecting</span></h1>
  <nav aria-label="Views"><a class="ctl navl" aria-current="page" href="/live">Live</a><a class="ctl navl" href="/">State</a></nav>
  <span class="sp"></span>
  <button class="ctl" id="sidebtn" aria-pressed="true" title="Show or hide the events and docs panel">Panel</button>
  <a class="ctl navl" id="kiosk" href="/live/kiosk" target="_blank" rel="noopener" title="Open the full-screen kiosk map in a new tab: wheel or pinch to zoom, drag to pan, click a sphere to zoom to it">Kiosk</a>
  <button class="ctl" id="pause" aria-pressed="false">Pause</button>
</header>
<button class="ctl" id="kfs" type="button" title="Toggle browser full screen (F)">Full screen</button><button class="ctl" id="kfit" type="button" title="Fit all spheres (0)">Fit all</button><button class="ctl" id="kexit" type="button" title="Leave kiosk (Esc)">Exit kiosk</button><div id="khint" aria-hidden="true">wheel/pinch zoom &middot; drag pan &middot; click sphere to centre &middot; 0 fit &middot; Tab next &middot; Esc exit<span id="ktour"></span></div>
<main>
  <div id="live"><button class="ctl" id="sopen" type="button" title="Open the events and docs panel" hidden>Events / Docs</button><div id="focusbar" hidden><button class="ctl" id="fback" type="button" title="Back to the whole fleet (Escape)">&larr; Fleet</button><button class="ctl" id="fdetails" type="button" title="Open this session's details drawer">Details</button></div><div id="lvload" role="status" aria-busy="true"><span class="lvspin" aria-hidden="true"></span><span id="lvmsg">Loading live view…</span><button class="ctl" id="lvretry" type="button" hidden>Retry</button></div><svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Fleet map: the Architect in the centre, project sessions on a fan: most active at 12, least active toward 6"></svg></div>
  <div class="legend" id="legend" aria-label="Legend"></div>
  <div id="srcs" class="srcs" aria-live="polite"></div>
</main>
<div id="tip" hidden role="tooltip"></div>
<div id="sumcard" hidden role="dialog" aria-label="Session task progress"></div>
<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vtitle"><div id="vbox"><header><b id="vtitle"></b><button class="ctl dact" id="vdiff" type="button" aria-pressed="false">Diff</button><button class="ctl" id="vclose" type="button">Close</button></header><div id="vbody" tabindex="0"></div></div></div>
<div class="scrim" id="scrim" hidden></div>
<aside id="side" aria-label="Events and docs">
  <div class="tabs" role="tablist"><button class="sclose" id="sclose" type="button" aria-label="Close panel" title="Close panel">&times;</button><button role="tab" id="tab-ev" aria-selected="true" data-tab="ev">Events</button><button role="tab" id="tab-docs" aria-selected="false" data-tab="docs">Docs <span id="ndocs"></span></button></div>
  <div id="fbar" hidden></div>
  <div id="sbody" role="tabpanel" tabindex="0"></div>
</aside>
<aside id="drawer" role="dialog" aria-modal="false" aria-labelledby="dt" hidden></aside>
<script>
"use strict";
/* Live view. Data: GET /api/harness every POLL_MS (scripts/dashboard_harness.py). ?demo=1 feeds a synthetic snapshot instead.
   Model objects (HARNESSES, their agents, PMS) persist across polls so nodes ease instead of jumping. */
const POLL_MS = 3000, WIN_S = 600;   /* activity window for sizing: messages in the last 10 min */
const TOUR_HOLD_MS = [10000, 15000], TOUR_ARCH_MS = 5000, TOUR_SETTLE_MS = 700, TOUR_START_MS = 3000, TOUR_IDLE_MS = 60000;   /* kiosk auto-tour (the owner 2026-10-30): dwell on a session (random in range), dwell back on the Architect, pane open delay after the pan, first step, idle before it resumes after input */
const DEMO = new URLSearchParams(location.search).get("demo") === "1";
let FOCUS_Q = new URLSearchParams(location.search).get("focus");
const HARNESSES = [];
const GOALS = {};   /* id -> title, learned from the snapshot */
const ARCH = "tm-architect";   /* the session name docs and events carry for the Architect */

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = (s) => Math.floor(s / 60) + "m " + String(Math.floor(s % 60)).padStart(2, "0") + "s";
const kt = (n) => ((n || 0) / 1000).toFixed(1) + "k";
let skew = 0;   /* server epoch minus client epoch (seconds), so message ages use the server clock */
const nowS = () => Date.now() / 1000 + skew;
const clock = (epoch) => new Date(epoch * 1000).toISOString().slice(11, 16) + "Z";
const agoTxt = (epoch) => { const a = Math.max(0, Math.round(nowS() - epoch)); return a < 90 ? a + " s ago" : Math.round(a / 60) + " min ago"; };
const findH = (n) => HARNESSES.find((h) => h.name === n);
const findA = (id) => { for (const h of HARNESSES) { const a = h.agents.find((x) => x.id === id); if (a) return a; } return null; };

/* BEGIN liveProgress: verbatim copies of the State page's functions (templates/dashboard/index.html); scripts/test_dashboard_live_progress.py fails when they drift */
const ETA_STALE_MS = 24 * 3600 * 1000;
function txt(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  try { return JSON.stringify(v); } catch (_) { return ""; }
}
function clampPct(v) { if (v == null || v === "") return null; const n = Number(v); return isFinite(n) ? Math.max(0, Math.min(100, n)) : null; }
function taskProgress(it, map) {
  const steps = Array.isArray(it.steps) ? it.steps.filter((x) => x && typeof x === "object") : [];
  if (steps.length) {
