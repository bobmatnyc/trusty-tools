[package]
name = "trusty-audit"
version = "0.1.0"
description = "Auditor client — installs its pinned audit tooling and drives an audit engagement on the recipient's own codebases."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["audit", "due-diligence", "installer", "cli"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# #5502: not published to crates.io. The delivery path for this crate is the
# handoff zip of pre-compiled macOS arm64 binaries (#5483), not `cargo install`
# by the recipient. Flip this to a real publish only if that changes.
publish = false

[lib]
name = "trusty_audit"
path = "src/lib.rs"

# #5502: PLACEHOLDER binary name — the final name is an open question the owner
# has not settled (this repo's binaries are short: `tm`, `tga`, `tctl`,
# `tcode`; `trusty-audit` is long to type, but the recipient is an outsider who
# types it once from a README). Whichever name wins, CLAUDE.md's
# "Abbreviations & Aliases" table gains a row, because `-p <crate>` takes the
# Cargo `name` field (`trusty-audit`), not the binary name.
[[bin]]
name = "taudit"
path = "src/main.rs"

[dependencies]
# Binary/CLI error handling (CLAUDE.md: anyhow for binaries, thiserror for libs).
anyhow = { workspace = true }
# Argument parsing. The parser lives in the LIBRARY (`cli.rs`) so every CLI
# invocation is unit-testable without spawning the binary.
clap = { workspace = true }
# Reading the companion engagement config and tga's `manifest.toml`.
serde = { workspace = true }
toml = { workspace = true }
# Library error type.
thiserror = { workspace = true }

[dev-dependencies]
# Real directories for the working-directory creation tests.
tempfile = { workspace = true }
