[package]
name = "trusty-audit"
# 0.13.0 (#6669): MINOR bump — `trusty_audit::rerender::rerender` now takes 9
# parameters instead of 8 (threading the new `ReportSettings.template` /
# `.code_only` fields through). `cargo-semver-checks` reports this as
# `function_parameter_count_changed` against the 0.12.0 baseline; for a 0.y.z
# crate the breaking bump is the MINOR position.
# 0.13.0 -> 0.13.1 (#6695, 2026-09-02 cut): PATCH. #6701 merged `src/**` after
# the 0.13.0 changelog section was assembled and left its fragment unfolded, so
# the cut ships as 0.13.1 with that fragment folded in. This bump also carries
# the `[tools]` pin refresh in templates/engagement.template.toml onto the
# versions this cut publishes. No public API change.
# 0.13.3 -> 0.14.0 (milestone 71, #6783): MINOR. 0.13.3 is already on crates.io,
# and this PR is the first of the milestone to change `src/**`, so it carries the
# bump for the set. MINOR rather than PATCH because the siblings landing under
# the same version add public fields — `index_report::IndexEntry` alone gains
# `search_evidence` here, which `cargo-semver-checks` reports as
# `struct_missing_field` against 0.13.3; for a 0.y.z crate the breaking bump is
# the MINOR position.
version = "0.14.0"
description = "Auditor client — installs its pinned audit tooling and drives an audit engagement on the recipient's own codebases."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["audit", "due-diligence", "installer", "cli"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "trusty_audit"
path = "src/lib.rs"

# #5502: the binary ships under BOTH names, the `trusty-installer` / `tctl`
# precedent. `trusty-audit` is what the docs and the handoff README say — the
# recipient is an outsider who types it once from a page in front of them.
# `taudit` is the short form for repeat use. Two targets, ONE `src/main.rs`:
# there is a single implementation and no second code path to drift. Cargo
# compiles that file once per target, so the binary is built twice.
# `-p <crate>` still takes the Cargo `name` field (`trusty-audit`).
[[bin]]
name = "trusty-audit"
path = "src/main.rs"

[[bin]]
name = "taudit"
path = "src/main.rs"

[dependencies]
# Binary/CLI error handling (CLAUDE.md: anyhow for binaries, thiserror for libs).
anyhow = { workspace = true }
# #6080: the run index states when the run finished, in the reader's own local
# time with its UTC offset. `chrono::Local` is the workspace's one answer for
# that (`trusty-common` reaches for it for the same reason), and `std::time`
# offers no calendar or timezone at all.
chrono = { workspace = true }
# #5825: expanding the `~` in the inbound package's default output directory
# (`~/duetto/audit`) without shelling out. The workspace's existing home-dir
# resolver — `trusty-common` reaches for the same crate in six places — so this
# is the shared answer rather than a second one.
dirs = { workspace = true }
# Argument parsing. The parser lives in the LIBRARY (`cli.rs`) so every CLI
# invocation is unit-testable without spawning the binary.
clap = { workspace = true }
# POSIX job control and terminal-queue calls the prompt path needs, none of
# which `std` exposes. `tcgetpgrp`/`getpgrp` refuse a terminal this process is
# in a BACKGROUND group of — reading one raises SIGTTIN and stops the job with
# no diagnostic — and `tcflush(TCIFLUSH)` discards typeahead before the question
# that commits to an hours-long sweep (both #5896 review). `rpassword` still
# owns every echo-suppression call, so this crate spells no `termios` of its
# own. Also `setsid(2)` in `tests/guided_launch.rs`, which needs a child with no
# controlling terminal at all.
libc = { workspace = true }
# Reading the companion engagement config and tga's `manifest.toml`.
serde = { workspace = true }
toml = { workspace = true }
# #6081: adding `inspect_priority` to a manifest `tga` wrote and `trusty-review`
# reads. A `toml::Value` round trip would rewrite every key of a document two
# other crates own — reordering it and dropping its comments — to add one; a
# format-preserving edit is the smaller claim.
toml_edit = { workspace = true }
# #5555: `tga audit` takes its repository set from a YAML config, so driving it
# at one repository means generating one. `serde_yaml` is the workspace-wide
# standard for YAML (see the root Cargo.toml note).
serde_yaml = { workspace = true }
# Library error type.
thiserror = { workspace = true }
# #5868: first-run credential entry with echo disabled. Already the workspace's
# hidden-input answer (`trusty-common`'s `config keys set` reaches for it), so
# this is the shared choice rather than a second one, and it is why this crate
# spells no `termios` call of its own. Its unix defaults are what the feature
# needs: it reads AND prompts on `/dev/tty` rather than stdin — which under
# `curl … | sh` is the pipe carrying the script — and it restores the terminal's
# previous state when it drops.
rpassword = { workspace = true }
# #5495: the pinned, fail-closed download entry point. Downloading, verifying
# and placing binaries is this crate's domain, not ours — CLAUDE.md's
# common-entry-point rule makes a second implementation here a defect. It also
# supplies the HTTP client (`download::http_client`), which is why `reqwest` is
# deliberately absent from this manifest.
trusty-installer = { workspace = true }
# #5487: the workspace's single `gh` entry point (#5475). Discovery shells out
# to `gh repo list`, and CLAUDE.md's common-entry-point rule makes a second
# `Command::new("gh")` here a defect — so this crate never spells one.
# #5822: `credentials` adds `scrub_secrets`, the workspace's one redaction entry
# point, used where a board provider's own error text reaches an operator.
# #5915: `crate-config` for `crate_config_dir_at` — the workspace's one owner of
# the `~/.trusty-tools/<crate>` layout, which `workdir.rs` now defaults into.
trusty-common = { workspace = true, features = ["gh-cli", "credentials", "crate-config"] }
# #5822: board validation issues HTTP requests, so it needs `reqwest`'s types —
# the RequestBuilder, and the error it classifies without quoting the URL. The
# CLIENT still comes from `trusty_installer::download::http_client`, which stays
# this crate's one client constructor under the common-entry-point rule.
reqwest = { workspace = true }
# Deserializing `gh --json` payloads. `GhCommand::json` hands back a typed value
# via serde; the derive lives on this crate's own `DiscoveredRepo`.
serde_json = { workspace = true }
# Async runtime for the binary. `Session::execute` is async because installing
# the pinned tools downloads; the Tauri shell will drive the same future.
tokio = { workspace = true }
# #5823: the workspace's single progress renderer (#1315), and the wire format
# the `tga audit` child relays its stage events through. Reaching for
# `indicatif` here instead would be a second implementation of a shared
# capability, which CLAUDE.md's common-entry-point rule makes a defect.
trusty-progress = { workspace = true }
# #5499: the return package is one zip file, because the return channel is
# manual (#5642) and a directory cannot be attached to an email.
zip = { workspace = true }
# #5980: a non-reversible, truncated fingerprint of the `gh`-derived
# credential a sweep resolved, persisted in the checkpoint so packaging (which
# can run as a separate process, possibly under a different `gh` account) can
# prove it is scanning outbound files with the credential that produced them
# rather than a freshly re-resolved one that never touched those files.
sha2 = { workspace = true }
# #5499: walking each audited repository's output directory. Not followed
# through symlinks — `package::collect_dir` refuses one rather than reading a
# file from outside the working directory into a package that leaves the
# recipient's network.
walkdir = { workspace = true }
# #6077: `gitleaks` writes its findings to a file, and that file holds the
# matched credentials UNREDACTED. A hand-rolled path under `std::env::temp_dir()`
# lands 0644 on a world-readable /tmp for as long as the scan runs, so the
# report goes inside a `TempDir` instead — 0700 on Unix, and removed by its own
# drop on every return path. Promoted from dev-dependencies for this; the tests
# that already used it cost no extra compilation.
tempfile = { workspace = true }

[dev-dependencies]
# #5824: `tests/cli_end_to_end.rs` opens the return package the chain wrote and
# reads its generated members, because what the recipient receives is the zip
# rather than the console output that produced it. Already a dependency above,
# so this costs no extra compilation.
zip = { workspace = true }
