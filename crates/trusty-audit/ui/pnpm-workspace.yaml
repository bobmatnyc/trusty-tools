# Standalone package, not a multi-package monorepo. `packages: []` is required
# as of pnpm >=9.15 (github.com/pnpm/pnpm#9361) whenever a pnpm-workspace.yaml
# exists at all — without it `pnpm install` fails with "packages field missing
# or empty". Same file, same reason, as crates/trusty-agents/ui.
packages: []
allowBuilds:
  esbuild: true
