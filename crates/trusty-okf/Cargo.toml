[package]
name = "trusty-okf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Builds and maintains OKF (Open Knowledge Format) bundles: format, profiles, bundle operations, build pipeline and import."
# #10746: not published, per SPEC-OKF-01 §3 (h) A. The OKF schema is still
# moving; trusty-kb, which this crate replaces, is `publish = false` too.
publish = false

# #10746: no `[[bin]]` and no `src/main.rs`. The crate has no MCP surface and no
# stdio server (SPEC-OKF-01 §2.7.1 B7); scripts/check_okf_boundary.sh enforces it.

[features]
# Both features are off by default. The core is network-free (B8) and never
# links an extraction backend (B9). Neither feature pulls a dependency yet; the
# slices that fill `feed`/`retrieve` (S7) and `extract::worker` (S10) add them.
default = []
# Push loop to trusty-search and `search.query` retrieval (SPEC-OKF-01 §5).
search-feed = []
# Client for the out-of-process extraction worker (SPEC-OKF-01 §2.16, App. B).
extract-worker = []

[dependencies]
# #10746 S2: the format and profile modules moved from trusty-kb. None of these
# is an async runtime, socket client, credential or extraction crate (B6-B9).
# `v0.2` instants (`generated.at`, `verified[].at`, `stale_after`).
chrono = { workspace = true }
# `Finding` serialises; trusty-kb's `kb_validate` returns it as JSON.
serde = { workspace = true }
# #10746 S3: one JSON line per verification-record event under `_sources/`
# (SPEC-OKF-01 §2.10, 3d C).
serde_json = { workspace = true }
# Frontmatter parse and render; workspace-standard 0.9 line.
serde_yaml = { workspace = true }
# #10746 S3: the §2.10 content hash and the stale-write check (A1).
sha2 = { workspace = true }
# `OkfError` (SPEC-OKF-01 §4.4).
thiserror = { workspace = true }
# #10746 S3: NFC form of the §2.11 fold key (fold_collision).
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
