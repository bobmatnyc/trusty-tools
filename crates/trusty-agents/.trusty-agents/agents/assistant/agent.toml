# Base `assistant` agent (#3054, epic #3052).
#
# This is the reusable, UN-personalized productivity assistant template. It
# carries a functional role, the curated Google Workspace tool surface, and
# generic helpful/productivity instructions (in persona.md) — with NO
# user-identity binding and no user-specific skills.
#
# #3738 (owner decision 2026-07-23): this base is ALSO the concrete GENERIC
# "Assistant" persona — the DEFAULT starting agent for a fresh session. It
# therefore now carries a professional, un-personalized display identity
# (`display_name = "Assistant"`), REVERSING the prior "bases are nameless"
# decision (2026-07-18). It remains the `extends` base for the named personas
# (`../izzie/`, `../cto-assistant/`); each of those overrides `display_name`
# via child-Some-wins per-key merge (`agents::extends::merge_extends`), so the
# generic "Assistant" identity is only ever seen when the base is used
# directly as the default. A user's own `extends = "assistant"` overlay may
# still supply its own name (Eve §2.5.1) — see `../izzie/` for the reference.
#
# NOTE: the `extends`-based overlay resolver landed in #3055/#3106
# (`crate::agents::extends`) — a personalization overlay's `[tools].allow`
# list is UNIONED with this base's at load time, base-first, deduped. This
# base is also fully self-contained and loads standalone.

[agent]
name = "assistant"
role = "assistant"
# #3819 (Bob directive): hidden from GUI/REPL picker listings — the base
# template is only ever instantiated via Concierge or the add-agent
# template flow, never picked directly. Dispatch/tools/role UNCHANGED —
# see AgentInfo::hidden's doc comment.
hidden = true
# #3358: no `runner` — falls back to the default (Subprocess), routing off
# the claude-code CLI onto the direct-API credential path (AnthropicDirect
# when ANTHROPIC_API_KEY is set, else OpenRouter). See `pick_credentials()`
# in `src/llm/credentials.rs`. This is the base "Assistant" agent
# (BASE_AGENT_ID in ui/src/lib/roster.ts) — default is Sonnet for latency
# (owner directive 2026-07-23: trivial turns measured ~2.1s on Opus via
# OpenRouter; Sonnet trades a small quality margin for materially lower
# per-turn latency on the default persona).
model = "claude-sonnet-4-6"
description = "General-purpose productivity assistant (base template; personalize via `extends`)"
# #3738: the generic default persona's professional display identity. Named
# personas (izzie, cto-assistant) override these via `extends`; a user overlay
# may override them too. Kept intentionally plain — no personal name.
display_name = "Assistant"
prompt_label = "assistant"

[llm]
# Conversational productivity assistant — warm, short replies by default.
temperature = 0.7
max_tokens = 1024
use_anthropic_direct = false
# Conversational mode: block markdown headers and divider rules from appearing
# mid-response so replies stay in plain prose.
stop_sequences = ["\n##", "\n* * *"]
# Note: "\n---\n" intentionally excluded — some models use HR dividers naturally
# in conversational output; including it caused mid-sentence truncation.

[tools]
# Curated productivity tool surface. Every entry here is generic — a capability
# any user of the assistant benefits from — so it belongs on the base. Personal,
# user-specific tools (if any) are added by the overlay, not here.
#
# BLACK-BOX POSTURE (PR A, epic #3052): the assistant tier must never leak
# internal trusty-* system/daemon names to the user. `session_list`,
# `session_status`, `project_list`, `console_metrics` (trusty-mpm proxied
# tools), `system_status` (enumerates daemon names incl. "trusty-mpm"), and
# `mcp_list`/`mcp_enable`/`mcp_disable` (enumerate MCP service names) are
# DELIBERATELY EXCLUDED here — do not re-add them to an assistant-tier
# allowlist. They remain reachable to pm/ctrl/research/observe roles via
# their own scoping. A follow-up PR adds a black-boxed "talk to my team"
# escalation path instead of exposing these directly.
allow = [
  # delegation (PR A, epic #3052): lets the assistant bring in a specialist
  # (engineer/QA/research) or consult a peer assistant instance, natively
  # in-process (tagent -> tagent), without exposing internal mechanics to
  # the user. See `delegate_to_agent` (`src/tools/delegate.rs`).
  "delegate_to_agent",
  # git
  "git_log", "git_status",
  # OKG builder (epic #3052): grow this assistant's own knowledge graph from
  # real sources — a directory of documents, a Gmail query window, a Drive
  # folder — idempotently and additively. Generic capability (every user
  # benefits from an assistant that can build its own KB), so it belongs on the
  # base rather than a personalization overlay.
  #
  # TWO SEPARATE BOUNDARIES apply, and both matter:
  #   WRITE — every entity lands under the assistant's OWN tree inside the
  #     knowledge directory; a model-supplied `root` outside it is rejected.
  #   READ  — `okg_ingest_docstore` reads a model-supplied filesystem path, so
  #     it is confined to an operator-controlled allow-list: `[okg]
  #     docstore_roots` in ~/.trusty-agents/config.toml, defaulting to $HOME
  #     with every hidden path below a root excluded (so ~/.ssh, ~/.aws,
  #     ~/.gnupg are refused without being enumerated). Widen it deliberately —
  #     anything reachable becomes searchable and quotable in chat, and
  #     ingested content is itself untrusted input.
  # #3987: the Google-backed ingest tools reuse the credentials the
  # gworkspace surface below already holds — which are WRITE-CAPABLE Google
  # OAuth grants, not read-only ones (the "read-only `google.read`" this
  # comment used to claim never existed; see the `[tools].scopes` note
  # below). These three are in-process tools that return `None` from
  # `ToolExecutor::scope()`, so they are not scope-gated at all; they read
  # Gmail/Drive through the same credential the scoped tools use.
  "okg_ingest_docstore",
  "okg_ingest_gmail",
  "okg_ingest_drive",
  "okg_sources",
  # meeting notes
  "granola_*",
  # web search
  "web_search",
  # gworkspace — Gmail
  "compose_email",
  "download_gmail_attachment",
  "format_email_content",
  "get_gmail_message_content",
  "list_message_attachments",
  "manage_gmail_filters",
  "manage_gmail_labels",
  "manage_gmail_settings",
  "modify_gmail_messages",
  "search_gmail_messages",
  # gworkspace — Calendar
  "manage_calendars",
  "manage_events",
  "query_free_busy",
  # gworkspace — Drive
  "get_drive_file_content",
  "list_drive_contents",
  "list_shared_drives",
  "manage_drive_file",
  "manage_file_permissions",
  "search_drive_files",
  "sync_drive",
  # gworkspace — Docs
  "append_to_document",
  "apply_table_style",
  "convert_document",
  "create_document",
  "create_document_from_template",
  "create_document_tab",
  "create_list_in_document",
  "delete_range_in_document",
  "find_tables_in_document",
  "format_document_range",
  "format_paragraph_in_document",
  "get_document",
  "get_document_named_styles",
  "get_document_structure",
  "insert_image_in_document",
  "insert_table_in_document",
  "insert_text_in_document",
  "manage_document_comments",
  "manage_document_header_footer",
  "manage_document_tabs",
  "manage_table_structure",
  "move_paragraph_in_document",
  "publish_markdown_to_doc",
  "render_mermaid_to_doc",
  "replace_text_in_document",
  "set_document_style",
  "update_document_named_styles",
  # gworkspace — Sheets
  "format_sheet",
  "get_spreadsheet",
  "manage_spreadsheet",
  "modify_sheet_values",
  "set_table_column_widths",
  # gworkspace — Slides
  "add_slide_content",
  "format_slide",
  "get_slides",
  "manage_slides",
  # gworkspace — Tasks
  "manage_task_lists",
  "manage_tasks",
  # gworkspace — misc
  "create_chart",
  "list_accounts",
]
# OpenRPC (https://spec.open-rpc.org/) over stdio scopes (#455, #454). The base
# assistant remembers facts across sessions (memory.write), recalls them
# (memory.read), and reads notes/snippets via search (search.read).
#
# #3987 (option B, Bob's explicit decision — see the issue's PM-recommendation
# comment): the Google grants below REPLACE the former `google.read`.
#
# WHAT `google.read` ACTUALLY DID: nothing. It was a dead pattern. Discovery
# maps every `x-google-scopes` OAuth URL to `google.<family>.<access>`
# (`tools::registry::google_scope::FAMILY_TABLE`), so the vocabulary contains
# `google.gmail.write`, `google.calendar.write`, … and never a bare
# `google.read`; `ScopePattern::matches` takes the no-wildcard branch for it
# and requires string equality. Every one of the ~60 gworkspace tools
# allowlisted above was therefore scope-denied at dispatch on the persona-chat
# path, and had been since the scopes line was written. There was no
# read-only enforcement to preserve here — the posture was fictional, which is
# why replacing it is a correction of the config to match reality and not a
# widening of a boundary that was holding.
#
# HONEST POSTURE STATEMENT (replacing the old §5.5 read-only claim): a base
# assistant granted the tools above holds WRITE-CAPABLE Google credentials.
# Every OAuth scope `trusty-gworkspace` requests is the full-access variant of
# its API, never a `.readonly` one (`trusty-gworkspace/src/openrpc.rs::scopes`),
# so the same `gmail.modify` token a "search" tool uses can also delete mail.
# A genuinely read-only tier is #3987's option A and is DEFERRED: it needs
# `.readonly` OAuth variants, user re-consent, and either middle-wildcard
# support in `ScopePattern` or a scope-naming redesign. If option A is built,
# these grants shrink naturally.
#
# INJECTION SURFACE — the risk this posture creates, named rather than left
# implicit: this same persona ingests attacker-controllable text in the SAME
# turn that holds send/share credentials (`okg_ingest_gmail`,
# `okg_ingest_drive`, `get_gmail_message_content`, `web_search` above all pull
# in an inbound mail body, a shared Drive doc, or a web page). The
# exfiltration-capable subset of the allowlist is `compose_email`,
# `manage_file_permissions`, `manage_gmail_settings`, `manage_gmail_filters`
# and `modify_gmail_messages` — the allow-list bounds WHICH tools exist, not
# what an injected model chooses to do with them. A confirmation gate for
# exactly those five is tracked in #4054 (it needs either #3074/#3075's
# `user_authority` field or an interim read site for
# `[[permissions.grants]] mode = "ask"`, neither of which exists yet).
#
# THE ALLOW-LIST REMAINS THE BINDING CONSTRAINT. `filter_persona_tool_names`
# intersects `[tools].allow` (by NAME) AND `[tools].scopes` (by CAPABILITY) —
# verified in #3985 — so these family grants do not expose a single tool the
# curated allowlist above does not already name. Widening the reachable
# surface means editing `allow`, not this line.
#
# ONE FAMILY PER SURFACE THE ALLOW-LIST ACTUALLY NAMES. No family is granted
# speculatively: every one below has at least one allowlisted tool, and no
# allowlisted scoped gworkspace tool lacks a family. That correspondence is
# ENFORCED, in both directions, by
# `base_assistant_scope_grants_cover_every_allowlisted_gworkspace_tool`
# (`src/ctrl/pm_task/dispatch/persona_tests.rs`), which derives every tool's
# dotted scope from the real `rpc.discover` document. Read the test, not a
# comment, for the per-family tool counts — an enumeration here would drift
# out of date the first time the allowlist changed, and a stale audit is
# worse than none.
#
# Personalization overlays are UNIONED with this list (`extends::merge_extends`
# -> `union_opt_vec`, deduped), so `../cto-assistant/`'s narrow
# `google.gmail.*` / `google.tasks.*` (#3985) now collapse into these as exact
# duplicates, and `../izzie/`'s blanket `google.*` remains a superset. Both are
# deliberately left declared: an overlay whose whole purpose is Gmail should
# say so itself rather than depend on the base keeping a grant forever.
scopes = [
  "memory.read",
  "memory.write",
  "search.read",
  "google.gmail.*",
  "google.calendar.*",
  "google.drive.*",
  "google.docs.*",
  "google.sheets.*",
  "google.slides.*",
  "google.tasks.*",
  "google.accounts.*",
]

[system_prompt]
# Generic productivity skills only — resolved by name from the skill registry.
# User-specific skills (weather for a home city, a personal transit line, a
# particular writing voice) belong on the personalization overlay, NOT here.
# #482: the system prompt body lives in persona.md (MD-package format).
skills = [
    "gworkspace-gmail",
    "gworkspace-calendar",
    "gworkspace-drive",
    "trusty-memory-openrpc",
]
