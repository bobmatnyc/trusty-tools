# CTO Assistant — personalization overlay over the base `assistant` agent
# (PR A, epic #3052). Converted from a hand-forked full copy to `extends =
# "assistant"` so it inherits the base's curated gworkspace tool surface,
# black-box tool posture (no session_list/system_status/mcp_list/... leaks —
# see `../assistant/agent.toml`), and delegation grant (`delegate_to_agent`),
# leaving only Masa/Duetto-specific personalization here: identity, the CTO
# ops DB + ticketing + extra git/task tools, and the Duetto org/APEX/voice
# skills. `[tools].allow` and `system_prompt.skills` below are UNIONED with
# the base's at load time (base-first, deduped) via
# `crate::agents::extends::merge_extends` — do not re-list tools/skills
# already granted by the base.
#
# `[llm]` below declares ONLY `temperature`/`max_tokens` (the tuned deltas)
# — these two fields use PER-KEY extends inheritance (`merge_extends`,
# `crates/trusty-agents/src/agents/extends/mod.rs`): a declared value
# overrides the base's, an omitted one inherits it. Every OTHER `[llm]`
# field (`use_anthropic_direct`, `stop_sequences`, ...) is intentionally
# NOT re-declared here — it's inherited from the base wholesale regardless
# (unchanged pre-existing behavior), and the base's values already match
# what this agent previously declared for those fields, so nothing is lost.

[agent]
name = "cto-assistant"
role = "assistant"
extends = "assistant"
# #3358: no `runner` — falls back to the default (Subprocess), routing off
# the claude-code CLI onto the direct-API credential path (AnthropicDirect
# when ANTHROPIC_API_KEY is set, else OpenRouter). See `pick_credentials()`
# in `src/llm/credentials.rs`.
model = "claude-sonnet-4-6"
description = "CTO Assistant — private assistant for Robert Matsuoka (CTO, Duetto)"
# #3738 (owner decision 2026-07-23): user-facing display name is "CTO Bot"
# (was "CTO Assistant"). Selectable named persona, never the default.
display_name = "CTO Assistant"
prompt_label = "cto"

[llm]
# #295: lower temperature than the base's 0.7 — factual precision for org
# data / Duetto-specific answers over conversational warmth.
temperature = 0.3
# #469: Bumped from the base's 1024 to 4096 to leave room for GFA reports and
# structured org data tables which were getting truncated.
max_tokens = 4096
# OKG STORE BINDING (#3816/#3864, DOC-54 SPEC-AGENTS-04 §5.1) — the FIRST leg
# of the stores/tools/listeners config triple: what this agent KNOWS, as
# opposed to how it ACTS (`[tools].allow`) or REACTS (`[[listeners]]`).
#
# Exactly ONE store per agent (Bob, 2026-07-24). `index` is a trusty-search
# index id (over /Users/masa/trusty-mpm-projects/bob-duetto/cto), `palace` a
# trusty-memory palace; the harness resolves both against the live daemons at
# boot and reports each as connected / not-connected with a reason
# (`crate::stores::status`) — a missing index degrades the store, it never
# blocks the agent from booting. `index` is also the DEFAULT target for an
# unqualified `vector_search(query)` call, which is the #3864 fix: this
# persona's `[tools].allow` grants `vector_search`, and before the binding
# existed that call silently searched a hardcoded local code index instead of
# the CTO corpus.
[[stores]]
name = "cto-assistant-kb"
tree = "okg://cto-assistant"
index = "cto-assistant"
palace = "cto"


[tools]
# CTO-specific DELTAS only — the base `assistant` already grants granola_*,
# web_search, delegate_to_agent, and the full
# gworkspace Gmail/Calendar/Drive/Docs/Sheets/Slides/Tasks surface (unioned
# in automatically). BLACK-BOX POSTURE (PR A): session_list, session_status,
# session_send, project_list, agent_delegate (trusty-mpm proxied tools),
# console_metrics, system_status, and mcp_list/mcp_enable/mcp_disable are
# DELIBERATELY EXCLUDED — do not re-add them here (see
# `../assistant/agent.toml` for the rationale).
allow = [
    # DELIBERATE CARVE-OUT (owner, 2026-07-30): all four git tools, declared
    # HERE rather than inherited. The base `assistant` dropped
    # `git_log`/`git_status` in the same change because they reached every
    # overlay — including `izzie`, who ingests untrusted Gmail/Drive content
    # and must not sit one hop from a cross-project read primitive. The CTO
    # assistant is a CODING assistant, not a mail-ingesting one, so the owner
    # chose to keep its git surface intact rather than accept a silent
    # capability regression. Re-declaring here is what makes that choice
    # explicit and reviewable instead of a side effect of the base edit.
    # #255: branch listing + commit search, alongside the two the base no
    # longer supplies.
    "git_log", "git_status",
    "git_branches", "git_search_commits",
    # ADR-0024 decision 4 (owner, 2026-07-29): the four direct ticket-tool
    # grants (`ticket_search`, `list_tickets`, `get_ticket`, `create_ticket`)
    # were REMOVED here. Ticketing is reachable as a SUB-AGENT only, never as a
    # direct tool or skill on an assistant — see `[subagents].delegate_allowed`
    # below, which names `ticketing-agent`. The tools themselves still exist and
    # are still granted to `ticketing-agent.toml`, which is the agent that owns
    # the domain.
    # #469: memory_recall (project decisions from trusty-memory) and
    # vector_search (semantic code/doc search).
    "memory_recall",
    "vector_search",
    # #472/#3656/#3700/#3732: CTO ops DB query tools — read-only SQLite over
    # ~/Duetto/cto/data/cto.db (a fixture DB ships until the real file is
    # reachable — see the skill's README). Backed by the "cto-db" Python
    # skill (`.trusty-agents/skills/cto-db/`), NOT hardcoded Rust: business
    # logic lives in the skill's `python/` package, discovered and registered
    # generically at startup by `crate::tools::python_skill` (persona-gated
    # via the `AgentPlugin`/`install_plugins` mechanism in
    # `crate::tools::agent_plugin`, matched to this persona by name — the
    # same gate `crates/cto-assistant` used before its wiring was severed by
    # PR #3310, now reused by the skill bridge instead of by that unwired
    # Rust crate).
    "query_headcount",
    "query_budget",
    "query_risks",
    "query_work_classification",
    # #472/#485: Google Tasks (distinct tool names from the base's
    # manage_task_lists/manage_tasks) — list/complete/create.
    "list_tasks",
    "complete_task",
    "create_task",
    # #473: create_draft — draft-only Gmail reply tool, not on the base
    # (search_gmail_messages/get_gmail_message_content/modify_gmail_messages
    # are already granted by the base's Gmail surface).
    "create_draft",
]
# #3938: OpenRPC scopes (#3208) for the Gmail/Tasks surface above. These are
# NOT a delta the base can supply and they are NOT redundant with `allow`:
# `allow` gates by tool NAME, `scopes` gates by the capability the tool's
# credential actually holds, and BOTH must pass in
# `ctrl::pm_task::dispatch::persona::filter_persona_tool_names` (#3208).
#
# HISTORY (#3938): the base `assistant` used to declare a read-only
# `google.read` — but no gworkspace tool ever advertises that scope:
# `registry::google_scope` maps every `x-google-scopes` OAuth URL to
# `google.<family>.<access>` (e.g. `google.gmail.write`, `google.tasks.write`),
# and `ScopePattern::matches` compares on segment boundaries, so `google.read`
# matched nothing. Inheriting it by union was therefore inheriting NO Google
# capability at all, and every Gmail/Tasks tool allowlisted above was silently
# dropped before the model ever saw it.
#
# #3987 (option B) has since replaced that dead pattern on the base with
# explicit family grants, which now INCLUDE `google.gmail.*` and
# `google.tasks.*` — so the line below is currently redundant and the extends
# union dedups it away (`union_opt_vec`). It is kept declared on purpose: an
# overlay whose entire purpose is Gmail triage and Tasks sync should state the
# capability it depends on rather than rely on the shared base never narrowing
# it. If the base is ever trimmed, this package keeps working.
#
# This overlay is a single named user's private assistant (Masa/Duetto) whose
# whole point is Gmail triage (#473) and Granola->Google Tasks sync (#472/#485),
# so it opts in EXPLICITLY and NARROWLY to exactly those two families —
# deliberately not izzie's blanket `google.*`, which would also hand this
# persona Calendar/Drive/Docs write. This restores, verbatim, the scope line
# the flat `../cto-assistant.toml` has always carried (its own comment there
# predicted this exact failure); converting that file into this directory
# package dropped it, and the package WINS the loader's resolution order.
scopes = ["google.gmail.*", "google.tasks.*"]

[system_prompt]
# CTO-specific skill DELTAS only — `gworkspace-calendar` is already granted
# by the base and inherited via union; listing it again here would be a
# harmless duplicate, so it's dropped.
# #256: Skill files live in `.trusty-agents/skills/<name>.md` and are resolved
# by name at agent load time. The org/APEX/voice skills give the model
# durable Duetto-specific knowledge without bloating the persona file.
# #482: The system prompt body now lives in persona.md (MD-package format).
skills = [
    "cto-duetto-org",
    "cto-apex-framework",
    "cto-bob-voice",
    "izzie-metro-north",
]

# ADR-0024 decision 4 (owner ratification, 2026-07-29) — the SEEDED reachable
# sub-agent whitelist.
#
# `delegate_allowed` is the editable list of in-process sub-agents this
# assistant may hand work to via `delegate_to_agent`. It is intersected with a
# server-owned floor (`agents::delegation::ASSISTANT_REACHABLE_SUBAGENTS`), so
# editing this list can only ever NARROW it — adding `engineer` here does
# nothing, and the PATCH endpoint refuses the write outright.
#
# ABSENT MEANS NOTHING, NOT EVERYTHING. An assistant with no
# `delegate_allowed` key reaches zero sub-agents. That is the ratified
# fail-closed answer, and this seed is the migration that keeps it from being a
# silent capability loss for the shipped personas. Every agent DEFINITION stays
# in the catalog — engineers, QA, docs, plan and ops agents are all still there
# and still dispatchable by `pm`/`ctrl`-as-orchestrator; what changed is that an
# ASSISTANT no longer reaches them.
#
# `allowed` (if present) is the SEPARATE cross-product `dispatch_task` list —
# different mechanism, different name vocabulary. Do not merge the two.
[subagents]
delegate_allowed = ["research-agent", "ticketing-agent"]
