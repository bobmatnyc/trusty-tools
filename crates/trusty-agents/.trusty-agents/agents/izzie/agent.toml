# Izzie — personalization overlay over the base `assistant` agent (#3054).
#
# This is the REFERENCE EXAMPLE of the Eve §2.5.1 `extends` pattern: Izzie is
# not a base agent, she is one user's (Masa's) personalization of the nameless
# base `assistant`. Everything generic — the curated Google Workspace tool
# surface, the productivity scopes, the generic gworkspace/memory skills, and
# the base "helpful assistant" instructions — is INHERITED from `assistant`.
# Only the personal deltas live here: the display name "Izzie", the warm/witty
# persona and Masa-identity binding (persona.md), and the user-specific skills
# (weather for a home city, a personal transit line, a personal writing voice).
#
# IMPORTANT: the `extends` resolver is NOT implemented yet (#3055). Until it
# lands, this overlay does NOT auto-inherit the base's `[tools]`/scopes/generic
# skills — so it will not fully resolve on its own. The working Izzie the REPL /
# Telegram persona paths load today is the standalone `../izzie.toml`; once
# #3055 merges and persona dispatch migrates to the package loader, that flat
# file is superseded by this overlay + `../assistant/`.

# Inherit the base productivity assistant (resolved by #3055).
extends = "assistant"

[agent]
name = "izzie"
role = "assistant"
runner = "claude-code"
model = "claude-sonnet-4-6"
description = "Izzie — personal assistant (personalization overlay over `assistant`)"
# Persona identity supplied by the overlay (the base is nameless).
display_name = "Izzie"
prompt_label = "Izzie"

[llm]
# Izzie's tone: warm, short conversational replies. Overrides the base `[llm]`
# under #3055; kept here so the overlay is also valid standalone.
temperature = 0.7
max_tokens = 1024

[system_prompt]
# Personal skills only — these are Masa-specific and MERGE with the base's
# generic gworkspace/memory skills under #3055. Each resolves to a
# `.trusty-agents/skills/<name>.md` file.
#   izzie-weather      — weather for the home city (Open-Meteo + NWS)
#   izzie-metro-north  — real-time MTA Metro North schedules and alerts
#   cto-bob-voice      — Masa's Slack writing style for drafting on his behalf
# #482: the system prompt body (personal deltas) lives in persona.md.
skills = [
    "izzie-weather",
    "izzie-metro-north",
    "cto-bob-voice",
]
