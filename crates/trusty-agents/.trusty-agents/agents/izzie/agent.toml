# Izzie — personalization overlay over the base `assistant` agent (#3054).
#
# This is the REFERENCE EXAMPLE of the Eve §2.5.1 `extends` pattern: Izzie is
# not a base agent, she is one user's (Masa's) personalization of the nameless
# base `assistant`. The intent is that everything generic — the curated Google
# Workspace tool surface, the productivity scopes, the generic gworkspace/memory
# skills, and the base "helpful assistant" instructions — is INHERITED from
# `assistant`, leaving only the personal deltas here (display name, warm/witty
# Masa-bound persona, and the user-specific skills).
#
# #3055/#3106 landed the `extends` resolver: `AgentConfig::by_name("izzie")`
# (this directory package shadows the flat `../izzie.toml`) now unions this
# overlay's `[tools].allow` with the base `assistant`'s, base-first, deduped
# (`crate::agents::extends::merge_extends`) — so the block below is REDUNDANT
# with the base's list, not load-bearing for safety anymore (an overlay with
# no `[tools]` at all would still inherit the base's restricted allowlist,
# not go unrestricted). It is kept explicit here so this overlay stays
# self-documenting and SAFE STANDALONE if ever loaded directly (e.g. the
# `extends`-shadow-fallback path, or a future direct-load caller) without
# relying on union semantics. When editing the base's tool surface (e.g.
# PR A / epic #3052's black-box tool strip), the base file
# (`../assistant/agent.toml`) is the single source of truth — this list does
# not need to be kept byte-identical, only a safe subset.
#
# BUG FIX (PR A code-critic follow-up, #3052): `extends = "assistant"` was
# previously placed BEFORE the `[agent]` table header, making it a TOP-LEVEL
# TOML key. `AgentConfig` has no top-level `extends` field (only
# `AgentInfo::extends`, i.e. `[agent].extends`) and doesn't
# `deny_unknown_fields`, so serde silently DROPPED it — `agent.extends` was
# always `None` and this package NEVER actually inherited anything from the
# base (no prose concatenation, no tool/skill union); every prior "izzie
# inherits from the base" claim in this file's comments was aspirational,
# not actual, until this fix. Caught by
# `assistant_tier_persona_carries_curated_worker_routing_list`
# (`crates/trusty-agents/src/agents/tests/loading.rs`), which failed because
# the base's persona body (added by PR A) never reached izzie's resolved
# content. `extends` now lives inside `[agent]` below, where the schema
# expects it.

[agent]
# Inherit the base productivity assistant (resolved by #3055/#3106).
extends = "assistant"
name = "izzie"
role = "assistant"
# #3358: no `runner` — falls back to the default (Subprocess), routing off
# the claude-code CLI onto the direct-API credential path (AnthropicDirect
# when ANTHROPIC_API_KEY is set, else OpenRouter). See `pick_credentials()`
# in `src/llm/credentials.rs`.
model = "claude-sonnet-4-6"
description = "Izzie — personal assistant (personalization overlay over `assistant`)"
# Persona identity supplied by the overlay (the base is nameless).
display_name = "Izzie"
prompt_label = "Izzie"

[llm]
# Izzie's tone: warm, short conversational replies. Overrides the base `[llm]`
# under #3055; kept here so the overlay is also valid standalone.
temperature = 0.7
max_tokens = 1024
# Conversational mode: block markdown headers and divider rules mid-response.
stop_sequences = ["\n##", "\n* * *"]
# OKG STORE BINDING (#3816/#3864, DOC-54 SPEC-AGENTS-04 §5.1) — the FIRST leg
# of the stores/tools/listeners config triple: what Izzie KNOWS, as opposed to
# how she ACTS (`[tools].allow`) or REACTS (`[[listeners]]`).
#
# Exactly ONE store per agent (Bob, 2026-07-24). `index` is a trusty-search
# index id, `palace` a trusty-memory palace; the harness resolves both against
# the live daemons at boot and reports each as connected / not-connected with a
# reason (`crate::stores::status`) — a missing index degrades the store, it
# never blocks the agent from booting. `index` is also the DEFAULT target for
# an unqualified `vector_search(query)` call (#3864), so Izzie's semantic
# search hits her own knowledge tree rather than whatever code index happens to
# sit under the process CWD.
[[stores]]
name = "bob-kb"
tree = "okg://izzie"
index = "bob-kb"
palace = "owner-profile"


[tools]
# Redundant-but-harmless — see the header note. This mirrors the curated
# allowlist in `../assistant/agent.toml` (now UNIONED with it at load time,
# not overridden) so the overlay stays safe and self-documenting even when
# read standalone (absent `allow` = UNRESTRICTED, which we must not ship).
# BLACK-BOX POSTURE (PR A, epic #3052): `mcp_list`/`mcp_enable`/`mcp_disable`
# are DELIBERATELY EXCLUDED — see `../assistant/agent.toml` for rationale.
allow = [
  # delegation (PR A, epic #3052)
  "delegate_to_agent",
  # git
  "git_log", "git_status",
  # meeting notes
  "granola_*",
  # web search
  "web_search",
  # #3864: semantic search over Izzie's bound OKG store (`bob-kb`). An
  # unqualified `vector_search(query)` defaults to that index; an explicit
  # `index_id` can still target another corpus.
  "vector_search",
  # weather + Metro-North (epic #3052; skills izzie-weather / izzie-metro-north)
  "get_weather",
  "get_train_schedule",
  "get_train_alerts",
  # gworkspace — Gmail
  "compose_email",
  "download_gmail_attachment",
  "format_email_content",
  "get_gmail_message_content",
  "list_message_attachments",
  "manage_gmail_filters",
  "manage_gmail_labels",
  "manage_gmail_settings",
  "modify_gmail_messages",
  "search_gmail_messages",
  # gworkspace — Calendar
  "manage_calendars",
  "manage_events",
  "query_free_busy",
  # gworkspace — Drive
  "get_drive_file_content",
  "list_drive_contents",
  "list_shared_drives",
  "manage_drive_file",
  "manage_file_permissions",
  "search_drive_files",
  "sync_drive",
  # gworkspace — Docs
  "append_to_document",
  "apply_table_style",
  "convert_document",
  "create_document",
  "create_document_from_template",
  "create_document_tab",
  "create_list_in_document",
  "delete_range_in_document",
  "find_tables_in_document",
  "format_document_range",
  "format_paragraph_in_document",
  "get_document",
  "get_document_named_styles",
  "get_document_structure",
  "insert_image_in_document",
  "insert_table_in_document",
  "insert_text_in_document",
  "manage_document_comments",
  "manage_document_header_footer",
  "manage_document_tabs",
  "manage_table_structure",
  "move_paragraph_in_document",
  "publish_markdown_to_doc",
  "render_mermaid_to_doc",
  "replace_text_in_document",
  "set_document_style",
  "update_document_named_styles",
  # gworkspace — Sheets
  "format_sheet",
  "get_spreadsheet",
  "manage_spreadsheet",
  "modify_sheet_values",
  "set_table_column_widths",
  # gworkspace — Slides
  "add_slide_content",
  "format_slide",
  "get_slides",
  "manage_slides",
  # gworkspace — Tasks
  "manage_task_lists",
  "manage_tasks",
  # gworkspace — misc
  "create_chart",
  "list_accounts",
]
# Izzie opts into BLANKET Google access (`google.*`) — one pattern covering
# every family, present and future.
#
# #3987: this used to be described as opting "into write on top of the base
# template's read-only `google.read` default (§5.5)". That framing was wrong in
# both halves: `google.read` matched nothing (no gworkspace tool advertises it —
# discovery only emits `google.<family>.<access>`), so there was no read-only
# default to sit on top of; and every Google OAuth scope `trusty-gworkspace`
# requests is the full-access variant of its API, so "write" was never a
# separate tier. The base now grants the eight families its allowlist names
# (`../assistant/agent.toml`); `google.*` is a strict superset of those and is
# kept deliberately — izzie is a single named user's private assistant and is
# meant to reach new Google families as they appear without a config edit.
# The rest of the scope list matches the base and is redundant until #3055
# (see header note).
scopes = ["memory.read", "memory.write", "search.read", "google.*"]

[system_prompt]
# Personal skills only — these are Masa-specific and MERGE with the base's
# generic gworkspace/memory skills under #3055. Each resolves to a
# `.trusty-agents/skills/<name>.md` file.
#   izzie-weather      — weather for the home city (Open-Meteo + NWS)
#   izzie-metro-north  — real-time MTA Metro North schedules and alerts
#   cto-bob-voice      — Masa's Slack writing style for drafting on his behalf
# #482: the system prompt body (personal deltas) lives in persona.md.
skills = [
    "izzie-weather",
    "izzie-metro-north",
    "cto-bob-voice",
]

# --- Listeners (#3820, DOC-54 SPEC-AGENTS-04/06) — the third config-triple
# leg: what Izzie REACTS to, distinct from `[tools]` (how she ACTS). This
# binding is INERT until a matching `[[listeners]]` entry named
# "gmail-personal" exists in `~/.trusty-agents/config.toml` AND that
# listener is `enabled = true` — see the PR body / #3820 for the exact
# stanza to paste into config.toml to turn this on live. `event_types`
# narrows to new-mail-only (no other Gmail event types are emitted by this
# slice yet); `filter.from` is intentionally broad (`*`) for the demo so any
# inbound mail can wake her — tighten this once real usage patterns emerge
# (DOC-54's own example narrows to `*@family.com`).
[[listeners]]
name = "gmail-personal"
event_types = ["message.received"]
filter = { from = ["*"] }
