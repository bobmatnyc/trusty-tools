[agent]
name = "ctrl"
# Bob directive (2026-07-24): role "controller" -> "assistant" so Concierge
# appears in the role-filtered pickers (REPL `/agent` no-arg AND the GUI/MCP
# roster, both gate on role == "assistant" with no other lever — #3812).
# `role == "controller"` was never compared anywhere else in the codebase.
role = "assistant"
# #3819 (Bob's roster-typing directive): picker GROUPING label — Concierge
# shows under a "System Tool" section, distinct from role (dispatch/tool
# security) and hidden (visibility). See AgentInfo::kind's doc comment.
kind = "system-tool"
# "Qwopus" = qwen3:30b — community nickname for the Opus-class local model.
# Already installed locally; routes through OllamaAdapter at http://localhost:11434.
model = "ollama/qwen3:30b"
description = "ctrl — trusty-agents coordination layer (assistant + project coordinator)"

[llm]
temperature = 0.5
# #295: ctrl is conversational/coordination — short responses are correct.
# Bumped from 1024 → 2048 for qwen3:30b which tends toward longer prose.
max_tokens = 2048
use_anthropic_direct = false
# Conversational mode (#feature-A): block markdown headers and divider rules
# from appearing mid-response so replies stay in plain prose.
stop_sequences = ["\n##", "\n* * *"]
# Note: "\n---\n" intentionally excluded — qwen3 uses HR dividers naturally in
# conversational output; including it caused mid-sentence truncation (#eval-qwen3)

# #420: ctrl is the interactive user-facing coordination layer. Use Lite rather
# than Full so it retains natural prose grammar — Full's fragment style reads
# as terse/curt in live conversation; Lite just strips preamble and filler.
[compress]
enabled = true
token_budget = 32000
compress_task = false
output_style = "lite"

# #482: The system prompt body now lives in persona.md (MD-package format).

# ADR-0024 decision 4 (owner ratification, 2026-07-29) — the SEEDED reachable
# sub-agent whitelist.
#
# `delegate_allowed` is the editable list of in-process sub-agents this
# assistant may hand work to via `delegate_to_agent`. It is intersected with a
# server-owned floor (`agents::delegation::ASSISTANT_REACHABLE_SUBAGENTS`), so
# editing this list can only ever NARROW it — adding `engineer` here does
# nothing, and the PATCH endpoint refuses the write outright.
#
# ABSENT MEANS NOTHING, NOT EVERYTHING. An assistant with no
# `delegate_allowed` key reaches zero sub-agents. That is the ratified
# fail-closed answer, and this seed is the migration that keeps it from being a
# silent capability loss for the shipped personas. Every agent DEFINITION stays
# in the catalog — engineers, QA, docs, plan and ops agents are all still there
# and still dispatchable by `pm`/`ctrl`-as-orchestrator; what changed is that an
# ASSISTANT no longer reaches them.
#
# `allowed` (if present) is the SEPARATE cross-product `dispatch_task` list —
# different mechanism, different name vocabulary. Do not merge the two.
[subagents]
delegate_allowed = ["research-agent", "ticketing-agent"]
