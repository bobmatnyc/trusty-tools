<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Trusty Assistant — AI agent orchestration" />
    <meta name="theme-color" content="#B7410E" />
    <meta name="color-scheme" content="light dark" />
    <title>Trusty Assistant</title>
    <script>
      // Why: Apply the persisted theme before first paint so users don't see a
      // flash of the wrong palette during JS bootstrap. The theme store also
      // calls applyTheme on import, but this inline script runs strictly
      // earlier (before any module evaluation).
      (function () {
        try {
          var stored = localStorage.getItem('foundry-theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
    <!-- Foundry design system fonts (docs/design/gui/README.md install step). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body class="bg-foundry-light-bg text-foundry-light-text dark:bg-foundry-bg dark:text-foundry-text">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
