<!--
  Why: This favicon must stay in visual sync with RobotIcon.svelte — before
  this fix it was a fourth, independently hand-drawn robot face (different
  rect/circle coordinates, `>_` rendered as <text> instead of stroked paths)
  that would silently drift from the "real" robot mark by construction
  (#3486). A static <svg> can't use Svelte props/reactivity, so it can't
  literally import RobotIcon.svelte — instead this file's geometry is
  copy-derived from RobotIcon.svelte's `full`-variant path data (see
  docs/design/UI/design-system/icons/RobotIcon.svelte, the canonical
  source): same head rect (x=6 y=9 20x18 rx=4), same antenna line + dot,
  same eye positions, same chevron+underscore mouth, on a rust rounded-
  square background sized for legibility at 16-32px favicon scale.
  What: Static rust (#B7410E) rounded-square favicon with the robot face
  traced from RobotIcon.svelte's coordinates, in white for contrast.
  Test: Regenerate by diffing circle/rect/line coordinates against
  RobotIcon.svelte's `full` variant — they must match exactly whenever
  RobotIcon.svelte's geometry changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- rounded square background -->
  <rect width="32" height="32" rx="6" fill="#B7410E"/>
  <!-- face (RobotIcon.svelte full-variant head rect) -->
  <rect x="6" y="9" width="20" height="18" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- antenna -->
  <line x1="16" y1="9" x2="16" y2="4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="3" r="1.5" fill="#fff"/>
  <!-- eyes -->
  <circle cx="12" cy="16" r="1.5" fill="#fff"/>
  <circle cx="20" cy="16" r="1.5" fill="#fff"/>
  <!-- mouth: chevron `>` + underscore `_` -->
  <polyline points="11.5,20.5 13.5,22.5 11.5,24.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="15" y1="24.5" x2="20.5" y2="24.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
