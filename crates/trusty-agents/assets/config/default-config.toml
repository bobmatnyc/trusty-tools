# trusty-agents global configuration
# ~/.trusty-agents/config.toml

[mcp]
# Agent roles that receive MCP tool descriptions in their system prompt
inject_for_roles = ["ctrl", "pm", "research", "observe"]

# SECURITY (#3266): whether live MCP discovery is allowed to auto-spawn
# servers declared in a project's `.mcp.json`. Defaults to false — a
# project's `.mcp.json` is repo-controlled, untrusted content; cloning a
# hostile repo must never cause trusty-agents to execute arbitrary binaries
# on every persona turn. The supported opt-in path is a per-server
# `[[mcp.services]]` entry with `discover = true` below, which is an
# explicit, operator-curated allowlist and is unaffected by this flag. Only
# set this to true if you trust every project you point trusty-agents at.
trust_project_mcp_json = false

# Service-tier MCPs agents can reference. Local native integrations
# (kuzu-memory, mcp-vector-search) are handled by the harness directly and
# do not appear here.

# gworkspace-mcp — REMOVED (#3204). This used to be a static `[[mcp.services]]`
# stdio entry (command = "trusty-gworkspace-mcp") carrying a hand-written tool
# list (`gmail_search`, `calendar_list`, `docs_read`, `sheets_read`,
# `tasks_list`, ...) that had drifted from the real binary's tool surface —
# the actual `trusty-gworkspace-mcp` tools are named `compose_email`,
# `search_gmail_messages`, `manage_calendars`, `get_document`, etc. (see the
# `assistant`/`cto-assistant` agent.toml `[tools].allow` lists, and
# `crates/trusty-gworkspace/src/tools.rs`). That mismatch was not cosmetic:
# `mcp_service_tool_executors()` (crates/trusty-agents/src/tools/
# mcp_service_tools.rs) spawns the service's `command` and calls
# `tools/call` using EXACTLY the names listed under `[[mcp.services.tools]]`,
# so every one of those stale names would have failed against the live server
# with a "method not found"-style error.
#
# The LIVE, self-discovering path for gworkspace is the OpenRPC
# `[[tool_registry.endpoints]]` entry named "gworkspace" below (search this
# file for `name = "gworkspace"`), which calls `rpc.discover` against the
# running `trusty-gworkspace-mcp` binary and always reflects its real tool
# surface — no static list to drift. Do not re-add a `[[mcp.services]]`
# block for gworkspace; extend the OpenRPC endpoint's `scopes` instead.
#
# slack-user-proxy retired per ADR-0014 (native Rust MCP, PR #2624): it was a
# disabled external (Python) stdio stub with no native in-workspace successor,
# so it is dropped rather than repointed.

# trusty-mpm — the native session-orchestration + project-registry MCP server
# (crate `trusty-mpm`, bin `trusty-mpm`). `serve --stdio` is a thin bridge:
# it ensures the trusty-mpm daemon is running, then forwards JSON-RPC framing
# to the daemon's loopback `POST /rpc` (crates/trusty-mpm/src/mcp/mod.rs,
# crates/trusty-mpm/src/daemon/mcp_backend.rs). The repo-root `.mcp.json`
# already wires this exact command for Claude Code itself (`.mcp.json:9-15`);
# this block gives trusty-agents personas the identical MCP surface.
#
# Issue #3203: curated, safe subset of the full 31-tool catalog
# (crates/trusty-mpm/src/mcp/tools/{core,session,console,project,proxy}.rs —
# see `TOOL_CATALOG` in `tools/mod.rs` for the authoritative name list).
# INCLUDED — read-only or clearly non-destructive: `session_list`,
# `session_status`, `session_send` (drives an existing pane; does not
# create/destroy sessions), `project_list`, `agent_delegate` (tracking/gating
# only — its own description states it "does not spawn" anything), and
# `console_metrics`. EXCLUDED: `session_new` / `session_stop` /
# `session_resume` / `session_decommission*` / `session_delete` /
# `session_prune` (real tmux-session lifecycle mutation — too consequential
# for a static default allowlist), `config_read` / `config_write` /
# `auto_resume_set` / `project_register` (mutate on-disk daemon config or the
# project registry), `memory_protect` / `hook_event` / `circuit_breaker_status`
# (internal daemon-instrumentation/ops surface, not agent-facing), the
# bug-reporting trio `list_recent_errors` / `preview_bug_report` /
# `report_bug` (`report_bug` files public GitHub issues and needs an
# explicit human-gated flow, not a default tool), and the `session_proxy_*`
# quartet (channel-proxy focus state — out of scope for this MVP wiring).
[[mcp.services]]
name = "trusty-mpm"
description = "trusty-mpm session orchestration + project registry (native MCP)"
command = "trusty-mpm"
args = ["serve", "--stdio"]
transport = "stdio"
enabled = true

[[mcp.services.tools]]
name = "session_list"
description = "List all Claude Code sessions the trusty-mpm daemon is managing, with status, working directory, and active delegation count."

[[mcp.services.tools]]
name = "session_status"
description = "Get detailed status for one session: uptime, token usage, current agent, memory pressure, and last activity."

[[mcp.services.tools]]
name = "session_send"
description = "Send a line of text into a managed session's tmux pane (followed by Enter), e.g. to answer a prompt or drive the harness. Returns a confirmation with the target tmux session name."

[[mcp.services.tools]]
name = "project_list"
description = "List all projects registered in the project registry. Returns a JSON array of project objects, each with `name`, `repo_url`, `default_branch`, and optional `stack_hint`, `tags`, `description`, and `gh_user` (the project's preferred GitHub account login, #2081)."

[[mcp.services.tools]]
name = "agent_delegate"
description = "Record and gate a delegation to a named agent: applies the circuit-breaker and depth limits and adds the delegation to the session's dashboard tree. This is a TRACKING/GATING companion, NOT an execution path — it does not spawn the agent. Execution happens via the native Agent/Task tool using the deployed agent name (from ~/.claude/agents/), e.g. Agent(subagent_type=\"rust-engineer\")."

[[mcp.services.tools]]
name = "console_metrics"
description = "Return the standard trusty-console metrics report for trusty-mpm: service id, display name, version, coarse health status, and a `metrics` payload carrying the managed-session fleet snapshot (counts by lifecycle state) and the supervisor auto-resume control state. Polled uniformly by trusty-console for the dashboard."

# Granola — meeting notes, transcripts, and action items (#256).
# Enabled by default; harmless when the binary is absent (the harness
# logs and continues). Used heavily by the personal-assistant and
# cto-assistant for meeting recall.
[[mcp.services]]
name = "granola-notes"
description = "Granola meeting notes and transcripts"
command = "/opt/homebrew/bin/granola-mcp"
args = []
transport = "stdio"
enabled = true

[[mcp.services.tools]]
name = "granola_search"
description = "Search Granola meeting notes and transcripts"

[[mcp.services.tools]]
name = "granola_get"
description = "Retrieve a specific Granola meeting note"

[[mcp.services.tools]]
name = "granola_list_recent"
description = "List recent Granola meetings"

# Duetto org memory service — Duetto-internal HTTP MCP (#256).
# Disabled by default since it's only reachable on Duetto infrastructure.
# Enable with `mcp_enable duetto-memory` when on a Duetto-connected machine.
[[mcp.services]]
name = "duetto-memory"
description = "Duetto org memory service (Duetto infra only)"
url = "https://mcp-services.dev.duettosystems.com/memory/mcp"
transport = "http"
enabled = false

# GitHub identities for the ticketing agent (#243).
# Each identity points to env vars holding a token + default repo, so
# secrets stay out of this file. Set `default_identity` to choose which
# identity is used when no override is provided.
#
# Example:
# [github]
# default_identity = "personal"
#
# [[github.identities]]
# name = "personal"
# token_env = "GITHUB_TOKEN"
# repo_env = "GITHUB_REPO"
#
# [[github.identities]]
# name = "work"
# token_env = "GITHUB_TOKEN_WORK"
# repo_env = "GITHUB_REPO_WORK"

# Native git tool configuration (#247).
# Controls which agent roles get the git_* tools (status, log, branches,
# commit, push, pull, fetch, stash, etc.). Read operations use libgit2;
# write operations shell out to `git` to preserve hooks and signing.
[git]
available_for_roles = ["ctrl", "pm", "research", "observe"]
confirm_writes = false
default_branch = "main"

# Local Ollama fast-path (#319).
# When enabled, qualifying ctrl turns (TM status queries, simple chat) are
# routed to a locally-running ollama instance instead of the remote model.
# Enabled by default (#345). Toggle with `/local off` or set `enabled = false`
# below. Requires `ollama serve` and a pulled model matching `model`.
[local_inference]
enabled = true
model = "ollama/qwen3:30b"
fallback_on_error = true
ollama_host = "http://localhost:11434"
max_tokens = 2048

# OpenRPC (https://spec.open-rpc.org/) over stdio tool registry (#453, #455).
# Declares external JSON-RPC 2.0 endpoints (driver = "direct") that advertise
# tools via `rpc.discover`. The `direct` driver spawns a subprocess and
# speaks JSON-RPC 2.0 over its stdin/stdout (NDJSON; one JSON object per
# line, JSON array for batch). Endpoints below are DISABLED by default —
# flip `enabled = true` once the corresponding binary supports an OpenRPC
# stdio mode (e.g. via a `--rpc` flag). See
# docs/trusty-agents/research/openrpc-trusty-contract.md for the wire format.
[tool_registry]
scope_enforcement = "deny"

# trusty-memory — recall/remember/forget over JSON-RPC 2.0 stdio.
# Disabled until the trusty-memory binary supports `--rpc` mode (where it
# reads OpenRPC requests from stdin and writes responses to stdout).
[[tool_registry.endpoints]]
name = "trusty-memory"
driver = "direct"
description = "Trusty memory service — recall/remember/forget"
command = "trusty-memory"
args = ["--rpc"]
enabled = false
scopes = ["memory.read", "memory.write"]
discovery_ttl_secs = 0
eager_discovery = true

[tool_registry.endpoints.transport]
timeout_ms = 5000

# trusty-search — semantic/keyword code search over JSON-RPC 2.0 stdio.
# Disabled until the trusty-search binary supports `--rpc` mode.
[[tool_registry.endpoints]]
name = "trusty-search"
driver = "direct"
description = "Trusty search service — semantic + keyword code search"
command = "trusty-search"
args = ["--rpc"]
enabled = false
scopes = ["search.read"]
discovery_ttl_secs = 0
eager_discovery = true

[tool_registry.endpoints.transport]
timeout_ms = 5000

# gworkspace — Google Workspace (Gmail, Calendar, Drive, Docs, Sheets, Tasks)
# via JSON-RPC 2.0 stdio. The `trusty-gworkspace-mcp` binary (renamed from
# `gworkspace-mcp` in #2644 to resolve a $PATH collision with the legacy pipx
# Python package; from the trusty-common workspace, crate `trusty-gworkspace`)
# exposes an OpenRPC 1.3.2 manifest via `rpc.discover` and advertises Google
# OAuth scopes per tool through the `x-google-scopes` extension.
#
# Issue #3056: enabled by default (was `enabled = false`, "pending auth").
# `rpc.discover`/`tools/list` on the gworkspace server are pure static
# functions (crates/trusty-gworkspace/src/{openrpc,tools}.rs) that never
# touch the token store, and `BaseClient::new()` succeeds with zero stored
# credentials (`oauth: Option<OAuthManager>` is simply `None`/refresh-disabled
# in that case) — so `ToolRegistryBuilder::build()`'s eager `discover()` at
# harness startup always succeeds regardless of auth state, and per
# `tool_registry/mod.rs::build()` a per-endpoint discovery failure only logs
# a warning and skips that endpoint, never aborts startup. Individual tool
# calls made before authenticating fail with a clear
# "no default Google Workspace profile found — run setup" operational error
# (crates/trusty-gworkspace/src/api/client.rs) rather than a crash. Run
# `trusty-gworkspace-mcp setup` on a machine with the (renamed) binary on
# $PATH to authorize a Google account — see
# docs/trusty-agents/research/openrpc-trusty-contract.md.
[[tool_registry.endpoints]]
name = "gworkspace"
driver = "direct"
description = "Google Workspace — Gmail, Calendar, Drive, Docs, Sheets, Tasks"
command = "trusty-gworkspace-mcp"
args = []
enabled = true
scopes = [
    "google.gmail.*",
    "google.calendar.*",
    "google.drive.*",
    "google.docs.*",
    "google.sheets.*",
    "google.tasks.*",
]
discovery_ttl_secs = 0
eager_discovery = true

[tool_registry.endpoints.transport]
timeout_ms = 5000

# tickets-mcp is intentionally NOT a `driver = "direct"` (OpenRPC) endpoint:
# the `tickets-mcp` binary (trusty-common, `tickets` feature) speaks MCP
# framing, not OpenRPC `rpc.discover`, so a direct endpoint would silently
# fail discovery. It is wired out-of-process via the repo-root `.mcp.json`
# stdio server instead. The former dead `tickets-mcp` (and `commons-ticketing`)
# OpenRPC stubs were retired per ADR-0014 (native Rust MCP, PR #2624).
