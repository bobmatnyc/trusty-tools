[package]
name = "trusty-agents"
version = "0.38.6"
edition = "2024"
description = "Trusty Agents: Rust-native agentic harness with multi-model routing, tool execution, and subprocess delegation."
license.workspace = true
repository.workspace = true
authors.workspace = true

include = [
    "src/**/*",
    "assets/**/*",
    "ui/dist/**/*",
    "ui/src/**/*",
    "ui/index.html",
    "ui/package.json",
    "ui/pnpm-lock.yaml",
    "ui/svelte.config.*",
    "ui/tsconfig.*",
    "ui/vite.config.*",
    "ui/tailwind.config.*",
    "ui/postcss.config.*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
# Why (#640): Phase 1 leaf/protocol modules (events, ipc, perf, intent,
#      progress, build_info) now live in trusty-code. trusty-agents re-exports
#      them so all existing consumers keep compiling unchanged. The
#      reconciliation (removing trusty-agents's own copies) is tracked in #647.
trusty-code = { workspace = true }
# Why: issue #460 unified rpc.discover — host needs the ServiceDescriptor
#      trait + OpenRpcBuilder, plus the in-process MemoryMcpService and
#      SearchMcpService impls. trusty-search now aligns on tree-sitter 0.26
#      (matches the symgraph parser) so the previous `links = "tree-sitter"`
#      single-copy conflict is resolved and we link it directly.
# The `symgraph-parser` feature pulls in the full symbol-graph engine
# (absorbed from the former `trusty-symgraph` crate in #5 phase 2c).
# The `memory-core` feature pulls in the Memory Palace storage engine
# (absorbed from the former `trusty-memory-core` crate in #5 phase 2d).
# `axum-server` (#3329): the shared same-origin write guard + standard axum
#      middleware stack (`trusty_common::server::with_guarded_middleware`,
#      `SelfOrigins`) the API server adopts router-wide for the loopback-only
#      doctrine (mirrors trusty-console/#3317).
# `inference-client` (#2410, epic #2400): the shared OpenAI-compatible
#      adapter layer (`Configurator`, `InferenceAdapter`, the `ChatRequest`/
#      `ChatResponse` wire types, `test_support::MockInferenceServer` when
#      paired with `axum-server`) that `llm::inference_bridge` /
#      `llm::inference_client` build on. Already implied transitively by
#      `config-cli`, but declared explicitly so that relationship is never a
#      silent, breakable assumption.
# `bedrock` (issue #3767): unlocks trusty-common's real `chat::BedrockProvider`
#      (`ConverseStream`-backed) for `llm::stream::stream_reply`'s Bedrock
#      branch — without it `BedrockProvider` resolves to the always-erroring
#      stub. Zero added dependency weight: `aws-config`/`aws-sdk-bedrockruntime`/
#      `aws-types` below are already unconditional direct dependencies of this
#      crate for the existing `llm::bedrock` (Converse, non-streaming) client.
trusty-common = { workspace = true, features = ["mcp", "symgraph-parser", "memory-core", "cli-help", "stdio-mcp-client", "session-naming", "config-cli", "axum-server", "inference-client", "bedrock"] }
# Why (issue #226): trusty-agents only links `trusty_memory::MemoryMcpService` for
#      in-process `rpc.discover` merging; it does not need the axum HTTP/SSE
#      surface (it owns its own axum stack for the orchestrator's UI). Setting
#      `default-features = false` drops the `axum-server` feature so we don't
#      compile the trusty-memory HTTP daemon code paths just to pick up a
#      zero-sized service descriptor.
trusty-memory = { path = "../trusty-memory", version = "0.22", default-features = false }
trusty-search = { path = "../trusty-search", version = "0.42" }
# Gmail/Calendar eventstream listeners (#3820, DOC-54 SPEC-AGENTS-06) call
# trusty-gworkspace's connector layer (`api::client::BaseClient` +
# `api::services::gmail::*`) DIRECTLY as library functions — the same code
# `trusty-gworkspace-mcp`'s tool handlers call, reused here instead of routed
# through MCP JSON-RPC. Not one of the `publish = false` "agent crate" deps
# `install_plugins` exists to keep out of this Cargo.toml (see the
# `trusty-agents-common` comment below) — trusty-gworkspace is a plain
# connector library, no cargo-cycle concern.
trusty-gworkspace = { path = "../trusty-gworkspace", version = "0.2.2" }
# trusty-kb: the deterministic KB store + OKG ingest engine (source registry,
# per-item ledger, entity writes). The `okg_ingest_*` tools are thin agent-facing
# wrappers over it — all idempotency logic lives in that crate, which stays pure
# and network-free while the Google fetchers live here, next to the authenticated
# gworkspace client.
trusty-kb = { path = "../trusty-kb", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
async-openai = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = { workspace = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
scraper = "0.21"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = { workspace = true }
redb = { workspace = true }
usearch = "2.25"
fastembed = "5.13"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
walkdir = "2.5"
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-mini = { version = "0.6", default-features = false, features = ["macos_fsevent"] }
fs4 = "1.0"
regex = "1"
once_cell = "1"
# Quote-aware POSIX word-splitting for `pytest_exec`'s allowlist (#3679):
# tokenizes the vetted command into argv so it can be exec'd directly (no
# `/bin/sh -c`), which is what actually closes the shell-injection hole —
# already a workspace dep for the PM Bash guard's git-argv parsing (#2734).
shlex = { workspace = true }
stop-words = "0.8"
dirs = "5"
sha2 = "0.10"
# subtle (#3761): constant-time byte equality for the internal relay's shared
# secret (`api::server::relay::relay_authorized`). Plain `==` short-circuits on
# the first differing byte, leaking the matching-prefix length to a caller that
# can time its own requests. Already present in the lockfile as a transitive
# dependency of the TLS stack, so declaring it directly adds no new compilation.
subtle = "2"
comrak = { workspace = true }
serde_yaml = { workspace = true }
toml_edit = "0.22"
base64 = "0.22"
axum = { workspace = true }
tower-http = { workspace = true }
clap = { version = "4", features = ["derive"] }
backon = "1"
indexmap = { version = "2", features = ["serde"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
local-ip-address = "0.6"
hostname = "0.4"
async-stream = "0.3"
tokio-stream = "0.1"
crossterm = "0.28"
ratatui = "0.29"
strip-ansi-escapes = "0.2"
nu-ansi-term = "0.50"
aws-config = { workspace = true }
aws-sdk-bedrockruntime = { workspace = true }
aws-types = { workspace = true }
aws-smithy-types = "1"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
teloxide = { version = "0.17", features = ["macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
flate2 = "1"
rand = "0.8"
similar = { version = "2", features = ["text"] }
petgraph = { version = "0.8", features = ["serde-1"] }
libc = "0.2"
lru = "0.16"

# Stable plugin surface shared with external agent crates. Defined in its own
# crate (rather than in trusty-agents/lib.rs) to break the trusty-agents ↔ agent-plugin
# cargo cycle: both sides depend on this small lib, neither depends on the
# other through it.
#
# Why: The `trusty-agents` crate must NOT depend on `publish = false`
#      agent crates. A private launcher can depend on both `trusty-agents`
#      and such an agent crate, wiring them at startup via
#      `trusty_agents::install_plugins(...)` before calling
#      `trusty_agents::run()`. No in-workspace launcher does this today: the
#      last such crate (`cto-assistant`) was dissolved in #3732 once its four
#      CTO DB tools became reachable declaratively via the `cto-db` Python
#      skill. This `install_plugins` mechanism remains available for any
#      future private launcher.
trusty-agents-common = { path = "../trusty-agents-common", version = "0.5.0" }

# [patch.crates-io] moved to workspace root Cargo.toml (Cargo requires
# [patch] tables to live in the workspace root; see #460 for context).

[lib]
name = "trusty_agents"
path = "src/lib.rs"

[[bin]]
name = "tagent"
path = "src/main.rs"

[dev-dependencies]
# test-util enables Tokio's paused clock (`#[tokio::test(start_paused = true)]`)
# used by `discover_one_returns_none_on_timeout` to exercise the real 15s
# `DISCOVERY_TIMEOUT` on the virtual clock. Declared explicitly rather than
# relying on `tokio-test` happening to pull the same feature in.
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serial_test = "3"
# Exposes async-openai's `OpenAIConfig::api_key()` (a `SecretString`) in
# tests so credential-resolution tests can assert on the actual value that
# reaches the request builder, not just "no panic" (see #3431 follow-up).
secrecy = "0.10"

[lints.clippy]
doc_lazy_continuation = "allow"
