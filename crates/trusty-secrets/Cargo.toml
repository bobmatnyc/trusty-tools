[package]
name = "trusty-secrets"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Project- and owner-scoped secret storage for the trusty-* tools: key, scope and reference types, a names-only index, and an OS Keychain backend (DOC-74 §15)."
keywords = ["secrets", "keychain", "credentials"]
categories = ["authentication", "development-tools"]
homepage = "https://trustytools.dev"
readme = "README.md"

# DOC-74 §15.2. `api` is the wire vocabulary only (no store code), so a caller
# that only names keys — trusty-console's bridge — never links a keychain.
# `store` is everything that touches a backend or the disk.
#
# #9066 (Architect ruling Q1, 2026-10-11): `ancestry` is the process ancestry
# walk alone (std, thiserror, libc), so trusty-console judges its HTTP client
# with the walk the socket uses. Pinned by tests/cli_backends_feature_closure.rs.
#
# `server` (S2, #9065) is the on-demand UDS socket and the `trusty-secrets`
# binary: tokio plus trusty-common's UDS stack (owner rulings 24, 31, 32). It
# is a default feature so `cargo install trusty-secrets` builds the binary;
# an `api`/`store` consumer opts out with `default-features = false`.
[features]
default = ["api", "store", "server"]
# #9071 (Architect ruling D1): `api` also carries `granted`, the tier-3
# client — serde_json for its frames, libc for its fd and socket checks. Both
# were already optional; still no tokio, keyring, fd-lock or trusty-common.
api = ["dep:serde", "dep:thiserror", "dep:serde_json", "dep:libc"]
store = ["api", "dep:keyring", "dep:fd-lock", "dep:serde_json", "dep:serde_yaml", "dep:dirs", "dep:libc", "dep:zeroize"]
ancestry = ["dep:thiserror", "dep:libc"]
server = ["store", "ancestry", "dep:tokio", "dep:trusty-common", "dep:sha2", "dep:rand_core"]
# #7519: the blocking runner and template-file guard the CLI-backed backends
# (1Password, Keeper) share. std plus `store`'s libc only — owner ruling
# 2026-10-07, "no common dependencies"; pinned by
# tests/cli_backends_feature_closure.rs.
cli-backends = ["store"]
# Exposes the in-memory `MemoryBackend` test double to downstream test suites.
test-support = ["store"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
fd-lock = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# #9793: `credentials` for `sandbox_flag_set`, the one `TRUSTY_SANDBOX` reader.
trusty-common = { workspace = true, optional = true, features = ["uds-supervisor", "credentials"] }
# #9070: exec-grant tokens — 256 bits from the OS CSPRNG, kept only as SHA-256.
sha2 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
# #7520 S2: the session cache zeroes each value it drops (ruling Dd8).
zeroize = { workspace = true, optional = true }

[[bin]]
name = "trusty-secrets"
path = "src/bin/trusty-secrets.rs"
required-features = ["server"]

# Spawns the real binary, so it needs the target `server` builds.
[[test]]
name = "on_demand_server"
path = "tests/on_demand_server.rs"
required-features = ["server"]

# #4567: sets RLIMIT_FSIZE for its whole process, so it is its own binary.
[[test]]
name = "audit_post_success"
path = "tests/audit_post_success.rs"
required-features = ["server"]

# #7520 S2: sets RLIMIT_CORE for its whole process, so it is its own binary.
[[test]]
name = "core_dump_limit"
path = "tests/core_dump_limit.rs"
required-features = ["server"]

# #9070: S8 live checks; spawns the real binary, so it needs `server`.
[[test]]
name = "live_flag_peer"
path = "tests/live_flag_peer.rs"
required-features = ["server"]

# #9071: S9 live check of the tier-3 client; spawns the real binary.
[[test]]
name = "granted_client_live"
path = "tests/granted_client_live.rs"
required-features = ["server"]

# #9328: imports `store`, so an `api`-only test run must skip it.
[[test]]
name = "keychain_roundtrip"
path = "tests/keychain_roundtrip.rs"
required-features = ["store"]

# #9064: macOS only, `apple-native` only. Not the workspace `keyring` entry:
# its `sync-secret-service` feature pulls libdbus-sys, which fails to build on
# a runner without libdbus-1-dev, and `workspace = true` can only add features.
# On any other target there is no `keyring` at all, so its in-memory mock
# store can never be selected; `KeychainBackend` returns
# `SecretsError::UnknownBackend` instead (see store/keychain.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }

# #9326: the file backend's `geteuid`, `O_NOFOLLOW` and `ELOOP`. Unix only,
# because the file backend is.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The api tests decode wire JSON even when only `api` is enabled.
serde_json = { workspace = true }
# #9070: the resolve sentinel test captures every tracing event. Both are
# already in the graph through trusty-common, with the same features.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
