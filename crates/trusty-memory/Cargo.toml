[package]
name = "trusty-memory"
# #6286 removes the whole HTTP-serving surface from the public API: run_http,
# run_http_dynamic, run_http_on, bind_dynamic_port, http_addr_path, the `web`
# and `foreground` modules, and the `axum-server` feature (renamed `daemon`).
# Cargo's 0.x rule puts a breaking change in the MINOR position.
# 0.25.1 (#6307): patch — `setup --client chatgpt` emits the MCP registration a
# launchd-launched GUI client can spawn. `commands::setup::handle_setup_gui_client`
# is a new public item beside an unchanged `handle_setup`, so nothing published
# was removed or changed.
# 0.25.2 (#5188): patch — dream semantic consolidation is opt-in and never
# falls back to a local model endpoint; a new `[semantic_consolidation]` config
# key and Drop-guarded test daemons. No public item was removed or changed.
# 0.25.3 (#6372): patch — console_metrics reports counts for every palace on
# disk rather than only the cache-resident ones, and carries room counts.
# Additive payload fields and metrics_schema_version 3. No public item was
# removed or changed.
# 0.25.4 (#5044): patch — TOOL_METHODS allowlist forwards
# palace_verify_embedded and palace_embed_sweep over raw RPC. No public item
# was removed or changed.
# 0.25.5 (#6464): patch — picks up trusty-common 0.46.0, which the `^0.45`
# requirement here could not resolve. 0.25.4 was tagged but never published, so
# this is the version that reaches crates.io. No public item was removed or
# changed.
# 0.25.6 (#6600, #6601): patch — the BM25 exit flush is bounded by
# `trusty_common::shutdown::CLEANUP_RESERVE` so a slow flush still lets the UDS
# socket unlink run, and one stderr line takes one ring slot with a bounded exit
# flush. Internal to `transport::uds` and `bm25_lane`; no public item was
# removed or changed.
# 0.25.7 (refs #6671, #6663, #6667, #6661): patch — test-flake stabilization
# changes in the test suite under an already-published version.
# 0.26.0 (#6820): minor — `AppState` gained the public `machine` field. The struct
# has public fields and is not `#[non_exhaustive]`, so a downstream struct literal
# stops compiling; Cargo's 0.x rule puts that break in MINOR.
# 0.26.2 (#8267): patch — test-only stabilization in
# `transport::uds_tests` following the trusty-common UDS retry/half-close
# changes. No public item was removed or changed.
# 0.27.0 (#277): minor — kuzu-import r6 work adds/changes public surface for
# the live import; 0.x rule puts the break in MINOR.
# 0.27.1 (#8589): patch — picks up trusty-common 0.52.3, whose secret filter
# stops refusing identifier paths, Google doc URLs and common identifier
# shapes as secrets during kuzu-import. No public item was removed or changed.
# 0.28.1 (#8732, issue #4421): patch — 0.28.0 is already live on crates.io
# and this PR changes `src/**`, so the "PR version bump vs crates.io" gate
# requires a bump. No public item added, removed, or changed shape.
# 0.28.1 -> 0.28.2 (issue #4421): patch — 0.28.1 is already live on crates.io
# and open PRs #8791, #8790, #8779 all change `src/**`, so this branch opens
# the next patch version ahead of those PRs' rebase. No public item added,
# removed, or changed shape on main as of this bump.
# 0.28.2 -> 0.28.3 (#8744, issue #4421): patch — 0.28.2 is already live on
# crates.io and this PR changes `src/**`. No public item added, removed, or
# changed shape.
# 0.28.3 -> 0.28.4 (#8744, issue #4421): patch — PR #8868 merged 0.28.3 to
# main first; this branch reopens the next patch version above main and
# crates.io (0.28.2) after the merge conflict. No public item added, removed,
# or changed shape.
# 0.29.2 -> 0.29.3 (#9141): patch — recall hot-path fix; 0.29.2 is already live
# on crates.io and this PR changes `src/**`. No public item added, removed, or
# changed shape.
# 0.29.3 -> 0.29.4 (#9421): patch — recall supersession demotion calls
# trusty-common `superseded_by_many`, first published in 0.54.3, so the
# trusty-common floor moves 0.54.2 -> 0.54.3. No public item added, removed, or
# changed shape.
# 0.29.5 (Refs #9299): patch — recall_all searches resident palaces by default; 0.29.4 is live on crates.io. Additive only.
# 0.29.6 (Refs #9433): patch — trusty-common floor moves 0.54.4 -> 0.54.5 so a locked install carries the #9433 fix. No source change.
# 0.31.1 (Refs #9340): patch — memory_list reports a read-only `fact_key` per drawer; 0.31.0 is live on crates.io. Additive only.
# 0.32.0 (Refs #9274): minor — palace format gate; trusty-common floor moves 0.57 -> 0.58; 0.31.1 is live on crates.io.
version = "0.32.0"
edition = "2021"
description = "MCP server (stdio + Unix socket) for trusty-memory"
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://trustytools.dev"
keywords = ["mcp", "memory", "vector-search", "knowledge-graph", "embeddings"]
categories = ["command-line-utilities", "development-tools"]

# #6155: no `ui/` tree any more — its Svelte source moved to
# crates/trusty-console/ui-memory, so there is nothing here to exclude but
# the embedder cache.
exclude = [".fastembed_cache/"]

[lib]
# Why: Explicit `rlib` keeps the crate linkable as a Rust library from
#      host processes (trusty-agents) that want to register `MemoryMcpService`
#      directly via the shared `ServiceDescriptor` trait, rather than
#      spawning a separate MCP stdio child. Matches the rest of the
#      trusty-* ecosystem (see trusty-mcp-core) for consistency.
crate-type = ["rlib"]

[[bin]]
# Why: Ship a CLI binary so users can install via `cargo install trusty-memory`
#      and invoke `trusty-memory serve` (MCP stdio) or `trusty-memory migrate
#      kuzu-memory` to rewrite Claude settings files that reference the
#      legacy kuzu-memory MCP server.
# What: Thin clap-to-handler shim; all logic lives in the library + the
#      `commands` module.
# Test: `cargo run -p trusty-memory -- --help` lists `serve` and `migrate`.
name = "trusty-memory"
path = "src/main.rs"
# Why: `serve` / `start` bind the daemon's socket, so the binary needs the
#      `server` feature compiled in. Listing it here keeps a
#      `--no-default-features` library build (the engine-only build, and the
#      trusty-agents `mcp-schema` linker) from trying to build this binary
#      without the serving surface and failing to link `serve`.
# #9269: `server` (default) replaces `daemon`, which stays as its alias.
required-features = ["server"]

# Why (#5329): the `trusty-bm25-daemon` `[[bin]]` shim was REMOVED. BM25 no
# longer runs as a subprocess — `bm25_lane::Bm25Lane` owns the same
# `trusty_common::bm25::BM25Index` in-process, the way trusty-search always has.
# `cargo install trusty-memory` now produces one fewer binary.

[[bin]]
# Why: Compatibility shim for users who installed trusty-memory before the #914
#      PR3 epic (commit ba60e0c3) deleted the original byte-pipe bridge + UDS
#      transport. Those users have `trusty-memory-mcp-bridge` in their .mcp.json
#      and receive JSON-RPC -32000 because the binary no longer ships. This shim
#      restores the binary so existing configs stop breaking without requiring
#      per-project config edits. It emits a one-line deprecation notice to stderr
#      then re-execs `trusty-memory serve --stdio` (the canonical path since PR1).
#      The shim is intentionally thin (no library imports beyond std)
#      to minimise maintenance surface. Users should migrate to
#      `"command": "trusty-memory", "args": ["serve", "--stdio"]` at their
#      convenience; this shim will be removed in a future minor version.
# What: standalone binary at src/bin/mcp_bridge.rs (no axum, no redb — this
#      binary never opens a database).
# Test: `cargo run --bin trusty-memory-mcp-bridge -- 2>&1 | grep DEPRECATED`
name = "trusty-memory-mcp-bridge"
path = "src/bin/mcp_bridge.rs"
# #9269: a CLI binary, so it ships with the server build only (ADR-0066 D1.4);
# a `--no-default-features` engine build compiles no binary at all.
required-features = ["server"]

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-memory`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `trusty-installer` (#1316).

[dependencies]
# `bm25` (#5329) replaces the retired `bm25-client`: the lexical lane now links
# the index itself rather than a UDS client for a subprocess that holds it.
# `uds-supervisor` is NOT dropped — trusty-console and trusty-agents still
# depend on the shared `UdsServiceSupervisor` for trusty-review / trusty-analyze.
# JSON-RPC / MCP primitives (ADR-0040, #5803). #6316: `daemon-bridge-json-rpc`
# compiles the shared stdio<->UDS forwarder `commands::serve_stdio_bridge` runs
# instead of a second copy of the transport.
# #9269: optional — `mcp-schema` enables it bare, `server` adds the forwarder.
trusty-mcp = { workspace = true, optional = true }
# `uds` (#6286) is what this crate now serves on: `trusty_common::uds::server`
# supplies the bind, the peer check, the framing and the accept loop, and
# `uds::stream_client` the reader `memory.chat` needs. It replaces
# `axum-server`, which was here for the retired HTTP listener.
# #9269: only the engine's `memory-core` is unconditional; every feature the
# serving surface needs is switched on by `server` below (`config-cli` is what
# pulls in clap).
trusty-common = { path = "../trusty-common", version = "0.58", default-features = false, features = ["memory-core"] }
# `bug-capture` enables Phase 1 ERROR event capture to JSONL + in-memory ring (bug-reporting #478)
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console
# is no longer bundled into trusty-memory (single-owner-per-binary); the
# standalone `trusty-console` crate is its sole producer.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# #4891: the backfill report reads a private COPY of each palace's redb store so
# that opening it can never write to the live file (see commands/backfill_report).
tempfile = { workspace = true }
# #8434: `palace legacy-kg` reads the pre-redb SQLite `kg.db` read-only to
# recover the drawers the #45 migration never imported (it compiled only under
# a feature this binary never enabled).
rusqlite = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Why axum and tower-http are gone (#6286): they were here for the HTTP/SSE
#      listener ADR-0032 retired. Nothing in this crate constructs a `Router`,
#      a `Response`, or a middleware layer any more — the daemon serves one
#      Unix socket through `trusty_common::uds::server`.
clap = { workspace = true, optional = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
dashmap = { workspace = true }
# Issue #4639: LRU-bounded cache of per-palace chat_sessions.redb handles.
# `lru` + `parking_lot` are the exact pair `PalaceRegistry` already uses in
# trusty-common for the same fd-bounding job, so this reuses the established
# pattern with zero new lockfile entries.
lru = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
colored = { workspace = true }
# Why: `commands::stop` walks the process table to find the running daemon by
#      name + argv. `sysinfo` is the portable way to do that across macOS and
#      Linux; the same crate is already a workspace dependency used by
#      trusty-search and trusty-mpm-daemon, so this is zero new lockfile churn.
sysinfo = { workspace = true }
# Issue #96: persistent activity log lives in a dedicated redb file under the
# daemon data dir so the dashboard activity feed survives restarts. redb was
# already a transitive dev-dependency for the MCP stdio peer-lock test; this
# moves it to a runtime dependency.
redb = { workspace = true }
# Issue #105: optional SHA-256 hashing of `trigger_prompt` field in enriched
# prompt logs when `TRUSTY_MEMORY_PROMPT_LOG_HASH_PROMPTS=1`. `sha2` already
# lives in the workspace dependency table (used by trusty-common,
# trusty-analyze, trusty-mpm-core, trusty-gworkspace) so this adds no new
# lockfile churn.
sha2 = { workspace = true }
# `fd_metrics` reads `RLIMIT_NOFILE` via `libc::getrlimit`. (#5329 removed the
# BM25 spawn supervisor's SIGTERM caller; #8759 removed `commands::daemon_lock`.)
libc = { workspace = true }
# Issue #220: rolling dedup window uses Jaro-Winkler similarity to detect
# near-duplicate memory writes within a short time window. `strsim` is
# already a workspace dep (used by the cli-help suggest feature in
# trusty-common), so this adds zero lockfile churn.
strsim = { workspace = true }
# Issue #278: encode/decode triple IDs as URL-safe base64 for the
# `DELETE /kg/triples/<id>` endpoint. Already in the workspace dependency table.
base64 = { workspace = true }
# Why: `monitor web` / `run_monitor_web` opens the daemon's web UI in the
# default system browser (issue #687). `open` provides a portable abstraction
# over `xdg-open` (Linux), `open` (macOS), and `start` (Windows) without
# pulling in a GUI toolkit. Matches the pattern in trusty-search.
open = "5"

[dev-dependencies]
tempfile = { workspace = true }
# libc: the #5267 TTY-gated notice can only be exercised by giving the child a
# REAL terminal on stdin, which needs openpty(3). A pipe proves the silent half
# of the contract; only a pty proves the human-facing half.
libc = { workspace = true }
# #5005: encode a real 384-dim vector when seeding a synthetic id collision
# into a palace's index redb, so HnswStore's dimension check accepts the file.
postcard = { workspace = true }
tower = { workspace = true }
serial_test = { workspace = true }
# #8729: capture the user-forget log line in `service::core_tests`. Already a
# normal dependency of trusty-common, so this adds no crate to the build.
tracing-subscriber = { workspace = true }
# Issue #1722: `task_mcp` integration tests drive `seed_shared_embedder_with_mock`
# which is gated behind `embedder-test-support`. Re-declaring trusty-common here
# with the feature activates it for all integration tests without enabling it in
# the production library (mirrors the trusty-mpm and trusty-search pattern).
# `docgen` (#5205 follow-up): `tests/generated_docs.rs` renders the MCP tool
# section of README.md from `tool_definitions()`.
# `memory-rpc` (#6286): `tests/uds_consumer_contract.rs` drives the SHARED
# client against a real daemon on a temp socket — the one place the two halves
# of this migration are proven to agree.
trusty-common = { path = "../trusty-common", version = "0.58", default-features = false, features = ["memory-core", "embedder-test-support", "docgen", "memory-rpc"] }
chrono = { workspace = true }
# #8341: the `trusty-installer` dev-dependency was REMOVED. Its only user was
# the #6555 arm of `tests/uds_consumer_contract.rs` — `tctl`'s real
# `probe_daemon_http` against this daemon's real router — which now lives in
# `crates/trusty-crate-contracts/tests/memory_uds_consumer.rs` over NORMAL
# dependencies on both crates. The edge added thirteen crates to every
# `cargo test -p trusty-memory` and `cargo clippy -p trusty-memory
# --all-targets`. `scripts/check_dev_dep_edges.sh` refuses a new edge of this
# shape.

[features]
# Why (#9269, ADR-0066 D1.4): the trusty-memory 1.x contract freezes the
#      engine library built with `--no-default-features`, so that build must
#      carry no serving surface — no trusty-mcp, no clap, no rusqlite. The
#      daemon, the CLI and every server module sit behind `server`.
# What: `default = ["server"]` keeps `cargo install trusty-memory` and
#      `cargo test -p trusty-memory` exactly as before. `daemon` is an alias
#      of `server` for all of 1.x (#6286 renamed `axum-server` to it).
#      `mcp-schema` compiles only the MCP tool schema and `MemoryMcpService`,
#      for a host that merges the schema into its own `rpc.discover` without
#      linking the daemon — trusty-agents is that host.
# Test: `tests/feature_gate.rs` (the manifest wiring) plus
#      `cargo check -p trusty-memory --no-default-features` and
#      `--no-default-features --features mcp-schema`.
default = ["server"]
# The socket-serving surface: `transport::uds`, `transport::methods`, `chat`,
# the `serve` / `start` commands, the CLI, and every daemon module.
server = [
    "mcp-schema",
    "dep:clap",
    "dep:rusqlite",
    "trusty-mcp/daemon-bridge-json-rpc",
    "trusty-common/monitor-tui",
    "trusty-common/bm25",
    "trusty-common/cli-help",
    "trusty-common/update-check",
    "trusty-common/bug-capture",
    "trusty-common/console-metrics",
    "trusty-common/config-cli",
    "trusty-common/crate-config",
    "trusty-common/palace-resolve",
    "trusty-common/codex-config",
    "trusty-common/uds",
    "trusty-common/machine-tier",
    # #9288: the protocol handshake's shared client half and answer shape.
    "trusty-common/memory-rpc",
]
# Alias of `server`, kept for all of 1.x (ADR-0066 D1.4).
daemon = ["server"]
# The MCP tool schema (`tools::tool_definitions*`, `openrpc`) and the
# `MemoryMcpService` descriptor. Its Rust types are out of the 1.x contract;
# only the feature name is frozen (ADR-0066 D7).
mcp-schema = ["dep:trusty-mcp"]
