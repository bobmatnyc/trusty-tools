[package]
name = "trusty-memory"
# #4421: patch bump — 0.23.0 already published on crates.io and this PR
# touches src/**. Every hunk is a doc-comment edit (module docs moved to the
# inner `//!` standard, #5754) — no item signature or behavior changed.
version = "0.23.2"
edition = "2021"
description = "MCP server (stdio + HTTP/SSE) for trusty-memory"
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["mcp", "memory", "vector-search", "knowledge-graph", "embeddings"]
categories = ["command-line-utilities", "development-tools"]

exclude = [".fastembed_cache/", "ui/node_modules/**"]

[lib]
# Why: Explicit `rlib` keeps the crate linkable as a Rust library from
#      host processes (trusty-agents) that want to register `MemoryMcpService`
#      directly via the shared `ServiceDescriptor` trait, rather than
#      spawning a separate MCP stdio child. Matches the rest of the
#      trusty-* ecosystem (see trusty-mcp-core) for consistency.
crate-type = ["rlib"]

[[bin]]
# Why: Ship a CLI binary so users can install via `cargo install trusty-memory`
#      and invoke `trusty-memory serve` (MCP stdio) or `trusty-memory migrate
#      kuzu-memory` to rewrite Claude settings files that reference the
#      legacy kuzu-memory MCP server.
# What: Thin clap-to-handler shim; all logic lives in the library + the
#      `commands` module.
# Test: `cargo run -p trusty-memory -- --help` lists `serve` and `migrate`.
name = "trusty-memory"
path = "src/main.rs"
# Why: `serve` / `start` boot the axum HTTP/SSE daemon, so the binary needs
#      the `axum-server` feature compiled in. Listing it here keeps
#      `--no-default-features` library builds (e.g. trusty-agents in-process linker
#      that only wants `MemoryMcpService`) from accidentally trying to build
#      this binary without axum and failing to link `run_http_*`.
required-features = ["axum-server"]

# Why (#5329): the `trusty-bm25-daemon` `[[bin]]` shim was REMOVED. BM25 no
# longer runs as a subprocess — `bm25_lane::Bm25Lane` owns the same
# `trusty_common::bm25::BM25Index` in-process, the way trusty-search always has.
# `cargo install trusty-memory` now produces one fewer binary.

[[bin]]
# Why: Compatibility shim for users who installed trusty-memory before the #914
#      PR3 epic (commit ba60e0c3) deleted the original byte-pipe bridge + UDS
#      transport. Those users have `trusty-memory-mcp-bridge` in their .mcp.json
#      and receive JSON-RPC -32000 because the binary no longer ships. This shim
#      restores the binary so existing configs stop breaking without requiring
#      per-project config edits. It emits a one-line deprecation notice to stderr
#      then re-execs `trusty-memory serve --stdio` (the canonical path since PR1).
#      The shim is intentionally thin (no library imports beyond std)
#      to minimise maintenance surface. Users should migrate to
#      `"command": "trusty-memory", "args": ["serve", "--stdio"]` at their
#      convenience; this shim will be removed in a future minor version.
# What: standalone binary at src/bin/mcp_bridge.rs; no required-features (no
#      axum, no redb — this binary never opens a database).
# Test: `cargo run --bin trusty-memory-mcp-bridge -- 2>&1 | grep DEPRECATED`
name = "trusty-memory-mcp-bridge"
path = "src/bin/mcp_bridge.rs"

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-memory`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `trusty-installer` (#1316).

[dependencies]
# Why: `axum-server` is gated on this crate's own `axum-server` feature so
#      downstream library consumers (e.g. `trusty-agents` linking
#      `trusty_memory::MemoryMcpService`) can drop the axum/tower-http
#      surface entirely by setting `default-features = false`. The default
#      build for the binary path keeps `axum-server` on (see [features]
#      below), so existing `cargo install` / `cargo build` flows are
#      unaffected.
# `bm25` (#5329) replaces the retired `bm25-client`: the lexical lane now links
# the index itself rather than a UDS client for a subprocess that holds it.
# `uds-supervisor` is NOT dropped — trusty-console and trusty-agents still
# depend on the shared `UdsServiceSupervisor` for trusty-review / trusty-analyze.
trusty-common = { path = "../trusty-common", version = "0.38", default-features = false, features = ["mcp", "memory-core", "monitor-tui", "bm25", "cli-help", "update-check", "bug-capture", "console-metrics", "config-cli", "crate-config", "palace-resolve", "codex-config"] }
# `bug-capture` enables Phase 1 ERROR event capture to JSONL + in-memory ring (bug-reporting #478)
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console
# is no longer bundled into trusty-memory (single-owner-per-binary); the
# standalone `trusty-console` crate is its sole producer.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# #4891: the backfill report reads a private COPY of each palace's redb store so
# that opening it can never write to the live file (see commands/backfill_report).
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Why (issue #226): axum + tower-http are HTTP-server only. Gating them behind
#      the `axum-server` feature mirrors the rule already enforced in
#      `trusty-common` and lets `trusty-agents` (which only links
#      `MemoryMcpService` for in-process `rpc.discover` merging) build a
#      slimmer dependency tree by setting `default-features = false`.
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
clap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
dashmap = { workspace = true }
# Issue #4639: LRU-bounded cache of per-palace chat_sessions.redb handles.
# `lru` + `parking_lot` are the exact pair `PalaceRegistry` already uses in
# trusty-common for the same fd-bounding job, so this reuses the established
# pattern with zero new lockfile entries.
lru = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
colored = { workspace = true }
# Why: `commands::stop` walks the process table to find the running daemon by
#      name + argv. `sysinfo` is the portable way to do that across macOS and
#      Linux; the same crate is already a workspace dependency used by
#      trusty-search and trusty-mpm-daemon, so this is zero new lockfile churn.
sysinfo = { workspace = true }
# Issue #96: persistent activity log lives in a dedicated redb file under the
# daemon data dir so the dashboard activity feed survives restarts. redb was
# already a transitive dev-dependency for the MCP stdio peer-lock test; this
# moves it to a runtime dependency.
redb = { workspace = true }
# Issue #105: optional SHA-256 hashing of `trigger_prompt` field in enriched
# prompt logs when `TRUSTY_MEMORY_PROMPT_LOG_HASH_PROMPTS=1`. `sha2` already
# lives in the workspace dependency table (used by trusty-common,
# trusty-analyze, trusty-mpm-core, trusty-gworkspace) so this adds no new
# lockfile churn.
sha2 = { workspace = true }
# `commands::daemon_lock` probes a recorded pid with `libc::kill(pid, 0)` and
# `fd_metrics` reads `RLIMIT_NOFILE` via `libc::getrlimit`. (#5329 removed the
# other caller, the BM25 spawn supervisor's SIGTERM path.)
libc = { workspace = true }
# Issue #220: rolling dedup window uses Jaro-Winkler similarity to detect
# near-duplicate memory writes within a short time window. `strsim` is
# already a workspace dep (used by the cli-help suggest feature in
# trusty-common), so this adds zero lockfile churn.
strsim = { workspace = true }
# Issue #278: encode/decode triple IDs as URL-safe base64 for the
# `DELETE /kg/triples/<id>` endpoint. Already in the workspace dependency table.
base64 = { workspace = true }
# Why: `monitor web` / `run_monitor_web` opens the daemon's web UI in the
# default system browser (issue #687). `open` provides a portable abstraction
# over `xdg-open` (Linux), `open` (macOS), and `start` (Windows) without
# pulling in a GUI toolkit. Matches the pattern in trusty-search.
open = "5"

[dev-dependencies]
tempfile = { workspace = true }
# libc: the #5267 TTY-gated notice can only be exercised by giving the child a
# REAL terminal on stdin, which needs openpty(3). A pipe proves the silent half
# of the contract; only a pty proves the human-facing half.
libc = { workspace = true }
# #5005: encode a real 384-dim vector when seeding a synthetic id collision
# into a palace's index redb, so HnswStore's dimension check accepts the file.
postcard = { workspace = true }
tower = { workspace = true }
serial_test = { workspace = true }
# Issue #1722: `task_mcp` integration tests drive `seed_shared_embedder_with_mock`
# which is gated behind `embedder-test-support`. Re-declaring trusty-common here
# with the feature activates it for all integration tests without enabling it in
# the production library (mirrors the trusty-mpm and trusty-search pattern).
# `docgen` (#5205 follow-up): `tests/generated_docs.rs` renders the MCP tool
# section of README.md from `tool_definitions()`.
trusty-common = { path = "../trusty-common", version = "0.38", default-features = false, features = ["memory-core", "embedder-test-support", "docgen"] }
chrono = { workspace = true }

[features]
# Why (issue #226): library consumers that only need `MemoryMcpService` for
#      in-process MCP discovery (e.g. `trusty-agents`) should not be forced to
#      compile the axum + tower-http HTTP/SSE surface. Mirrors the
#      `trusty-common` pattern where `axum-server` gates the same crates.
# Defaults to `axum-server` so the `trusty-memory` binary — and the standard
# `cargo install trusty-memory` / `cargo test -p trusty-memory` flows — keep
# building exactly as before. Consumers that
# want the slim library surface override with `default-features = false`.
default = ["axum-server"]
# Enables the axum HTTP/SSE daemon surface (`web`, `chat`, `run_http_*`,
# `sse_handler`, `bind_dynamic_port`, etc.). Pulls in `axum`, `tower-http`,
# and the matching `trusty-common/axum-server` feature flag.
axum-server = ["dep:axum", "dep:tower-http", "trusty-common/axum-server"]
