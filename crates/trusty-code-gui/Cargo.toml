[package]
name = "trusty-code-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Tauri desktop shell for trusty-code (tcode) — in-process bridge onto the daemon's Unix socket"
publish = false
license.workspace = true

[lib]
name = "trusty_code_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trusty-code-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri is not in [workspace.dependencies]; pinned locally.
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# #6637: the shell serves the webview's HTTP itself now, so it needs a router.
axum = { workspace = true }
# #6637: `uds` supplies the socket client (`send_framed_request`, the stream
# reader, `daemon_socket_path`); `axum-server` supplies the guard stack the
# daemon's own listener carried plus `uds::sse`, the SSE rendering hoisted out of
# trusty-console in PR 2a; `daemon-token` supplies `mint_token` and the
# `DaemonAuth` bearer/ticket guard the webview's requests carry.
trusty-common = { workspace = true, features = ["daemon-token", "axum-server", "uds"] }
# #10166: `ServiceExt::oneshot` runs the router in-process for the custom URI
# scheme and the stream command; axum already depends on it.
tower = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
http-body-util = { workspace = true }
# Test bodies that stream or never end (`stream::iter`, `stream::pending`).
futures-util = { workspace = true }
# Test-only: pins this crate's copies of the daemon's socket name, its two
# stream method names, and its JSON-RPC-to-HTTP status table against the
# originals, so the copies cannot drift in the window before #6637's PR 2c
# deletes them — see `src/bridge/mod.rs`'s tests.
trusty-code = { workspace = true }
