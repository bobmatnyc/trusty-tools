[package]
name = "trusty-code-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Tauri desktop shell for trusty-code (tcode) — thin client over the tcode daemon HTTP API"
publish = false
license.workspace = true

[lib]
name = "trusty_code_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trusty-code-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri is not in [workspace.dependencies]; pinned locally (matches trusty-mpm-gui).
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
