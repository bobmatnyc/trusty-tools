[package]
name = "trusty-code-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Tauri desktop shell for trusty-code (tcode) — thin client over the tcode daemon HTTP API"
publish = false
license.workspace = true

[lib]
name = "trusty_code_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trusty-code-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri is not in [workspace.dependencies]; pinned locally (matches trusty-mpm-gui).
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# #5439: `daemon-token` supplies `credential_for` — the shared loopback gate,
# override precedence, and `0600` file read that the shell (the only side that
# can read that file) hands to its webview. `axum-server` is deliberately NOT
# enabled: the gate lives in `daemon_token` precisely so a client-only consumer
# needs no router. The earlier version of this dependency did take it, for
# `server::origin_is_loopback` — an `Origin`-HEADER parser that read
# `http://127.0.0.1:7882@attacker.example` as loopback and leaked the token.
trusty-common = { workspace = true, features = ["daemon-token"] }

[dev-dependencies]
# serial_test: `commands::tests` mutate `TCODE_DAEMON_TOKEN`, which is shared
# across the threads `cargo test` runs a target's tests on.
serial_test = { workspace = true }
# Test-only: pins `DEFAULT_DAEMON_URL` (state.rs) against trusty-code's own
# `serve::DEFAULT_HTTP_PORT` so the two compiled-in defaults cannot drift
# apart silently the way they did in #3364 — see
# `default_daemon_url_matches_tcode_default_http_port` in `src/state.rs`.
trusty-code = { workspace = true }
