<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Trusty Code app-icon master (1024x1024). Derived from the CANONICAL Foundry
    robot mark: docs/design/UI/design-system/icons/RobotIcon.svelte, the "full"
    variant (filled dark bg square + rust stroke/details, hero usage). Colors
    are Foundry brand tokens from docs/design/UI/design-system/tokens.css: rust
    primary #b7410e and oxide chassis #2B1C12 (the full-variant bgFill literal).
    The outer squircle uses a slightly deeper oxide (#241610) so the rust
    outlined robot head reads with depth against the full-bleed background.
    The robot group re-expresses the 32-grid RobotIcon full markup verbatim
    (rounded-square face, antenna with dot, two eyes, terminal mouth, sparkle
    accent), scaled and centered with app-icon padding.
  -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#241610"/>

  <g transform="translate(512,512) scale(28.5) translate(-16,-14.375)"
     fill="none" stroke="#b7410e" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="9" width="20" height="18" rx="4" fill="#2B1C12" stroke="#b7410e"/>
    <line x1="16" y1="9" x2="16" y2="4" stroke="#b7410e"/>
    <circle cx="16" cy="3" r="1.25" fill="#b7410e" stroke="none"/>
    <circle cx="12" cy="16" r="1.25" fill="#b7410e" stroke="none"/>
    <circle cx="20" cy="16" r="1.25" fill="#b7410e" stroke="none"/>
    <polyline points="11.5,21 13.5,22.5 11.5,24" stroke="#b7410e" fill="none"/>
    <line x1="15" y1="24" x2="20.5" y2="24" stroke="#b7410e"/>
    <path d="M26 6 L26 9 M24.5 7.5 L27.5 7.5" stroke="#b7410e" stroke-width="1.25"/>
  </g>
</svg>
