<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B7410E" />
    <meta name="color-scheme" content="light dark" />
    <title>trusty-code</title>
    <style>
      /* Foundry design system fonts (docs/design/UI/design-system/README.md
         install step), self-hosted from public/fonts/ — Tauri desktop apps
         must work fully offline and the CSP (`app.security.csp`) should
         never need a remote font-origin allowance, so these are NOT linked
         from fonts.googleapis.com. Files copied from the existing
         crates/trusty-agents/ui/public/fonts/ bundle (latin-subset woff2,
         OFL-1.1 licensed — see the OFL-*.txt files alongside them). IBM
         Plex Sans ships as one variable-font file covering weights 400-700;
         Chakra Petch and IBM Plex Mono ship as separate static files per
         weight actually used (500/600/700 display, 400/500/600 mono). */
      @font-face {
        font-family: 'Chakra Petch';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/chakra-petch-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Chakra Petch';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/chakra-petch-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Chakra Petch';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/chakra-petch-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/ibm-plex-sans-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-600.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
