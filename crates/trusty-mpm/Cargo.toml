[package]
name = "trusty-mpm"
version = "0.19.23"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "trusty-mpm: unified multi-agent orchestration platform (core, daemon, CLI, TUI, Telegram)"
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["orchestration", "multi-agent", "cli", "daemon", "mcp"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.claude/", "/.trusty-mpm/", "/CLAUDE.md"]

# ── Feature flags ─────────────────────────────────────────────────────────────
#
# Default features build the unified `tm` / `trusty-mpm` binary with daemon,
# TUI, and Telegram support baked in. Users who only want the libraries can
# opt out with `--no-default-features`.
#
# Each optional library module is gated behind a matching feature flag so
# users only pay the compile cost for the components they actually need.
[features]
default = ["cli", "daemon"]

# `cli` gates the `tm` / `trusty-mpm` binary (embeds daemon + tui + telegram + slack).
cli = ["daemon", "tui", "telegram", "slack"]

# `daemon` gates the daemon library module and the `daemon` subcommand.
# Activating `daemon` also pulls in `mcp` (the daemon implements OrchestratorBackend).
daemon = ["mcp",
          "dep:axum", "dep:tower", "dep:tower-http",
          "dep:tokio-stream", "dep:futures",
          "dep:dashmap", "dep:parking_lot",
          "dep:notify", "dep:tracing-appender",
          "dep:tokio-util"]

# `swagger-ui` adds utoipa-swagger-ui to the daemon HTTP server so the
# built-in API explorer is reachable at `/api-docs`. NOT included in
# `daemon` by default so offline or air-gapped builds (which cannot pull
# the swagger-ui static assets) can compile with `--no-default-features
# --features daemon`. Enable with `--features swagger-ui` when you want
# the in-process explorer (closes #1694).
swagger-ui = ["dep:utoipa-swagger-ui"]

# `mcp` gates the MCP server library module.
# (`async-trait`, used by the OrchestratorBackend trait, is now an always-on
# dependency because the SM providers' `LlmProvider` trait needs it too — SM-2.)
mcp = []

# `tui` gates the TUI library module (`tm tui`).
tui = ["dep:ratatui", "dep:crossterm"]

# `telegram` gates the Telegram bot library module (`tm telegram`).
telegram = ["dep:teloxide", "dep:tokio-util"]

# `slack` gates the Slack bot library module (`tm slack`, DOC-20 adapter #1294).
# Pulls the WebSocket client used for Slack Socket Mode plus the streaming
# futures combinators it needs; kept opt-in (in `cli`'s default set, mirroring
# `telegram`) so a `--no-default-features` build pays no Slack cost.
slack = ["dep:tokio-tungstenite", "dep:futures-util"]

# `bedrock` gates the Session Manager's AWS Bedrock provider (SM-2, DOC-14 §5.1).
# NOT in `default`: it pulls the heavy `aws-sdk-bedrockruntime` stack, so the
# Bedrock provider weight is strictly opt-in. Build/test with `--features bedrock`.
#
# As of #2411 the SM Bedrock provider is a thin bridge onto the shared
# `trusty_common::inference::bedrock` Converse adapter (#2407) instead of a
# private aws-sdk port — so this feature now just turns on the commons
# `bedrock-client` feature, which pulls the AWS SDK stack in ONE place. The
# direct `aws-config`/`aws-sdk-bedrockruntime`/`aws-types` deps were dropped here.
bedrock = ["trusty-common/bedrock-client"]

# `sm-memory` gates the Session Manager's dedicated memory palace (SM-4, DOC-14
# §8). NOT in `default`: it turns on `trusty-common/memory-core`, which pulls the
# heavy Memory Palace storage engine (usearch/hnsw_rs HNSW vector index, redb +
# postcard stores, git2, and the bundled-ORT FastEmbedder). Keeping it opt-in
# means a `--no-default-features` build — and even the default daemon build —
# does NOT pay the ONNX/usearch compile or runtime cost unless the operator
# explicitly opts the SM memory subsystem in. Build/test with `--features
# sm-memory`. The `core::sm::memory` module is compiled only under this flag.
#
# Production hygiene (SM-4 review): this feature deliberately does NOT enable
# `trusty-common/embedder-test-support`. That test double (and its
# `seed_shared_embedder_with_mock` seam) must never link into a production
# `--features sm-memory` build. The SM-4 unit tests still need the mock
# embedder to run without the ONNX model, so the test-support feature is wired
# in via `[dev-dependencies]` below — Cargo unifies dev-dependency features only
# for test/bench/example builds, so `cargo test` gets the mock while a plain
# `cargo build --features sm-memory` does not.
sm-memory = ["trusty-common/memory-core"]

# `manager-memory` gates the Layer-3 `tm manager` PORTFOLIO memory palace (WI-5,
# #2582, DOC-36 §3.4) — a single portfolio-scoped `trusty-memory` palace holding
# digest history, escalation dispositions, and portfolio chat turns, distinct
# from the SM palace and every per-project palace. Like `sm-memory` it is NOT in
# `default`: it turns on `trusty-common/memory-core` (the heavy HNSW/ONNX Memory
# Palace engine), so a default daemon build pays no ONNX/usearch cost. Without
# this feature the portfolio palace reports "unavailable" and the manager surface
# still works (DOC-36 §4 degrade bar). The `daemon::manager::memory` live binding
# is compiled only under this flag. Build/test with `--features manager-memory`;
# the `embedder-test-support` dev-dependency below supplies the mock embedder so
# `cargo test --features manager-memory` runs without the ONNX model.
manager-memory = ["trusty-common/memory-core"]

# `gui` is intentionally a no-dep CLI-gating feature. The `tm gui` subcommand
# is ALWAYS available; this flag exists only so the subcommand can optionally
# advertise itself. The Tauri GUI lives in the separate, publish=false
# `trusty-mpm-gui` crate (it owns `build.rs` + `tauri.conf.json` which cannot be
# published cleanly to crates.io). Rather than pull that unpublishable crate in
# as an optional Cargo dependency — which blocks `cargo publish` for trusty-mpm,
# because cargo requires even optional deps to resolve on crates.io — `tm gui`
# shells out to a separately-installed `trusty-mpm-gui` binary (Single-Install
# convention: `cargo install trusty-mpm-gui`). See src/bin/tm/main.rs.
gui = []

# ── Library ────────────────────────────────────────────────────────────────────
[lib]
name = "trusty_mpm"
path = "src/lib.rs"

# ── Binaries ───────────────────────────────────────────────────────────────────

[[bin]]
name = "tm"
path = "src/bin/tm/main.rs"
required-features = ["cli"]

[[bin]]
name = "trusty-mpm"
path = "src/bin/tm/main.rs"
required-features = ["cli"]

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-mpm`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `tctl` (#1316).

# ── Integration tests ─────────────────────────────────────────────────────────
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["daemon"]

# Services discovery integration test (gated #[ignore]; run with --include-ignored).
[[test]]
name = "services_integration"
path = "tests/services_integration.rs"

# WI-7: isolation-invariant integration tests for the standalone managed driver.
# No special features required — uses only the always-on `core::standalone` module.
[[test]]
name = "standalone_isolation"
path = "tests/standalone_isolation.rs"

# ── Always-on dependencies ─────────────────────────────────────────────────────
# Required by the `core` and `client` library modules (compiled unconditionally).
[dependencies]
trusty-agents-common = { workspace = true }
trusty-common = { workspace = true, features = [
    "mcp",
    "cli-help",
    "bug-capture",
    "crate-config",
    "console-metrics",
    "intent-source",
    # DOC-28 catch-up engine (PR1, #1762): moves the catch-up module out of
    # trusty-mpm/src/core/ into trusty-common so trusty-code can share it.
    "catchup",
    # SPEC-ONESM-01 / DOC-33: canonical tmux-session naming was hoisted into
    # trusty-common so trusty-agents can reuse it. `core::names` re-exports it.
    "session-naming",
    # #2486: reuses `trusty_common::update::is_launchd_supervised` for the
    # daemon-restart-race supervision signal (see daemon_run.rs / api/types.rs).
    # Zero extra transitive deps — see the feature's Cargo.toml comment.
    "update-check",
    # #2405: the universal `tm config keys …` inference-provider credential CLI.
    "config-cli",
    # #2580/#2581 (DOC-36 §3.3): the Layer-3 `tm manager` digest/chat handlers
    # resolve providers and issue chat calls through the unified
    # `trusty_common::inference` adapter/Configurator. `config-cli` already implies
    # `inference-client`; listing it explicitly documents the direct dependency so
    # a future config-cli change can't silently drop the manager's inference core.
    "inference-client",
    # Shared best-effort trusty-search index register+reindex helper
    # (`search_index::register_project_index` → `trusty_common::search_index`).
    # Promoted out of trusty-mpm so trusty-code can reuse the ONE implementation.
    "search-index",
] }
# `bug-capture` enables Phase 1 ERROR event capture to JSONL + in-memory ring (bug-reporting #478)
# `console-metrics` enables `trusty_common::console_metrics` (used unconditionally by
# `daemon/mcp_console.rs`). Without it, `cargo check -p trusty-mpm` and `cargo publish`
# fail to resolve the module — workspace feature-unification masks this under `cargo test`.
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console is
# no longer bundled into trusty-mpm (single-owner-per-binary); the standalone
# `trusty-console` crate is its sole producer.
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
gray_matter.workspace = true
walkdir.workspace = true
dirs.workspace = true
# Used by statusline/compaction.rs for atomic state-file writes (NamedTempFile::persist).
tempfile.workspace = true
sha2.workspace = true
regex.workspace = true
# #2734: quote-aware shell word-splitting for the PM Bash guard's git-argv
# parsing (`src/bin/tm/commands/pm_guard_bash/shell_lex.rs`).
shlex.workspace = true
jsonwebtoken.workspace = true
utoipa.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tokio.workspace = true
# #2602: bounds the manager ChatStore's distinct conversation-key set with a
# capacity-evicting LRU cache — see daemon/manager/chat_store.rs.
lru.workspace = true
# async-trait is needed by the SM providers' `LlmProvider` trait (SM-2), which is
# compiled unconditionally in the `core` library. (The `mcp` feature also lists it
# below for the OrchestratorBackend trait; declaring it here makes it always-on.)
async-trait.workspace = true

# Always-on CLI/binary support deps.
# These are pulled in by the bin targets; having them always-on is acceptable
# because the library itself does not depend on them directly.
clap.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
sysinfo.workspace = true
libc.workspace = true
unicode-width.workspace = true
# Portable executable lookup on PATH (replaces the non-portable `which` shell-out
# in the tcode runtime adapter's availability probe — see #1213).
which.workspace = true
# Shared rustup/cargo-style spinner used around the blocking managed-spawn POST
# in the guided `tm` on-ramp so first-run clone/provisioning is no longer a
# silent multi-minute hang (issue #1904).
trusty-progress = { workspace = true }
# rusqlite: formerly a direct dep for the claude-mpm session-registry reader
# (DOC-28 cutover bridge, #1762). Now consumed transitively via
# trusty-common/catchup feature — removed from direct deps (PR1, refs #1762).

# ── Optional dependencies (feature-gated) ────────────────────────────────────

# bedrock feature (SM-2): the AWS SDK stack is no longer a direct dependency
# here. As of #2411 the SM Bedrock provider bridges onto
# `trusty_common::inference::bedrock` (the shared #2407 Converse adapter), so the
# `aws-config`/`aws-sdk-bedrockruntime`/`aws-types` crates are pulled transitively
# via `trusty-common/bedrock-client` (see the `bedrock` feature above) — the one
# place the AWS SDK weight lives now.

# daemon feature
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }

# tui feature
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# telegram feature
teloxide = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# slack feature (DOC-20 adapter #1294): Socket-Mode WebSocket client + stream
# combinators. Same pinned version/features the trusty-agents crate already uses,
# so no new Cargo.lock entries are introduced.
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# NOTE: trusty-mpm-gui is deliberately NOT a Cargo dependency. It is a
# publish=false Tauri crate that cannot resolve on crates.io, so declaring it
# (even as an optional dep) blocks `cargo publish` for trusty-mpm. The `tm gui`
# subcommand shells out to a separately-installed `trusty-mpm-gui` binary
# instead — see the `gui` feature comment above and src/bin/tm/main.rs.

# ── Platform-specific always-on deps ─────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# ── Dev dependencies ───────────────────────────────────────────────────────────
[dev-dependencies]
# Re-declare trusty-common with `embedder-test-support` (SM-4 review): Cargo
# merges dev-dependency features ONLY for test/bench/example builds, so this
# turns on the mock-embedder seam (`seed_shared_embedder_with_mock`) for
# `cargo test --features sm-memory` WITHOUT leaking it into a production
# `cargo build --features sm-memory`. `memory-core` is repeated so the unified
# feature set still includes the palace storage engine the SM-4 tests exercise.
trusty-common = { workspace = true, features = [
    "memory-core",
    "embedder-test-support",
    # #2584 (DOC-36 §4): the hermetic manager CI suite drives the digest/chat
    # routes with `ScriptedAdapter` and, for real HTTP-client mechanics,
    # `test_support::MockInferenceServer` — the latter is gated behind
    # `axum-server`. `inference-client` is listed for clarity (the runtime dep
    # already enables it via `config-cli`); `axum-server` is the dev-only
    # addition that exposes the loopback mock server.
    "inference-client",
    "axum-server",
] }
# DEV-ONLY (DOC-15 C5 / #1362): the cross-gate AC-18 golden test
# (`tests/conformance_cross_gate.rs`) drives BOTH conformance gates from one
# shared `trusty_common::intent_source::ResolvedIntent` — the trusty-mpm FRONT
# gate (`front_gate_disposition`) and the trusty-review BACK gate
# (`ConformanceSource::would_flag`). trusty-review is a dev-dependency ONLY (it
# is NOT a runtime dependency of trusty-mpm, and neither crate depends on the
# other normally, so this introduces no dependency cycle and adds zero cost to a
# production `cargo build`).
trusty-review = { workspace = true }
tempfile.workspace = true
axum.workspace = true
http-body-util.workspace = true
# serial_test: run env-mutating tests serially to prevent env-var races across
# parallel Rust test threads (used by bug-report token resolution tests).
serial_test.workspace = true
# test-util enables tokio's paused-clock (`tokio::time::pause` / `start_paused = true`)
# used by the deterministic auth-timeout tests in actor_tests.rs (#1649).
tokio = { workspace = true, features = ["test-util"] }
