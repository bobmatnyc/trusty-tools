[package]
name = "trusty-channels"
version = "0.1.0"
edition = "2021"
description = "Native chat-channel MCP servers (Slack, …) for the Trusty suite — chat-as-tools"
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "slack-mcp"
path = "src/bin/slack-mcp.rs"

[[bin]]
name = "telegram-mcp"
path = "src/bin/telegram-mcp.rs"

[[bin]]
name = "gchat-mcp"
path = "src/bin/gchat-mcp.rs"

[dependencies]
# #8454 S2b: crate-config locates the host config.yaml.
trusty-common = { workspace = true, features = ["credentials", "crate-config"] }
# JSON-RPC / MCP primitives, extracted from `trusty_common::mcp` by ADR-0040 (#5803).
trusty-mcp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
comrak = { workspace = true }
# gchat: RS256 service-account assertions and Pub/Sub base64 payloads (#9448).
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# gchat routes, ledger and audit (#9448 S2a): routes.toml parsing, review
# notice URL check, RFC 3339 timestamps. All three are already in the graph.
toml = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# #8454 S2a: strict parse of the host `channels:` section of config.yaml.
serde_yaml = { workspace = true }
# #8454 S2b: the home directory for the host file and `~/` entries.
dirs = { workspace = true }
# #8454 S2b: O_NOFOLLOW and O_NONBLOCK for opening a route or host file;
# std names neither. Already in the graph via tokio.
libc = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
# gchat tests generate a throwaway RSA key at run time so no PEM is committed
# (#9448). Already in the graph via jsonwebtoken's `aws_lc_rs` backend, with
# the same default features, so it adds no compile.
aws-lc-rs = "1"
# gchat-mcp poller test captures the tracing output it logs (#9448 S2b).
# Already in the graph via trusty-common's tracing init.
tracing-subscriber = { workspace = true }
