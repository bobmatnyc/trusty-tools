[package]
name = "trusty-channels"
version = "0.1.0"
publish = false
edition = "2021"
description = "Native chat-channel MCP servers (Slack, …) for the Trusty suite — chat-as-tools"
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "slack-mcp"
path = "src/bin/slack-mcp.rs"

[[bin]]
name = "telegram-mcp"
path = "src/bin/telegram-mcp.rs"

[dependencies]
trusty-common = { workspace = true, features = ["mcp", "credentials"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
comrak = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
serial_test = { workspace = true }
