[package]
name = "trusty-channels"
version = "0.1.0"
# ADR-0029 lists this crate as an explicit opt-down to 2021.
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Chat channels for the trusty-* tools: a deny-by-default route policy, a route-checked Google Chat MCP server, and Slack and Telegram API clients."
keywords = ["mcp", "slack", "google-chat", "chat", "policy"]
categories = ["api-bindings", "command-line-utilities"]
homepage = "https://trustytools.dev"
readme = "README.md"
# #8454: ship the library, the binaries and the user-facing docs only. Left
# out: `tests/` (fake tokens, wiremock fixtures), `changelog.d/` (assembled
# into CHANGELOG.md at release), and `docs/` (one workspace's Slack app
# manifest, not a usage document).
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
# #8454 (ruling Q7): every binary is listed below, so a new `src/bin/*.rs`
# cannot build by default without passing `tests/publish_surface.rs`.
autobins = false
autoexamples = false

[features]
default = []
# #8454 (ruling Q7): `slack-mcp` posts, schedules, reacts and writes canvases
# with no route check, so the default build and `cargo install
# trusty-channels` do not produce it. Opt in knowingly:
# `cargo install trusty-channels --features unrouted-slack-mcp`.
unrouted-slack-mcp = []

[lib]
crate-type = ["rlib"]

[[bin]]
name = "slack-mcp"
path = "src/bin/slack-mcp.rs"
# #8454: unrouted sender; see the `unrouted-slack-mcp` feature above.
required-features = ["unrouted-slack-mcp"]

[[bin]]
name = "telegram-mcp"
path = "src/bin/telegram-mcp.rs"

[[bin]]
name = "gchat-mcp"
path = "src/bin/gchat-mcp.rs"

# #8454: these drive `slack::handlers` / `slack::server`, which exist only
# with `unrouted-slack-mcp`.
[[test]]
name = "tools_http"
required-features = ["unrouted-slack-mcp"]

[[test]]
name = "slack_list_http"
required-features = ["unrouted-slack-mcp"]

[[test]]
name = "canvas_push_http"
required-features = ["unrouted-slack-mcp"]

[dependencies]
# #8454 S2b: crate-config locates the host config.yaml.
trusty-common = { workspace = true, features = ["credentials", "crate-config"] }
# JSON-RPC / MCP primitives, extracted from `trusty_common::mcp` by ADR-0040 (#5803).
trusty-mcp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
comrak = { workspace = true }
# gchat: RS256 service-account assertions and Pub/Sub base64 payloads (#9448).
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# gchat routes, ledger and audit (#9448 S2a): routes.toml parsing, review
# notice URL check, RFC 3339 timestamps. All three are already in the graph.
toml = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# #8454 S2a: strict parse of the host `channels:` section of config.yaml.
serde_yaml = { workspace = true }
# #8454 S2b: the home directory for the host file and `~/` entries.
dirs = { workspace = true }
# #8454 S2b: O_NOFOLLOW and O_NONBLOCK for opening a route or host file;
# std names neither. Already in the graph via tokio.
libc = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
# gchat tests generate a throwaway RSA key at run time so no PEM is committed
# (#9448). Already in the graph via jsonwebtoken's `aws_lc_rs` backend, with
# the same default features, so it adds no compile.
aws-lc-rs = "1"
# gchat-mcp poller test captures the tracing output it logs (#9448 S2b).
# Already in the graph via trusty-common's tracing init.
tracing-subscriber = { workspace = true }
