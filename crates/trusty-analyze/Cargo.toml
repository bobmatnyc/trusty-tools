[package]
name        = "trusty-analyze"
# 🔴 #5067 removed public API — `EmbedderKind::Neural`, `embedder::NeuralEmbedder`,
# the `bundled-ort` / `load-dynamic` / `cuda` features, and the type of
# `ClusterQueryParams::method`. The next release MUST be 0.9.0, not 0.8.x.
# CI does not detect SemVer breaks (#4088, the gap that got 0.7.3 yanked), so
# this comment and the changelog fragment are the only record. Version bumps
# stay with `local-ops` — do not bump here as a side effect of another change.
version     = "0.8.0"
edition     = "2021"
license.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage             = "https://github.com/bobmatnyc/trusty-tools"
readme               = "README.md"
description = "Sidecar code-analysis daemon for trusty-search: complexity, smells, quality, facts"
keywords    = ["code-analysis", "complexity", "code-smells", "mcp", "daemon"]
categories  = ["development-tools", "command-line-utilities"]
build       = "build.rs"
exclude     = [
    "ui/node_modules",
    "ui/src",
    "ui/package.json",
    "ui/vite.config.js",
    "ui/pnpm-lock.yaml",
    "ui/pnpm-workspace.yaml",
]

[[bin]]
name = "trusty-analyze"
path = "src/main.rs"
# Why (issue #249): the `trusty-analyze` binary boots the axum HTTP daemon and
# the axum-backed MCP HTTP/SSE transport, so it needs the `http-server` feature
# compiled in. Listing it here keeps `--no-default-features` library builds
# (e.g. consumers that only want the CLI types or the pure dispatcher) from
# accidentally trying to build this binary without axum and failing to link
# the `service` and `mcp::sse` modules.
required-features = ["http-server"]

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-analyze`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `tctl` (#1316).

[lib]
name = "trusty_analyze"
path = "src/lib.rs"

[dependencies]
tokio              = { workspace = true }
# Why (issue #249): axum + tower-http are HTTP-server only. Gating them behind
#      the `http-server` feature mirrors the rule already enforced in
#      `trusty-common` (`axum-server`) and `trusty-memory` so downstream library
#      consumers can drop the HTTP stack entirely with `default-features = false`.
axum               = { workspace = true, optional = true }
tower-http         = { workspace = true, optional = true }
reqwest            = { workspace = true, features = ["http2"] }
futures-util       = { workspace = true }
futures            = { workspace = true }
tokio-stream       = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
chrono             = { workspace = true }
async-trait        = { workspace = true }
clap               = { workspace = true }
clap_complete      = { workspace = true }
colored            = { workspace = true }
dirs               = { workspace = true }
which              = { workspace = true }
tempfile           = { workspace = true }
# Why: process-group kill on timeout for run_command_with_timeout. Used only on
#      Unix (POSIX setsid + killpg) and gated behind #[cfg(unix)] at call sites
#      so Windows builds are unaffected. libc 0.2 is already a workspace dep.
libc               = { workspace = true }
open               = { workspace = true }
redb               = { workspace = true }
dashmap            = { workspace = true }
rust-embed         = { workspace = true }
mime_guess         = { workspace = true }
# `webhook-relay` (#5182): the console->target relay wire contract AND its
# receive half — the durable inbox, the listener, and the hardened UDS bind
# this crate mounts in `webhook_listener`. Implies `uds` and `webhook-hmac`.
trusty-common      = { workspace = true, features = ["symgraph", "cli-help", "update-check", "bedrock", "mcp", "console-metrics", "config-cli", "webhook-relay"] }
tree-sitter            = { workspace = true }
tree-sitter-rust       = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python     = { workspace = true }
tree-sitter-java       = { workspace = true }
tree-sitter-go         = { workspace = true }
tree-sitter-ruby       = { workspace = true }
tree-sitter-php        = { workspace = true }
tree-sitter-c          = { workspace = true }
tree-sitter-cpp        = { workspace = true }
tree-sitter-c-sharp    = { workspace = true }
tree-sitter-kotlin-ng  = { workspace = true }
tree-sitter-swift      = { workspace = true }
tree-sitter-scala      = { workspace = true }
ndarray            = { workspace = true }
scip               = { workspace = true }
protobuf           = { workspace = true }
xxhash-rust        = { workspace = true }
base64             = { workspace = true }
hmac               = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
# Why (#5067): the `fastembed` dependency was REMOVED. It backed a neural
#      concept-clustering embedder that no caller ever selected, yet
#      `NeuralEmbedder::new()` ran at every daemon boot and made an untimed
#      hf-hub request that blocked startup for as long as that request took
#      (31m46s measured in production). `ort`/`tokenizers` stay because the
#      unrelated, off-by-default `ner` feature uses them; neither is on the
#      boot path.
ort        = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# Why (#630): trusty-review provides the reusable LLM review pipeline + MCP tool
#      surface. Optional and OFF by default so `cargo install trusty-analyze`
#      and the crates.io publish are unaffected (trusty-review need not be
#      published). The `review` feature pulls it in with its `mcp` feature.
trusty-review = { workspace = true, optional = true }
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console
# is no longer bundled into trusty-analyze (single-owner-per-binary); the
# standalone `trusty-console` crate is its sole producer.

[features]
# Why (issue #249): mirrors the `trusty-common` / `trusty-memory` rule that
#      axum + tower-http are HTTP-server-only deps. Defaults to `http-server`
#      so the `trusty-analyze` binary — and the standard `cargo install
#      trusty-analyze` / `cargo test -p trusty-analyze` flows — keep building
#      exactly as before. Library consumers that only want the dispatcher /
#      CLI types override with `default-features = false`.
#
# Why (#5067): `bundled-ort` (and its `load-dynamic` / `cuda` siblings) were
#      REMOVED from the default set and from the crate. They existed only to
#      pick an ONNX Runtime backend for the neural clustering embedder, which
#      no caller selected and which cost every boot an untimed hf-hub request.
#      Removing them also removes ONNX Runtime from the shipped binary, which
#      is why `trusty-analyze` no longer needs the AL2023 load-dynamic release
#      asset or the installer's glibc-aware asset routing.
default = ["http-server"]
# Enables the axum HTTP daemon surface (the `service` module and the
# `mcp::sse` HTTP/SSE transport). Pulls in `axum`, `tower-http`, and the
# matching `trusty-common/axum-server` feature flag.
http-server = ["dep:axum", "dep:tower-http", "trusty-common/axum-server"]
# Optional ONNX NER over doc comments (`core::ner`). OFF by default and not on
# the boot path — `NerExtractor::try_load` is only reached from entity
# extraction, and it is a no-op unless the operator drops a model into place.
ner     = ["dep:ort", "dep:tokenizers"]
# Why (#630): exposes the trusty-review LLM review pipeline as MCP tools
#      (`tr_review_pr`, `tr_review_diff`, `tr_review_health`). OFF by default so
#      the standard `cargo install` / crates.io publish do not require
#      trusty-review to be published. Pulls in trusty-review with its `mcp`
#      feature so the reusable tool surface (`tools::call_tool`, `AppState`,
#      `build_review_state`) is reachable.
review  = ["dep:trusty-review", "trusty-review/mcp"]

[package.metadata.docs.rs]
# Why: docs.rs builds with no features by default; the binary requires
#      http-server which pulls in axum. Listing it here ensures the full
#      public API surface (service module) is documented on docs.rs.
features = ["http-server"]

[dev-dependencies]
tempfile       = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
# docgen (#5205 follow-up): `tests/generated_docs.rs` renders the MCP tool
# section of README.md / CLAUDE.md from the descriptor functions. Test-facing
# only, so the feature is enabled here rather than on the production dep.
trusty-common     = { workspace = true, features = ["docgen"] }
