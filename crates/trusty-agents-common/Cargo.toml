[package]
name = "trusty-agents-common"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stable agent-plugin surface (ToolExecutor, AgentPlugin, ToolResult) shared by trusty-agents and external agent crates."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["agent", "orchestration", "plugin", "rpc", "traits"]
categories = ["development-tools", "asynchronous"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Wave 1 (issue #862): session_registry.rs needs anyhow + chrono.
anyhow = { workspace = true }
chrono = { workspace = true }
# adapters/patterns.rs uses regex for pattern compilation.
regex = { workspace = true }
# Wave 3 P0 (issue #875): events::bus uses tokio::sync::broadcast for the
# process-global event bus. The workspace `tokio` already enables "full"
# (which includes the `sync` feature that provides `broadcast`).
tokio = { workspace = true }
# agents::manifest hashes deployed content for the ownership ledger (#2892).
sha2 = { workspace = true }
# agents::manifest::ManifestError is a self-contained thiserror enum (#2892).
thiserror = { workspace = true }
# agents::deployer warns once on untracked-modified files (#2892).
tracing = { workspace = true }

[dev-dependencies]
# session_registry tests use tempfile for isolated state-dir creation.
tempfile = { workspace = true }
# events::tests use serial_test to serialise tests that share the
# process-global broadcast bus (issue #2961; precedent: #2271 bm25_client).
serial_test = { workspace = true }
