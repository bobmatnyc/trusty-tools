[package]
name = "trusty-agents-common"
# #4421: patch bump — 0.5.2 already published on crates.io and this PR
# touches src/**. Every hunk in this bump is a doc-comment edit (module docs
# moved to the inner `//!` standard, #5754) — no item signature or behavior
# changed, so a patch asserts no breaking change.
version = "0.5.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stable agent-plugin surface (ToolExecutor, AgentPlugin, ToolResult) shared by trusty-agents and external agent crates."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["agent", "orchestration", "plugin", "rpc", "traits"]
categories = ["development-tools", "asynchronous"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# agents::frontmatter::validate_frontmatter strict-parses composed/deployed
# agent frontmatter with a real YAML parser (issue #3556) — trusty-mpm's own
# `parse_kv_line` is deliberately lenient (first-colon-only split) and cannot
# catch what a strict consumer (e.g. trusty-agents' `serde_yaml`-based
# `parse_md_agent`) rejects.
serde_yaml = { workspace = true }
# Wave 1 (issue #862): session_registry.rs needs anyhow + chrono.
anyhow = { workspace = true }
chrono = { workspace = true }
# adapters/patterns.rs uses regex for pattern compilation.
regex = { workspace = true }
# Wave 3 P0 (issue #875): events::bus uses tokio::sync::broadcast for the
# process-global event bus. The workspace `tokio` already enables "full"
# (which includes the `sync` feature that provides `broadcast`).
tokio = { workspace = true }
# agents::manifest hashes deployed content for the ownership ledger (#2892).
sha2 = { workspace = true }
# agents::manifest::ManifestError is a self-contained thiserror enum (#2892).
thiserror = { workspace = true }
# agents::deployer warns once on untracked-modified files (#2892).
tracing = { workspace = true }
# workstreams::ledger assigns each Workstream a UUIDv4 id (#3008, twin Phase 2).
uuid = { workspace = true }
# transport::aggregate_live is Stream-combinator based (filter_map over a
# boxed EventSource stream); StreamExt is not in std (#3299, DOC-48 AC-7).
futures-util = { workspace = true }
# agents::manifest serialises the deploy ledger's read-modify-write across
# PROCESSES (#4409): the agent deploy target became one machine-global
# directory shared by every concurrent session launch, sync-assets run, and
# `tm catalog apply`, so an in-process Mutex cannot help. Same crate and same
# sidecar-lock convention `trusty_common::json_rmw` uses for the identical
# whole-file-JSON hazard (#3502).
fd-lock = { workspace = true }

[dev-dependencies]
# session_registry tests use tempfile for isolated state-dir creation.
tempfile = { workspace = true }
# events::tests use serial_test to serialise tests that share the
# process-global broadcast bus (issue #2961; precedent: #2271 bm25_client).
serial_test = { workspace = true }
# transport_tests exercises EventSource over a real tokio broadcast channel,
# wrapped as a Stream via BroadcastStream (#3299).
tokio-stream = { workspace = true }
