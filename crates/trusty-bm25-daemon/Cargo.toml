[package]
name = "trusty-bm25-daemon"
version = "0.1.3"
publish = true
edition = "2021"
rust-version = "1.91"
description = "Per-palace BM25 lexical-index subprocess for the trusty-* ecosystem (issue #156)"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["mcp", "bm25", "search", "daemon"]
categories = ["command-line-utilities"]

[lib]
# Why: exposing a [lib] target lets trusty-memory bundle the
# trusty-bm25-daemon binary without a separate `cargo install` step — the
# bundler crate declares this as a dependency and adds its own thin
# [[bin]] shim. Mirrors PR #190 (trusty-embedderd / trusty-search).
# What: rlib so it is linkable from the bundled-install shim. Both `name`
# and `path` are spelled out explicitly so the lib target is unambiguous
# even if the directory layout changes.
# Test: `cargo build -p trusty-bm25-daemon` produces the library.
name = "trusty_bm25_daemon"
path = "src/lib.rs"
crate-type = ["rlib"]

# Why (issue #1318): single-owner-per-binary — the standalone `trusty-bm25-daemon`
# crate is now LIBRARY-ONLY. The `trusty-bm25-daemon` binary is produced solely
# by `trusty-memory` (the host that bundles + spawns it), so there is exactly one
# producing crate for the binary name and `cargo install trusty-memory` no longer
# collides on `.crates2.json` binary ownership. This crate is still published to
# crates.io as a LIBRARY (dependent published crates require it). The former
# `[[bin]]`/`src/main.rs` shim was removed; it now lives ONLY as
# `crates/trusty-memory/src/bin/bm25_daemon.rs`.

[dependencies]
# Uses the in-tree, zero-dep BM25 implementation from trusty-common
# (`bm25` feature). Keeps the tokenizer's camelCase / alpha↔digit splits
# in lock-step with every other consumer (trusty-search, trusty-memory).
trusty-common = { workspace = true, features = ["bm25"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The integration test drives the daemon through the same client surface
# real consumers use, so enable the `bm25-client` feature here.
trusty-common = { workspace = true, features = ["bm25", "bm25-client"] }
