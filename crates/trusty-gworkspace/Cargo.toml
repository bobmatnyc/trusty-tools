[package]
name = "trusty-gworkspace"
version = "0.3.1"  # #10746 S13: additive api::bulk and BaseClient::with_loopback_root
edition = "2024" # edition 2024 required: let-chains used in api/client.rs, api/services/gmail/, api/services/docs/ (issue #258)
description = "Google Workspace MCP server for the Trusty suite"
license.workspace = true
repository.workspace = true
homepage = "https://trustytools.dev"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "trusty-gworkspace-mcp"
path = "src/bin/trusty-gworkspace-mcp.rs"

[features]
# #10746 S13 fix round: `BaseClient::with_loopback_root`, the test seam that
# sends every Google API call to a loopback HTTP server. Off by default, so no
# default or release build can send a bearer token over cleartext HTTP; the
# trusty-connectors conformance suite turns it on.
loopback-seam = []

[dependencies]
trusty-common = { path = "../trusty-common", version = "0.69" }
# JSON-RPC / MCP primitives, extracted from `trusty_common::mcp` by ADR-0040 (#5803).
trusty-mcp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
open = { workspace = true }
fd-lock = { workspace = true }

[dev-dependencies]
# serial_test: env-mutating tests (HOME override for oauth_client.json
# fallback resolution) must run serially to avoid races across parallel
# test threads.
serial_test = { workspace = true }
# tracing-test: captures real tracing::warn! emissions for the
# stale-project-token-shadow throttling tests (storage.rs). Not in
# [workspace.dependencies]; pinned locally, matching the existing
# trusty-git-analytics precedent.
tracing-test = "0.2"
# wiremock: async HTTP mock server for the OAuthManager::refresh tests
# (issue #3518) — asserts the exact client_id/secret sent to the token
# endpoint without hitting Google, matching the trusty-channels /
# trusty-git-analytics precedent.
wiremock = { workspace = true }
# #10873: `credential-test-sandbox` is the shared credential test sandbox
# (#9123); it mutates the process environment, so it is dev-only.
trusty-common = { path = "../trusty-common", version = "0.69", features = ["credential-test-sandbox"] }
