[package]
name = "trusty-gworkspace"
version = "0.2.2"
publish = false
edition = "2024" # edition 2024 required: let-chains used in api/client.rs, api/services/gmail/, api/services/docs/ (issue #258)
description = "Google Workspace MCP server for the Trusty suite"
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gworkspace-mcp"
path = "src/bin/gworkspace-mcp.rs"

[dependencies]
trusty-common = { path = "../trusty-common", version = "0.23.0", features = ["mcp"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
open = { workspace = true }

[dev-dependencies]
# serial_test: env-mutating tests (HOME override for oauth_client.json
# fallback resolution) must run serially to avoid races across parallel
# test threads.
serial_test = { workspace = true }
# tracing-test: captures real tracing::warn! emissions for the
# stale-project-token-shadow throttling tests (storage.rs). Not in
# [workspace.dependencies]; pinned locally, matching the existing
# trusty-git-analytics precedent.
tracing-test = "0.2"
