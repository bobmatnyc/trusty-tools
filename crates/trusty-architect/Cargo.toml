# #9171: the Architect's launcher and poller library. A leaf: `tm` calls this
# crate, so it must never depend on `trusty-mpm` or on any crate that does.
# `tests/dependency_boundary.rs` fails the build if one appears here.
[package]
name = "trusty-architect"
version = "0.4.6"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Leaf library for the trusty-mpm Architect: tmux access behind a trait and the guarded send path that never overwrites a typed draft."
keywords = ["tmux", "claude-code", "orchestration", "trusty"]
categories = ["command-line-utilities"]
homepage = "https://trustytools.dev"
readme = "README.md"
# Ship the library, README and changelog; `tests/` and `changelog.d/` stay out.
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]

# #11600: the Intent Ledger command (datg.py and ilio.py port).
[[bin]]
name = "trusty-architect-il"
path = "src/bin/trusty-architect-il.rs"

# #12026: record-then-replay parity tool for the Architect script ports.
[[bin]]
name = "trusty-architect-replay"
path = "src/bin/trusty-architect-replay.rs"

# #12028: the spec_drift_check.py port.
[[bin]]
name = "trusty-architect-spec-drift-check"
path = "src/bin/trusty-architect-spec-drift-check.rs"

# #12028: the level_lint.py port (owner-facing text against the technical level).
[[bin]]
name = "trusty-architect-level-lint"
path = "src/bin/trusty-architect-level-lint.rs"

# #12028 P1d: the task checker ports (stale-tasks.py, stalled_tasks.py, task_wait_check.py).
[[bin]]
name = "trusty-architect-stale-tasks"
path = "src/bin/trusty-architect-stale-tasks.rs"

[[bin]]
name = "trusty-architect-stalled-tasks"
path = "src/bin/trusty-architect-stalled-tasks.rs"

[[bin]]
name = "trusty-architect-task-wait-check"
path = "src/bin/trusty-architect-task-wait-check.rs"

# #12028 P1e: the state writer ports (state-archive.py, brief-id.py, aliases.py).
[[bin]]
name = "trusty-architect-state-archive"
path = "src/bin/trusty-architect-state-archive.rs"

[[bin]]
name = "trusty-architect-brief-id"
path = "src/bin/trusty-architect-brief-id.rs"

[[bin]]
name = "trusty-architect-aliases"
path = "src/bin/trusty-architect-aliases.rs"

# #12028 P1f: the il_agent.py port.
[[bin]]
name = "trusty-architect-il-agent"
path = "src/bin/trusty-architect-il-agent.rs"

# #12028 P1g: the verify-claim.py port.
[[bin]]
name = "trusty-architect-verify-claim"
path = "src/bin/trusty-architect-verify-claim.rs"

# #12087: the gh-session-track.py port.
[[bin]]
name = "trusty-architect-gh-session-track"
path = "src/bin/trusty-architect-gh-session-track.rs"

[dependencies]
# #9171 A1: dependencies are limited to std, serde, thiserror, tracing and
# libc. A2 adds serde/serde_json for the parity JSON; regex and hashing are
# written by hand (src/classify/matchers.rs, src/sha1.rs) to stay inside that
# list. A3a adds libc (Architect ruling Q5) for kill(pid, 0), getloadavg,
# statvfs and the CPU count the host sensors read.
libc = { workspace = true }
serde = { workspace = true }
# #10063: `float_roundtrip` parses every float exactly, so a dashboard
# document re-renders to the prototype's bytes (no new dependency).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Temporary transcript and quiet-list directories in the ported tests.
tempfile = { workspace = true }
# Parses this crate's own Cargo.toml in `tests/dependency_boundary.rs`.
toml = { workspace = true }
