[package]
name = "trusty-embedderd"
version = "0.3.12"
publish = true
edition = "2021"
license.workspace = true
repository = "https://github.com/bobmatnyc/trusty-tools"
description = "Unified ONNX embedding daemon with stdio + Unix-socket transports and BatchQueue (issue #164)."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["onnx", "embeddings", "daemon", "ml", "nlp"]
categories = ["artificial-intelligence", "network-programming"]

[lib]
name = "trusty_embedderd"
path = "src/lib.rs"
# Why: expose the daemon's startup sequence as a library so the bundled shim
# binary inside `trusty-search` can call `trusty_embedderd::run()` without
# duplicating any logic. The standalone `trusty-embedderd` binary delegates
# to the same function. crate-type rlib keeps link semantics clean.
crate-type = ["rlib"]

# Why (issue #1318): single-owner-per-binary — the standalone `trusty-embedderd`
# crate is now LIBRARY-ONLY. The `trusty-embedderd` binary is produced solely by
# `trusty-search` (the host that bundles + spawns it), so there is exactly one
# producing crate for the binary name and `cargo install trusty-search` no
# longer collides on `.crates2.json` binary ownership. This crate is still
# published to crates.io as a LIBRARY (dependent published crates require it).
# The former `[[bin]]`/`src/main.rs` shim (required-features = ["daemon"])
# was removed; it now lives ONLY as
# `crates/trusty-search/src/bin/trusty-embedderd.rs`.

[dependencies]
# Shared client / wire types — now provided by trusty-common's `embedder-client` feature.
# (Formerly `trusty-embedder-client` crate; removed in v0.2.0.)
# Why (issue #2222): `embedder-bundled-ort` is deliberately NOT hardcoded here.
# It used to be forced on unconditionally, which meant Cargo's feature
# unification pulled the glibc-2.38-bound static ORT libs into ANY build of
# this crate — even one that requested `--features load-dynamic` — because
# `embedder-bundled-ort` and `embedder-load-dynamic` are additive, not
# exclusive, at the Cargo level (mutual exclusivity is enforced later, at the
# `ort-sys` link step). That leak defeated the AL2023 load-dynamic build path
# for the `trusty-embedderd` binary bundled inside `trusty-search`. The
# `bundled-ort` feature below now carries that requirement instead, and it is
# on by default (see `default` below) so the zero-config `cargo install`
# experience on modern glibc is unchanged.
trusty-common = { workspace = true, features = ["embedder", "embedder-client", "uds"] }

# CLI argument parsing.
clap = { workspace = true }

# Why (#6289): no axum, no tower-http. This daemon binds no TCP listener —
# ADR-0032 makes trusty-console the only HTTP surface — so the HTTP stack the
# retired `--http` mode needed is gone from the dependency graph entirely.

# Async runtime.
tokio = { workspace = true }

# Serde for JSON handlers.
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling (binary: anyhow).
anyhow = { workspace = true }

# Logging.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Why (issue #2222): `gnu_get_libc_version()` for the pre-init glibc probe
# (see `src/glibc_probe.rs`). Target-gated to Linux/glibc only — musl and
# non-Linux targets have no such symbol and no glibc-floor problem to probe
# for, so they don't need this dependency at all.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Used in the bit_identical and concurrent_embed integration tests.
tokio = { workspace = true }
anyhow = { workspace = true }
# Tempfile for ephemeral UDS socket paths in integration tests.
tempfile = { workspace = true }
# Wire types + MockEmbedder for integration tests.
trusty-common = { workspace = true, features = ["embedder", "embedder-bundled-ort", "embedder-client", "embedder-test-support"] }

[features]
# Why (issue #250, renamed #6289): `daemon` gates the crate's startup surface
#      (`Args`, `Transport`, `resolve_transport`, `run`, `run_with_args`) so a
#      library consumer that only wants the wire protocol / batch queue can
#      take it with `default-features = false`. Defaults to `daemon` so the
#      `trusty-search`-bundled shim binary that calls `trusty_embedderd::run()`
#      keeps building exactly as before.
# Why (issue #2222): `bundled-ort` is also part of the default set now (it
# used to be forced unconditionally via the `[dependencies]` entry above).
# This preserves the exact same default behaviour — modern glibc (>= 2.38)
# hosts still get the zero-config statically-linked ORT build — while making
# it possible to swap to `load-dynamic` cleanly via
# `--no-default-features --features daemon,load-dynamic` (AL2023 /
# glibc < 2.38 hosts). See `crates/trusty-search/Cargo.toml` for how the
# host crate forwards its own `bundled-ort`/`load-dynamic` selection down to
# these features so the bundled `trusty-embedderd` binary matches.
default = ["daemon", "bundled-ort"]
# Enables the daemon startup surface (`Args`, `Transport`,
# `resolve_transport`, `run`, `run_with_args`). The stdio + UDS transports
# themselves do not require this feature; they are exposed via the always-on
# `stdio_server` and `uds_server` modules.
daemon = []
# Deprecated alias (#6289). This feature enabled the axum HTTP listener that
# ADR-0032 retired; it is kept as a no-op forward to `daemon` so an
# out-of-workspace consumer that names it keeps building. Do not use in new code.
http-server = ["daemon"]
# Forward ORT feature flags so the binary can be compiled with cuda/coreml.
# Mutually exclusive with `load-dynamic`/`cuda` at the `ort-sys` link step
# (same rule as `trusty-common`'s `embedder-bundled-ort`) — always pair a
# non-default selection with `--no-default-features`.
bundled-ort = ["trusty-common/embedder-bundled-ort"]
cuda = ["trusty-common/embedder-cuda"]
load-dynamic = ["trusty-common/embedder-load-dynamic"]
coreml = ["trusty-common/embedder-coreml"]
