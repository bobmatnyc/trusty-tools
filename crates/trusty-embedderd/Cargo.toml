[package]
name = "trusty-embedderd"
version = "0.3.7"
publish = true
edition = "2021"
license.workspace = true
repository = "https://github.com/bobmatnyc/trusty-tools"
description = "Unified ONNX embedding daemon with HTTP + UDS transports and BatchQueue (issue #164)."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["onnx", "embeddings", "daemon", "ml", "nlp"]
categories = ["artificial-intelligence", "network-programming"]

[lib]
name = "trusty_embedderd"
path = "src/lib.rs"
# Why: expose the daemon's startup sequence as a library so the bundled shim
# binary inside `trusty-search` can call `trusty_embedderd::run()` without
# duplicating any logic. The standalone `trusty-embedderd` binary delegates
# to the same function. crate-type rlib keeps link semantics clean.
crate-type = ["rlib"]

# Why (issue #1318): single-owner-per-binary — the standalone `trusty-embedderd`
# crate is now LIBRARY-ONLY. The `trusty-embedderd` binary is produced solely by
# `trusty-search` (the host that bundles + spawns it), so there is exactly one
# producing crate for the binary name and `cargo install trusty-search` no
# longer collides on `.crates2.json` binary ownership. This crate is still
# published to crates.io as a LIBRARY (dependent published crates require it).
# The former `[[bin]]`/`src/main.rs` shim (required-features = ["http-server"])
# was removed; it now lives ONLY as
# `crates/trusty-search/src/bin/trusty-embedderd.rs`.

[dependencies]
# Shared client / wire types — now provided by trusty-common's `embedder-client` feature.
# (Formerly `trusty-embedder-client` crate; removed in v0.2.0.)
trusty-common = { workspace = true, features = ["embedder", "embedder-bundled-ort", "embedder-client"] }

# CLI argument parsing.
clap = { workspace = true }

# Why (issue #250): axum + tower-http are HTTP-server only. Gating them behind
# the `http-server` feature mirrors the rule already enforced in
# `trusty-common` (`axum-server`) and `trusty-memory` so the daemon's logic
# (BatchQueue, protocol, stdio/UDS transports) can be consumed by a library
# user with `default-features = false` without dragging the HTTP stack in.
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# Async runtime.
tokio = { workspace = true }

# Serde for JSON handlers.
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling (binary: anyhow).
anyhow = { workspace = true }

# Logging.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Used in the bit_identical and concurrent_embed integration tests.
tokio = { workspace = true }
anyhow = { workspace = true }
# Tempfile for ephemeral UDS socket paths in integration tests.
tempfile = { workspace = true }
# HTTP client for the concurrent HTTP integration tests.
reqwest = { workspace = true }
# Wire types + MockEmbedder for integration tests.
trusty-common = { workspace = true, features = ["embedder", "embedder-bundled-ort", "embedder-client", "embedder-test-support"] }

[features]
# Why (issue #250): mirrors the `trusty-common` / `trusty-memory` rule that
#      axum + tower-http are HTTP-server-only deps. Defaults to `http-server`
#      so the `trusty-embedderd` binary — and the `trusty-search`-bundled
#      shim binary that calls `trusty_embedderd::run()` — keep building
#      exactly as before. Library consumers that only need the wire
#      protocol / batch queue override with `default-features = false`.
default = ["http-server"]
# Enables the axum HTTP daemon surface (`Args`, `AppState`, `run`,
# `run_with_args`, `health_handler`, `embed_handler`). Pulls in `axum` and
# `tower-http`. The stdio + UDS transports do not require this feature; they
# are exposed via the always-on `stdio_server` and `uds_server` modules.
http-server = ["dep:axum", "dep:tower-http"]
# Forward ORT feature flags so the binary can be compiled with cuda/coreml.
bundled-ort = ["trusty-common/embedder-bundled-ort"]
cuda = ["trusty-common/embedder-cuda"]
load-dynamic = ["trusty-common/embedder-load-dynamic"]
coreml = ["trusty-common/embedder-coreml"]
