[package]
name = "trusty-code-tui"
description = "Engine-agnostic terminal-UI seam (TuiEngine trait + ReplEvent) shared by trusty-code and trusty-agents interactive REPLs"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["tui", "repl", "terminal", "ratatui", "engine-adapter"]
categories = ["command-line-interface", "asynchronous"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# 0.1.1 (#6605/#6577): PATCH bump — 0.1.0 is already published and this PR
# edits several doc comments' `# Spec References` link paths to be
# repo-root-relative. No public item changes shape; the `PR version bump vs
# crates.io` gate (#4421) requires the bump since `src/**` changed.
#
# #4713: this crate is published. `trusty-code` depends on it from production
# code (`src/cli/tui.rs`, `src/tui_client/`), and `cargo publish` refuses a
# crate whose non-dev dependency is unpublishable — so the earlier
# `publish = false` here is what held `trusty-code` at 0.2.0 on crates.io while
# the tree moved to 0.4.0. The owner decided to publish rather than vendor the
# seam or freeze the registry copy. 0.1.0 is the first upload; no
# `trusty-code-tui-v*` tag exists yet.
#
# `trusty-code-tui` (#3412, epic #3411, DOC-50 §3.1/§5): the `TuiEngine` trait
# and `ReplEvent` enum that let one TUI drive both tagent and tcode, plus the
# terminal layer, event loop, widgets, and layout added in later slices.

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# Slice 2 (#3414, DOC-50 §5 Slice 2 / Q2): the terminal layer. Deliberately
# NOT `{ workspace = true }` — the workspace-wide `ratatui`/`crossterm`
# pins (0.29/0.28, see root `Cargo.toml`) stay put for every other crate
# (trusty-agents, trusty-mpm, trusty-common) until Slice 10 migrates
# tagent. This crate alone adopts ratatui 0.30 now because it clears a
# vulnerable transitive `lru` (#2886); crossterm 0.29 is 0.30's matching
# minimum. Two ratatui majors coexist in the workspace dependency graph by
# design during the migration window — see the Slice 2 PR report for the
# 0.29→0.30 API-breakage spike Slices 4/10 will need.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
