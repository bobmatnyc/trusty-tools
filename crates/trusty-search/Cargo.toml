[package]
name = "trusty-search"
version = "0.37.1"
edition = "2021"
description = "Machine-wide hybrid code search service: BM25 + vector + KG, zero cold-start, MCP server"
readme = "README.md"
license.workspace = true
repository = "https://github.com/bobmatnyc/trusty-tools"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["search", "code-search", "mcp", "vector-search", "bm25"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
include = [
    "src/**/*",
    "build.rs",
    "ui-dist/**/*",
    "help.yaml",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
name = "trusty_search"
path = "src/lib.rs"
# Why: explicit rlib so downstream host crates (e.g. open-mpm) can link
# trusty-search as a Rust library and consume `SearchMcpService` directly
# (issue #115). Default would already be rlib, but stating it explicitly
# documents the intent and guards against future bin-only changes.
crate-type = ["rlib"]

[[bin]]
name = "trusty-search"
path = "src/main.rs"

[[bin]]
name = "trusty-embedderd"
path = "src/bin/trusty-embedderd.rs"
# Why: bundling trusty-embedderd as a second binary in the trusty-search
# crate means `cargo install trusty-search` installs both binaries from a
# single command (issue #187 Phase 2 follow-up). The daemon's logic lives
# entirely in the trusty-embedderd library crate; this is a thin shim.

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-search`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `tctl` (#1316).

# [patch.crates-io] moved to workspace root Cargo.toml — Cargo only honours
# [patch] tables at the workspace root. The monorepo root patches
# trusty-common / trusty-embedder / trusty-mcp-core / trusty-symgraph to the
# in-tree paths so version-based deps below resolve to the local crates.

[dependencies]
# ── Shared trusty-common crates ────────────────────────────────────────────
trusty-common = { version = "0.24.0", default-features = false, features = ["axum-server", "mcp", "embedder", "embedder-test-support", "symgraph", "monitor-tui", "embedder-client", "bm25", "migrations", "cli-help", "update-check", "bug-capture", "console-metrics", "config-cli"] }  # `config-cli` (#2405): implies `credentials`, giving both the shared `.env.local` loader `load_env_local_once` (retiring trusty-search's ad hoc dotenvy call) AND the embeddable `ConfigKeysCommand` nested under `trusty-search config keys …`  # `symgraph` enables only the contracts surface — no tree-sitter, no `links` conflict; `monitor-tui` powers `trusty-search monitor tui`; `embedder-client` provides EmbedderClient/RemoteEmbedderClient/UdsEmbedderClient (issue #164); `bm25` is the canonical lexical index (issue #156); `migrations` provides the shared schema-migration kernel (issue #179); `cli-help` provides the shared declarative CLI help + "did you mean?" suggester (issue #216); `update-check` provides throttled crates.io update notification; `bug-capture` enables Phase 1 ERROR event capture to JSONL + in-memory ring (bug-reporting #478); `console-metrics` provides ConsoleMetricsReport for the trusty-console dashboard (issue #1104)

# ── Bundled sidecars ─────────────────────────────────────────────────────────
# Why: the trusty-embedderd binary is a required runtime dependency (issue
# #187 Phase 2). Declaring trusty-embedderd as a Cargo dependency causes
# `cargo install trusty-search` to also compile and install the
# trusty-embedderd binary alongside trusty-search — one install command,
# two binaries. The shim at src/bin/trusty-embedderd.rs calls
# `trusty_embedderd::run()` so all daemon logic stays in the library crate.
# Why (issue #2222): declared as an explicit path+version dependency (like
# `trusty-common` above) instead of `workspace = true`, so that
# `default-features = false` here actually takes effect. Cargo silently
# ignores a member's local `default-features` override on a
# `dep.workspace = true` entry unless the `[workspace.dependencies]` entry
# also states `default-features` explicitly AND agrees with the override —
# in practice that means `workspace = true` cannot be used to turn a
# dependency's default features off from just one consuming crate. Without
# `default-features = false` + explicit `http-server` here, trusty-embedderd's
# own default features (which include `bundled-ort`) stayed on regardless of
# what was passed to `cargo build -p trusty-search`, so
# `--no-default-features --features load-dynamic` silently still linked the
# glibc-2.38-bound bundled ORT libs into the bundled trusty-embedderd binary.
# The `bundled-ort`/`load-dynamic`/`cuda` features below forward this crate's
# own ORT-mode selection down to `trusty-embedderd/*` explicitly.
trusty-embedderd = { path = "../trusty-embedderd", version = "0.3.10", default-features = false, features = [
    "http-server",
] }
# Opt-in Python/MPS embedding sidecar launcher (epic #3524, slices 2-4). Pulls
# in NO torch/ORT — it is a lightweight uv/venv bootstrapper + launcher used
# only when `TRUSTY_EMBEDDER=python` selects it (DEFAULT-OFF). Building it does
# not require a venv; that is all runtime.
trusty-embedderd-py = { path = "../trusty-embedderd-py", version = "0.1.0" }
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console
# is no longer bundled into trusty-search (single-owner-per-binary); the
# standalone `trusty-console` crate is its sole producer.

# ── Async runtime / HTTP ───────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
async-trait = "0.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"

# ── Serde / errors / logs ──────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
serde_yaml = { workspace = true }
glob = "0.3"

# ── CLI / UX ───────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "2"
indicatif = "0.17"
open = "5"

# ── Storage / vector / KG / chunking ───────────────────────────────────────
usearch = "2.25"
redb = { workspace = true }
# Why: the `migrate-redb` subcommand reads legacy redb 2.x corpora that redb 4.x
# cannot open (`DatabaseError::UpgradeRequired`) and copies their rows into a new
# redb 4.x file WITHOUT re-embedding. Pulling redb 2.6 in under the `redb2` alias
# lets the binary link both the 2.x read engine and the 4.x write engine at once.
# Not feature-gated: the tool must be present in every default `cargo install
# trusty-search` so an operator who upgrades into the empty-recreate path can run
# the data-preserving migration with zero extra build steps (redb is a pure-Rust
# B-tree — no C deps — so the binary-size cost is small).
redb2 = { package = "redb", version = "2.6" }
dashmap = "5"
petgraph = "0.6"
# Lock-free `Arc` hot-swap backing `SwitchableEmbedder` (epic #3524 slice 6):
# lets the embedder-supervisor swap the active backend (ort -> python) at
# runtime without every embed-pool worker's captured `Arc<dyn Embedder>`
# going stale.
arc-swap = { workspace = true }
lru = "0.16"
# Clustering deps are only compiled when the `clustering` feature is enabled.
# Why: linfa + ndarray pull in a deep BLAS/numerical stack that significantly
# slows cold compile time even though only `core::concept_cluster` consumes
# them. Off by default; turn on with `--features clustering` to enable
# ConceptCluster entities derived from doc-comment k-means clustering.
linfa = { version = "0.7", optional = true }
linfa-clustering = { version = "0.7", optional = true }
ndarray = { version = "0.15", optional = true }
ndarray-rand = { version = "0.14", optional = true }
rand = "0.8"
rayon = "1"
sha2 = "0.10"
regex = "1"

# ── Document extraction (native pdf/docx/xlsx indexing, issue #2923) ────────
pdf-extract = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }

# ── Tree-sitter grammars (ABI 15) ──────────────────────────────────────────
# Upgraded to tree-sitter 0.26 to align with open-mpm (issue #116) so that
# trusty-search can be directly linked as an rlib without violating Cargo's
# `links = "tree-sitter"` single-copy rule. Grammar versions match the set
# used by open-mpm where possible; remaining grammars bumped to the latest
# release compatible with tree-sitter 0.26.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"

# ── File watching / FS ─────────────────────────────────────────────────────
notify = "6"
notify-debouncer-mini = "0.4"
fs4 = { version = "0.8", features = ["sync"] }
walkdir = "2"
# `ignore` (the engine that powers ripgrep): honours `.gitignore`,
# `.git/info/exclude`, the global gitignore, `.ignore`, and `.rgignore`. Used
# by `service::walker` to avoid walking subtrees the user has explicitly told
# git to ignore — a partial-index failure mode tracked in issue #100. Already
# a transitive dep (via `globset`/`notify`); declared directly here so the
# walker can rely on the API surface without leaning on someone else's pin.
ignore = "0.4"
crossbeam-utils = "0.8"
dirs = "5"
# Binary discovery for trusty-embedderd (Phase 2 of #110: auto-spawn).
which = { workspace = true }

# ── Process memory introspection (TRUSTY_MEMORY_LIMIT_MB, peak RSS log) ────
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# ── Metrics / Prometheus exporter (issue #41 Phase 1) ──────────────────────
# Why: production observability for multi-user deployments — counters for
# request totals, histograms for latency, gauges for queue depth + embed
# pool utilisation. The `metrics` facade keeps emit sites cheap (one macro
# call) while `metrics-exporter-prometheus` renders the recorder's snapshot
# in Prometheus text format for `GET /metrics`.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# ── Embedded UI ────────────────────────────────────────────────────────────
include_dir = "0.7"

# ── Optional ONNX NER (feature-gated) ──────────────────────────────────────
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

# ── Optional Candle embedder (issue #41 phase 4, feature-gated) ────────────
# Why: bypasses the ONNX/CoreML jetsam-kill risk on Apple Silicon by running
# the all-MiniLM-L6-v2 BERT forward pass on Metal directly via candle. Opt-in
# only — default builds keep the fastembed/ONNX path.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
hf-hub = { version = "0.3", optional = true, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
# `fs` enables `nix::sys::statfs` (issue #3408): the network-mount detector
# uses it to read the filesystem type at the watcher's root path (macOS
# `f_fstypename`; Linux `f_type` magic number) so the watcher can detect an
# EFS/NFS/SMB mount instead of silently never firing.
nix = { version = "0.29", features = ["signal", "user", "fs"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
# test-util enables tokio's paused-clock (`tokio::time::pause` /
# `start_paused = true`), used by the graceful-python-bootstrap orchestrator
# retry test (epic #3524 slice 6, PR 3/5) so the linear backoff between
# attempts advances instantly instead of sleeping in real time.
tokio = { version = "1", features = ["test-util"] }
# Why: tower::ServiceExt::oneshot is used in the unit tests for the new
# `service::concurrency` and `service::metrics` modules (issue #41 Phase 1)
# to exercise router behaviour without binding a TCP port.
tower = { version = "0.5", features = ["util"] }
# Why: issue #1672 mtime reconcile tests need to set file mtimes precisely so
# `collect_stale_files_by_mtime` returns the expected set.
filetime = "0.2"

[features]
# Default: bundle ORT static libs via trusty-embedder. Works on macOS and
# modern Linux (glibc ≥ 2.38). For glibc 2.34 hosts (e.g. Amazon Linux
# 2023) building with `--features cuda`, also pass `--no-default-features`
# so trusty-embedder switches fastembed to `ort-load-dynamic` and the
# operator can provide `ORT_DYLIB_PATH=/path/to/libonnxruntime.so` at
# runtime (see trusty-search#114).
default = ["bundled-ort"]
# Forwards `trusty-embedder/bundled-ort`. Enables static linking of the
# fastembed-downloaded ORT 1.24.x libraries. Mutually exclusive with the
# load-dynamic path that `cuda` activates (see below).
# Why (issue #2222): also forwards `trusty-embedderd/bundled-ort` — the
# bundled `trusty-embedderd` binary (see the dependency declaration above,
# which now sets `default-features = false` on that dependency) needs the
# same explicit selection this crate makes for itself, or it silently falls
# back to no ORT linking mode at all (neither bundled nor load-dynamic).
bundled-ort = ["trusty-common/embedder-bundled-ort", "trusty-embedderd/bundled-ort"]
# Exposes test doubles (e.g. `MockEmbedder`) outside `cfg(test)` so
# downstream integration tests can reuse them. Kept for parity with the
# previous trusty-search-core feature surface.
test-support = []
# Compile in the ONNX NER extractor. Even with this feature on, NER stays
# inert at runtime unless `~/.trusty-search/models/ner.onnx` is present.
ner = ["dep:ort", "dep:tokenizers"]
# GPU-accelerated embedding via fastembed-rs CUDA backend. Activates the
# `ort/cuda` + `ort/load-dynamic` path in trusty-embedder, so this build
# does NOT bundle the (glibc-2.38-bound) ORT static libs. Install on
# AL2023 with:
#
#     cargo install trusty-search --no-default-features --features cuda
#     export ORT_DYLIB_PATH=/opt/onnxruntime/lib/libonnxruntime.so
#
# Enabling `cuda` alongside the default `bundled-ort` feature is not
# supported — Cargo will compile but the resulting binary will fail to
# link ORT correctly. Always pair `--features cuda` with
# `--no-default-features`.
# Why (issue #2222): also forwards `trusty-embedderd/cuda` — see the
# `bundled-ort` comment above for why the bundled binary needs the same
# explicit selection.
cuda = ["trusty-common/embedder-cuda", "trusty-embedderd/cuda"]
# Dynamic ORT loading without CUDA — for AL2023 (glibc 2.34) CPU-only cross-compilation.
# Enables fastembed/ort-load-dynamic so no glibc-2.38-bound static ORT binaries are bundled.
# Build: cargo build --no-default-features --features load-dynamic
# Runtime: set ORT_DYLIB_PATH=/path/to/libonnxruntime.so
# Why (issue #2222): also forwards `trusty-embedderd/load-dynamic` — without
# this, the bundled `trusty-embedderd` binary (the shim in
# `src/bin/trusty-embedderd.rs`, built as part of `cargo build -p
# trusty-search`) had no ORT feature selected at all once the dependency
# below stopped defaulting to `bundled-ort`, which is worse than the
# original leak (issue #2222 gap: the AL2023 load-dynamic build path for the
# bundled binary was never actually exercised in CI before this fix).
load-dynamic = ["trusty-common/embedder-load-dynamic", "trusty-embedderd/load-dynamic"]
# Deprecated: CoreML / Metal GPU acceleration is now auto-detected at runtime
# on Apple Silicon and requires no opt-in. The `coreml` feature is kept as a
# no-op alias for backward compatibility so `cargo install --features coreml`
# still works.
coreml = ["trusty-common/embedder-coreml"]
# ConceptCluster entities via k-means over doc-comment embeddings (issue #108).
# Off by default — pulls in linfa, linfa-clustering, ndarray, and
# ndarray-rand, which materially extend cold compile time. Enable with
# `cargo build --features clustering` when ConceptCluster entities are
# desired in the KG / BM25 enrichment passes.
clustering = ["dep:linfa", "dep:linfa-clustering", "dep:ndarray", "dep:ndarray-rand"]
# Candle embedder (issue #41 phase 4): alternative to the ONNX/fastembed
# path, running all-MiniLM-L6-v2 on Metal (Apple Silicon) via candle. Opt-in
# via `--features candle` AND `TRUSTY_EMBEDDER=candle` at runtime. Default
# builds keep the fastembed/ONNX path untouched.
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
]
