[package]
name        = "trusty-review"
# MINOR bump — 0.17.0 is already published, and this change edits `src/**`, so
# the `PR version bump vs crates.io` gate (#4421) requires the bump here. MINOR
# by the owner's standing decision; nothing in the public API changed, and the
# three `report` types that broke at 0.17.0 now carry `#[non_exhaustive]`
# (#5762), so field and variant additions stay non-breaking from here on.
#
# #4421: this PR (#5754) additionally converts config/mod.rs's module doc to
# the inner `//!`-only standard — a doc-comment-only change, so it lands under
# the 0.18.0 above with no further bump needed.
#
# #5886: PATCH bump — 0.18.0 is already published, and this PR edits
# synthesize_prompt.rs's prompt text (adds a coverage-gaps instruction). No
# public API changed; the `PR version bump vs crates.io` gate (#4421) still
# requires the bump since `src/**` changed.
#
# #6078: MINOR bump — 0.20.0 is already published, and this PR edits `src/**`,
# so the `PR version bump vs crates.io` gate (#4421) requires a bump. MINOR is
# also the right position on its own merits: `RepositoryEntry` and
# `RepositoryReport` each gain an `inspect_priority` field, and neither carries
# `#[non_exhaustive]` (the note above covers three OTHER report types), so an
# external struct literal breaks. For a `0.y.z` crate the breaking bump is the
# MINOR position.
#
# #6166: MINOR bump — `RepoInvestigation` gains a `traces` field and
# `cargo-semver-checks` reports `constructible_struct_adds_field`, which for a
# `0.y.z` crate takes the MINOR position. `#[non_exhaustive]` would foreclose
# the next such bump, and it cannot go on this struct: the `trusty-review`
# binary is a separate compilation unit and builds one with a struct literal.
#
# #6082 lap 4: PATCH bump — 0.24.0 is on `main` and being published as this
# lands, so 0.24.1 is the next free position either way. Nothing public changes
# shape: `synthesize_grounding` and `investigate::regions` are both crate-private
# modules, and the two new `analyze_findings` constants are `pub(crate)`.
#
# #6082 lap 5: PATCH bump — both fixes are internal to the render pipeline.
# `reporter_findings` and `synthesize_grounding` are crate-private, and the one
# new `synthesize` helper is a private free function; no public type changes
# shape.
#
# #6123: PATCH bump — 0.25.0 is published on crates.io and this change touches
# `src/**`, so the pre-merge guard requires the next free position. The public
# surface only grows: `LlmRequest::effective_model` and
# `OpenRouterProvider::with_base_url` are added, nothing changes shape or moves.
#
# #5063: PATCH bump — 0.28.0 is published on crates.io and this change touches
# `src/**`, so the pre-merge guard requires the next free position.
# `store::redb_error_is_incompatible_format` is `pub(crate)` and keeps its name
# and signature; it now delegates its body to
# `trusty_common::redb_open::is_incompatible_format`. No public item changes.
#
# #6290: MINOR bump — retiring the serve daemon removes the whole
# `service::rpc` module, its `serve`/`serve_with_shutdown`/`build_router`/
# `socket_path` functions, the `METHOD_*` and `MAX_FRAME_BYTES` constants, and
# the `NoParams` struct. `cargo-semver-checks` reports 4 major lints
# (`function_missing`, `module_missing`, `pub_module_level_const_missing`,
# `struct_missing`); for a `0.y.z` crate the breaking bump is the MINOR
# position, so 0.28.1 -> 0.29.0.
#
# #4491: PATCH bump — 0.29.0 is already published and this PR edits `src/**`,
# so the `PR version bump vs crates.io` gate (#4421) requires the bump. No
# public item changes shape: `LlmOutputBlock`/`LlmFinding`/`FindingsField` and
# `deserialize_findings` are crate-private, and the runner change only
# populates an existing `result.error` field on the fail-safe path.
#
# #4045: PATCH bump — 0.29.1 is already published on crates.io (merged via
# #6401) and this PR adds `src/**` regression-coverage tests, so the same gate
# requires another re-bump.
#
# 0.30.0 (#6464): MINOR — `HealthResponse` is newly `#[non_exhaustive]`
# (`src/service/handlers.rs:187`), which stops a downstream crate constructing
# or exhaustively matching it. Cargo's 0.x rule puts a break in the MINOR
# position.
version     = "0.30.0"
edition     = "2024"
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage               = "https://github.com/bobmatnyc/trusty-tools"
readme                 = "README.md"
description            = "LLM-backed code review service — reviews GitHub PRs and unified diffs via AWS Bedrock or OpenRouter"
keywords    = ["code-review", "pr-review", "llm", "bedrock", "github"]
categories  = ["development-tools", "command-line-utilities"]
publish     = true

[[bin]]
name               = "trusty-review"
path               = "src/main.rs"
required-features  = []

# Why (issue #1318): the `trusty-console` `[[bin]]` shim was REMOVED here.
# Single-owner-per-binary — the standalone `trusty-console` crate is now the
# sole producer of the `trusty-console` binary, so `cargo install trusty-review`
# no longer collides on `.crates2.json` binary ownership (#1262). Install the
# console separately (`cargo install trusty-console`) or via `tctl` (#1316).

[lib]
name = "trusty_review"
path = "src/lib.rs"

[dependencies]
# ── async runtime ──────────────────────────────────────────────────────────
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures-util = { workspace = true }

# ── HTTP client only. #6277 removed axum, tower and tower-http along with the
#    TCP listener they served: ADR-0032 moves this daemon's own transport onto
#    a Unix socket and leaves trusty-console as the workspace's only HTTP
#    surface. `reqwest` stays — it is how this crate CALLS trusty-search.
reqwest      = { workspace = true }
tempfile     = { workspace = true }

# ── Serialisation ──────────────────────────────────────────────────────────
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }

# ── Dependency inventory (#6080) ───────────────────────────────────────────
# Resolving a declared requirement against a multi-version Cargo.lock is a
# semver-matching question; first-wins reported the lowest locked version.
semver       = { workspace = true }

# ── Regex (JIRA ticket-key extraction, #599) ───────────────────────────────
# Scans PR title + body for `[A-Z][A-Z0-9]+-\d+` ticket keys so the JIRA source
# can do an exact issueKey lookup (parity with code-intelligence's primary path).
regex        = { workspace = true }

# ── Error handling ─────────────────────────────────────────────────────────
# thiserror for library error enums; anyhow used in main.rs binary only.
thiserror    = { workspace = true }
anyhow       = { workspace = true }

# ── Observability ──────────────────────────────────────────────────────────
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

# ── Config / paths ─────────────────────────────────────────────────────────
dirs         = { workspace = true }

# ── Dedup + in-flight guards (Phase 1, #582) ───────────────────────────────
# redb: embedded key-value store for the cross-process SHA-keyed dedup claim
#       store (atomic insert-or-fail on (owner,repo,pr,head_sha)).
# dashmap: lock-free concurrent map backing the in-process in-flight guards.
redb         = { workspace = true }
dashmap      = { workspace = true }

# ── CLI (Stage 3) ──────────────────────────────────────────────────────────
clap         = { workspace = true }

# ── Shared workspace utilities ─────────────────────────────────────────────
# The `chat` module of trusty-common exposes the streaming ChatProvider trait
# and OpenRouterProvider.  We drain the stream internally (no feature
# flag needed for the chat module itself, which is compiled unconditionally).
# The `mcp` feature is enabled only under the `mcp` cargo feature of this crate
# (which is on by default) to pull in the JSON-RPC 2.0 stdio loop primitives.
# The `intent-source` feature pulls in the shared intent-source resolver (ISR,
# C1 / #1363): `trusty_common::intent_source::resolve` — the back gate (C2,
# #1359) calls it to surface the resolved ticket/spec intent as a review context
# source.  The ISR is feature-gated in trusty-common so the 11 non-consumer
# dependents pay nothing; trusty-review opts in here.
# `webhook-relay` (#5182): the console->target relay wire contract AND its
# receive half — the durable inbox, the listener, and the hardened UDS bind
# this crate mounts in `webhook_listener`. Implies `uds` and `webhook-hmac`.
# `uds` (#6277) is named explicitly even though `webhook-relay` already implies
# it: the serve transport depends on `uds::server` directly now, and an implied
# feature is one refactor away from disappearing under a consumer that never
# said it needed it.
trusty-common = { workspace = true, features = ["intent-source", "config-cli", "webhook-relay", "gh-cli", "uds", "uds-supervisor", "redb-open"] }  # `redb-open` (#5063): the workspace's single redb corruption classifier, which `store::redb_error_is_incompatible_format` delegates to
# JSON-RPC / MCP primitives (ADR-0040, #5803). Optional: only the `mcp` feature
# compiles `src/mcp/`.
trusty-mcp = { workspace = true, optional = true }
# Why (issue #1318): the `trusty-console` dependency was REMOVED. The console is
# no longer bundled into trusty-review (single-owner-per-binary); the standalone
# `trusty-console` crate is its sole producer.

# ── JWT / crypto (GitHub App auth) ────────────────────────────────────────
# Why (#5181): `hmac`/`sha2`/`hex` were REMOVED with `verify_webhook_signature`.
#      `trusty-console` verifies a GitHub delivery's HMAC once, before relaying
#      (ADR-0034 §3); this crate has no signature to check any more.
jsonwebtoken = { workspace = true }
base64       = { workspace = true }
chrono       = { workspace = true }

# ── AWS Bedrock (Converse API) ─────────────────────────────────────────────
# Reuses the same versions already pinned by trusty-analyze in [workspace.dependencies].
# aws-sdk-bedrockruntime: Converse (non-streaming) API for LLM calls.
# aws-config: standard credential chain (env / ~/.aws / IAM / SSO).
# aws-types: Region type for region_provider construction.
aws-sdk-bedrockruntime = { workspace = true }
aws-config             = { workspace = true }
aws-types              = { workspace = true }
aws-smithy-types       = { workspace = true }

# Why (#5466): `tga` and `rusqlite` were REMOVED with the contributor-profile
# pipeline. Profiling is tga's domain now (`tga profile`), so the Cargo edge
# runs tga -> trusty-review only, never back. See #5468.

# ── Time (Instant for latency measurement) ─────────────────────────────────
# std::time::Instant is sufficient; chrono is used for JWT iat/exp claims.

[package.metadata.docs.rs]
features = ["http-server", "mcp", "report"]

[features]
# Why: gates the `service` module — `AppState`, the three operations, and the
#      UDS listener — so `--no-default-features` library consumers (CLI
#      one-shot, unit tests) do not compile the daemon.
#
# #6277: the NAME is now a misnomer and is kept deliberately. It no longer
# pulls axum or tower — ADR-0032 replaced the TCP listener with a Unix socket,
# and `trusty-common/axum-server` went with it. Renaming it would be a breaking
# change to every consumer's manifest for no behaviour, so the rename waits for
# a change that is already breaking those consumers.
default     = ["http-server", "mcp", "report"]
http-server = []
# Why: gates the MCP stdio JSON-RPC service + the shared MCP primitives behind
#      an opt-in feature so library-only consumers do not pull in the stdio
#      loop.  Enabled by default so `cargo install` and the default binary
#      include it out of the box.
# What: pulls in `trusty-mcp` (Request, Response, run_stdio_loop, etc.) and
#       compiles the `src/mcp/` module. ADR-0040 (#5803) moved those primitives
#       out of `trusty-common`, so this is a `dep:` entry rather than a
#       `trusty-common/mcp` feature forward.
# Test: `cargo test -p trusty-review --features mcp` covers dispatch/tools tests.
mcp         = ["dep:trusty-mcp", "trusty-common/console-metrics", "http-server"]
# Why (#5466): the `profile` feature was REMOVED along with `src/profile/` and
#      the `profile` subcommand. Contributor profiling lives in tga (`tga
#      profile`, tga 2.19.0); see #5468.
# Why: gates the deterministic technical-DD report generator (epic #2312 / M1
#      #2313).  Default-on so `cargo install` ships the `report` subcommand out
#      of the box.  Pulls in NO new external dependencies — the module reuses
#      toml/serde/serde_json/regex/chrono/tempfile/dirs already in [dependencies]
#      — so the gate exists purely for module/subcommand opt-out, not dep weight.
# What: enables `src/report/` and the `report` CLI subcommand.
# Test: `cargo test -p trusty-review` (default features) covers report module tests.
report      = []

[dev-dependencies]
# test-util enables tokio's paused-clock (`tokio::time::pause`) used by the
# context-orchestrator timeout fail-open test (#550).
tokio        = { workspace = true, features = ["test-util"] }
tempfile     = { workspace = true }
# #6277: the combined-PR obligation from the design review —
# `tests/uds_consumer_contract.rs` stands this daemon up on a temp socket and
# asserts BOTH consumers see it healthy. A gap between the daemon and either
# consumer leaves `tctl` kickstarting a live daemon (#4246), which is why they
# ship together and why the proof lives here rather than in three separate
# crates that each mock the other side.
#
# PATH-ONLY, deliberately no `version`: `cargo package` strips a dev-dependency
# that carries no version requirement, so this does NOT make trusty-review's
# publish wait for trusty-console's and trusty-installer's. A `workspace = true`
# entry would carry the version and create exactly that ordering constraint.
#
# One developer-visible cost: trusty-console has a `build.rs` that builds its
# Svelte UI, so `cargo test -p trusty-review` now needs pnpm on PATH. Without it,
# set `SKIP_UI_BUILD=1` — the build script's documented escape hatch, and what CI
# uses.
trusty-console   = { path = "../trusty-console" }
trusty-installer = { path = "../trusty-installer" }
# Why (#5466): `git2` was REMOVED. Its only use was the profile diff-sampler
# tests, which went with `src/profile/`.
# serial_test: run env-mutating tests serially to prevent env-var races across
# parallel test threads (used by selector resolve_db_path tests).
serial_test  = { workspace = true }
