[package]
name = "trusty-code"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
# license.workspace resolves to "MIT"; LICENSE is kept in-crate for correctness.
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Per-project Claude-Code-compatible MPM orchestration harness (bin: tcode) — an original coding harness, tracked under epic #2052."
readme = "README.md"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["cli", "mcp", "orchestration", "agents", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tcode"
path = "src/main.rs"

[lib]
name = "trusty_code"
path = "src/lib.rs"

[dependencies]
# Core error handling and async runtime
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Serialization (events, ipc, perf, build_info, tools, agents)
serde = { workspace = true }
serde_json = { workspace = true }

# Timestamp support (perf, build_info)
chrono = { workspace = true }

# UUID generation (ipc task IDs)
uuid = { workspace = true }

# CLI entry point (tcode binary)
clap = { workspace = true }
tracing-subscriber = { workspace = true }

# Phase 2: async trait dispatch for ToolExecutor, AgentRunner, SearchProvider
async-trait = { workspace = true }

# Phase 3: TOML config parsing for AgentConfig
toml = { workspace = true }

# Structured error types for library code (FsError, LlmError, etc.)
thiserror = { workspace = true }

# LLM client: HTTP + TLS for the OpenRouter chat-completions API
reqwest = { workspace = true }

# Bash tool: process-group kill on Unix (setsid / kill syscalls)
libc = { workspace = true }

# verify_gate (#2279): matches a `bash` tool call's command against the
# finalized test-invocation patterns (`pytest\s+\S+`, `cargo test`, …).
regex = { workspace = true }

# DOC-28 catch-up digest for PM prompt seed context (#1762 PR2), plus the
# shared JSON-RPC 2.0 / MCP wire types + STDIO loop (#2053) so `tcode serve
# --stdio` speaks the exact same JSON-RPC-over-STDIO contract as trusty-memory
# and trusty-search. `catchup` already pulls in `mcp` transitively
# (`catchup = ["dep:rusqlite", "mcp"]`); `mcp` is listed explicitly too so the
# direct dependency is documented rather than relying on the transitive edge.
# `axum-server` enables `trusty_common::server::with_standard_middleware`
# (CORS/trace/gzip) so `tcode serve --http` matches the trusty-memory/
# trusty-search middleware stack exactly.
trusty-common = { workspace = true, features = ["catchup", "mcp", "axum-server"] }

# `tcode serve --http`: POST /rpc + GET /health over axum (#2053). Per
# CLAUDE.md, axum stays feature-gated in *library* crates
# (`trusty-common`'s `axum-server` flag); trusty-code is a binary crate that
# actually serves HTTP, so it takes the dependency unconditionally, matching
# how `trusty-search`/`trusty-memory` depend on it.
axum = { workspace = true }

# `GET /sessions/{id}/events` SSE route (#2054): wraps the existing
# `tokio::sync::broadcast`-backed event bus (`crate::events`) as a `Stream`
# axum's SSE response type can consume, chained after a ring-buffer replay
# burst built with plain `futures_util::stream::iter`.
tokio-stream = { workspace = true }
futures-util = { workspace = true }

# `run_task::diff`'s git-tree snapshot (#2061, #1475 bug 3): a scratch
# directory for the THROWAWAY `GIT_INDEX_FILE` git stages into, so the run's
# before/after capture never touches the project's real `.git/index`.
# Promoted from dev-dependencies (where it already served every temp-dir
# test in this crate) since this is now a genuine production code path, not
# test-only.
tempfile = { workspace = true }

# AWS Bedrock Converse API transport (#1021 phase 1): mirrors trusty-review's
# `llm::bedrock` — `aws-sdk-bedrockruntime` for the Converse call,
# `aws-config`/`aws-types` for the default credential chain + region
# resolution, `aws-smithy-types` for the `Document` <-> JSON conversion tool
# calls require. Only reached when a `bedrock/*` model slug is actually
# requested (`DispatchingLlmClient` lazily constructs the Bedrock client), so
# the OpenRouter-only default configuration never needs AWS credentials.
aws-sdk-bedrockruntime = { workspace = true }
aws-config             = { workspace = true }
aws-types              = { workspace = true }
aws-smithy-types       = { workspace = true }

[dev-dependencies]
# Async test runtime (events, build_info, perf async tests, tools tests)
tokio = { workspace = true }
# HTTP router test-only helper (`tower::util::ServiceExt::oneshot`) for
# driving the `tcode serve --http` axum router without a real socket (#2053).
tower = { workspace = true }
