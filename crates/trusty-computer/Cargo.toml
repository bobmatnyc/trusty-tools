[package]
name = "trusty-computer"
version = "0.1.0"
description = "Trusty Computer broker and MCP server: lets local AI agents drive one granted macOS app through a bounded cua-driver daemon"
readme = "README.md"
homepage = "https://trustytools.dev"
keywords = ["macos", "accessibility", "mcp", "automation", "agents"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The spike fixtures and evidence under `tests/` stay in the repo.
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]
# Kept until the release (issue #11460).
publish = false

[[bin]]
name = "trusty-computer"
path = "src/main.rs"

[[bin]]
name = "trusty-computer-mcp"
path = "src/bin/trusty-computer-mcp.rs"

[features]
# Test-only hooks; a build with it refuses `install-service` (plan section 8).
test-seams = []

[dependencies]
hex = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
