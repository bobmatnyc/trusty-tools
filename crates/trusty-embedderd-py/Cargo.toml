[package]
name = "trusty-embedderd-py"
version = "0.2.0"  # library-only: trusty-search ships the launcher (#9468)
publish = true
edition = "2021"
license.workspace = true
repository = "https://github.com/bobmatnyc/trusty-tools"
description = "Library behind trusty-search's Python/MPS embedding sidecar launcher: uv-bootstraps a pinned venv and execs the trusty_embed_sidecar stdio JSON-RPC server (epic #3524)."
# #9468: library-only. A stray src/main.rs must not become a second owner of
# the `trusty-embedderd-py` binary name.
autobins = false
readme = "README.md"
homepage = "https://trustytools.dev"
keywords = ["embeddings", "sidecar", "mps", "torch", "uv"]
categories = ["command-line-utilities", "artificial-intelligence"]

[lib]
name = "trusty_embedderd_py"
path = "src/lib.rs"

# #9468 (owner ruling D94, 2026-10-16): single owner per binary, as #1318 did
# for trusty-embedderd. The `trusty-embedderd-py` launcher binary is built
# ONLY by trusty-search (`src/bin/trusty-embedderd-py.rs`, a shim over
# `trusty_embedderd_py::run`), so `cargo install trusty-search` installs it
# next to the daemon that spawns it.

[dependencies]
# resolve_data_dir + TRUSTY_DATA_DIR_OVERRIDE honouring (venv placement). Only
# the always-on core of trusty-common (no embedder/ORT/torch) is pulled in.
# `integrity`: the shared SHA-256 verify for the pinned uv archive (#9468).
trusty-common = { workspace = true, features = ["integrity"] }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Embed the Python project (pyproject + hashed uv.lock + package src + tests)
# into the binary and materialize it to the data dir at bootstrap.
include_dir = "0.7"

# Lockfile-hash → venv directory keying, and sentinel content.
sha2 = { workspace = true }
hex = { workspace = true }

# Advisory flock over the venv dir against concurrent bootstraps, plus
# available-space precheck.
fs4 = { version = "0.8", features = ["sync"] }

# `uv` discovery on PATH.
which = { workspace = true }

# #9468: extract the pinned uv archive (gzip + tar) and type its errors.
flate2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# The real supervisor + stdio client, to prove ZERO wire-code changes are
# needed. Only used by the `#[ignore]`-gated e2e test (needs a built venv);
# ORT is already compiled workspace-wide, so this adds no new heavy build.
trusty-common = { workspace = true, features = ["embedder-client", "embedder-bundled-ort"] }
