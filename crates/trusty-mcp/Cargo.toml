[package]
name = "trusty-mcp"
# 0.1.1 -> 0.1.2 carries no code change. The `trusty-mcp-v0.1.1` tag is pinned
# by a protected ruleset to c66fb18ff, and that commit fails Gate 1 of the
# pre-publish workflow (two broken intra-doc links, fixed in this same commit),
# so it can never satisfy `check-publish-ready.sh` CHECK 7. #6178: a release tag
# here cannot be moved or deleted, so the version number is spent and the
# release moves forward to a gate-clean commit instead.
#
# 0.1.2 -> 0.1.3: additive, feature-gated `daemon_bridge_json_rpc` (#6316).
# 0.1.3 -> 0.1.4: additive, feature-gated `trusty-mcp <service>` binary (#6316
# slice 4). One bump per merged slice, so a release cut from any commit names
# exactly what it carries.
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared JSON-RPC 2.0 / MCP protocol primitives for the trusty-* ecosystem: request/response envelopes, the stdio dispatch loop, OpenRPC document building, and the daemon-bridge startup guard."
readme = "README.md"
keywords = ["mcp", "json-rpc", "openrpc", "daemon"]
categories = ["network-programming"]
homepage = "https://github.com/bobmatnyc/trusty-tools"

[lib]
crate-type = ["rlib"]

# #6316: the one MCP stdio bridge, per the 2026-07-24 "no per-crate MCP
# binaries" directive. `required-features` keeps `cargo check -p trusty-mcp` and
# `cargo check --workspace` (both default-featured) free of `trusty-common` —
# the bin is simply not a target then.
[[bin]]
name = "trusty-mcp"
path = "src/bin/trusty-mcp.rs"
required-features = ["daemon-bridge-json-rpc"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `io-std` + `io-util` back `run_stdio_loop`; `time` backs the daemon-bridge
# poll interval; `rt` backs `spawn_blocking` for the single-flight start lock.
tokio = { workspace = true, features = ["io-std", "io-util", "time", "rt", "macros"] }
# `daemon_bridge`'s health probe. Inherited from the workspace so this crate
# links the same rustls TLS stack as the rest of trusty-*.
reqwest = { workspace = true }
# `daemon_bridge` spawns the daemon with `home_dir()` as its working directory,
# so a relative path in the child never resolves against a caller's cwd.
dirs = { workspace = true }
# #6316: `daemon_bridge_json_rpc` forwards over a Unix socket with the shared
# framed client. OPTIONAL, and this crate's only `trusty-common` edge — the lean
# rlib every MCP server links (ADR-0040) must not gain a heavyweight dependency
# it does not use. PR #6726 removed the `trusty-common` -> `trusty-mcp`
# back-edge that would otherwise make this a cycle.
trusty-common = { workspace = true, optional = true }

# `single_flight` uses `flock(2)` directly: an advisory whole-file lock that the
# kernel releases on process death, which is what makes the guard crash-safe.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
# #6316: compiles `daemon_bridge_json_rpc`, the shared stdio<->UDS JSON-RPC
# forwarder trusty-memory / trusty-analyze / trusty-search re-point onto. Off by
# default because it is what pulls `trusty-common` into the graph; a consumer
# that wants only the protocol primitives pays nothing for it. Unix-only in
# practice — `trusty_common::uds` is itself gated on `cfg(unix)`.
daemon-bridge-json-rpc = ["dep:trusty-common", "trusty-common/uds"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
