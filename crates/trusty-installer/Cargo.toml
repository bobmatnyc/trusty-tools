[package]
name = "trusty-installer"
version = "0.3.0"
edition = "2021"
description = "Thin control plane for the claude-mpm stack: install, upgrade, restart, health, and config coordination across all trusty-* tools."
readme = "README.md"
# Workspace default: MIT (see root Cargo.toml [workspace.package] license = "MIT",
# #898 relicense, and sibling crates). Use license.workspace = true so the
# authoritative value propagates from one place.
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "trusty_installer"
path = "src/lib.rs"

[[bin]]
name = "trusty-installer"
path = "src/main.rs"

# Transitional alias: `tctl` stays on PATH so existing scripts and muscle
# memory work during the migration period. Both binaries share the same
# main.rs entry point. (Phase 1 / ADR-0013 / SPEC-INSTALLER-01)
[[bin]]
name = "tctl"
path = "src/main.rs"

[dependencies]
# Binary error handling
anyhow = { workspace = true }
# Argument parsing (derive API, matching repo convention in trusty-search/trusty-analyze)
clap = { workspace = true }
# Serialisation for --json output (DOC-5 §4.2)
serde = { workspace = true }
serde_json = { workspace = true }
# Boot-policy config parsing (~/.trusty-tools/trusty-installer/config.yaml, #1220 / DOC-12 §8)
serde_yaml = { workspace = true }
# Home-directory resolution for the #1220 config path + lock state dir
dirs = { workspace = true }
# `which <binary>` presence checks for members + the claude-code runtime (DOC-12 §6)
which = { workspace = true }
# Async runtime for parallel member probes (DOC-5 §2, DOC-4 §1.3)
tokio = { workspace = true }
# flock(2)-based system advisory lock for `trusty-installer up` idempotency/concurrency (DOC-12 §3.4 / DOC-3 §4)
libc = { workspace = true }
# HTTP client for `trusty-installer ensure` project-setup stages (POST /indexes → trusty-search,
# POST /api/v1/palaces → trusty-memory) and `--wait` readiness polling against the
# daemon /health endpoints (#1341). Also used for prebuilt-binary downloads (Phase 2 / #1760).
# Reuses the workspace reqwest (rustls-tls).
reqwest = { workspace = true }
# SHA-256 verification for prebuilt-binary tarballs (Phase 2 / #1760).
sha2 = { workspace = true }
# Gzip decompression for prebuilt-binary tarballs (Phase 2 / #1760).
flate2 = { workspace = true }
# Tar archive extraction for prebuilt-binary tarballs (Phase 2 / #1760).
tar = { workspace = true }
# Semantic-version parsing for GitHub release tag resolution (Phase 2 / #1760).
semver = { workspace = true }
# Structured logging to stderr (CLAUDE.md: logs → stderr, stdout = data)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Shared update primitives (check_crates_io, perform_upgrade, verify_installed_binary,
# is_launchd_supervised, upgrade_and_restart) reused by trusty-installer updates/upgrade.
# The `update-check` feature gates the `trusty_common::update` module exposing
# those primitives (it adds zero new transitive deps; the flag controls module
# compilation only).
trusty-common = { workspace = true, features = ["update-check"] }
# Rustup/cargo-style progress display (#1315): Narrator `info:` lines + the
# right-aligned ComponentTracker table for install/upgrade rows.
trusty-progress = { workspace = true }
# Temp-directory helpers: used in production code by the prebuilt download layer
# (Phase 2 / #1760) to stage downloads atomically before placing binaries, and in
# tests for integration-test isolation.
tempfile = { workspace = true }

[dev-dependencies]
