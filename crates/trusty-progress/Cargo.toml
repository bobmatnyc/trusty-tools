[package]
name = "trusty-progress"
description = "Shared rustup/cargo-style progress + status display for the trusty-* tooling ecosystem"
homepage = "https://github.com/bobmatnyc/trusty-tools"
keywords = ["progress", "spinner", "cli", "terminal", "status"]
categories = ["command-line-interface", "development-tools"]
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Published to crates.io as of #1332: required as a real registry dependency of
# trusty-installer (formerly trusty-controller) Phase-2 publish. The API has
# stabilised enough to ship; the in-tree path dep still resolves locally via
# [workspace.dependencies].

[dependencies]
indicatif = { workspace = true }
thiserror = { workspace = true }
