[package]
name        = "trusty-console"
# 0.8.2 (#6285): patch — trusty-search moves from loopback HTTP to its Unix
# socket. Nothing public changes shape: `AppState` GAINS `with_search_socket`
# and the two `search_uds::routes` handlers, and the routes that changed
# transport (`delete_index_on_socket`, `prune_indexes_on_socket`) were
# `pub(crate)`.
# 0.8.3 (#6380): patch — batch prune re-censuses each id against the daemon
# immediately before deleting it, closing the TOCTOU window between the
# operator's confirm and the delete. New `pub(crate)` module
# (`routes::census_guard::OrphanGuard`); no public shape change.
# 0.9.0 (#6464): minor — `ServiceInfo` gains the public field `lifecycle`
# (`src/connector.rs:100`). The struct was exhaustively constructible through
# the public API, so a struct literal downstream stops compiling. Cargo's 0.x
# rule puts a break in the MINOR position.
# 0.9.3 -> 0.10.0 (#6695, 2026-09-02 cut): MINOR, which is the breaking position
# for a 0.x crate. `preflight-publish.sh` CHECK 5 refused 0.9.3 against 0.9.2 on
# two counts: `constructible_struct_adds_field` for `ServeArgs.host_sample_interval`
# (src/lib.rs:204), and `function_missing` for `trusty_console::host_status::start`.
# 0.10.1 (refs #6671, #6663, #6667, #6661): patch — test-flake stabilization
# changes in the test suite under an already-published version.
# 0.11.0 (#6642): MINOR, the breaking position for a 0.x crate.
# `cargo-semver-checks` refuses 0.10.1 against 0.10.0 on two counts:
# `constructible_struct_adds_field` for `ServiceInfo.cpu_pct`
# (src/connector.rs:100) and `enum_variant_added` for
# `machine_history::events::HistoryEvent::Services`. Both are the shape the
# console's per-service graphs are read from, so neither is avoidable.
version     = "0.11.0"
edition     = "2024"
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage               = "https://github.com/bobmatnyc/trusty-tools"
readme                 = "README.md"
description            = "Web console that detects and surfaces running trusty services as a home page with service cards"
keywords    = ["dashboard", "console", "services", "trusty", "developer-tools"]
categories  = ["command-line-utilities", "development-tools"]
build       = "build.rs"
include = [
    "src/**/*",
    "build.rs",
    "ui/dist/**/*",
    # #6155: the trusty-search SPA the console serves at /tools/search/.
    "ui-search-dist/**/*",
    "Cargo.toml",
    "README.md",
]

[lib]
# Why: Expose the daemon's startup sequence as a library so bundled shim
# binaries inside host crates (trusty-search, trusty-memory, trusty-analyze,
# trusty-review, trusty-mpm) can call `trusty_console::run()` without
# duplicating any logic. Mirrors trusty-embedderd (issue #187) and
# trusty-bm25-daemon (PR #190). crate-type rlib keeps link semantics clean.
name       = "trusty_console"
path       = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "trusty-console"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
axum               = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
dirs               = { workspace = true }
which              = { workspace = true }
open               = { workspace = true }
rust-embed         = { workspace = true }
mime_guess         = { workspace = true }
# `axum-server` (#3304): the shared same-origin write guard the console consumes
# via `routes::origin_guard`. `uds` + `webhook-hmac` (#5089 step 3): the hardened
# UDS dial/framing the webhook relay uses and the single GitHub HMAC verifier.
# #6517: `host-metrics` adds the whole-machine sampler + the
# `console_metrics::machine_status` aggregation the machine-status route serves.
trusty-common      = { workspace = true, features = ["stdio-mcp-client", "console-metrics", "host-metrics", "config-cli", "axum-server", "uds", "uds-supervisor", "webhook-hmac", "webhook-relay"] }
reqwest            = { workspace = true }
# #6155: `TryStreamExt::inspect_err` on the proxied upstream body, so a
# mid-stream failure is logged instead of reaching the browser as a silent
# truncation.
futures-util       = { workspace = true }
thiserror          = { workspace = true }
# Spool entries hold the raw webhook body byte-exact; base64 keeps the JSON
# container from corrupting bytes the HMAC was computed over.
base64             = { workspace = true }

[dev-dependencies]
tempfile       = { workspace = true }
tokio          = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
