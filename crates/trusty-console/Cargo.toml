[package]
name        = "trusty-console"
# 0.8.1 (#6371): patch — 0.8.0 was published while this PR was open and it edits
# `src/**`. The public surface only GAINS items: the two cleanup handlers and
# their request body. `DeleteVerdict` becoming `ActionVerdict` moves nothing
# public — it was `pub(crate)`, as is everything else the routes refactor
# touched.
version     = "0.8.1"
edition     = "2024"
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage               = "https://github.com/bobmatnyc/trusty-tools"
readme                 = "README.md"
description            = "Web console that detects and surfaces running trusty services as a home page with service cards"
keywords    = ["dashboard", "console", "services", "trusty", "developer-tools"]
categories  = ["command-line-utilities", "development-tools"]
build       = "build.rs"
include = [
    "src/**/*",
    "build.rs",
    "ui/dist/**/*",
    "Cargo.toml",
    "README.md",
]

[lib]
# Why: Expose the daemon's startup sequence as a library so bundled shim
# binaries inside host crates (trusty-search, trusty-memory, trusty-analyze,
# trusty-review, trusty-mpm) can call `trusty_console::run()` without
# duplicating any logic. Mirrors trusty-embedderd (issue #187) and
# trusty-bm25-daemon (PR #190). crate-type rlib keeps link semantics clean.
name       = "trusty_console"
path       = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "trusty-console"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
axum               = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
dirs               = { workspace = true }
which              = { workspace = true }
open               = { workspace = true }
rust-embed         = { workspace = true }
mime_guess         = { workspace = true }
# `axum-server` (#3304): the shared same-origin write guard the console consumes
# via `routes::origin_guard`. `uds` + `webhook-hmac` (#5089 step 3): the hardened
# UDS dial/framing the webhook relay uses and the single GitHub HMAC verifier.
trusty-common      = { workspace = true, features = ["stdio-mcp-client", "console-metrics", "config-cli", "axum-server", "uds", "uds-supervisor", "webhook-hmac", "webhook-relay"] }
reqwest            = { workspace = true }
thiserror          = { workspace = true }
# Spool entries hold the raw webhook body byte-exact; base64 keeps the JSON
# container from corrupting bytes the HMAC was computed over.
base64             = { workspace = true }

[dev-dependencies]
tempfile       = { workspace = true }
tokio          = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
