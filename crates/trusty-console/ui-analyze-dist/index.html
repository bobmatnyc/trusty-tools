<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trusty-analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- #6155: the daemon-injected `__DAEMON_PORT__` / `__SEARCH_URL__`
         globals are gone. #6287 removed the listener that injected them and
         nothing in src/ ever read them. The console injects
         `window.__ANALYZE_BASE__` here instead (src/tools_ui.rs). -->
    <!-- Apply theme before first paint to avoid flash of wrong palette. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('trusty-analyzer.theme') || 'system';
          var resolved = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CQ1Q_I6T.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DnbOmi_Y.css">
  </head>

    <div id="app"></div>
  </body>
</html>
