[package]
name = "trusty-common"
# 0.40.0 (#5809): the MCP extraction (ADR-0040 Phase 1) removed the public
# `src/mcp/*` modules. Cargo's 0.x rule makes that a MINOR bump, not a patch.
# 0.42.1 (#6208): patch — additive `PalaceHandle::compact_vector_orphans` fixes
# a data-loss race; no public item removed or changed, so not a 0.x break.
# 0.43.2 (#6198): patch — the Jira backend resolves a milestone id to its
# version name internally; every changed item is `pub(super)`, so no public
# item was removed or changed.
# 0.44.0 (#6277): minor — the new public `uds::server` module is additive, and
# nothing existing was removed or changed. Under Cargo's 0.x rule a MINOR bump
# is what a published crate owes a new public module.
# 0.44.1 (#6286): patch — `uds::server` gains the `RpcFallback` trait and
# `RpcRouter::fallback`. Both are additions inside an existing module: no public
# item was removed or changed, and no existing trait gained a method, so nothing
# here breaks a consumer.
# 0.44.2 (#6286): patch — multi-frame streaming responses over UDS. Everything
# is an addition: a new `uds::stream_client` module, new items inside
# `uds::server`, new `#[non_exhaustive]` `UdsRpcError` variants, and new
# `RpcRouter` methods. `RpcRequest` is deliberately untouched — the `"stream"`
# opt-in is read through a private probe struct rather than a new public field,
# which would have made an additive feature a 0.x break.
# #6286 replaces `memory_rpc`'s whole public surface: `resolve_memory_base_url`,
# `resolve_memory_base_url_or_unreachable`, `TRUSTY_MEMORY_URL_ENV` and
# `call_memory_tool_at`'s `&str` base-URL parameter are gone, and
# `CatchupOptions::memory_url` becomes `memory_socket: PathBuf`. Cargo's 0.x rule
# puts a breaking change in the MINOR position.
# 0.45.1 (#6307): patch — the new public `gui_mcp_client` module is purely
# additive; no public item was removed or changed. Kept in the PATCH position
# rather than 0.44.0's MINOR-for-a-new-module precedent because the `^0.45`
# requirement in the workspace table and in two crates' own manifests is what a
# MINOR bump would force churn through, for no compatibility fact it records.
# 0.45.2 (#5188): patch — semantic consolidation defaults off and no longer
# falls back to a local model endpoint. Every public change is additive
# (`ConsolidationProvider`, `resolve_consolidation_provider`, three consts) or a
# default VALUE change on an existing field; no public item was removed or had
# its type changed, so nothing here breaks a consumer at compile time.
# 0.45.6 (#6382): patch — `SearchClient::index_communities` and its
# `CommunitiesWire` struct are removed, but both were private (no `pub`), so
# no public item changed; nothing here breaks a consumer at compile time.
# 0.46.0 (#6464): minor — two accepted breaks that already landed on main.
# `PalaceHandle` gained the public field `commit_mutex`
# (`src/memory_core/retrieval/handle.rs:180`),
# which breaks any struct-literal construction, and
# `PalaceResolveError::NoIdentity` moved from discriminant 3 to 4
# (`palace_resolve.rs:225`). Cargo's 0.x rule puts a break in the MINOR
# position, so 0.46.0 is where they ship.
# 0.46.3 (#5439): patch — new public `daemon_token` module and
# `server::bearer_auth` are additive; cargo-semver-checks reports no break.
# 0.47.0 (issue #4421, post-publish wave 2026-09-01): minor — 0.46.6 is
# already live on crates.io and two queued PRs change `src/**` under it.
# #6562 adds a required method to the public `LogDestination` trait — a
# breaking change under Cargo's 0.x rule. #6573 also adds public API. Bumped
# on `main` first, ahead of either PR, so the `PR version bump vs crates.io`
# gate clears once each PR updates its branch onto this commit.
version = "0.47.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared utilities and provider-agnostic streaming chat (ChatProvider, OllamaProvider, OpenRouter, tool-use) for trusty-* projects"
readme = "README.md"
keywords = ["mcp", "utilities", "cli", "openrouter"]
categories = ["command-line-utilities"]
homepage = "https://github.com/bobmatnyc/trusty-tools"

# #4474: which feature sets constitute full test coverage of this crate, stated
# where a machine can read it.
#
# Why: `default = []` and 47 opt-in features mean no single `cargo test -p
# trusty-common` run covers the crate. Which combination does was tribal
# knowledge, so a new feature could ship with tests nothing ever ran —
# `inference-client` missed `inference::bedrock`, and `credentials`,
# `session-naming` and `memory-core` each went unrun for a whole PR.
# What: `lanes` are the feature sets that together cover every declared
# feature; `exempt` names the features no lane can run, each with the reason.
# `tests/feature_coverage.rs` resolves every lane's transitive feature closure
# from the `[features]` table below and fails when the union plus `exempt` is
# not exactly that table, so adding a feature without placing it fails a test.
# `scripts/test_trusty_common_lanes.sh` reads these same rows and runs them, so
# the runner cannot drift from the statement.
# Test: `every_declared_feature_is_covered_by_a_lane_or_exempted`,
# `lanes_and_exemptions_name_only_declared_features`,
# `every_exemption_states_a_reason` (`tests/feature_coverage.rs`).
[package.metadata.trusty-test-coverage]
lanes = [
    { name = "unconditional", features = [
        "unconditional-only",
    ] },
    { name = "core", features = [
        "memory-core",
        "embedder-test-support",
        "embedder-client",
        "catchup",
        "monitor-tui",
        "search-index",
        "uds-supervisor",
        "webhook-relay",
        "bm25",
        "migrations",
        "docgen",
        "cli-help",
        "crate-config",
        "codex-config",
        "console-metrics",
        # #6517: host-metrics shares this lane with console-metrics so the
        # `console_metrics::machine_status` module (which needs BOTH) is compiled
        # and tested by the core lane, not silently skipped.
        "host-metrics",
        # #6533: log-drain implies `credentials`, which this lane does not
        # otherwise carry. It sits here rather than in `inference` so the
        # collector's `scrub_secrets` path is exercised by the lane that already
        # owns the crate's filesystem-facing modules.
        "log-drain",
        "update-check",
        "bug-capture",
        "session-naming",
        "rpc",
    ] },
    { name = "inference", features = [
        "bedrock-client",
        "config-cli",
        "tickets",
        "intent-source",
        "keyring-store",
        "bedrock",
        "axum-server",
        # #5439: shares this lane with `axum-server` because `server::bearer_auth`
        # compiles only when both are on — a lane that ran `daemon-token` alone
        # would cover the token store and silently skip the guard that uses it.
        "daemon-token",
    ] },
    { name = "symgraph", features = [
        "symgraph-server",
    ] },
]
exempt = [
    { feature = "default", reason = "Empty by design, and `build.rs` fails the build if it stops being empty — it is the precondition the #4901 zero-feature guard rests on, not a module." },
    { feature = "embedder-cuda", reason = "Links ORT against a CUDA host runtime. Mutually exclusive with `embedder-bundled-ort`, which the `core` lane runs, and unbuildable on this workspace's macOS and ubuntu runners." },
    { feature = "embedder-load-dynamic", reason = "Selects ORT's load-dynamic linking for AL2023; gates no `cfg` site anywhere in `src/`, so it changes how `embedder` links and not what it does. `core` runs the embedder tests." },
    { feature = "embedder-coreml", reason = "Documented no-op alias for `embedder`, kept for backward compatibility; gates no `cfg` site anywhere in `src/`." },
    { feature = "embedder-candle", reason = "Every test it gates is `#[ignore]`d — they download ~90 MB from HuggingFace. Run them deliberately: `cargo test -p trusty-common --features embedder-candle -- --ignored`." },
]

[lib]
crate-type = ["rlib"]

# Candle Metal RSS validation harness (absorbed from trusty-embedder).
# Requires the `embedder-candle` feature to be enabled.
[[bin]]
name = "candle_metal_bench"
path = "src/bin/candle_metal_bench.rs"
required-features = ["embedder-candle"]

# Unified ticketing MCP server (absorbed from trusty-tickets).
# Requires the `tickets` feature to be enabled.
[[bin]]
name = "tickets-mcp"
path = "src/bin/tickets_mcp.rs"
required-features = ["tickets"]

# Task-drawer + dream-cycle integration test (spec-001 Phase 4, issue #1722).
# Pre-existing gap fixed incidentally by #2401: this target references
# `trusty_common::memory_core` and the `embedder-test-support`-gated
# `seed_shared_embedder_with_mock` unconditionally, so `cargo test
# -p trusty-common` with default (empty) features failed to compile it.
# `required-features` tells cargo to skip building this test binary unless
# both are enabled, matching the pattern already used for the
# `candle_metal_bench` / `tickets-mcp` binaries above.
[[test]]
name = "memory_palace"
path = "tests/memory_palace.rs"
required-features = ["memory-core", "embedder-test-support"]

# Inference-foundation integration suite (issue #2402). References
# `trusty_common::inference::{InferenceAdapter, Configurator, …}`, which only
# exist behind the `inference-client` feature, so — like `memory_palace` above —
# `required-features` tells cargo to skip building it unless that feature is on.
[[test]]
name = "inference_foundation"
path = "tests/inference_foundation.rs"
required-features = ["inference-client"]

# Concrete inference-adapter integration suite (issue #2403). Drives the
# OpenRouter/Fireworks/OpenAI adapters through the `Configurator` against the
# axum `MockInferenceServer`, so it needs BOTH `inference-client` (the adapters)
# and `axum-server` (the HTTP mock); `required-features` skips it otherwise.
[[test]]
name = "inference_adapters"
path = "tests/inference_adapters.rs"
required-features = ["inference-client", "axum-server"]

# Universal `config keys` CLI suite (issue #2404). Drives the `config keys`
# argv grammar + the set/list/test/unset operations through the injectable
# `inference::config::ops` seam, with the live `test` probe hitting the axum
# `MockInferenceServer`. Needs BOTH `config-cli` (the command + ops) and
# `axum-server` (the HTTP mock); `required-features` skips it otherwise.
[[test]]
name = "config_keys_cli"
path = "tests/config_keys_cli.rs"
required-features = ["config-cli", "axum-server"]

# Bedrock Converse adapter integration suite (issue #2407). Drives the offline
# configurator wiring — `register_bedrock_factory` + `Configurator::build` for a
# `bedrock/*` slug — proving the adapter registers and constructs without any AWS
# call (the client is lazy). Needs the `bedrock-client` feature; `required-features`
# skips it otherwise.
[[test]]
name = "inference_bedrock"
path = "tests/inference_bedrock.rs"
required-features = ["bedrock-client"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "macros", "rt", "sync", "process", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Process RSS / CPU sampling for the shared `sys_metrics` module; the
# `Layer` impl in `log_buffer` also uses tracing-subscriber's `registry`
# feature (enabled in the workspace dep).
sysinfo = { workspace = true }
# Cross-process advisory file locking for the `json_rmw` locked
# read-modify-write critical section (trusty-mpm's projects.json lost-update
# bug; same primitive trusty-gworkspace already uses for tokens.json, #3502).
fd-lock = { workspace = true }
dirs = { workspace = true }
colored = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Optional: enabled by the `rpc` feature for UUID-v4 JSON-RPC request ids.
uuid = { workspace = true, optional = true }
# Optional: enabled by `daemon-token` for `url_targets_loopback` (#5439). The
# gate must parse a URL the way the client dialling it does; a hand-rolled
# authority split is the bug it exists to prevent.
url = { workspace = true, optional = true }
# Optional: enabled by the `embedder` feature (formerly the `trusty-embedder`
# crate). fastembed-rs provides the ONNX-runtime text-embedding pipeline;
# `hf-hub-native-tls` is required so it can fetch the model on first run.
fastembed = { workspace = true, features = ["hf-hub-native-tls"], optional = true }
lru = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
# Optional: enabled by the `embedder-candle` feature (issue #54). Candle is
# an opt-in alternative BERT backend (all-MiniLM-L6-v2) running on Metal or
# CPU, bypassing the ONNX/CoreML jetsam-kill risk on Apple Silicon. Default
# builds keep the fastembed/ORT path unchanged.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# Optional: enabled by the `monitor-tui` feature (formerly the
# `trusty-monitor-tui` crate). ratatui + crossterm power the unified
# terminal dashboard for the trusty-search and trusty-memory daemons.
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Optional: enabled by the `symgraph` / `symgraph-parser` features (formerly
# the `trusty-symgraph` crate). The `symgraph` feature pulls in only the
# pure-data contracts surface (`thiserror`, `sha2`) — no tree-sitter, no
# `links` conflict. The `symgraph-parser` feature additionally pulls in
# tree-sitter and all grammar crates plus the emitter / editor stack.
thiserror = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
similar = { version = "2", features = ["text"], optional = true }
walkdir = { workspace = true, optional = true }
petgraph = { version = "0.8", features = ["serde-1"], optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
syn = { version = "2.0", features = ["full"], optional = true }
prettyplease = { version = "0.2", optional = true }
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }
genco = { version = "0.19", optional = true }

# Optional: enabled by the `memory-core` feature (formerly the
# `trusty-memory-core` crate). Memory Palace storage engine — HNSW
# vector index (pure-Rust `hnsw_rs`), redb-backed knowledge graph,
# fastembed embeddings, git-history extraction, dream/decay analytics.
# Heavy deps gated behind the feature so downstream crates that only
# want chat / mcp / symgraph pay zero cost.
hex = { workspace = true, optional = true }
# Optional: enabled by the `webhook-hmac` feature (#5089 step 3). The GitHub
# `X-Hub-Signature-256` verifier is the crate's only HMAC consumer.
hmac = { workspace = true, optional = true }
hnsw_rs = { workspace = true, optional = true }
# Optional: enabled by the `memory-core` feature. NFC composition for
# `memory_core::content_hash`'s normalization contract (#5902) — the only
# consumer, so it is gated with the rest of the Memory Palace.
unicode-normalization = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Non-optional: the unconditional `log_buffer` module timestamps each captured
# dashboard log line via `chrono::Local` (issue #846). It must be available in
# default-features builds, so it cannot be gated behind a feature flag.
chrono = { workspace = true }
regex = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
# Optional: enabled by the `tickets` feature (absorbed from `trusty-tickets`).
# base64 is used by the JIRA backend for Basic-auth encoding.
base64 = { workspace = true, optional = true }
# Optional: enabled by the `tickets` feature for config-file parsing. Also
# reused by the `credentials` feature's `FileKeyStore` backend (issue #2401).
toml = { version = "0.8", optional = true }
toml_edit = { workspace = true, optional = true }

# Optional: enabled by the `credentials` feature (issue #2401). Shared
# `.env.local` loader for the `credentials` resolver's env tier.
dotenvy = { workspace = true, optional = true }
# Optional: enabled by the `keyring-store` feature (issue #2401). OS-keychain
# backend for `credentials::KeyringStore`.
keyring = { workspace = true, optional = true }
# Optional: enabled by the `config-cli` feature (issue #2404). `clap` provides
# the derive surface for the universal `config` command; `rpassword` reads a key
# from the TTY without echo for `config keys set`. Both are workspace deps used
# elsewhere; gating them keeps the base library (and its `inference-client`
# consumers) free of a clap/CLI dependency.
clap = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

# Optional: enabled by the `cli-help` feature. Declarative help-config parsing
# (YAML → `HelpConfig`) plus the "did you mean?" suggester for unknown
# subcommands. Kept off by default so library consumers that only want the
# chat / mcp / symgraph surfaces don't pay the parse cost.
serde_yaml = { workspace = true, optional = true }
strsim = { workspace = true, optional = true }

# Optional: enabled by the `bedrock` feature (streaming `ChatProvider`) and the
# `bedrock-client` feature (the `inference::bedrock` Converse adapter, #2407).
# AWS Bedrock Converse API client + credential chain. `aws-smithy-types` is
# additionally required by the `bedrock-client` adapter for the `Document` <->
# JSON tool-argument/schema conversion.
aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }

# Optional: enabled by the `log-drain` feature (#6533). `object_store` supplies
# both destination adapters — `AmazonS3Builder` for `s3://` and
# `LocalFileSystem` for `file://`. `bytes` names the payload type in
# `LogDestination::put`'s own signature. `flate2` gzips each body on the wire,
# `sha2` produces the manifest's plaintext digest, `globset` compiles a
# `LogSource`'s include patterns, and `walkdir` enumerates its root. Every one
# of these is already an optional workspace dep pulled in by some other feature;
# only `object_store` and `bytes` are new to the lockfile.
object_store = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
globset = { workspace = true, optional = true }

# Optional: enabled by the `catchup` feature (DOC-28 cutover bridge, #1762).
# rusqlite is used only by the `mpm_registry` submodule to read the
# claude-mpm session-registry SQLite DB. All other catch-up deps (chrono,
# reqwest, dirs, serde, serde_json, anyhow, tokio) are already unconditional.
rusqlite = { workspace = true, optional = true }

# `tickets`' MCP stdio server speaks JSON-RPC through the shared primitives,
# which ADR-0040 (#5803) moved out of this crate into `trusty-mcp`. Optional so
# the 20-plus consumers that never enable `tickets` do not compile it.
trusty-mcp = { workspace = true, optional = true }

# libc on every unix target: the macOS `launchd` module needs getuid(2) for the
# gui/<uid> domain, and (#5099) the `uds` module needs getuid(2) plus
# SO_PEERCRED / getpeereid on both macOS and Linux for peer-credential checks.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Cross-platform direct ort dep for the `embedder` feature. Pinned to the
# exact version fastembed-rs requires (`=2.0.0-rc.12`). We need ort as a
# direct dep so we can register execution providers at runtime (CoreML on
# Apple Silicon, CUDA when the `embedder-cuda` feature is enabled).
[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = ["std", "api-24"]
optional = true

# macOS-specific: add the `coreml` feature so the runtime can build a
# CoreML EP on Apple Silicon. Only takes effect when the `embedder`
# feature is enabled (ort is optional).
[target.'cfg(target_os = "macos")'.dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = ["coreml", "std", "api-24"]
optional = true

[dev-dependencies]
toml = "0.8"
tempfile = { workspace = true }
# libc: the production dependency (above) is macOS-only (launchd/getuid), but
# the #3830 fd-redirection regression tests (`update::tests`) need dup/dup2/
# STDOUT_FILENO on every unix CI target (this workspace's CI runs on
# ubuntu-latest) — an unconditional dev-only dependency makes that available
# for `#[cfg(test)]` code without adding libc to any non-macOS production
# build.
libc = { workspace = true }
# serial_test: run env-mutating tests serially to prevent env-var races across
# parallel test threads (e.g. supervisor_tests.rs).
serial_test = { workspace = true }
# uuid: used by kg_store_snapshot_tests (integration tests for snapshot write-rejection).
uuid = { workspace = true }
# redb: used by kg_store_snapshot_tests to hold the exclusive flock.
redb = { workspace = true }
# chrono: used by kg_store_snapshot_tests to construct triples.
chrono = { workspace = true }
# tokio: used by kg_store_snapshot_tests async test harness.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# postcard: used by `memory_palace` integration test to assert DrawerType
# serialization indices are stable (issue #1722 backward-compat guarantee).
postcard = { workspace = true }
# wiremock: hermetic HTTP mock server for `search_client`'s `fetch_all`
# regression test (#6382 — proves the dead `/communities` route is no longer
# dialled).
wiremock = { workspace = true }
# tower: `ServiceExt::oneshot` drives `server::bearer_auth`'s router through the
# middleware with no socket bound (#5439), the same way the consuming daemons'
# router tests do.
tower = { workspace = true }

[features]
default = []
# #4901: names a test run that deliberately covers only the always-compiled
# surface (banner, port, slug, data_dir, chat, tmux, …). Enables no module and
# pulls in no dependency — its whole job is to be typed on the command line, so
# that `cargo test -p trusty-common --features unconditional-only` says out loud
# what the bare form used to hide: 328 of the crate's ~2062 tests ran, and the
# feature-gated modules were never compiled. The `build.rs` zero-feature guard
# rejects the bare form; this is the documented way through it when the gated
# modules genuinely are not what you changed.
unconditional-only = []
# Enables the `docgen` module: marker-delimited generated documentation
# regions (`<!-- BEGIN GENERATED: <id> -->`) plus the MCP-tool-table renderer
# and the check-or-rewrite gate the consumer crates' `tests/generated_docs.rs`
# drive. Test-facing only — enable it in `[dev-dependencies]`, not in
# `[dependencies]`. Adds no new dependency: `serde_json` is already
# unconditional here, so the flag gates module compilation alone.
docgen = []
# Enables the `catchup` module: DOC-28 incremental catch-up engine for the
# trusty-mpm ↔ trusty-code cutover bridge (#1762). Provides
# `CatchupOptions`, `generate_catchup_context`, `run_catchup`,
# `run_catchup_blocking`, and the per-source submodules (`git`, `palace`,
# `state`, `session_finder`, `mpm_session`, `mpm_registry`). Pulls in
# `rusqlite` for the claude-mpm session-registry reader; all other deps are
# already unconditional in this crate. Also requires `memory-rpc` (issue #2030):
# `catchup::palace` reaches trusty-memory via `memory_rpc`'s discovery +
# JSON-RPC helper rather than a hardcoded REST URL.
catchup = ["dep:rusqlite", "memory-rpc", "palace-resolve"]
# Enables the `server` module: standard axum middleware stack (CORS, trace,
# gzip) and a fast-fail reqwest client for daemon-to-daemon calls.
axum-server = ["dep:axum", "dep:tower-http"]
# Enables the `daemon_token` module (#5439): the `0600` local-client credential
# a loopback daemon and its clients share, the WHATWG loopback gate every client
# resolves through, and the constant-time comparison every verifier uses.
# Turning it on WITH `axum-server` additionally compiles `server::bearer_auth`,
# the router-wide enforcement layer. Kept separate from `axum-server` because
# the two halves are genuinely separable — a client that only reads the token
# needs no router — even though both of today's consumers happen to enable both.
# `uuid` supplies the CSPRNG behind `mint_token`, `url` the WHATWG parsing the
# loopback gate must not hand-roll, and `thiserror` the weak-credential error;
# all three are already optional dependencies here.
daemon-token = ["dep:uuid", "dep:url", "dep:thiserror"]
# Enables the `memory_rpc` module: the one JSON-RPC client for the
# trusty-memory daemon's Unix socket. Implies `uds` (#6286) — the daemon retired
# its HTTP listener, so the framing and the envelope now come from that module
# rather than from `reqwest`.
#
# This is what remains of the former `mcp` feature. ADR-0040 (#5803) moved the
