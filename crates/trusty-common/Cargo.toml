[package]
name = "trusty-common"
version = "0.23.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared utilities and provider-agnostic streaming chat (ChatProvider, OllamaProvider, OpenRouter, tool-use) for trusty-* projects"
readme = "README.md"
keywords = ["mcp", "utilities", "cli", "openrouter"]
categories = ["command-line-utilities"]
homepage = "https://github.com/bobmatnyc/trusty-tools"

[lib]
crate-type = ["rlib"]

# Candle Metal RSS validation harness (absorbed from trusty-embedder).
# Requires the `embedder-candle` feature to be enabled.
[[bin]]
name = "candle_metal_bench"
path = "src/bin/candle_metal_bench.rs"
required-features = ["embedder-candle"]

# Unified ticketing MCP server (absorbed from trusty-tickets).
# Requires the `tickets` feature to be enabled.
[[bin]]
name = "tickets-mcp"
path = "src/bin/tickets_mcp.rs"
required-features = ["tickets"]

# Task-drawer + dream-cycle integration test (spec-001 Phase 4, issue #1722).
# Pre-existing gap fixed incidentally by #2401: this target references
# `trusty_common::memory_core` and the `embedder-test-support`-gated
# `seed_shared_embedder_with_mock` unconditionally, so `cargo test
# -p trusty-common` with default (empty) features failed to compile it.
# `required-features` tells cargo to skip building this test binary unless
# both are enabled, matching the pattern already used for the
# `candle_metal_bench` / `tickets-mcp` binaries above.
[[test]]
name = "memory_palace"
path = "tests/memory_palace.rs"
required-features = ["memory-core", "embedder-test-support"]

# Inference-foundation integration suite (issue #2402). References
# `trusty_common::inference::{InferenceAdapter, Configurator, …}`, which only
# exist behind the `inference-client` feature, so — like `memory_palace` above —
# `required-features` tells cargo to skip building it unless that feature is on.
[[test]]
name = "inference_foundation"
path = "tests/inference_foundation.rs"
required-features = ["inference-client"]

# Concrete inference-adapter integration suite (issue #2403). Drives the
# OpenRouter/Fireworks/OpenAI adapters through the `Configurator` against the
# axum `MockInferenceServer`, so it needs BOTH `inference-client` (the adapters)
# and `axum-server` (the HTTP mock); `required-features` skips it otherwise.
[[test]]
name = "inference_adapters"
path = "tests/inference_adapters.rs"
required-features = ["inference-client", "axum-server"]

# Universal `config keys` CLI suite (issue #2404). Drives the `config keys`
# argv grammar + the set/list/test/unset operations through the injectable
# `inference::config::ops` seam, with the live `test` probe hitting the axum
# `MockInferenceServer`. Needs BOTH `config-cli` (the command + ops) and
# `axum-server` (the HTTP mock); `required-features` skips it otherwise.
[[test]]
name = "config_keys_cli"
path = "tests/config_keys_cli.rs"
required-features = ["config-cli", "axum-server"]

# Bedrock Converse adapter integration suite (issue #2407). Drives the offline
# configurator wiring — `register_bedrock_factory` + `Configurator::build` for a
# `bedrock/*` slug — proving the adapter registers and constructs without any AWS
# call (the client is lazy). Needs the `bedrock-client` feature; `required-features`
# skips it otherwise.
[[test]]
name = "inference_bedrock"
path = "tests/inference_bedrock.rs"
required-features = ["bedrock-client"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "macros", "rt", "sync", "process", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Process RSS / CPU sampling for the shared `sys_metrics` module; the
# `Layer` impl in `log_buffer` also uses tracing-subscriber's `registry`
# feature (enabled in the workspace dep).
sysinfo = { workspace = true }
dirs = { workspace = true }
colored = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Optional: enabled by the `rpc` feature for UUID-v4 JSON-RPC request ids.
uuid = { workspace = true, optional = true }
# Optional: enabled by the `embedder` feature (formerly the `trusty-embedder`
# crate). fastembed-rs provides the ONNX-runtime text-embedding pipeline;
# `hf-hub-native-tls` is required so it can fetch the model on first run.
fastembed = { workspace = true, features = ["hf-hub-native-tls"], optional = true }
lru = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
# Optional: enabled by the `embedder-candle` feature (issue #54). Candle is
# an opt-in alternative BERT backend (all-MiniLM-L6-v2) running on Metal or
# CPU, bypassing the ONNX/CoreML jetsam-kill risk on Apple Silicon. Default
# builds keep the fastembed/ORT path unchanged.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# Optional: enabled by the `monitor-tui` feature (formerly the
# `trusty-monitor-tui` crate). ratatui + crossterm power the unified
# terminal dashboard for the trusty-search and trusty-memory daemons.
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Optional: enabled by the `symgraph` / `symgraph-parser` features (formerly
# the `trusty-symgraph` crate). The `symgraph` feature pulls in only the
# pure-data contracts surface (`thiserror`, `sha2`) — no tree-sitter, no
# `links` conflict. The `symgraph-parser` feature additionally pulls in
# tree-sitter and all grammar crates plus the emitter / editor stack.
thiserror = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
similar = { version = "2", features = ["text"], optional = true }
walkdir = { workspace = true, optional = true }
petgraph = { version = "0.8", features = ["serde-1"], optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
syn = { version = "2.0", features = ["full"], optional = true }
prettyplease = { version = "0.2", optional = true }
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }
genco = { version = "0.19", optional = true }

# Optional: enabled by the `memory-core` feature (formerly the
# `trusty-memory-core` crate). Memory Palace storage engine — HNSW
# vector index (pure-Rust `hnsw_rs`), redb-backed knowledge graph,
# fastembed embeddings, git-history extraction, dream/decay analytics.
# Heavy deps gated behind the feature so downstream crates that only
# want chat / mcp / symgraph pay zero cost.
hex = { workspace = true, optional = true }
hnsw_rs = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Non-optional: the unconditional `log_buffer` module timestamps each captured
# dashboard log line via `chrono::Local` (issue #846). It must be available in
# default-features builds, so it cannot be gated behind a feature flag.
chrono = { workspace = true }
regex = { workspace = true, optional = true }
kuzu = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
# Optional: enabled by the `tickets` feature (absorbed from `trusty-tickets`).
# base64 is used by the JIRA backend for Basic-auth encoding.
base64 = { workspace = true, optional = true }
# Optional: enabled by the `tickets` feature for config-file parsing. Also
# reused by the `credentials` feature's `FileKeyStore` backend (issue #2401).
toml = { version = "0.8", optional = true }

# Optional: enabled by the `credentials` feature (issue #2401). Shared
# `.env.local` loader for the `inference::credentials` resolver's env tier.
dotenvy = { workspace = true, optional = true }
# Optional: enabled by the `keyring-store` feature (issue #2401). OS-keychain
# backend for `inference::credentials::KeyringStore`.
keyring = { workspace = true, optional = true }
# Optional: enabled by the `config-cli` feature (issue #2404). `clap` provides
# the derive surface for the universal `config` command; `rpassword` reads a key
# from the TTY without echo for `config keys set`. Both are workspace deps used
# elsewhere; gating them keeps the base library (and its `inference-client`
# consumers) free of a clap/CLI dependency.
clap = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

# Optional: enabled by the `cli-help` feature. Declarative help-config parsing
# (YAML → `HelpConfig`) plus the "did you mean?" suggester for unknown
# subcommands. Kept off by default so library consumers that only want the
# chat / mcp / symgraph surfaces don't pay the parse cost.
serde_yaml = { workspace = true, optional = true }
strsim = { workspace = true, optional = true }

# Optional: enabled by the `bedrock` feature (streaming `ChatProvider`) and the
# `bedrock-client` feature (the `inference::bedrock` Converse adapter, #2407).
# AWS Bedrock Converse API client + credential chain. `aws-smithy-types` is
# additionally required by the `bedrock-client` adapter for the `Document` <->
# JSON tool-argument/schema conversion.
aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }

# Optional: enabled by the `catchup` feature (DOC-28 cutover bridge, #1762).
# rusqlite is used only by the `mpm_registry` submodule to read the
# claude-mpm session-registry SQLite DB. All other catch-up deps (chrono,
# reqwest, dirs, serde, serde_json, anyhow, tokio) are already unconditional.
rusqlite = { workspace = true, optional = true }

# launchd module is macOS-only and needs getuid(2) for the gui/<uid> domain.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

# Cross-platform direct ort dep for the `embedder` feature. Pinned to the
# exact version fastembed-rs requires (`=2.0.0-rc.12`). We need ort as a
# direct dep so we can register execution providers at runtime (CoreML on
# Apple Silicon, CUDA when the `embedder-cuda` feature is enabled).
[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = ["std", "api-24"]
optional = true

# macOS-specific: add the `coreml` feature so the runtime can build a
# CoreML EP on Apple Silicon. Only takes effect when the `embedder`
# feature is enabled (ort is optional).
[target.'cfg(target_os = "macos")'.dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = ["coreml", "std", "api-24"]
optional = true

[dev-dependencies]
toml = "0.8"
tempfile = { workspace = true }
# serial_test: run env-mutating tests serially to prevent env-var races across
# parallel test threads (e.g. supervisor_tests.rs).
serial_test = { workspace = true }
# uuid: used by kg_store_snapshot_tests (integration tests for snapshot write-rejection).
uuid = { workspace = true }
# redb: used by kg_store_snapshot_tests to hold the exclusive flock.
redb = { workspace = true }
# chrono: used by kg_store_snapshot_tests to construct triples.
chrono = { workspace = true }
# tokio: used by kg_store_snapshot_tests async test harness.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# postcard: used by `memory_palace` integration test to assert DrawerType
# serialization indices are stable (issue #1722 backward-compat guarantee).
postcard = { workspace = true }

[features]
default = []
# Enables the `catchup` module: DOC-28 incremental catch-up engine for the
# trusty-mpm ↔ trusty-code cutover bridge (#1762). Provides
# `CatchupOptions`, `generate_catchup_context`, `run_catchup`,
# `run_catchup_blocking`, and the per-source submodules (`git`, `palace`,
# `state`, `session_finder`, `mpm_session`, `mpm_registry`). Pulls in
# `rusqlite` for the claude-mpm session-registry reader; all other deps are
# already unconditional in this crate. Also requires `mcp` (issue #2030):
# `catchup::palace` reaches trusty-memory via `mcp::memory_rpc`'s discovery +
# JSON-RPC helper rather than a hardcoded REST URL.
catchup = ["dep:rusqlite", "mcp"]
# Enables the `server` module: standard axum middleware stack (CORS, trace,
# gzip) and a fast-fail reqwest client for daemon-to-daemon calls.
axum-server = ["dep:axum", "dep:tower-http"]
# Enables the `mcp` module: shared JSON-RPC 2.0 / MCP primitives (formerly the
# `trusty-mcp-core` crate). Pulls in no extra deps beyond `serde` / `tokio`
# which are already required.
mcp = []
# Enables the `search_index` module: the shared best-effort "ensure this project
# is indexed by trusty-search" entry point (issues #1373 / #1908), used by
# trusty-mpm at session launch and trusty-code at task start. Adds no new
# dependency — it only turns on `reqwest`'s `blocking` client feature (reqwest is
# already an unconditional dep). `chrono` / `serde_json` / `tracing` and the
# `index_id` / `daemon_addr` helpers it uses are already unconditional, so the
# feature flag gates module compilation + the blocking client only. Off by
# default so consumers that don't register indexes pay nothing.
search-index = ["reqwest/blocking"]
# Enables the `session_naming` module: the ONE canonical tmux-session naming
# rule (managed prefix, adjective+noun / dir-slug / serial derivation, and the
# `is_managed_session_name` classifier) shared by trusty-mpm's SessionManager
# and trusty-agents' TmManager so lifecycle passes (reconcile/prune/adopt) never
# orphan a session created by the other manager (SPEC-ONESM-01 / DOC-33). Pulls
# in `uuid` (UUID→name derivation) and `thiserror` (`SessionNameError`), both
# already optional workspace deps in this crate.
session-naming = ["dep:uuid", "dep:thiserror"]
# Enables the `rpc` module: general-purpose JSON-RPC client + stdio/HTTP
# transports + pretty-print helpers (formerly the library half of the
# `trusty-rpc` crate). Requires `uuid` for request id generation and reuses
# the workspace `reqwest` for HTTP transport.
rpc = ["dep:uuid"]
# Enables the `embedder` module: shared text-embedding abstraction
# (Embedder trait + FastEmbedder + MockEmbedder), formerly the
# `trusty-embedder` crate. Pulls in fastembed-rs, lru, parking_lot, and
# the ort direct dep. Defaults to bundled ORT linking — see the
# `embedder-*` sub-features for AL2023 / CUDA / load-dynamic variants.
embedder = ["dep:fastembed", "dep:lru", "dep:parking_lot", "dep:ort"]
# Enables the `bm25` module: zero-dependency BM25 lexical index +
# code-aware tokenizer (issue #156). Pure `std` + `tracing` — no new deps.
bm25 = []
# Enables the `migrations` module: reusable schema-migration kernel
# (`SchemaVersion`, `Migration`, `MigrationRunner`, file-stamp helpers).
# Issue #179. Pure user of existing `serde` / `serde_json` / `anyhow` /
# `tracing` workspace deps — adds no new dependencies.
migrations = []
# Enables the `bm25_client` module: a UDS JSON-RPC client for the per-palace
# `trusty-bm25-daemon` subprocess (issue #156). Pure user of existing
# `tokio` / `serde_json` / `anyhow` workspace deps — adds no new deps.
bm25-client = []
# Bundle the ONNX Runtime static libs via fastembed's
# `ort-download-binaries-native-tls`. Right choice for macOS and modern
# Linux (glibc ≥ 2.38). Mutually exclusive with `embedder-load-dynamic`
# and `embedder-cuda` at the `ort-sys` level.
embedder-bundled-ort = ["embedder", "fastembed/ort-download-binaries-native-tls"]
# GPU-accelerated embedding via ort's CUDA execution provider. Pairs with
# `fastembed/ort-load-dynamic` so no glibc-2.38-bound static ORT binaries
# are bundled. Operators provide a host-compatible `libonnxruntime.so` and
# point to it with `ORT_DYLIB_PATH=/path/to/lib` at runtime.
embedder-cuda = ["embedder", "fastembed/cuda", "fastembed/ort-load-dynamic", "ort/cuda", "ort/load-dynamic"]
# Dynamic ORT loading without CUDA — for AL2023 (glibc 2.34) CPU-only
# builds. Set `ORT_DYLIB_PATH` at runtime.
embedder-load-dynamic = ["embedder", "fastembed/ort-load-dynamic", "ort/load-dynamic"]
# Deprecated: CoreML is now auto-detected at runtime on macOS. Kept as a
# no-op alias for backward compatibility.
embedder-coreml = ["embedder"]
# Exposes the `MockEmbedder` test double outside `cfg(test)` so downstream
# integration tests can reuse it.
embedder-test-support = ["embedder"]
# Issue #54: opt-in Candle BERT backend (all-MiniLM-L6-v2 on Metal/CPU). Does
# NOT replace the fastembed/ORT default — operators select it at runtime via
# `TRUSTY_EMBEDDER=candle` on builds that compiled this feature in. The
# CandleEmbedder lives in `embedder::candle_embedder` behind a `#[cfg]` gate.
embedder-candle = [
    "embedder",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
    # `thiserror` is otherwise gated on the `symgraph` feature; the candle
    # embedder uses it for `CandleEmbedderError`, so we pull it in here.
    "dep:thiserror",
]
# Enables the `symgraph` module's contracts surface (formerly the
# `trusty-symgraph` crate's default surface): pure data types
# (`EntityType` / `RawEntity` / `EdgeKind` / `fact_hash_str` / tables).
# Pulls in `thiserror` and `sha2` only — no tree-sitter, no `links`
# conflict. Downstream crates that only need the knowledge-graph data
# shapes (trusty-search, trusty-analyze) enable this feature and stop.
symgraph = ["dep:thiserror", "dep:sha2"]
# Enables the full symgraph parser + emitter + graph stack: tree-sitter
# grammars (Rust, Python, JavaScript, Go, Java, TypeScript, C, C++), the
# `IndexMap`-based `SymbolRegistry`, the deterministic emitter, the
# `SymbolGraph`, editor primitives, and the strategy/locality/
# test-colocation modules. Pulls in the `links = "tree-sitter"` constraint
# — only enable in one crate per build graph (typically `open-mpm`).
symgraph-parser = [
    "symgraph",
    "dep:uuid",
    "dep:indexmap",
    "dep:similar",
    "dep:walkdir",
    "dep:petgraph",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:syn",
    "dep:prettyplease",
    "dep:proc-macro2",
    "dep:quote",
    "dep:genco",
]
# Enables the symgraph HTTP server module (axum + tokio). Implies the
# full parser stack.
symgraph-server = ["symgraph-parser", "axum-server"]
# Enables the `memory_core` module: Memory Palace storage engine
# (formerly the `trusty-memory-core` crate). Pulls in usearch (HNSW
# vector index), redb + postcard (knowledge graph + payload/chat stores),
# git2 (git history extraction), and dashmap / chrono / regex /
# lru / parking_lot / thiserror / uuid utilities. Requires the bundled-ORT
# embedder variant by default so FastEmbedder is available; downstream
# consumers can switch to the load-dynamic or CUDA variants by enabling
# `embedder-load-dynamic` / `embedder-cuda` explicitly.
#
# Issue #47: rusqlite / r2d2 / r2d2_sqlite are no longer pulled in by this
# feature — all stores migrated to redb (#44, #45, #46, #56, #57). The
# migration-era `usearch-migrate` and `sqlite-kg` features have been removed
# (issue #989) — all production palaces are confirmed migrated to redb.
#
# Issue #2401: implies `credentials` so `memory_core::filter::redact_token`
# can delegate to the single canonical `inference::credentials::redact_secret`
# implementation without every `memory-core` consumer needing to opt in to
# `credentials` separately — the two extra deps it pulls (`toml`, `dotenvy`)
# are negligible next to memory-core's existing footprint.
memory-core = [
    "dep:hnsw_rs",
    "dep:git2",
    "dep:dashmap",
    "dep:futures",
    "dep:regex",
    "dep:lru",
    "dep:parking_lot",
    "dep:thiserror",
    "dep:uuid",
    "dep:redb",
    "dep:postcard",
    "dep:petgraph",
    "dep:sha2",
    "dep:hex",
    "embedder",
    "embedder-bundled-ort",
    "credentials",
]
# Optional kuzu graph DB read-only integration on top of the memory-core
# feature. Pulls in the `kuzu` crate. Off by default because kuzu adds a
# large native dependency.
memory-core-kuzu = ["memory-core", "dep:kuzu"]
# Enables the `monitor` module: the unified ratatui dashboard for the
# trusty-search and trusty-memory daemons (formerly the `trusty-monitor-tui`
# crate, and before that the standalone `trusty-monitor` binary). Pulls in
# ratatui + crossterm; the daemon HTTP clients reuse the `reqwest` already
# required. Consumed via `trusty_common::monitor::run()` by the
# `monitor tui` subcommand of `trusty-search` and `trusty-memory`.
monitor-tui = ["dep:ratatui", "dep:crossterm"]
# Enables the `embedder_client` module: HTTP client trait + wire types +
# InProcessEmbedderClient + RemoteEmbedderClient for the `trusty-embedderd`
# standalone process (issue #110 Phase 1). Formerly the `trusty-embedder-client`
# crate — consolidated here. Requires `reqwest` (already a
# workspace dep), `async-trait`, and `thiserror` (already workspace deps).
# The `embedder` feature is NOT implied so callers that only need the HTTP
# client path don't pull in fastembed/ORT. Use
# `features = ["embedder-client", "embedder", "embedder-bundled-ort"]` to get
# both the in-process and remote paths.
# Note: module name is `embedder_client` (with `er`) to distinguish from the
# existing `embed_client` (UDS, PR #157). Issue #164 will reconcile them.
embedder-client = ["dep:thiserror", "embedder"]
# Enables the `tickets` module: unified ticketing MCP server with GitHub,
# JIRA, and Linear backends (absorbed from the former standalone `trusty-tickets`
# crate). Pulls in `chrono`, `uuid`, `base64`, `thiserror`, and `toml` as
# additional optional deps. Requires the `mcp` feature for the stdio loop.
tickets = ["mcp", "dep:uuid", "dep:base64", "dep:thiserror", "dep:toml"]
# Enables the `intent_source` module: the shared intent-source resolver (ISR)
# for the intent/method conformance gates (DOC-15, SPEC-CONFORMANCE-03, #1358).
# Resolves the ticket method + spec method from a PR or ticket-id and applies
# precedence (ticket > spec), returning one `ResolvedIntent` that both the
# FRONT gate (trusty-mpm) and the BACK gate (trusty-review) consume. Reuses the
# in-crate `tickets` backend (`Backend::get_issue`) and is designed to compose
# with the `chat` `ChatProvider` surface for optional method extraction; it
# lifts tga's PR→ticket regexes so neither gate pulls tga's git2/rusqlite stack.
# Pulls in `regex` and `thiserror`. The non-consumer trusty-common dependents
# pay nothing (feature off by default).
intent-source = ["tickets", "dep:regex", "dep:thiserror"]
# Enables the `help` module: declarative CLI help loader (`HelpConfig` parsed
# from a per-binary `help.yaml` bundled via `include_str!`), the canonical
# `render_help` formatter, and a Jaro-Winkler-based `suggest("did you mean?")`
# helper consumed by each binary's unknown-subcommand error path. Pulls in
# `serde_yaml`, `strsim`, `indexmap`, and `thiserror` (all otherwise optional).
# Issue #216.
cli-help = ["dep:serde_yaml", "dep:strsim", "dep:indexmap", "dep:thiserror"]
# Enables the `crate_config` module: the `~/.trusty-tools/<crate>/config.yaml`
# cross-crate configuration convention (#1220). Provides a generic typed YAML
# loader/saver so every trusty-* crate resolves its config from one canonical,
# per-crate location. Pulls in `serde_yaml` (pinned 0.9 — see the workspace
# manifest's pin note and #1250) and `dirs` (already an unconditional dep).
crate-config = ["dep:serde_yaml", "dep:thiserror"]
# Enables the `update` module: throttled crates.io update-notification helper.
# Checks once per 24 h via a JSON cache file in the OS cache directory. Opt-out
# via `TRUSTY_NO_UPDATE_CHECK` or `CI` environment variables. Reuses the
# unconditional `reqwest`, `serde`, `serde_json`, `dirs`, and `tracing` deps —
# the feature flag controls module compilation only, adding zero new transitive
# dependencies to builds that enable it.
update-check = []
# Enables the `error_capture` module: tracing Layer that taps ERROR-level
# events into a bounded ring buffer + local JSONL store for consent-gated
# bug reporting (Phase 1 of #479). Captures fingerprinted error records with
# crate attribution, code location, OS/arch, and a dedup SHA-256 fingerprint.
# Opt-out via `TRUSTY_NO_BUG_CAPTURE` env var. Additive — does not change
# stderr logging behaviour. Requires `sha2` (already an optional workspace
# dep via `symgraph`); enables it unconditionally for this feature.
# Default builds that do NOT enable `bug-capture` pull in zero new deps.
bug-capture = ["dep:sha2"]
# Enables the `chat::BedrockProvider`: AWS Bedrock `Converse` API backend
# for the (streaming-oriented) `ChatProvider` trait, consumed by trusty-analyze.
# Pulls in `aws-config` (credential chain) and `aws-sdk-bedrockruntime` (Converse
# SDK). Auth via the standard AWS credential chain (env vars, ~/.aws/credentials,
# IAM roles, SSO) — no API key required. Without this feature, `BedrockProvider::new`
# returns a clear error message instructing the operator to rebuild with
# `--features bedrock`. NOT the same feature as `bedrock-client` below (#2407):
# that one is the non-streaming `InferenceAdapter`-shaped Converse adapter tcode
# consumes via `Configurator`/`register_bedrock_factory`. The two features are
# independent (each pulls its own copy of the AWS deps) and may be enabled
# together or separately depending on which trait surface a consumer needs.
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-types"]

# Promotes `StdioMcpClient` (JSON-RPC 2.0 over child stdio) to a shared module
# in `trusty-common`. Originally lived in `trusty-agents/src/plugins/stdio_mcp`;
# promoted here in epic #1104 Phase 0a so `trusty-console` and other local
# services can use it without a dependency on `trusty-agents`. Uses only deps
# already required by the crate (`tokio` with `process` + `io-util`, `serde_json`,
# `tracing`, `anyhow`) -- adds no new transitive dependencies. The `tokio`
# workspace dep already enables `process` and `io-util` via the `full` feature;
# this feature flag gates module compilation only.
stdio-mcp-client = []

# Defines the shared "console metrics" contract (epic #1104 Phase 0a):
# `CONSOLE_METRICS_METHOD` tool-name constant, `ConsoleMetricsReport` response
# type, `ServiceHealth` enum, and `make_report` / `parse_report` helpers. Any
# local service that wants to expose metrics to `trusty-console` enables this
# feature, implements the `console_metrics` MCP tool, and returns a serialised
# `ConsoleMetricsReport`. The console side enables it too and calls `parse_report`
# to decode. Implies `stdio-mcp-client` so the console can poll via the shared
# client without a separate feature declaration.
console-metrics = ["stdio-mcp-client"]

# Enables the `inference::credentials` module (issue #2401, epic #2400 Wave
# 1): the `KeyStore` trait, `MemoryKeyStore`, the `0600`-permission
# `FileKeyStore` (`~/.trusty-tools/credentials.toml`), the `resolve_key`
# 3-tier precedence resolver (process env > `.env.local` > secure store),
# and the shared `redact_secret` helper. Pulls in `thiserror` (error type),
# `toml` (`FileKeyStore`'s on-disk format), and `dotenvy` (the `.env.local`
# loader) — all already optional workspace deps. Does NOT pull in the OS
# keychain backend; see `keyring-store` for that.
credentials = ["dep:thiserror", "dep:toml", "dep:dotenvy"]
# Enables `inference::credentials::KeyringStore`, the OS-keychain backend
# (macOS Keychain / Windows Credential Manager / Secret Service on Linux)
# selected by `inference::credentials::default_store` when available, with
# `FileKeyStore` as the runtime-probed fallback (issue #2401). Pulls in the
# `keyring` crate in addition to everything `credentials` already requires.
keyring-store = ["credentials", "dep:keyring"]
# Enables the `inference` adapter foundation (issue #2402, epic #2400 Wave 1):
# the `types` request/response model, `InferenceError`, the `InferenceAdapter`
# trait, the capability `registry` (context windows incl. the #2330 haiku fix,
# pricing, caching, tool dialects), the two-stage `configurator` (`provider_for`
# + `Configurator`), and the `test_support::ScriptedAdapter` double. Composes
# with `credentials` for the resolver's env > `.env.local` > store precedence.
# Adds NO new dependencies — `async-trait`, `serde`, `serde_json`, and (via
# `credentials`) `thiserror` are already required. The axum HTTP mock
# (`test_support::MockInferenceServer`) additionally requires `axum-server`; it
# is not pulled in by this feature, keeping the base surface HTTP-server-free.
# Concrete provider adapters (OpenRouter/Fireworks/Bedrock) land in #2403/#2407.
inference-client = ["credentials"]
# Enables the `inference::bedrock` adapter (issue #2407, epic #2400 Wave 2): the
# AWS Bedrock Converse-API `BedrockAdapter` implementing `InferenceAdapter`, the
# wire-format conversion + `cachePoint` prompt-cache translation ported from
# tcode's proven `llm::bedrock` transport, and `register_bedrock_factory` (which
# wires the adapter into a `Configurator` under `ProviderId::Bedrock` — kept
# separate from the OpenAI-dialect `register_default_factories`). Implies
# `inference-client` (the trait + registry + configurator) and pulls in the AWS
# SDK stack (`aws-config`/`aws-sdk-bedrockruntime`/`aws-types`/`aws-smithy-types`).
# Auth is the standard AWS credential chain (env/`~/.aws/credentials`/IMDS/SSO) —
# no API key. The client is constructed lazily on first `chat`, so a default
# (no-features) build and a `Configurator` that only registers the factory never
# touch AWS credentials. NOT the same feature as `bedrock` above: that one is
# the streaming `ChatProvider`-shaped backend trusty-analyze consumes. The two
# features are independent (each pulls its own copy of the AWS deps).
bedrock-client = [
    "inference-client",
    "dep:aws-config",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-types",
    "dep:aws-smithy-types",
]
# Enables the `inference::config` module (issue #2404, epic #2400 Wave 1): the
# universal `config` clap command (`ConfigCommand`) that any binary mounts with
# two lines, exposing `config keys set/list/test/unset` for inference-provider
# credentials. Implies `inference-client` (it builds adapters for the live `test`
# probe) and pulls in `clap` (the derive surface) plus `rpassword` (hidden TTY
# input for `set`). A default (no-features) `trusty-common` build compiles
# neither this module nor `clap`; only binaries that mount the command enable it.
config-cli = ["inference-client", "dep:clap", "dep:rpassword"]
