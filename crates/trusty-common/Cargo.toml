# Enables the `inference::bedrock` adapter (issue #2407, epic #2400 Wave 2): the
# AWS Bedrock Converse-API `BedrockAdapter` implementing `InferenceAdapter`, the
# wire-format conversion + `cachePoint` prompt-cache translation ported from
# tcode's proven `llm::bedrock` transport, and `register_bedrock_factory` (which
# wires the adapter into a `Configurator` under `ProviderId::Bedrock` — kept
