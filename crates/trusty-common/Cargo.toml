    "dep:object_store",
    "dep:bytes",
    "dep:flate2",
    "dep:globset",
    "dep:walkdir",
    "dep:sha2",
    "dep:futures",
    "dep:aws-config",
    "dep:aws-types",
    "dep:aws-credential-types",
]

