[package]
name = "trusty-browser"
version = "0.7.0"
description = "Trusty Browser broker and MCP server (Rust port of the Python 0.7.0 package)"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Exposes the enrollment `HostCheck` seam to integration tests only; never
# enable it in a release build (see review af942b9e95 #4).
test-seams = []

[[bin]]
name = "trusty-browser"
path = "src/main.rs"

[[bin]]
name = "trusty-browser-mcp"
path = "src/bin/trusty-browser-mcp.rs"

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The shared JSON-RPC envelope types; never rmcp (plan section 2).
trusty-mcp = { workspace = true }
unicode-normalization = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
# Self dev-dependency: turns on `test-seams` for this crate's own test targets only.
trusty-browser = { path = ".", features = ["test-seams"] }
tempfile = { workspace = true }
